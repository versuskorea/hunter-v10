<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HUNTER 대시보드</title>
<style>
:root{--bg:#0b0d14;--card:#141826;--line:#232a3d;--tx:#e8ecf5;--dim:#8a93a8;--up:#ff5b6e;--dn:#4d8dff;--ok:#3ddc97;--warn:#ffb547;--acc:#9b7bff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;padding:14px 14px 60px}
h1{font-size:18px;margin:4px 0 2px}
.sub{color:var(--dim);font-size:12px}
.strip{display:flex;gap:8px;overflow-x:auto;margin:12px 0}
.chip{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-width:110px}
.chip b{display:block;font-size:16px}
.grid{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:760px){.grid{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.card{transition:transform .12s ease,background-color .12s ease;-webkit-tap-highlight-color:transparent}
.card.press{transform:scale(.97);background:#1c2236}
.card h2{font-size:15px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:#232a3d;color:var(--dim)}
.tag.live{background:#3a1520;color:var(--up)}.tag.paper{background:#1d2440;color:#8fb0ff}.tag.off{background:#222;color:#777}
.big{font-size:24px;font-weight:700}
.row{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px dashed #1e2436}
.row:last-child{border-bottom:0}
.k{color:var(--dim)}
.up{color:var(--up)}.dn{color:var(--dn)}.ok{color:var(--ok)}.warn{color:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:4px 2px;text-align:right;border-bottom:1px solid #1e2436}
td:first-child,th:first-child{text-align:left}
th{color:var(--dim);font-weight:500}
a{color:#9fb7ff}
.err{color:var(--warn);font-size:12px}
#pin{display:none;max-width:320px;margin:80px auto;text-align:center}
#pin input{width:100%;padding:12px;font-size:18px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);text-align:center;letter-spacing:4px}
#pin button,.btn{margin-top:10px;padding:10px 16px;border-radius:12px;border:0;background:var(--acc);color:#fff;font-size:15px}
.foot{margin-top:18px;color:var(--dim);font-size:12px;text-align:center}
details summary{cursor:pointer;color:var(--dim);font-size:12px;margin-top:6px}
pre{white-space:pre-wrap;word-break:break-all;font-size:11px;color:var(--dim)}
.card:not(.nolink):has(a[href^="chart.html"]),.card:not(.nolink):has(a[href="mnq.html"]){cursor:pointer}
.pl{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed #1e2436}
.pl .t{flex:1;font-size:12px;word-break:break-all}.pl.off .t{color:#5a6278;text-decoration:line-through}
.sw{flex:none;width:40px;height:24px;border-radius:99px;border:0;background:#2a3147;position:relative;padding:0}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#8a93a8;transition:left .15s}
.sw.on{background:#3ddc97}.sw.on::after{left:19px;background:#fff}
.xb{flex:none;border:0;background:#2a1820;color:#ff8a9a;border-radius:8px;width:30px;height:28px;font-size:13px}
.pst{font-size:12px;white-space:nowrap}
.nb{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.nb .g{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:6px}
.nb label{display:block;font-size:10.5px;color:var(--dim);margin-bottom:2px}
.nb input,.nb select{width:100%;padding:7px;border-radius:9px;border:1px solid var(--line);background:#0f1320;color:var(--tx);font-size:14px}
.ob{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.ob button{border:1px solid var(--line);background:#0f1320;color:var(--dim);border-radius:99px;padding:5px 10px;font-size:12px}
.ob button.on{border-color:var(--acc);color:#fff;background:#231c40}
#nPrev{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#c9b8ff;margin-top:8px;word-break:break-all}
#pmsg{font-size:12px;margin-top:6px;min-height:16px}
.rt{padding:7px 0;border-bottom:1px dashed #1e2436}
.rt .ob{margin-top:5px}.rt .ob button{min-width:52px}
#rmsg{font-size:12px;margin-top:6px;min-height:16px}
.wx{display:flex;align-items:center;gap:12px}
.wx .ic{font-size:46px;line-height:1}
.wx .nm{font-size:13px;color:var(--dim)}
.wx .v{font-size:22px;font-weight:800}
.mvp{margin-top:8px;padding:8px 10px;border-radius:12px;background:linear-gradient(90deg,#3a2a0a,#1a1406);border:1px solid #6b4f12;font-size:13px}
.sb{display:grid;grid-template-columns:96px 1fr 76px;gap:6px;align-items:center;font-size:12px;margin-top:5px}
.sb .bar{height:8px;border-radius:99px;background:#1e2436;position:relative;overflow:hidden}
.sb .bar i{position:absolute;top:0;bottom:0;border-radius:99px}
.sb .n{text-align:right;font-variant-numeric:tabular-nums}
.fd{display:grid;grid-template-columns:22px 1fr auto;gap:2px 8px;padding:6px 0;border-bottom:1px dashed #1e2436;font-size:12.5px}
.fd:last-child{border-bottom:0}
.fd .w{grid-column:2;color:var(--dim);font-size:11px}
.tiers{display:flex;gap:4px;margin:4px 0 6px}
.tiers i{flex:1;height:12px;border-radius:4px;background:#1e2436}
.tiers i.on{background:linear-gradient(90deg,#f87171,#fb923c)}
.pg{height:10px;border-radius:99px;background:#1e2436;overflow:hidden;margin:3px 0 7px}
.pg i{display:block;height:100%;border-radius:99px}
</style>
</head>
<body>
<div id="pin">
  <h1>HUNTER</h1>
  <div class="sub">PIN 을 넣으세요 (Vercel 환경변수 DASH_PIN)</div>
  <input id="pinIn" type="password" inputmode="numeric" autocomplete="off">
  <button onclick="savePin()">들어가기</button>
  <div id="pinErr" class="err"></div>
</div>

<div id="app" style="display:none">
  <h1>HUNTER 대시보드 <a href="set.html" style="float:right;font-size:14px;text-decoration:none">⚙️ 설정</a></h1>
  <div class="sub" id="at">불러오는 중…</div>
  <div class="strip" id="strip"></div>
  <div class="card" id="wx" style="margin-bottom:12px"></div>
  <div class="card" style="margin-bottom:12px">
    <h2>전체 자산 <span class="tag" id="fxTag"></span></h2>
    <div class="big" id="totKrw">–</div>
    <div id="totRows"></div>
  </div>
  <div class="card" id="feedCard" style="margin-bottom:12px"></div>
  <div class="grid" id="grid"></div>
  <div id="pitTools" style="display:none">
    <div class="nb">
      <div class="sub">새 웅덩이 줄 추가</div>
      <div class="g">
        <div><label>종목</label><select id="nSym"><option>SOXL</option><option>SOXS</option></select></div>
        <div><label>봉</label><select id="nTf"><option value="3M">3분봉</option><option value="1M">1분봉</option><option value="5M">5분봉</option></select></div>
        <div><label>최대 수량</label><input id="nQty" type="number" inputmode="numeric" value="1000"></div>
        <div><label>RISK ($)</label><input id="nRisk" type="number" inputmode="numeric" value="700"></div>
        <div><label>절반 익절 (R)</label><input id="nHalf" type="number" inputmode="decimal" step="0.1" value="0.5"></div>
        <div><label>웅덩이 RSI (이 아래)</label><input id="nPit" type="number" inputmode="numeric" value="25"></div>
        <div><label>봉우리 RSI (이 위)</label><input id="nPeak" type="number" inputmode="numeric" value="71"></div>
      </div>
      <div class="ob" id="nOpts"></div>
      <div id="nPrev"></div>
      <button class="btn" style="width:100%" onclick="addLine()">＋ 이 줄 추가 (바로 저장)</button>
    </div>
    <div class="nb" id="pxBox" style="margin-top:12px">
      <div class="sub">새 가격 주문 (RSI 없이 · 체결되면 손절·익절 자동)</div>
      <div class="g">
        <div><label>종목</label><select id="xSym"><option>SOXL</option><option>SOXS</option></select></div>
        <div><label>진입</label><select id="xWhen"><option value="NOW">지금 바로</option><option value="IF<=">이 가격 이하면</option><option value="IF>=">이 가격 이상이면</option></select></div>
        <div><label>진입가 ($)</label><input id="xPx" type="number" inputmode="decimal" step="0.01" placeholder="지금 바로면 비움"></div>
        <div><label>수량</label><input id="xQty" type="number" inputmode="numeric" value="500"></div>
        <div><label>손절 (가격 또는 −%)</label><input id="xSl" type="text" value="-3%"></div>
        <div><label>익절 (가격 또는 +%)</label><input id="xTp" type="text" value="+5%"></div>
      </div>
      <div class="ob" id="xOpts"></div>
      <div id="xPrev"></div>
      <button class="btn" style="width:100%" onclick="addPx()">＋ 가격 주문 추가 (바로 저장)</button>
    </div>
    <div id="pmsg"></div>
  </div>
  <div class="foot">
    <a href="set.html"><b>⚙️ 설정</b></a> · <a href="mnq.html">MNQ 보드</a> · <a href="index.html?old=1">예전 화면</a> · <a href="#" onclick="logout()">PIN 지우기</a><br>
    1분마다 새로고침 · 주문은 봇만 냅니다
  </div>
</div>

<script src="hfeed.js"></script>
<script>
const $ = s => document.querySelector(s);
const f2 = x => x == null || isNaN(x) ? '–' : Number(x).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const f0 = x => x == null || isNaN(x) ? '–' : Math.round(Number(x)).toLocaleString('en-US');
const usd = x => x == null || isNaN(x) ? '–' : (x < 0 ? '−$' : '$') + f0(Math.abs(x));
const krw = x => x == null || isNaN(x) ? '–' : (Math.abs(x) >= 1e8 ? (x / 1e8).toFixed(2) + '억' : f0(x / 1e4) + '만') + '원';
const pct = (a, b) => (a && b) ? ((a / b - 1) * 100) : null;
const cls = v => v == null ? '' : v > 0 ? 'up' : v < 0 ? 'dn' : '';
const sg = v => v == null ? '–' : (v > 0 ? '+' : '') + v.toFixed(2) + '%';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const row = (k, v, c = '') => `<div class="row"><span class="k">${k}</span><span class="${c}">${v}</span></div>`;
const modeTag = m => { m = String(m || '').toUpperCase(); return `<span class="tag ${m === 'LIVE' ? 'live' : m === 'PAPER' ? 'paper' : 'off'}">${m || 'OFF'}</span>`; };

function getPin() { try { return localStorage.getItem('dashPin') || ''; } catch { return ''; } }
function savePin() { const v = $('#pinIn').value.trim(); try { localStorage.setItem('dashPin', v); } catch {} window.__pin = v; load(); }
function logout() { try { localStorage.removeItem('dashPin'); } catch {} location.reload(); }

async function load() {
  const pin = window.__pin || getPin();
  if (!pin) { $('#pin').style.display = 'block'; $('#app').style.display = 'none'; return; }
  let j;
  try {
    const r = await fetch('/api/dash', { headers: { 'x-pin': pin }, cache: 'no-store' });
    j = await r.json();
    if (!r.ok) throw new Error(j.error || r.status);
  } catch (e) {
    $('#pin').style.display = 'block'; $('#app').style.display = 'none'; $('#pinErr').textContent = String(e.message || e); return;
  }
  $('#pin').style.display = 'none'; $('#app').style.display = 'block';
  render(j);
}

function acctCard(title, a, px, extra) {
  if (!a || a.err) return { html: `<div class="card"><h2>${title}</h2><div class="err">${esc(a && a.err || '불러오기 실패')}</div></div>`, usd: null };
  let val = a.cash || 0, rows = '';
  for (const [s, h] of Object.entries(a.hold || {})) {
    if (!h.qty) continue;
    const p = px[s] ? px[s].last : null; const v = p ? h.qty * p : h.qty * h.avg; val += v;
    const pl = p ? (p - h.avg) * h.qty : null;
    rows += `<tr><td>${s}</td><td>${f0(h.qty)}</td><td>${f2(h.avg)}</td><td>${f2(p)}</td><td class="${cls(pl)}">${usd(pl)}</td></tr>`;
  }
  const html = `<div class="card"><h2>${title} ${extra || ''}</h2>
    <div class="big">${usd(val)}</div>
    ${row('현금', usd(a.cash))}
    ${rows ? `<table><tr><th>종목</th><th>수량</th><th>평단</th><th>현재</th><th>평가손익</th></tr>${rows}</table>` : row('보유', '없음')}
  </div>`;
  return { html, usd: val };
}

function render(j) {
  const px = j.px || {}; const fx = j.fx || 1350;
  $('#at').textContent = '갱신 ' + new Date(j.at).toLocaleString('ko-KR', { hour12: false });
  $('#strip').innerHTML = ['SOXL', 'SOXS', 'QQQ'].map(s => {
    const q = px[s]; if (!q) return '';
    const c = pct(q.last, q.prev);
    return `<div class="chip"><span class="k">${s}</span><b>${f2(q.last)}</b><span class="${cls(c)}">${sg(c)}</span></div>`;
  }).join('');
  $('#fxTag').textContent = '환율 ' + f0(fx);

  const cards = [];
  // 계좌1 · 계좌2
  const a1 = acctCard('계좌1 · 스나이퍼·웨이브·밤돌파·웅덩이', j.acct1, px);
  const a2 = acctCard('계좌2 · 돌파', j.acct2, px, modeTag(j.bo && j.bo.mode));
  cards.push(a1.html, a2.html);

  // MNQ
  const m = j.mnq; let mnqKrw = null;
  if (m) {
    // MNQ 보드의 '현재 자산'과 같은 계산: 납입 시드 + 봇 실현 + 웨이브 실현 + 평가손익
    const it = j.mnqIntra || {}, cf = m.cfg || {}, FXm = +cf.fx || 1360;
    const seedM = (+cf.paid || 0) * 1e4, mpx = (px.MNQ && px.MNQ.last) || (m.quote && m.quote.px) || 0;
    const unrM = (m.positions || []).reduce((a, q) => a + (mpx - q.entry) * 2 * (+q.qty || 1) * FXm, 0);
    mnqKrw = seedM ? seedM + (+m.realized || 0) + (+it.realized || 0) + unrM : m.equity;
    const pos = (m.positions || []).length;
    cards.push(`<div class="card"><h2>MNQ <a href="mnq.html" class="tag">보드 →</a></h2>
      <div class="big">${krw(mnqKrw)} <span class="${cls(mnqKrw - seedM)}" style="font-size:14px">${seedM ? sg((mnqKrw / seedM - 1) * 100) : ''}</span></div>
      ${seedM ? row('시드 (납입)', krw(seedM)) : ''}
      ${row('평가손익 (MNQ ' + f2(mpx) + ')', krw(unrM), cls(unrM))}
      ${row('봇 보유', pos + '계약 (' + (m.step || 0) + '티어)')}
      ${row('봇 실현손익', krw(m.realized), cls(m.realized))}
      ${row('웨이브', it.pos ? (it.pos > 0 ? '롱 ' : '숏 ') + it.qty + '계약 @' + f2(it.entry) : '없음')}
      ${row('웨이브 누적 실현', krw(it.realized), cls(it.realized))}
      ${row('최근 처리일', esc(m.last_date))}
    </div>`);
  }

  // 전체
  const tot = (a1.usd || 0) * fx + (a2.usd || 0) * fx + (mnqKrw || 0);
  $('#totKrw').textContent = krw(tot);
  // ☀️ 오늘 날씨 · MVP
  try {
    const T = HF.today(j), pc = tot ? T.tot / tot * 100 : 0, [ic, nm] = HF.weather(pc);
    const mx = Math.max(1, ...Object.values(T.by).map(Math.abs));
    $('#wx').innerHTML = `<div class="wx"><div class="ic">${ic}</div><div><div class="nm">오늘 날씨 · ${esc(T.day.slice(5))} 장</div><div class="v ${cls(T.tot)}">${nm} ${HF.krw(T.tot)} <span style="font-size:14px">${sg(pc)}</span></div></div></div>`
      + (T.mvp && T.mvp[1] > 0 ? `<div class="mvp">🏆 오늘의 MVP <b>${esc(T.mvp[0])}</b> ${HF.krw(T.mvp[1])}</div>` : '')
      + Object.entries(T.by).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<div class="sb"><span>${esc(k)}</span><span class="bar"><i style="${v >= 0 ? 'left:50%' : 'right:50%'};width:${Math.abs(v) / mx * 50}%;background:${v >= 0 ? 'var(--up)' : 'var(--dn)'}"></i></span><span class="n ${cls(v)}">${HF.krw(v)}</span></div>`).join('');
  } catch (e) { $('#wx').innerHTML = '<span class="k">날씨 계산 실패</span>'; }
  // 📜 봇 활동 (최근 5건)
  try {
    const F = HF.feed(j).slice(0, 5);
    $('#feedCard').innerHTML = `<h2>📜 봇 활동 <a href="chart.html?k=feed" class="tag">전체 →</a></h2>` + (F.map(x => `<div class="fd"><span>${x.icon}</span><span class="${x.warn ? 'warn' : ''}">${esc(x.text)}</span><span class="${x.pnl == null ? 'k' : cls(x.pnl)}">${x.pnl == null ? '' : HF.krw(x.pnl)}</span><span class="w">${esc(x.when)}</span></div>`).join('') || '<div class="k">아직 기록 없음</div>');
  } catch (e) { $('#feedCard').innerHTML = '<span class="k">활동 불러오기 실패</span>'; }
  try { HF.alertNew(j); } catch { }
  $('#totRows').innerHTML = row('계좌1', a1.usd == null ? '–' : usd(a1.usd) + ' · ' + krw(a1.usd * fx)) + row('계좌2', a2.usd == null ? '–' : usd(a2.usd) + ' · ' + krw(a2.usd * fx)) + row('MNQ', krw(mnqKrw));

  // 스나이퍼
  const p = j.sniper && j.sniper.plan;
  if (p && !p.err) {
    const soxl = (j.acct1 && j.acct1.hold && j.acct1.hold.SOXL) ? j.acct1.hold.SOXL.qty : null;
    const rows = (p.rows || []).map(r => `<tr><td>${r.side === 'BUY' ? '<span class="up">매수</span>' : '<span class="dn">매도</span>'} ${esc(r.tier || '')}</td><td>${r.type}</td><td>${r.price ? f2(r.price) : 'MOC'}</td><td>${f0(r.qty)}</td></tr>`).join('');
    const lp = px.SOXL ? px.SOXL.last : null;
    // 사이클 진행바: 보유 티어 · 매도가까지 · 다음 매수까지
    const sells = (p.rows || []).filter(r => r.side === 'SELL'), maxT = p.mode === 'def' ? 5 : 6;
    const held = new Set(sells.map(r => r.tier)).size;
    const sp = sells.filter(r => r.price).map(r => r.price), sMin = sp.length ? Math.min(...sp) : null;
    const bp = (p.rows || []).filter(r => r.side === 'BUY' && r.price).map(r => r.price), bMax = bp.length ? Math.max(...bp) : null;
    let snBar = `<div class="sub">보유 티어 ${held} / ${maxT}</div><div class="tiers">${Array.from({ length: maxT }, (_, i) => `<i class="${i < held ? 'on' : ''}"></i>`).join('')}</div>`;
    if (lp && sMin) { const g = Math.min(1, lp / sMin); snBar += `<div class="sub">매도가 ${f2(sMin)}까지 ${lp >= sMin ? '도달 🎉' : sg((sMin / lp - 1) * 100)}</div><div class="pg"><i style="width:${g * 100}%;background:linear-gradient(90deg,#3b82f6,#38bdf8)"></i></div>`; }
    if (lp && bMax) snBar += `<div class="sub">다음 매수 ${f2(bMax)} ${lp <= bMax ? '— 지금가면 매수 구간' : '까지 ' + sg((bMax / lp - 1) * 100)}</div>`;
    cards.push(`<div class="card"><h2>스나이퍼 <span class="tag">${p.mode === 'def' ? '방어' : p.mode === 'atk' ? '공격' : esc(p.mode)}</span> <a href="chart.html?k=sniper" class="tag">차트 →</a></h2>
      ${snBar}
      ${row('주문표 날짜', esc(p.date) + (p.placed ? ' · 접수됨' : ' · 미접수'))}
      ${row('장부 주식 (주문 전)', f0(p.ledger_sh) + '주')}
      ${row('장부 자산 (주문 전 종가)', usd(p.ledger_E))}
      ${row('계좌 SOXL', soxl == null ? '–' : f0(soxl) + '주')}
      ${row('EXTRA_SHARES', f0(j.extraShares))}
      ${rows ? `<table><tr><th>주문</th><th>방식</th><th>가격</th><th>수량</th></tr>${rows}</table>` : ''}
      ${lp && p.rows ? row('지금가 대비 매도가', p.rows.filter(r => r.side === 'SELL' && r.price).map(r => sg(pct(r.price, lp))).slice(0, 1).join('') || '–') : ''}
    </div>`);
  } else cards.push(`<div class="card"><h2>스나이퍼</h2><div class="err">${esc(p && p.err || '주문표 없음')}</div></div>`);

  // SOXL 웨이브
  const w = j.wave;
  if (w && !w.err) {
    const lp = w.sym && px[w.sym] ? px[w.sym].last : null;
    const open = w.pos && w.qty ? (lp - w.entry) * w.qty : null;
    const tr = (w.trades || []).slice(-5).reverse().map(t => `<tr><td>${esc(t.d.slice(5))} ${esc(t.sym)}</td><td>${esc(t.in)}→${esc(String(t.out).split(' ')[0])}</td><td>${f2(t.e)}→${f2(t.x)}</td><td class="${cls(t.pnl)}">${usd(t.pnl)}</td></tr>`).join('');
    cards.push(`<div class="card"><h2>SOXL 웨이브 <span class="tag">${esc(w.day || '')}</span> <a href="chart.html?k=wave" class="tag">차트 →</a></h2>
      ${row('보유', w.pos ? `${w.pos > 0 ? '롱' : '숏'} · ${esc(w.sym)} ${f0(w.qty)}주 @${f2(w.entry)} (${esc(w.entry_t)})` : '없음')}
      ${open != null ? row('평가손익', usd(open), cls(open)) : ''}
      ${row('누적 실현', usd(w.realized), cls(w.realized))}
      ${tr ? `<table><tr><th>날짜</th><th>시각</th><th>진입→청산</th><th>손익</th></tr>${tr}</table>` : ''}
    </div>`);
  }

  // 계좌2 돌파
  const b = j.bo || {}; const bs = b.state || {};
  const pl = bs.plan || {};
  cards.push(`<div class="card"><h2>계좌2 돌파 ${modeTag(b.mode)} <a href="chart.html?k=bo" class="tag">차트 →</a></h2>
    ${row('오늘', esc(pl.date || '–') + ' · ' + esc(pl.status || '–'))}
    ${row('모드', esc(pl.mode === 'atk' ? '공격' : pl.mode === 'def' ? '방어' : pl.mode || '–'))}
    ${pl.level != null ? row('돌파가', f2(pl.level)) : ''}${pl.lv != null ? row('돌파가', f2(pl.lv)) : ''}
    ${row('보유', bs.pos && bs.pos.qty ? `${f0(bs.pos.qty)}주 @${f2(bs.pos.entry)}` : '없음')}
    ${bs.paper ? row('PAPER 자산', usd(bs.paper.cash + (bs.paper.sq || 0) * (px.SOXL ? px.SOXL.last : 0))) : ''}
    ${bs.errMsg ? `<div class="err">${esc(bs.errMsg)}</div>` : ''}
    <details><summary>상태 원본</summary><pre>${esc(JSON.stringify(bs, null, 1))}</pre></details>
  </div>`);

  // 밤 돌파
  const n = j.night || {}; const ns = n.state || {};
  cards.push(`<div class="card"><h2>밤 돌파 ${modeTag(n.mode)} <a href="chart.html?k=night" class="tag">차트 →</a></h2>
    ${row('오늘 판단', esc(ns.planMsg || '–'))}
    ${row('보유', ns.pos && ns.pos.qty ? `${f0(ns.pos.qty)}주` : '없음')}
    ${ns.n ? row('기록', `${ns.n}번 · 승 ${ns.win || 0} · 합계 ${usd(ns.tot)}`) : ''}
    ${row('마지막 실행', esc(ns.last || '–'))}
    ${ns.errMsg ? `<div class="err">${esc(ns.errMsg)}</div>` : ''}
  </div>`);

  // 웅덩이 (조건주문) — 여기서 바로 켜기/끄기·지우기·추가 (카드 통째 이동 없음, 차트는 오른쪽 위 버튼)
  const mn = j.manual || {}; PIT_R = (mn.raw && mn.raw.rules) || {};
  if (!PIT_BUSY) LINES = (mn.lines || []).slice();
  cards.push(`<div class="card nolink"><h2>웅덩이 · 조건주문 <a href="chart.html?k=pit" class="tag">차트 →</a></h2><div id="pitLines"></div><div id="pitSlot"></div></div>`);
  // 새로 그리기 전에 '새 줄 추가' 칸을 카드 밖으로 빼 둔다 (안 그러면 1분 새로고침 때 같이 지워짐)
  const keep = $('#pitTools'); if (keep) $('#app').appendChild(keep);
  $('#grid').innerHTML = cards.join('');
  pitLines();
  const tools = $('#pitTools'); $('#pitSlot').appendChild(tools); tools.style.display = 'block';
}

// ── 웅덩이 조작 ──
let LINES = [], PIT_R = {}, PIT_BUSY = false;
const OPT = { RTH: false, EOD: false, REPEAT: true };
function pitLines() {
  const el = $('#pitLines'); if (!el) return;
  el.innerHTML = LINES.length ? LINES.map((l, i) => {
    const off = l.startsWith('#'), t = off ? l.replace(/^#\s*/, '') : l, st = PIT_R[l] || {};
    const held = (st.bought || 0) - (st.sold || 0);
    const s = off ? '<span class="k">꺼짐</span>' : st.st === 'hold' ? `<span class="up">보유 ${f0(held)}주</span>` : st.st === 'done' ? '<span class="k">끝</span>' : `<span class="k">${esc(st.st || '대기')}</span>`;
    const det = st.st === 'hold' ? `<div class="sub">평단 ${f2(st.avg)} · 손절 ${f2(st.slPx)}${st.halfPx && !st.halfDone ? ' · 절반 ' + f2(st.halfPx) : ''}${st.tpPx ? ' · 익절 ' + f2(st.tpPx) : ''}</div>` : '';
    return `<div class="pl ${off ? 'off' : ''}"><button class="sw ${off ? '' : 'on'}" onclick="pitTog(${i})" aria-label="켜기/끄기"></button><div class="t">${esc(t)}${det}</div><span class="pst">${s}</span><button class="xb" onclick="pitDel(${i})" aria-label="지우기">✕</button></div>`;
  }).join('') : '<div class="k" style="font-size:13px">등록된 줄 없음</div>';
}
function pmsg(t, err) { const m = $('#pmsg'); if (m) { m.textContent = t; m.className = err ? 'err' : 'ok'; } }
async function pitSave(msg) {
  PIT_BUSY = true; pitLines(); pmsg('저장 중…');
  try {
    const r = await fetch('/api/settings', { method: 'POST', headers: { 'x-pin': window.__pin || getPin(), 'content-type': 'application/json' }, body: JSON.stringify({ set: { MANUAL: LINES.join('\n') } }) });
    const j = await r.json(); if (!r.ok || !j.ok) throw new Error(j.error || r.status);
    pmsg(msg + ' · 1분 안에 봇이 읽어요');
  } catch (e) { pmsg('저장 실패: ' + (e.message || e) + ' · 원래대로 다시 불러옴', 1); PIT_BUSY = false; load(); return; }
  PIT_BUSY = false;
}
function pitTog(i) { const l = LINES[i]; LINES[i] = l.startsWith('#') ? l.replace(/^#\s*/, '') : '# ' + l; pitSave(LINES[i].startsWith('#') ? '끔' : '켬'); }
function pitDel(i) { if (!confirm('이 줄을 지울까요?\n' + LINES[i])) return; LINES.splice(i, 1); pitSave('지움'); }
function build() {
  const s = $('#nSym').value, tf = $('#nTf').value, q = Math.max(1, +$('#nQty').value || 1000), r = +$('#nRisk').value || 0, h = +$('#nHalf').value, pk = +$('#nPeak').value || 71, pt = Math.min(50, Math.max(5, +$('#nPit').value || 25));
  let l = `${s} BUY ${q} PIT${tf}<${pt} PEAK${tf}>${pk} SL=LOW`;
  if (h > 0) l += ` HALF=R${h}`;
  if (OPT.EOD) l += ' EOD'; if (OPT.RTH) l += ' RTH';
  if (r > 0) l += ` RISK=${r}`; if (OPT.REPEAT) l += ' REPEAT';
  return l;
}
function opts() {
  $('#nOpts').innerHTML = [['RTH', '정규장만'], ['EOD', '장 마감 정리'], ['REPEAT', '매일 반복']].map(([k, t]) => `<button class="${OPT[k] ? 'on' : ''}" data-k="${k}">${t}</button>`).join('');
  $('#nOpts').querySelectorAll('button').forEach(b => b.onclick = () => { OPT[b.dataset.k] = !OPT[b.dataset.k]; opts(); });
  $('#nPrev').textContent = build();
}
['#nSym', '#nTf', '#nQty', '#nRisk', '#nHalf', '#nPit', '#nPeak'].forEach(s => $(s).addEventListener('input', () => $('#nPrev').textContent = build()));
opts();
function addLine() { const l = build(); if (LINES.includes(l)) { pmsg('같은 줄이 이미 있어요', 1); return; } LINES.push(l); pitSave('추가함'); }

// ── 가격 주문 (RSI 없이): NOW / IF<= / IF>= + SL·TP (봇 MANUAL 문법 그대로)
let XOPT = { EOD: true, RTH: true, REPEAT: false };
function xLv(v, sign) {
  v = String(v || '').trim().replace(/\s/g, '').replace('−', '-'); if (!v) return '';
  if (v.endsWith('%')) { const n = Math.abs(parseFloat(v)); if (!(n > 0)) return ''; return (sign < 0 ? '-' : '+') + n + '%'; }
  const n = parseFloat(v); return n > 0 ? String(n) : '';
}
function xBuild() {
  const s = $('#xSym').value, w = $('#xWhen').value, p = +$('#xPx').value, q = Math.max(1, Math.trunc(+$('#xQty').value || 1));
  let l = `${s} BUY ${q} `;
  if (w === 'NOW') l += 'NOW'; else { if (!(p > 0)) return ''; l += w + p; }
  const sl = xLv($('#xSl').value, -1), tp = xLv($('#xTp').value, 1);
  if (sl) l += ' SL=' + sl; if (tp) l += ' TP=' + tp;
  if (XOPT.EOD) l += ' EOD'; if (XOPT.RTH) l += ' RTH'; if (XOPT.REPEAT) l += ' REPEAT';
  return l;
}
function xOpts() {
  $('#xOpts').innerHTML = [['RTH', '정규장만'], ['EOD', '장 마감 정리'], ['REPEAT', '매일 반복']].map(([k, t]) => `<button class="${XOPT[k] ? 'on' : ''}" data-k="${k}">${t}</button>`).join('');
  $('#xOpts').querySelectorAll('button').forEach(b => b.onclick = () => { XOPT[b.dataset.k] = !XOPT[b.dataset.k]; xOpts(); });
  const l = xBuild(); $('#xPrev').textContent = l || '진입가를 넣어주세요';
}
['#xSym', '#xWhen', '#xPx', '#xQty', '#xSl', '#xTp'].forEach(s => $(s).addEventListener('input', xOpts));
xOpts();
function addPx() {
  const l = xBuild(); if (!l) { pmsg('진입가를 넣어주세요', 1); return; }
  if (!/ SL=/.test(l)) { pmsg('손절을 넣어주세요', 1); return; }
  if (LINES.includes(l)) { pmsg('같은 줄이 이미 있어요', 1); return; }
  LINES.push(l); pitSave('가격 주문 추가함');
}

// ── ⚖️ 비중 조절 (누르면 바로 저장, 봇은 다음 실행부터 적용) ──
const RAT = [
  ['WAVE_CASH', '🌊 웨이브 비중', '스나이퍼가 쉬는 현금 중 웨이브에 쓸 비율', [['0', '끔'], ['0.3'], ['0.5'], ['1', '전부']], '0.3'],
  ['WAVE_KEEP', '🌊 웨이브 수익 재투자', '웨이브로 번 돈을 다음 웨이브 금액에 계속 더함', [['1', '켬'], ['0', '끔']], '1'],
  ['NIGHT_W_UP', '🌙 밤 돌파 · NQ 20일선 위', '남는 현금 중 넣을 비율', [['0', '끔'], ['0.5'], ['1', '전부']], '1'],
  ['NIGHT_W_DN', '🌙 밤 돌파 · NQ 20일선 아래', '남는 현금 중 넣을 비율', [['0', '끔'], ['0.25'], ['0.5'], ['1', '전부']], '0.5'],
  ['NIGHT_CAP', '🌙 밤 돌파 최대', '계좌 자산 대비 최대 비율', [['0.3'], ['0.5'], ['0.7'], ['1']], '0.7'],
  ['MA_PAUSE', '📈 MNQ 200일선 아래 쉬기', '전일 종가가 200일선 아래면 봇 신규 매수 쉼 (매도·웨이브는 그대로)', [['0', '끔'], ['200', '켬']], '0'],
  ['PAUSE_BUY', '📈 MNQ 신규 매수', '쉼 = 봇이 새로 사지 않음 (가진 건 규칙대로 매도)', [['0', '함'], ['1', '쉼']], '0'],
  ['SIZE_LEV', '📈 MNQ 계약 수 방식', '기존 = 수익 나면 계약 +1 (복리) · 숫자 = 자산 × 배수로 계약 수 계산', [['0', '기존'], ['4', '×4'], ['5', '×5'], ['6.5', '×6.5']], '6.5'],
  ['INTRA_MAX', '🌀 MNQ 웨이브 최대 계약', '웨이브가 한 번에 들어가는 최대 계약 수', [['1', '1'], ['2', '2'], ['3', '3'], ['4', '4']], '2'],
  ['INTRA_LEV', '🌀 MNQ 웨이브 배수', '자산 × 배수로 웨이브 계약 수 계산 (최대 계약 안에서)', [['2', '×2'], ['3.3', '×3.3'], ['5', '×5']], '3.3'],
];
const MKEYS = ['MA_PAUSE', 'PAUSE_BUY', 'SIZE_LEV', 'INTRA_MAX', 'INTRA_LEV', 'TOTAL_PAID', 'MODE', 'INTRA_MODE'];
let RV = null;
function rmsg(t, err) { const m = $('#rmsg'); if (m) { m.textContent = t; m.className = err ? 'err' : 'ok'; } }
function drawRatios() {
  const el = $('#ratioCard'); if (!el || !RV) return;
  el.innerHTML = `<h2>⚖️ 비중 조절 <a href="set.html" class="tag">설정 →</a></h2>` + RAT.map(([k, t, hint, opts, def]) => {
    const cur = RV[k] == null || RV[k] === '' ? def : RV[k];
    return `<div class="rt"><div style="font-size:13px">${t}</div><div class="sub">${hint}</div><div class="ob">${opts.map(([v, lab]) => `<button class="${Number(v) === Number(cur) ? 'on' : ''}" onclick="setRatio('${k}','${v}')">${lab || Math.round(Number(v) * 100) + '%'}</button>`).join('')}</div></div>`;
  }).join('') + `<div class="sub" style="margin-top:6px">📈 MNQ 모드 ${esc(String(RV.MODE || '–').toUpperCase())} · 웨이브 ${esc(String(RV.INTRA_MODE || '–').toUpperCase())} · 납입 ${RV.TOTAL_PAID ? Number(RV.TOTAL_PAID).toLocaleString() + '만' : '–'}${RV._mnqErr ? ' · ⚠️ ' + esc(RV._mnqErr) : ''}</div><div id="rmsg"></div><div class="sub" style="margin-top:4px">5:5 계좌 비율은 계좌 이체로 맞춥니다 · 돌파(계좌2) 비중은 공격 50%·수비 100% 고정</div>`;
}
async function loadRatios() {
  try {
    const h = { headers: { 'x-pin': window.__pin || getPin() }, cache: 'no-store' };
    const [a, b] = await Promise.all([fetch('/api/settings', h).then(r => r.json()), fetch('/api/mnqset', h).then(r => r.json()).catch(() => ({}))]);
    if (!a.ok) throw new Error(a.error || '설정 읽기 실패');
    RV = { ...(a.vars || {}), ...((b && b.vars) || {}) }; RV._mnqErr = b && !b.ok ? (b.error || 'MNQ 설정 읽기 실패') : '';
    drawRatios();
  }
  catch (e) { const el = $('#ratioCard'); if (el) el.innerHTML = `<h2>⚖️ 비중 조절</h2><div class="err">${esc(e.message || e)}</div>`; }
}
async function setRatio(k, v) {
  const old = RV[k]; RV[k] = v; drawRatios(); rmsg('저장 중…');
  try {
    const r = await fetch(MKEYS.includes(k) ? '/api/mnqset' : '/api/settings', { method: 'POST', headers: { 'x-pin': window.__pin || getPin(), 'content-type': 'application/json' }, body: JSON.stringify({ set: { [k]: v } }) });
    const j = await r.json(); if (!r.ok || !j.ok) throw new Error(j.error || r.status);
    rmsg('저장됨 · 봇 다음 실행부터 적용');
  } catch (e) { RV[k] = old; drawRatios(); rmsg('저장 실패: ' + (e.message || e), 1); }
}

load();
setInterval(load, 60000);
// 카드 아무 데나 누르면 그 카드의 차트(보드)로 이동 — 링크·버튼·펼치기는 원래대로
document.addEventListener('click', e => {
  if (e.target.closest('a,button,summary,details,input,select,textarea')) return;
  const c = e.target.closest('.card'); if (!c || c.classList.contains('nolink')) return;
  const a = c.querySelector('a[href^="chart.html"],a[href="mnq.html"]'); if (a) { c.classList.add('press'); setTimeout(() => { location.href = a.getAttribute('href'); }, 120); }
});
// 누르는 동안 눌린 느낌 (스크롤하면 풀림), 뒤로 와도 풀림
const linkCard = t => { const c = t.closest && t.closest('.card'); return c && !c.classList.contains('nolink') && c.querySelector('a[href^="chart.html"],a[href="mnq.html"]') ? c : null; };
const unpress = () => document.querySelectorAll('.card.press').forEach(c => c.classList.remove('press'));
// 폰: 손 떼는 순간 직접 이동 (아이폰은 누를 때 모양이 바뀌면 click 을 안 보내는 경우가 있음)
let tc = null, tx = 0, ty = 0;
document.addEventListener('touchstart', e => { const c = linkCard(e.target); tc = (c && !e.target.closest('a,button,summary,details')) ? c : null; tx = e.touches[0].clientX; ty = e.touches[0].clientY; if (tc) tc.classList.add('press'); }, { passive: true });
document.addEventListener('touchmove', e => { if (tc && Math.hypot(e.touches[0].clientX - tx, e.touches[0].clientY - ty) > 10) { tc = null; unpress(); } }, { passive: true });
document.addEventListener('touchcancel', () => { tc = null; unpress(); }, { passive: true });
document.addEventListener('touchend', e => {
  if (!tc) return; const c = tc; tc = null;
  const a = c.querySelector('a[href^="chart.html"],a[href="mnq.html"]'); if (!a) { unpress(); return; }
  e.preventDefault(); setTimeout(() => { location.href = a.getAttribute('href'); }, 100);
}, { passive: false });
addEventListener('pageshow', unpress);
// 당겨서 새로고침 — 맨 위에서 아래로 끌어내리면 다시 불러온다 (홈 화면 앱에서도 동작)
(() => {
  const el = document.createElement('div');
  el.style.cssText = 'position:fixed;left:50%;top:0;transform:translate(-50%,-40px);padding:6px 14px;border-radius:99px;background:#9b7bff;color:#fff;font-size:13px;z-index:99;transition:transform .15s;pointer-events:none';
  el.textContent = '↓ 당겨서 새로고침'; document.body.appendChild(el);
  let y0 = null, dy = 0;
  addEventListener('touchstart', e => { y0 = (scrollY <= 0) ? e.touches[0].clientY : null; dy = 0; }, { passive: true });
  addEventListener('touchmove', e => {
    if (y0 == null) return; dy = e.touches[0].clientY - y0;
    if (dy <= 0) { el.style.transform = 'translate(-50%,-40px)'; return; }
    el.style.transform = `translate(-50%,${Math.min(dy, 90) / 2}px)`;
    el.textContent = dy > 80 ? '↻ 놓으면 새로고침' : '↓ 당겨서 새로고침';
  }, { passive: true });
  addEventListener('touchend', () => {
    if (y0 != null && dy > 80) { el.textContent = '불러오는 중…'; location.reload(); }
    else el.style.transform = 'translate(-50%,-40px)';
    y0 = null; dy = 0;
  });
})();
