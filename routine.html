<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>루틴</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:#0a0a14; color:#fff; padding:18px; padding-bottom:60px;
    max-width:480px; margin:0 auto; min-height:100vh;
  }
  .back-btn {
    display:inline-flex; align-items:center; gap:6px; margin-bottom:12px;
    padding:8px 16px; background:#16162a; color:#a78bfa; text-decoration:none;
    border-radius:20px; font-size:13px; font-weight:700; border:1px solid rgba(167,139,250,0.3);
  }
  .top-date { text-align:center; font-size:14px; color:#8b8ba0; margin-bottom:6px; }
  .streak-card {
    background:linear-gradient(135deg,#1a1a3e,#2a1a3e);
    border-radius:20px; padding:24px 18px; text-align:center; margin-bottom:16px;
    border:1px solid rgba(123,97,255,0.3);
  }
  .streak-label { font-size:13px; color:#a78bfa; margin-bottom:8px; font-weight:600; }
  .streak-num { font-size:64px; font-weight:800; line-height:1;
    background:linear-gradient(135deg,#a78bfa,#ec4899); -webkit-background-clip:text;
    -webkit-text-fill-color:transparent; }
  .streak-unit { font-size:18px; color:#8b8ba0; margin-top:4px; }
  .streak-msg { font-size:13px; color:#c4b5fd; margin-top:12px; line-height:1.5; min-height:18px; }
  .checks { margin-bottom:18px; }
  .check-title { font-size:13px; color:#8b8ba0; margin-bottom:10px; padding-left:4px; display:flex; justify-content:space-between; align-items:center; }
  .sel-tag { font-size:12px; color:#a78bfa; font-weight:700; }
  .check-item {
    display:flex; align-items:center; gap:14px; background:#16162a;
    border-radius:14px; padding:16px 18px; margin-bottom:10px; cursor:pointer;
    border:2px solid transparent; transition:all 0.15s;
  }
  .check-box {
    width:26px; height:26px; border-radius:8px; border:2px solid #444;
    flex-shrink:0; display:flex; align-items:center; justify-content:center;
    font-size:16px; color:#fff; transition:all 0.15s;
  }
  .check-label { font-size:15px; font-weight:600; }
  .check-sub { font-size:11px; color:#777; margin-top:2px; }
  .check-item.on.c-rule { border-color:#3b82f6; background:#0f1d33; }
  .check-item.on.c-rule .check-box { background:#3b82f6; border-color:#3b82f6; }
  .check-item.on.c-ex { border-color:#22c55e; background:#0f2918; }
  .check-item.on.c-ex .check-box { background:#22c55e; border-color:#22c55e; }
  .check-item.on.c-sleep { border-color:#a855f7; background:#1d0f33; }
  .check-item.on.c-sleep .check-box { background:#a855f7; border-color:#a855f7; }
  .check-item.on.c-thx { border-color:#fbbf24; background:#33290f; }
  .check-item.on.c-thx .check-box { background:#fbbf24; border-color:#fbbf24; color:#000; }
  .thx-input {
    width:100%; margin-top:8px; background:#0a0a14; border:1px solid #333;
    border-radius:10px; padding:10px 12px; color:#fff; font-size:14px;
    font-family:inherit; outline:none; resize:none;
  }
  .thx-input:focus { border-color:#fbbf24; }
  .cal-card { background:#16162a; border-radius:18px; padding:16px; }
  .cal-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .cal-nav { font-size:22px; color:#a78bfa; cursor:pointer; padding:4px 12px; user-select:none; }
  .cal-month { font-size:15px; font-weight:700; }
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
  .cal-dow { text-align:center; font-size:11px; color:#666; padding:4px 0; }
  .cal-day {
    aspect-ratio:1; border-radius:10px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; font-size:13px; color:#aaa;
    background:#1e1e34; cursor:pointer; position:relative; overflow:hidden;
  }
  .cal-day.empty { background:transparent; cursor:default; }
  .cal-day.future { opacity:0.3; cursor:default; }
  .cal-day.today .daynum { color:#fff; font-weight:800; }
  .cal-day.selected { border:2px solid #fff; }
  /* 채움: 밑에서부터 차오르는 fill 레이어 */
  .cal-fill { position:absolute; left:0; right:0; bottom:0; z-index:1; transition:height 0.2s; }
  .cal-day .daynum { position:relative; z-index:2; }
  .cal-check { font-size:10px; line-height:1; margin-top:1px; position:relative; z-index:2; color:#fff; }
  .cal-day.perfect { box-shadow:0 0 14px rgba(255,255,255,0.5); }
  .cal-day.perfect .daynum { color:#fff; font-weight:800; text-shadow:0 1px 3px rgba(0,0,0,0.6); }
  @keyframes rainbow { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
  .rainbow {
    background:linear-gradient(45deg,#ff0040,#ff8000,#ffe000,#40ff00,#00e0ff,#4000ff,#ff00e0);
    background-size:300% 300%; animation:rainbow 3s ease infinite;
  }
  .legend { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin-top:14px; font-size:10px; color:#999; }
  .legend span { display:flex; align-items:center; gap:4px; }
  .dot { width:10px; height:10px; border-radius:3px; }
  .stats { display:flex; gap:8px; margin-top:16px; }
  .stat { flex:1; background:#16162a; border-radius:14px; padding:12px 6px; text-align:center; }
  .stat-num { font-size:22px; font-weight:700; }
  .stat-lbl { font-size:10px; color:#777; margin-top:2px; }
</style>
</head>
<body>
  <a href="index.html" class="back-btn">← 헌터로</a>

  <div class="top-date" id="topDate"></div>

  <div class="streak-card">
    <div class="streak-label">매매 원칙 연속 지킨 날</div>
    <div class="streak-num" id="streakNum">0</div>
    <div class="streak-unit">일째</div>
    <div class="streak-msg" id="streakMsg"></div>
  </div>

  <div class="checks">
    <div class="check-title"><span>탭해서 체크</span><span class="sel-tag" id="selTag"></span></div>

    <div class="check-item c-rule" data-k="rule" onclick="toggle('rule')">
      <div class="check-box">&#10003;</div>
      <div><div class="check-label">매매 원칙 지켰다</div>
      <div class="check-sub">장중 안 보고 룰대로 &mdash; 제일 중요</div></div>
    </div>

    <div class="check-item c-ex" data-k="ex" onclick="toggle('ex')">
      <div class="check-box">&#10003;</div>
      <div><div class="check-label">운동했다</div>
      <div class="check-sub">아침 10분이라도 &mdash; 도파민 옮기기</div></div>
    </div>

    <div class="check-item c-sleep" data-k="sleep" onclick="toggle('sleep')">
      <div class="check-box">&#10003;</div>
      <div><div class="check-label">일찍 잤다</div>
      <div class="check-sub">수면&middot;컨디션 &mdash; 우울한 아침 끊기</div></div>
    </div>

    <div class="check-item c-thx" data-k="thx" onclick="toggle('thx')">
      <div class="check-box">&#10003;</div>
      <div style="flex:1"><div class="check-label">감사 한 줄 &mdash; 하루 마무리</div>
      <div class="check-sub">오늘 좋았던 거 하나</div></div>
    </div>
    <textarea class="thx-input" id="thxInput" rows="2" placeholder="감사한 거 한 줄&hellip; (적으면 자동 체크)" oninput="onThxInput()"></textarea>
  </div>

  <div class="cal-card">
    <div class="cal-head">
      <div class="cal-nav" onclick="moveMonth(-1)">&#8249;</div>
      <div class="cal-month" id="calMonth"></div>
      <div class="cal-nav" onclick="moveMonth(1)">&#8250;</div>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="legend">
      <span><i class="dot" style="background:#3b82f6"></i>원칙</span>
      <span><i class="dot" style="background:#22c55e"></i>운동</span>
      <span><i class="dot" style="background:#a855f7"></i>수면</span>
      <span><i class="dot" style="background:#fbbf24"></i>감사</span>
      <span><i class="dot rainbow"></i>4개 완성</span>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><div class="stat-num" style="color:#fff" id="statPerfect">0</div><div class="stat-lbl">완벽한 날</div></div>
    <div class="stat"><div class="stat-num" style="color:#3b82f6" id="statRule">0</div><div class="stat-lbl">원칙</div></div>
    <div class="stat"><div class="stat-num" style="color:#22c55e" id="statEx">0</div><div class="stat-lbl">운동</div></div>
    <div class="stat"><div class="stat-num" style="color:#a855f7" id="statSleep">0</div><div class="stat-lbl">수면</div></div>
    <div class="stat"><div class="stat-num" style="color:#fbbf24" id="statThx">0</div><div class="stat-lbl">감사</div></div>
  </div>

<script>
  var KEY='routine_data_v3';
  var ITEMS=['rule','ex','sleep','thx'];
  var COLORS={rule:'#3b82f6', ex:'#22c55e', sleep:'#a855f7', thx:'#fbbf24'};
  var data = load();
  var viewYM = (function(){ var d=new Date(); return {y:d.getFullYear(), m:d.getMonth()}; })();
  var selKey = todayKey(); // 선택된 날짜 (기본 오늘)

  function load(){ try{ return JSON.parse(localStorage.getItem(KEY))||{}; }catch(e){ return {}; } }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(data)); }catch(e){} }
  function todayKey(){ var d=new Date(); return ymd(d.getFullYear(),d.getMonth(),d.getDate()); }
  function ymd(y,m,d){ return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'); }
  function blank(){ return {rule:false,ex:false,sleep:false,thx:false,note:''}; }
  function isFutureKey(key){
    var p=key.split('-'); var dt=new Date(+p[0],+p[1]-1,+p[2]);
    var n=new Date(); return dt > new Date(n.getFullYear(),n.getMonth(),n.getDate());
  }

  // 위 체크칸은 "선택된 날짜(selKey)"를 토글
  function toggle(k){
    if(isFutureKey(selKey)) return;
    if(!data[selKey]) data[selKey]=blank();
    data[selKey][k]=!data[selKey][k];
    if(k==='thx' && !data[selKey][k]) data[selKey].note='';
    save(); render();
  }

  function onThxInput(){
    if(isFutureKey(selKey)) return;
    if(!data[selKey]) data[selKey]=blank();
    var v=document.getElementById('thxInput').value;
    data[selKey].note=v;
    data[selKey].thx = v.trim().length>0;
    save(); render();
  }

  // 달력 날짜 누르면 그 날을 "선택"만 (전부 채우지 않음)
  function selectDay(key){
    if(isFutureKey(key)) return;
    selKey=key;
    render();
    window.scrollTo({top:0, behavior:'smooth'});
  }

  function dayCount(key){
    var d=data[key]; if(!d) return 0;
    return ITEMS.reduce(function(s,k){return s+(d[k]?1:0);},0);
  }

  function calcStreak(){
    var s=0; var d=new Date();
    for(var i=0;i<3650;i++){
      var k=ymd(d.getFullYear(),d.getMonth(),d.getDate());
      if(data[k] && data[k].rule) s++;
      else { if(i===0){ d.setDate(d.getDate()-1); continue; } break; }
      d.setDate(d.getDate()-1);
    }
    return s;
  }

  function msgFor(s){
    if(s===0) return '오늘 원칙 지키면 1일째 시작이에요.';
    if(s===1) return '1일. 시작이 제일 어려워요. 했어요.';
    if(s<7) return s+'일 연속. 끊지 마세요, 쌓이고 있어요.';
    if(s<30) return s+'일 연속. 습관이 자리잡는 중이에요.';
    if(s<100) return s+'일. 이제 형님 거예요. 안 끊기네요.';
    return s+'일. 5년 되찾고 있는 중이에요.';
  }

  function fillStyle(dd, cnt){
    // 밑에서부터 1/4씩. 채워진 항목 색을 아래→위 순서로 쌓음
    if(cnt===0) return '';
    if(cnt===4) return ''; // 무지개는 클래스로
    var on=[];
    for(var i=0;i<ITEMS.length;i++){ if(dd[ITEMS[i]]) on.push(COLORS[ITEMS[i]]); }
    var h=cnt*25;
    if(on.length===1) return 'height:'+h+'%;background:'+on[0]+';';
    // 여러 색이면 아래부터 균등 그라데이션
    var stops=[]; var seg=100/on.length;
    for(var j=0;j<on.length;j++){
      stops.push(on[j]+' '+(j*seg)+'%'); stops.push(on[j]+' '+((j+1)*seg)+'%');
    }
    return 'height:'+h+'%;background:linear-gradient(to top,'+stops.join(',')+');';
  }

  function render(){
    var now=new Date();
    var dows=['일','월','화','수','목','금','토'];
    document.getElementById('topDate').textContent =
      now.getFullYear()+'년 '+(now.getMonth()+1)+'월 '+now.getDate()+'일 '+dows[now.getDay()]+'요일';

    var s=calcStreak();
    document.getElementById('streakNum').textContent=s;
    document.getElementById('streakMsg').textContent=msgFor(s);

    // 선택된 날짜 표시 + 위 체크칸을 selKey 기준으로
    var sd=data[selKey]||blank();
    var selTag=document.getElementById('selTag');
    if(selKey===todayKey()) selTag.textContent='오늘';
    else { var sp=selKey.split('-'); selTag.textContent=(+sp[1])+'월 '+(+sp[2])+'일 수정중'; }

    var items=document.querySelectorAll('.check-item');
    for(var ii=0;ii<items.length;ii++){
      var k=items[ii].dataset.k;
      if(sd[k]) items[ii].classList.add('on'); else items[ii].classList.remove('on');
    }
    var thxBox=document.getElementById('thxInput');
    if(document.activeElement!==thxBox) thxBox.value = sd.note||'';

    document.getElementById('calMonth').textContent = viewYM.y+'년 '+(viewYM.m+1)+'월';
    var grid=document.getElementById('calGrid');
    grid.innerHTML='';
    for(var di=0;di<dows.length;di++){ var de=document.createElement('div'); de.className='cal-dow'; de.textContent=dows[di]; grid.appendChild(de); }
    var first=new Date(viewYM.y,viewYM.m,1).getDay();
    var days=new Date(viewYM.y,viewYM.m+1,0).getDate();
    for(var f=0;f<first;f++){ var ee=document.createElement('div'); ee.className='cal-day empty'; grid.appendChild(ee); }
    var todayStr=todayKey();
    for(var d=1;d<=days;d++){
      var key=ymd(viewYM.y,viewYM.m,d);
      var e=document.createElement('div'); e.className='cal-day';
      var fut=isFutureKey(key);
      var cnt=dayCount(key);
      var dd=data[key]||blank();
      if(key===todayStr) e.classList.add('today');
      if(key===selKey) e.classList.add('selected');
      var inner='';
      // fill 레이어
      if(cnt===4){
        inner+='<div class="cal-fill rainbow" style="height:100%"></div>';
      } else if(cnt>0){
        inner+='<div class="cal-fill" style="'+fillStyle(dd,cnt)+'"></div>';
      }
      inner+='<div class="daynum">'+d+'</div>';
      if(cnt===4){ e.classList.add('perfect'); inner+='<div class="cal-check">&#10003;</div>'; }
      e.innerHTML=inner;
      if(fut){ e.classList.add('future'); }
      else { (function(kk){ e.onclick=function(){ selectDay(kk); }; })(key); }
      grid.appendChild(e);
    }

    var perfect=0,rule=0,ex=0,sleep=0,thx=0;
    Object.keys(data).forEach(function(k){
      var c=dayCount(k);
      if(c===4) perfect++;
      if(data[k].rule) rule++;
      if(data[k].ex) ex++;
      if(data[k].sleep) sleep++;
      if(data[k].thx) thx++;
    });
    document.getElementById('statPerfect').textContent=perfect;
    document.getElementById('statRule').textContent=rule;
    document.getElementById('statEx').textContent=ex;
    document.getElementById('statSleep').textContent=sleep;
    document.getElementById('statThx').textContent=thx;
  }

  function moveMonth(dir){
    viewYM.m+=dir;
    if(viewYM.m<0){ viewYM.m=11; viewYM.y--; }
    if(viewYM.m>11){ viewYM.m=0; viewYM.y++; }
    render();
  }

  render();
</script>
</body>
</html>
