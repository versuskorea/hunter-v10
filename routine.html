<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>루틴</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:#0a0a14; color:#fff; padding:18px; padding-bottom:60px;
    max-width:480px; margin:0 auto; min-height:100vh;
  }
  .top-date { text-align:center; font-size:14px; color:#8b8ba0; margin-bottom:6px; }
  .streak-card {
    background:linear-gradient(135deg,#1a1a3e,#2a1a3e);
    border-radius:20px; padding:24px 18px; text-align:center; margin-bottom:16px;
    border:1px solid rgba(123,97,255,0.3);
  }
  .streak-label { font-size:13px; color:#a78bfa; margin-bottom:8px; font-weight:600; }
  .streak-num { font-size:64px; font-weight:800; line-height:1;
    background:linear-gradient(135deg,#a78bfa,#ec4899); -webkit-background-clip:text;
    -webkit-text-fill-color:transparent; }
  .streak-unit { font-size:18px; color:#8b8ba0; margin-top:4px; }
  .streak-msg { font-size:13px; color:#c4b5fd; margin-top:12px; line-height:1.5; min-height:18px; }
  .checks { margin-bottom:18px; }
  .check-title { font-size:13px; color:#8b8ba0; margin-bottom:10px; padding-left:4px; }
  .check-item {
    display:flex; align-items:center; gap:14px; background:#16162a;
    border-radius:14px; padding:16px 18px; margin-bottom:10px; cursor:pointer;
    border:2px solid transparent; transition:all 0.15s;
  }
  .check-item.on { border-color:#22c55e; background:#16291e; }
  .check-box {
    width:26px; height:26px; border-radius:8px; border:2px solid #444;
    flex-shrink:0; display:flex; align-items:center; justify-content:center;
    font-size:16px; color:#fff; transition:all 0.15s;
  }
  .check-item.on .check-box { background:#22c55e; border-color:#22c55e; }
  .check-label { font-size:15px; font-weight:600; }
  .check-sub { font-size:11px; color:#777; margin-top:2px; }
  .cal-card { background:#16162a; border-radius:18px; padding:16px; }
  .cal-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .cal-nav { font-size:22px; color:#a78bfa; cursor:pointer; padding:4px 12px; user-select:none; }
  .cal-month { font-size:15px; font-weight:700; }
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
  .cal-dow { text-align:center; font-size:11px; color:#666; padding:4px 0; }
  .cal-day {
    aspect-ratio:1; border-radius:10px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; font-size:13px; color:#888;
    background:#1e1e34; cursor:pointer; position:relative; transition:all 0.15s;
  }
  .cal-day.empty { background:transparent; cursor:default; }
  .cal-day.future { opacity:0.3; cursor:default; }
  .cal-day.lv1 { background:#1f3a28; color:#86efac; }
  .cal-day.lv2 { background:#236b3a; color:#fff; }
  .cal-day.lv3 { background:#22c55e; color:#fff; font-weight:700;
    box-shadow:0 0 12px rgba(34,197,94,0.5); }
  .cal-day.today { border:2px solid #a78bfa; }
  .cal-check { font-size:11px; line-height:1; margin-top:1px; }
  .legend { display:flex; justify-content:center; gap:14px; margin-top:14px; font-size:10px; color:#777; }
  .legend span { display:flex; align-items:center; gap:4px; }
  .dot { width:10px; height:10px; border-radius:3px; }
  .stats { display:flex; gap:10px; margin-top:16px; }
  .stat { flex:1; background:#16162a; border-radius:14px; padding:14px; text-align:center; }
  .stat-num { font-size:24px; font-weight:700; color:#a78bfa; }
  .stat-lbl { font-size:11px; color:#777; margin-top:2px; }
</style>
</head>
<body>
  <div class="top-date" id="topDate"></div>

  <div class="streak-card">
    <div class="streak-label">매매 원칙 연속 지킨 날</div>
    <div class="streak-num" id="streakNum">0</div>
    <div class="streak-unit">일째</div>
    <div class="streak-msg" id="streakMsg"></div>
  </div>

  <div class="checks">
    <div class="check-title">오늘 한 거 탭하기</div>
    <div class="check-item" data-k="rule" onclick="toggleToday('rule')">
      <div class="check-box">✓</div>
      <div><div class="check-label">매매 원칙 지켰다</div>
      <div class="check-sub">장중 안 보고 룰대로 — 이게 제일 중요</div></div>
    </div>
    <div class="check-item" data-k="del" onclick="toggleToday('del')">
      <div class="check-box">✓</div>
      <div><div class="check-label">주문 후 앱 지웠다</div>
      <div class="check-sub">충동 들어올 구멍 막기</div></div>
    </div>
    <div class="check-item" data-k="ex" onclick="toggleToday('ex')">
      <div class="check-box">✓</div>
      <div><div class="check-label">운동했다</div>
      <div class="check-sub">아침 10분이라도 — 도파민 옮기기</div></div>
    </div>
  </div>

  <div class="cal-card">
    <div class="cal-head">
      <div class="cal-nav" onclick="moveMonth(-1)">‹</div>
      <div class="cal-month" id="calMonth"></div>
      <div class="cal-nav" onclick="moveMonth(1)">›</div>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="legend">
      <span><i class="dot" style="background:#1f3a28"></i>1개</span>
      <span><i class="dot" style="background:#236b3a"></i>2개</span>
      <span><i class="dot" style="background:#22c55e"></i>완벽한 날</span>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><div class="stat-num" id="statPerfect">0</div><div class="stat-lbl">완벽한 날</div></div>
    <div class="stat"><div class="stat-num" id="statRule">0</div><div class="stat-lbl">원칙 지킨 날</div></div>
    <div class="stat"><div class="stat-num" id="statEx">0</div><div class="stat-lbl">운동한 날</div></div>
  </div>

<script>
  const KEY='routine_data_v2';
  let data = load();
  let viewYM = (function(){ const d=new Date(); return {y:d.getFullYear(), m:d.getMonth()}; })();

  function load(){ try{ return JSON.parse(localStorage.getItem(KEY))||{}; }catch(e){ return {}; } }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(data)); }catch(e){} }
  function todayKey(){ const d=new Date(); return ymd(d.getFullYear(),d.getMonth(),d.getDate()); }
  function ymd(y,m,d){ return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'); }

  function toggleToday(k){
    const t=todayKey();
    if(!data[t]) data[t]={rule:false,del:false,ex:false};
    data[t][k]=!data[t][k];
    save(); render();
  }

  function toggleDay(key){
    const d=data[key]||{rule:false,del:false,ex:false};
    const cnt=(d.rule?1:0)+(d.del?1:0)+(d.ex?1:0);
    // 탭하면: 비어있으면 완벽한날로, 뭔가 있으면 비우기
    if(cnt===0) data[key]={rule:true,del:true,ex:true};
    else data[key]={rule:false,del:false,ex:false};
    save(); render();
  }

  function dayCount(key){
    const d=data[key]; if(!d) return 0;
    return (d.rule?1:0)+(d.del?1:0)+(d.ex?1:0);
  }

  function calcStreak(){
    let s=0; const d=new Date();
    for(let i=0;i<3650;i++){
      const k=ymd(d.getFullYear(),d.getMonth(),d.getDate());
      if(data[k] && data[k].rule) s++;
      else { if(i===0){ d.setDate(d.getDate()-1); continue; } break; }
      d.setDate(d.getDate()-1);
    }
    return s;
  }

  function msgFor(s){
    if(s===0) return '오늘 원칙 지키면 1일째 시작이에요.';
    if(s===1) return '1일. 시작이 제일 어려워요. 했어요.';
    if(s<7) return s+'일 연속. 끊지 마세요, 쌓이고 있어요.';
    if(s<30) return s+'일 연속. 습관이 자리잡는 중이에요.';
    if(s<100) return s+'일. 이제 형님 거예요. 안 끊기네요.';
    return s+'일. 5년 되찾고 있는 중이에요.';
  }

  function render(){
    const now=new Date();
    const dows=['일','월','화','수','목','금','토'];
    document.getElementById('topDate').textContent =
      now.getFullYear()+'년 '+(now.getMonth()+1)+'월 '+now.getDate()+'일 '+dows[now.getDay()]+'요일';

    const s=calcStreak();
    document.getElementById('streakNum').textContent=s;
    document.getElementById('streakMsg').textContent=msgFor(s);

    const t=todayKey();
    document.querySelectorAll('.check-item').forEach(el=>{
      const k=el.dataset.k;
      const on = data[t] && data[t][k];
      el.classList.toggle('on', !!on);
    });

    // 달력
    document.getElementById('calMonth').textContent = viewYM.y+'년 '+(viewYM.m+1)+'월';
    const grid=document.getElementById('calGrid');
    grid.innerHTML='';
    dows.forEach(d=>{ const e=document.createElement('div'); e.className='cal-dow'; e.textContent=d; grid.appendChild(e); });
    const first=new Date(viewYM.y,viewYM.m,1).getDay();
    const days=new Date(viewYM.y,viewYM.m+1,0).getDate();
    for(let i=0;i<first;i++){ const e=document.createElement('div'); e.className='cal-day empty'; grid.appendChild(e); }
    const todayStr=todayKey();
    for(let d=1;d<=days;d++){
      const key=ymd(viewYM.y,viewYM.m,d);
      const e=document.createElement('div'); e.className='cal-day';
      const cellDate=new Date(viewYM.y,viewYM.m,d);
      const isFuture = cellDate > new Date(now.getFullYear(),now.getMonth(),now.getDate());
      const cnt=dayCount(key);
      if(cnt===1) e.classList.add('lv1');
      else if(cnt===2) e.classList.add('lv2');
      else if(cnt===3) e.classList.add('lv3');
      if(key===todayStr) e.classList.add('today');
      let inner='<div>'+d+'</div>';
      if(cnt===3) inner+='<div class="cal-check">✓</div>';
      e.innerHTML=inner;
      if(isFuture){ e.classList.add('future'); }
      else { e.onclick=()=>toggleDay(key); }
      grid.appendChild(e);
    }

    // 통계
    let perfect=0, rule=0, ex=0;
    Object.keys(data).forEach(k=>{
      const c=dayCount(k);
      if(c===3) perfect++;
      if(data[k].rule) rule++;
      if(data[k].ex) ex++;
    });
    document.getElementById('statPerfect').textContent=perfect;
    document.getElementById('statRule').textContent=rule;
    document.getElementById('statEx').textContent=ex;
  }

  function moveMonth(dir){
    viewYM.m+=dir;
    if(viewYM.m<0){ viewYM.m=11; viewYM.y--; }
    if(viewYM.m>11){ viewYM.m=0; viewYM.y++; }
    render();
  }

  render();
</script>
</body>
</html>
