<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>📊 MNQ 백테</title>
<meta http-equiv="Cache-Control" content="no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#08080a;--card:#111118;--card2:#1a1a1f;--border:#222233;--accent:#3b82f6;--green:#22c55e;--red:#ef4444;--text:#f0f0f0;--dim:#666;--top:#a78bfa;--gold:#fbbf24}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;padding:12px;max-width:640px;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;padding:6px 0 2px}
.back{font-size:13px;color:var(--accent);text-decoration:none;font-weight:700;padding:7px 12px;border:1px solid var(--border);border-radius:10px;white-space:nowrap}
.top h1{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:2px;color:#fff}
.top h1 span{color:var(--accent)}
.status{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;padding:5px 10px;border-radius:20px;background:var(--card);color:var(--dim)}
.status.live{color:var(--green);border:1px solid var(--green)}
.status.err{color:var(--red);border:1px solid var(--red)}
.asof{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--dim);margin:4px 2px 12px}

.panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px}
.pt{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--dim);letter-spacing:1.2px;text-transform:uppercase;margin-bottom:10px;font-weight:700}
.grid{display:grid;gap:8px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:1fr 1fr 1fr}
.g4{grid-template-columns:repeat(4,1fr)}
label{display:block;font-size:10px;color:var(--dim);margin-bottom:4px;font-weight:600}
input,select{width:100%;background:#0a0a0f;border:1px solid var(--border);border-radius:8px;padding:9px 10px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;text-align:center;outline:none;-webkit-appearance:none}
input:focus,select:focus{border-color:var(--accent)}
.run{width:100%;padding:14px;background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff;border:none;border-radius:11px;font-size:15px;font-weight:800;cursor:pointer;margin-top:12px;font-family:'DM Sans',sans-serif}
.run:active{transform:scale(.98)}
.run:disabled{opacity:.5}

.chartbox{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 10px 8px;margin-bottom:12px}
.chartbox .ct2{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--dim);letter-spacing:1.2px;font-weight:700;margin:0 4px 8px;display:flex;align-items:center}
.chartbox .ct2 .rt{margin-left:auto;font-size:11px}
.chartbox svg{width:100%;display:block}
.hero{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px}
.hbox{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 6px;text-align:center}
.hbox .k{font-size:10px;color:var(--dim);font-weight:600}
.hbox .v{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:800;margin-top:4px}
.up{color:var(--green)}.down{color:var(--red)}.warn{color:var(--gold)}

.ct{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--dim);letter-spacing:1.2px;text-transform:uppercase;margin:14px 4px 8px;font-weight:700}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;font-family:'JetBrains Mono',monospace}
th,td{padding:9px 5px;text-align:right;font-size:12px;border-bottom:1px solid var(--border)}
th{background:var(--card2);color:var(--dim);font-weight:700;font-size:10px}
td:first-child,th:first-child{text-align:left;padding-left:12px;font-weight:800}
tr:last-child td{border-bottom:none}
.scroll{max-height:340px;overflow-y:auto;border-radius:12px}
.empty{color:var(--dim);text-align:center;padding:24px;font-style:italic}
.bar{display:inline-block;height:7px;border-radius:3px;background:var(--accent);vertical-align:middle}
.note{background:#0a0a14;border-radius:8px;padding:9px 11px;font-size:10px;color:var(--dim);line-height:1.6;margin-top:10px}
.preset-wrap{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pbtn{background:var(--card2);border:1px solid var(--border);border-radius:9px;padding:9px 8px;cursor:pointer;text-align:left;color:var(--text);font-family:'DM Sans',sans-serif}
.pbtn:active{background:#252535}
.pbtn .n{font-size:12px;font-weight:800;display:block}
.pbtn .r{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--dim);display:block;margin-top:2px}
.pbtn .dd{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;color:var(--red);display:block;margin-top:1px}
.pbtn.all{grid-column:1/-1;border-color:var(--accent)}
.pbtn.all .n{color:var(--accent)}

<script>
const MULT=2, FX=1390;
const etDate=off=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(Date.now()+(off||0)*86400000));

/* ── 주요 시장 사건 (사건 직전 시작 ~ 회복까지) ── */
const EVENTS=[
  {n:'닷컴 붕괴',          d1:'2000-03-01', d2:'2003-06-30', dd:'NQ −83%'},
  {n:'서브프라임',         d1:'2007-10-01', d2:'2009-12-31', dd:'NQ −53%'},
  {n:'2018 VIX 쇼크',      d1:'2018-01-15', d2:'2018-06-30', dd:'NQ −12%'},
  {n:'2018 4Q 폭락',       d1:'2018-09-20', d2:'2019-06-30', dd:'NQ −23%'},
  {n:'2020 코로나',        d1:'2020-02-10', d2:'2020-09-30', dd:'NQ −30%'},
  {n:'2021 말 고점',       d1:'2021-11-15', d2:'2022-12-31', dd:'NQ −35%'},
  {n:'2022 하락장 전체',   d1:'2022-01-01', d2:'2022-12-31', dd:'연 −33%'},
  {n:'2022 6월 저점',      d1:'2022-05-01', d2:'2023-06-30', dd:'NQ −24%'},
  {n:'2023 SVB 사태',      d1:'2023-02-20', d2:'2023-08-31', dd:'NQ −8%'},
  {n:'2024 8월 엔캐리',    d1:'2024-07-10', d2:'2024-12-31', dd:'NQ −15%'},
  {n:'2025 관세 폭락',     d1:'2025-01-28', d2:'2025-12-31', dd:'NQ −22%'},
  {n:'2026 상반기',        d1:'2026-01-01', d2:'2026-12-31', dd:'조정 −12%'},
];
function renderPresets(){
  const el=document.getElementById('presets');
  el.innerHTML=EVENTS.map((e,i)=>
    `<button class="pbtn" onclick="applyPreset(${i})">
      <span class="n">${e.n}</span><span class="r">${e.d1.slice(2)} ~ ${e.d2.slice(2)}</span>
      <span class="dd">${e.dd}</span></button>`).join('')
    + `<button class="pbtn all" onclick="applyPreset(-1)"><span class="n">전체 기간</span>
       <span class="r">데이터 처음부터 끝까지</span></button>`;
}
window.applyPreset=i=>{
  if(i<0){
    if(BARS.length){
      document.getElementById('d1').value=BARS[0].date;
      document.getElementById('d2').value=BARS[BARS.length-1].date;
    }
  }else{
    const e=EVENTS[i];
    document.getElementById('d1').value=e.d1;
    document.getElementById('d2').value=e.d2;
  }
  document.getElementById('run').click();
  setTimeout(()=>document.getElementById('out').scrollIntoView({behavior:'smooth',block:'start'}),120);
};

let BARS=[], ADJ_INFO='';

/* 선물 롤오버 갭 보정 (back-adjust)
   롤오버는 3·6·9·12월 셋째 금요일 전후에만 발생하므로 그 시점만 검사한다.
   (임계값만으로 판정하면 실제 폭락을 갭으로 오인함) */
function isRollWindow(dateStr){
  const d=new Date(dateStr+'T00:00:00Z');
  const m=d.getUTCMonth()+1;
  if(![3,6,9,12].includes(m)) return false;
  // 그 달 셋째 금요일 구하기
  const y=d.getUTCFullYear();
  let fri=0,cnt=0;
  for(let day=1;day<=31;day++){
    const t=new Date(Date.UTC(y,m-1,day));
    if(t.getUTCMonth()+1!==m) break;
    if(t.getUTCDay()===5){cnt++;if(cnt===3){fri=day;break;}}
  }
  const dd=d.getUTCDate();
  return Math.abs(dd-fri)<=4;      // 만기 ±4일
}
function backAdjust(bars){
  if(bars.length<10) return {bars,n:0};
  const out=bars.map(b=>({date:b.date,close:b.close}));
  const gaps=[];
  for(let i=1;i<out.length-1;i++){
    if(!isRollWindow(out[i].date)) continue;      // 만기 창 밖은 무시
    const r=out[i].close/out[i-1].close-1;
    if(Math.abs(r)>0.015){                        // 롤오버 갭은 보통 0.5~2%
      const nx=out[i+1].close/out[i].close-1;
      if(Math.sign(nx)!==Math.sign(r) && Math.abs(nx)>Math.abs(r)*0.6) continue;
      gaps.push({i, diff: out[i].close-out[i-1].close, date:out[i].date});
    }
  }
  for(const g of gaps.slice().reverse()){
    for(let k=0;k<g.i;k++) out[k].close+=g.diff;
  }
  return {bars:out.filter(b=>b.close>0), n:gaps.length};
}

async function fetchBars(sym,days){
  const url=`/api/history?symbol=${encodeURIComponent(sym)}&start=${etDate(-days)}&end=${etDate(1)}&_=${Date.now()}`;
  const r=await fetch(url,{cache:'no-store'});
  const d=await r.json();
  if(d.error||!d.bars||d.bars.length<30) throw new Error(d.error||'데이터 부족');
  return d.bars;
}
async function loadData(){
  const st=document.getElementById('status'),as=document.getElementById('asof');
  st.textContent='로딩'; st.className='status';
  const src=document.getElementById('src')?document.getElementById('src').value:'auto';
  const useAdj=document.getElementById('adj')?document.getElementById('adj').value==='1':true;
  if(src==='auto'){
    for(const sym of ['NQ=F','^NDX']){
      try{
        const b=await fetchBars(sym,11000);
        if(b[b.length-1].close>5000){
          const {bars:adj,n:ng}= useAdj? backAdjust(b) : {bars:b,n:0};
          BARS=adj;
          ADJ_INFO=useAdj?(ng?` · 롤오버 ${ng}건 보정`:' · 갭 없음'):' · 보정 끔';
          st.textContent='준비완료'; st.className='status live';
          as.textContent=`${sym} · ${adj[0].date} ~ ${adj[adj.length-1].date} · ${adj.length}일${ADJ_INFO}`;
          document.getElementById('d1').value=adj[0].date;
          document.getElementById('d2').value=adj[adj.length-1].date;
          return;
        }
      }catch(e){}
    }
  }
  // QQQ 환산 (갭 없음)
  try{
    const b=await fetchBars('QQQ',11000);
    const sc=+localStorage.getItem('mnq-scale')||41.4;
    BARS=b.map(x=>({date:x.date,close:x.close*sc}));
    st.textContent='QQQ환산'; st.className='status live';
    as.textContent=`QQQ×${sc.toFixed(1)} · ${b[0].date} ~ ${b[b.length-1].date} · ${b.length}일`;
    document.getElementById('d1').value=b[0].date;
    document.getElementById('d2').value=b[b.length-1].date;
    autoRun();
  }catch(e){
    st.textContent='실패'; st.className='status err';
    as.textContent='데이터 로드 실패: '+e.message;
  }
}

function bizDays(a,b){let d=new Date(a),e=new Date(b),n=0;while(d<e){d.setDate(d.getDate()+1);const w=d.getDay();if(w!==0&&w!==6)n++;}return n;}

function ladderFor(total, tiers, order='mid'){
  /* 총 계약수를 티어에 배분. order: mid(T2우선) / back(T3우선) / front(T1우선) */
  const lad=new Array(tiers).fill(1);
  let seq;
  if(order==='front')      seq=[...Array(tiers).keys()];                 // 0,1,2
  else if(order==='back')  seq=[...Array(tiers).keys()].reverse();       // 2,1,0
  else {                                                                 // 가운데부터
    seq=[...Array(tiers).keys()].sort((a,b)=>
      Math.abs(a-(tiers-1)/2) - Math.abs(b-(tiers-1)/2) || a-b);
  }
  let extra=total-tiers, k=0;
  while(extra>0){ lad[seq[k%tiers]]++; extra--; k++; }
  return lad;
}

function backtest(P){
  const bars=BARS.filter(b=>b.date>=P.d1&&b.date<=P.d2);
  if(bars.length<P.ma+2) return null;
  const cl=bars.map(b=>b.close), dt=bars.map(b=>b.date);
  const REF = BARS.length ? BARS[BARS.length-1].close : cl[cl.length-1];  // 전체 데이터 마지막 = 현재 지수
  const n=cl.length;
  let equity=P.cap, pos=[], step=0;
  let qty = P.qty;                      // 균등 모드용
  let totalQ = P.tiers * P.qty;         // 사다리 모드용 총 계약수
  let peak=P.cap, mdd=0, wu=0, liq=0, skip=0, maxHeld=0, wuEquity=P.cap, minRatio=1;
  let maxNeed=0, maxNeedAt=null, maxNeedQ=0, startNeed=0, wuAt=null, wuQty=0;
  let liqAt=null, bankrupt=null, stopped=null;
  let limWant=0, limCap=0;
  const buys=[];
  const mmdd={}, mpk={}, mstart={};
  const trades=[], yearly={}, monthly={}, eqCurve=[];
  let ypk=P.cap, ymdd={};

  for(let i=P.ma;i<n;i++){
    const p=cl[i], pv=cl[i-1];
    let s=0; for(let k=i-P.ma+1;k<=i;k++) s+=cl[k];
    const ma=s/P.ma;
    let ps=0; for(let k=i-P.ma;k<i;k++) ps+=cl[k];
    const ym=dt[i].slice(0,7), yy=dt[i].slice(0,4);

    // ── 매도 (MOC 우선) ──
    const hasMOC = pos.some(x=>(i-x.i)>=P.hold);
    const keep=[];
    for(const x of pos.slice().sort((a,b)=>a.i-b.i)){
      const held=i-x.i;
      const byTime=held>=P.hold;
      if(hasMOC && P.mocFirst){                 // MOC 있는 날엔 MOC만 청산
        if(byTime){ closeOne(x,'MOC'); } else keep.push(x);
        continue;
      }
      if(byTime){ closeOne(x,'MOC'); continue; }
      const sellThr = (P.smode==='entry')
        ? Math.ceil(x.e*(1+P.sell/100)/0.25)*0.25
        : Math.ceil(ma*(1+P.sell/100)/0.25)*0.25;
      if(p>=sellThr) closeOne(x, P.smode==='entry'?'익절':'MA'); else keep.push(x);
    }
    function closeOne(x,rz){
      const raw = (p-P.slip)-x.e;
      const adj = P.norm ? (raw/x.e)*REF : raw;      // 정규화: %수익률 × 현재지수
      const pnl = adj*MULT*x.q*FX;
      equity+=pnl;
      trades.push({d:dt[i],pnl,pct:(p/x.e-1)*100,held:i-x.i,q:x.q,reason:rz,entry:x.e,exit:p});
      monthly[ym]=(monthly[ym]||0)+pnl;
      yearly[yy]=(yearly[yy]||0)+pnl;
    }
    if(!keep.length) step=0;
    pos=keep;

    // 복리 배수
    if(P.per>0 && !pos.length){
      const gain = equity - P.cap;
      // 복리 기준 통일: P.per = "총 계약 1개 늘리는 데 필요한 수익"
      const baseTotal = P.tiers * P.qty;
      const wantTotal = baseTotal + Math.max(Math.floor(gain/P.per), 0);
      if(P.growMode==='unit'){
        // 사다리: 총 계약수를 1개씩
        const perOne = P.margin * (1 + P.buffer);
        const aff = Math.floor(equity/perOne);
        if(wantTotal < aff) limWant++; else if(aff < wantTotal) limCap++;
        totalQ = Math.max(baseTotal, Math.min(wantTotal, aff));
      }else{
        // 균등: 총 계약수를 티어수로 나눠 올림 단위로
        const perUnit = P.tiers * P.margin * (1 + P.buffer);
        const wantQ   = Math.max(1, Math.floor(wantTotal / P.tiers));
        const afford  = Math.max(Math.floor(equity/perUnit), 1);
        const nq = Math.min(wantQ, afford);
        if(nq!==qty) qty=nq;
      }
    }

    // 매수
    const lad = (P.growMode==='unit') ? ladderFor(totalQ, P.tiers, P.ladOrder) : null;
    if(step<P.tiers){
      let thr;
      if(P.bmode==='low'){
        thr = Math.min(cl[i-1],cl[i-2]) * (1-P.buy/100);
      }else if(P.bmode==='prev'){
        thr = pv * (1-P.buy/100);
      }else{
        const f=1-P.buy/100;
        thr = Math.min(f*ps/(P.ma-f), pv*(1+P.cap2/100));
      }
      thr = Math.floor(thr/0.25)*0.25;              // 매수 내림(틱)
      if(p<=thr){
        const useQ = lad ? lad[step] : qty;
        pos.push({e:p+P.slip,i,q:useQ}); step++;
        buys.push({d:dt[i], px:p+P.slip, q:useQ, tier:step, held:pos.reduce((a,x)=>a+x.q,0)});
      }
    }
    const un=pos.reduce((a,x)=>a+(P.norm?((p-x.e)/x.e)*REF:(p-x.e))*MULT*x.q*FX,0);
    const heldQ=pos.reduce((a,x)=>a+x.q,0); maxHeld=Math.max(maxHeld,heldQ);
    let tot=equity+un;
    if(un<wu){ wu=un; wuEquity=tot; wuAt=dt[i]; wuQty=heldQ; }
    if(heldQ>0){ const rr=tot/(heldQ*P.margin); if(rr<minRatio) minRatio=rr; }
    // 필요자본 추적
    if(heldQ>0){
      const need = heldQ*P.margin + Math.max(0,-un);
      if(need>maxNeed){ maxNeed=need; maxNeedAt=dt[i]; maxNeedQ=heldQ; }
      if(heldQ<=P.qty*P.tiers && need>startNeed) startNeed=need;
    }

    // ── 마진콜 / 파산 판정 ──
    if(P.liqMode!=='off' && heldQ>0 && tot < heldQ*P.margin*P.maintRatio){
      for(const x of pos) equity += ((p-P.slip)-x.e)*MULT*x.q*FX;
      pos=[]; step=0; liq++;
      if(!liqAt) liqAt=dt[i];
      tot = equity;
      if(P.liqMode==='stop'){ stopped=dt[i]; break; }      // 마진콜 = 종료
      if(equity <= 0){ equity=0; tot=0; bankrupt=dt[i]; break; }
    }
    if(P.liqMode!=='off' && tot <= 0){ equity=0; tot=0; bankrupt=dt[i]; break; }
    peak=Math.max(peak,tot); if(peak>0) mdd=Math.max(Math.min(mdd,(tot-peak)/peak*100),-100);
    if(!(yy in ymdd)){ypk=tot;ymdd[yy]=0;}
    ypk=Math.max(ypk,tot); ymdd[yy]=Math.min(ymdd[yy],(tot-ypk)/ypk*100);
    if(!(ym in mmdd)){ mmdd[ym]=0; mpk[ym]=tot; mstart[ym]=tot; }
    mpk[ym]=Math.max(mpk[ym],tot);
    mmdd[ym]=Math.min(mmdd[ym],(tot-mpk[ym])/mpk[ym]*100);
    mstart[ym+'_end']=tot;
    eqCurve.push({d:dt[i],v:tot,y:yy});
  }
  const un=pos.reduce((a,x)=>a+(P.norm?((cl[n-1]-x.e)/x.e)*REF:(cl[n-1]-x.e))*MULT*x.q*FX,0);
  const final=equity+un;
  const years=(new Date(dt[n-1])-new Date(dt[P.ma]))/(365.25*864e5);
  const wins=trades.filter(t=>t.pnl>0);
  return {final,profit:final-P.cap,
    cagr:(years>0&&final>0)?(Math.pow(final/P.cap,1/years)-1)*100:(final<=0?-100:0),
    mdd,wu,liq,skip,trades,buys,yearly,monthly,ymdd,mmdd,mstart,years,qty,eqCurve,maxHeld,wuEquity,minRatio,maxNeed,maxNeedAt,maxNeedQ,startNeed,wuAt,wuQty,liqAt,bankrupt,stopped,limWant,limCap,ref:REF,
    wr:trades.length?wins.length/trades.length*100:0,
    d1:dt[P.ma],d2:dt[n-1],nq0:cl[P.ma],nq1:cl[n-1]};
}

function fmt(v){const a=Math.abs(v);
  if(a>=1e8) return (v/1e8).toFixed(2)+'억';
  return Math.round(v/1e4).toLocaleString()+'만';}

function equityChart(R, init){
  const c=R.eqCurve; if(!c||c.length<2) return '';
  const W=1000, H=300, PL=62, PR=14, PT=14, PB=26;
  const iw=W-PL-PR, ih=H-PT-PB;
  const vals=c.map(x=>x.v);
  let lo=Math.min(...vals, init), hi=Math.max(...vals, init);
  const logMode = hi/Math.max(lo,1) > 20;
  const f = v => logMode ? Math.log10(Math.max(v,1)) : v;
  const flo=f(lo), fhi=f(hi), span=(fhi-flo)||1;
  const X = i => PL + iw*i/(c.length-1);
  const Y = v => PT + ih*(1-(f(v)-flo)/span);

  // 자산 곡선
  let d='';
  for(let i=0;i<c.length;i++) d += (i?'L':'M')+X(i).toFixed(1)+','+Y(c[i].v).toFixed(1);
  // 최고점 추적선(drawdown 음영용)
  let pk=-1e18, dd='';
  const pkArr=c.map(x=>{ pk=Math.max(pk,x.v); return pk; });
  for(let i=0;i<c.length;i++) dd += (i?'L':'M')+X(i).toFixed(1)+','+Y(pkArr[i]).toFixed(1);
  const area = d + 'L'+X(c.length-1).toFixed(1)+','+(PT+ih)+'L'+PL+','+(PT+ih)+'Z';

  // y축 눈금
  const ticks=[];
  for(let k=0;k<=4;k++){
    const fv = flo + span*k/4;
    ticks.push(logMode ? Math.pow(10,fv) : fv);
  }
  // x축 연도
  const yl=[]; let last='';
  c.forEach((x,i)=>{ const y=x.d.slice(0,4); if(y!==last){ yl.push({i,y}); last=y; } });

  const up = c[c.length-1].v >= init;
  const col = up ? 'var(--green)' : 'var(--red)';
  return `<div class="chartbox">
    <div class="ct2">자산 곡선 ${logMode?'<span style="color:var(--dim)">(로그)</span>':''}
      <span class="rt">${fmt(init)} → <b style="color:${col}">${fmt(c[c.length-1].v)}</b></span></div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <defs><linearGradient id="eg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${up?'#22c55e':'#ef4444'}" stop-opacity="0.28"/>
        <stop offset="100%" stop-color="${up?'#22c55e':'#ef4444'}" stop-opacity="0"/>
      </linearGradient></defs>
      ${ticks.map(t=>`<line x1="${PL}" y1="${Y(t).toFixed(1)}" x2="${W-PR}" y2="${Y(t).toFixed(1)}" stroke="#222233" stroke-width="1"/>
        <text x="${PL-6}" y="${(Y(t)+4).toFixed(1)}" fill="#666" font-size="11" text-anchor="end" font-family="monospace">${fmt(t)}</text>`).join('')}
      <line x1="${PL}" y1="${Y(init).toFixed(1)}" x2="${W-PR}" y2="${Y(init).toFixed(1)}" stroke="#3b82f6" stroke-width="1.2" stroke-dasharray="5,4"/>
      <path d="${area}" fill="url(#eg)"/>
      <path d="${dd}" fill="none" stroke="#444455" stroke-width="1.2" stroke-dasharray="3,3"/>
      <path d="${d}" fill="none" stroke="${up?'#22c55e':'#ef4444'}" stroke-width="2.2" stroke-linejoin="round"/>
      ${yl.map(o=>`<text x="${X(o.i).toFixed(1)}" y="${H-7}" fill="#666" font-size="11" text-anchor="middle" font-family="monospace">${o.y}</text>`).join('')}
    </svg></div>`;
}

  h+=`<div class="panel"><div class="pt">요약</div><table><tbody>
    <tr><td>기간</td><td>${R.d1} ~ ${R.d2} (${R.years.toFixed(1)}년)</td></tr>

    <tr><td>최종자산</td><td>${fmt(R.final)}  (${((R.final/P.cap-1)*100).toFixed(0)}%)</td></tr>
    <tr><td>거래 / 승률</td><td>${R.trades.length}회 / ${R.wr.toFixed(0)}%</td></tr>
    <tr><td>최악 평가손</td><td class="down">${fmt(R.wu)}</td></tr>
    <tr><td>계약/티어 (시작→끝)</td><td>${P.qty}계약 → <b style="color:var(--accent)">${R.qty}계약</b>${P.per>0?' (복리 증설)':''}</td></tr>
    <tr><td>최대 동시보유</td><td>${R.maxHeld}계약 (증거금 ${(R.maxHeld*P.margin/1e4).toLocaleString()}만)</td></tr>
  </tbody></table></div>`;

  // 연도별
  const ys=Object.keys(R.yearly).sort();
  if(ys.length){
    const mx=Math.max(...ys.map(y=>Math.abs(R.yearly[y])));
    h+=`<div class="ct">연도별</div><table><thead><tr><th>연도</th><th>실현손익</th><th>수익률</th><th>MDD</th><th></th></tr></thead><tbody>`;
    let runY=init;
    for(const y of ys){
      const v=R.yearly[y], w=mx?Math.abs(v)/mx*100:0;
      const ret=runY>0?(v/runY*100):0; runY+=v;
      h+=`<tr><td>${y}</td><td class="${v>=0?'up':'down'}">${fmt(v)}</td>
        <td class="${ret>=0?'up':'down'}">${ret>=0?'+':''}${ret.toFixed(0)}%</td>
        <td class="warn">${(R.ymdd[y]||0).toFixed(1)}%</td>
        <td style="width:26%"><span class="bar" style="width:${w}%;background:${v>=0?'var(--green)':'var(--red)'}"></span></td></tr>`;
    }
    h+=`</tbody></table>`;
  }

  // 월별
  const ms=Object.keys(R.monthly).sort();
  if(ms.length&&ms.length<=80){
    const mx=Math.max(...ms.map(m=>Math.abs(R.monthly[m])));
    h+=`<div class="ct">월별 손익 · 수익률 · MDD</div><div class="scroll"><table>
      <thead><tr><th>월</th><th>실현손익</th><th>수익률</th><th>MDD</th><th></th></tr></thead><tbody>`;
    let run=init;
    for(const m of ms){
      const v=R.monthly[m];
      const ret=run>0?(v/run*100):0;
      run+=v;
      const md=R.mmdd&&R.mmdd[m]!==undefined?R.mmdd[m]:0;
      const w=mx?Math.abs(v)/mx*100:0;
      h+=`<tr><td>${m}</td>
        <td class="${v>=0?'up':'down'}">${fmt(v)}</td>
        <td class="${ret>=0?'up':'down'}">${ret>=0?'+':''}${ret.toFixed(1)}%</td>
        <td class="${md<-20?'down':'warn'}">${md.toFixed(1)}%</td>
        <td style="width:26%"><span class="bar" style="width:${w}%;background:${v>=0?'var(--green)':'var(--red)'}"></span></td></tr>`;
    }
    h+=`</tbody></table></div>`;
  }

  // 거래 (최근 40)
  h+=`<div class="ct">거래 내역 (최근 40)</div><div class="scroll"><table>
    <thead><tr><th>청산일</th><th>계약</th><th>진입</th><th>청산</th><th>보유</th><th>%</th><th>손익</th><th>사유</th></tr></thead><tbody>`;
  for(const t of R.trades.slice(-40).reverse()){
    h+=`<tr><td>${t.d.slice(5)}</td>
      <td style="color:var(--accent);font-weight:800">${t.q}</td>
      <td>${Math.round(t.entry).toLocaleString()}</td>
      <td>${Math.round(t.exit).toLocaleString()}</td><td>${t.held}일</td>
      <td class="${t.pct>=0?'up':'down'}">${t.pct>=0?'+':''}${t.pct.toFixed(2)}</td>
      <td class="${t.pnl>=0?'up':'down'}">${fmt(t.pnl)}</td><td style="font-size:10px;color:var(--dim)">${t.reason}</td></tr>`;
  }
  h+=`</tbody></table></div>`;

  // 매수 내역
  if(R.buys && R.buys.length){
    h+=`<div class="ct">매수 내역 (최근 30)</div><div class="scroll"><table>
      <thead><tr><th>매수일</th><th>티어</th><th>계약</th><th>진입가</th><th>보유합계</th></tr></thead><tbody>`;
    for(const b of R.buys.slice(-30).reverse()){
      h+=`<tr><td>${b.d.slice(5)}</td>
        <td>T${b.tier}</td>
        <td style="color:var(--green);font-weight:800">${b.q}</td>
        <td>${Math.round(b.px).toLocaleString()}</td>
        <td style="color:var(--dim)">${b.held}계</td></tr>`;
    }
    h+=`</tbody></table></div>`;
  }
  document.getElementById('out').innerHTML=h;
}

document.getElementById('run').addEventListener('click',()=>{
  if(!BARS.length){alert('시세 데이터가 없습니다');return;}
  const P=readParams();
  const btn=document.getElementById('run');
  running=true;
  btn.disabled=true;btn.textContent='계산 중…';
  setTimeout(()=>{ 
    try{
      const R=backtest(P);
      render(R,P);
    }catch(err){
      document.getElementById('out').innerHTML=
        `<div class="panel" style="border-color:var(--red);background:#1a0a0a">
          <div style="color:var(--red);font-weight:800;font-size:13px">⚠️ 계산 오류</div>
          <div style="color:var(--dim);font-size:11px;margin-top:6px">${err.message}</div></div>`;
      console.error(err);
    }
    running=false;
    btn.disabled=false;btn.textContent='▶ 백테 실행';
  },30);
});

function readParams(){
  return {
    d1:document.getElementById('d1').value, d2:document.getElementById('d2').value,
    cap:(+document.getElementById('cap').value||2200)*1e4,
    qty:+document.getElementById('qty').value||1,
    per:(+document.getElementById('per').value||0)*1e4,
    buy:+document.getElementById('buy').value||0.6,
    sell:+document.getElementById('sell').value||0.7,
    ma:Math.max(+document.getElementById('ma').value||3,2),
    hold:+document.getElementById('hold').value||8,
    tiers:+document.getElementById('tiers').value||5,
    cap2:+document.getElementById('cap2').value||5.5,
    margin:(+document.getElementById('margin').value||600)*1e4,
    minAdd:(+document.getElementById('minAdd').value||1620)*1e4,
    buffer:(+document.getElementById('buffer').value||30)/100,
    growMode:document.getElementById('growMode').value,
    ladOrder:document.getElementById('ladOrder').value,
    liqMode:document.getElementById('liqOn').value,
    maintRatio:(+document.getElementById('maintRatio').value||91)/100,
    norm:document.getElementById('norm').value==='1',
    startMode:'1',
    bmode:document.getElementById('bmode').value,
    mocFirst:document.getElementById('mocFirst').value==='1',

    smode:document.getElementById('smode').value,
    slip:+document.getElementById('slip').value||0,
  };
}

/* 청산 안 나는 최소 자본 탐색 */
function findMinCap(P0){
  let lo=+document.getElementById('cap').value, hi=lo, found=null;
  for(let k=0;k<12;k++){
    hi=Math.round(hi*1.4);
    const P={...P0, cap:hi*1e4};
    const R=backtest(P);
    if(R && R.liq===0 && R.final>0){ found={cap:hi,R}; break; }
  }
  const el=document.getElementById('out');
  if(!found){
    el.insertAdjacentHTML('afterbegin',
      `<div class="panel" style="border-color:var(--red);background:#1a0a0a">
        <div style="font-size:13px;font-weight:700;color:var(--red)">자본을 크게 늘려도 청산을 피하지 못함</div>
        <div style="font-size:11px;color:var(--dim);margin-top:6px">
          복리 설정이 켜져 있으면 자본이 늘수록 계약도 늘어 효과가 없다. 복리를 0으로 두고 다시 확인.
        </div></div>`);
    return;
  }
  // 정밀 탐색
  let a=Math.round(found.cap/1.4), b=found.cap;
  for(let k=0;k<8;k++){
    const mid=Math.round((a+b)/2);
    const R=backtest({...P0,cap:mid*1e4});
    if(R && R.liq===0 && R.final>0) b=mid; else a=mid;
  }
  const R=backtest({...P0,cap:b*1e4});
  el.insertAdjacentHTML('afterbegin',
    `<div class="panel" style="border-color:var(--gold);background:#1a1508">
      <div style="font-size:13px;font-weight:800;color:var(--gold)">🔎 이 구간을 버티려면</div>
      <table style="margin-top:10px;border:none;background:none"><tbody>
        <tr><td>최소 자본</td><td style="color:var(--gold);font-weight:800">${b.toLocaleString()}만원</td></tr>
        <tr><td>안전 자본 (+30%)</td><td style="color:var(--green);font-weight:800">${Math.round(b*1.3).toLocaleString()}만원</td></tr>
        <tr><td>그때 수익금</td><td>${fmt(R.profit)}</td></tr>
        <tr><td>그때 MDD</td><td>${R.mdd.toFixed(1)}%</td></tr>
        <tr><td>최악 평가손</td><td class="down">${fmt(R.wu)}</td></tr>
      </tbody></table></div>`);
}
let capManual=false;
function syncCap(){
  if(capManual) return;
  const q=+document.getElementById('qty').value||1;
  const t=+document.getElementById('tiers').value||3;
  const m=+document.getElementById('margin').value||400;
  const b=(+document.getElementById('buffer').value||30)/100;
  const v=Math.ceil(q*t*m*(1+b)/100)*100;          // 100만 단위 올림
  document.getElementById('cap').value=v;
  document.getElementById('capMode').textContent='자동';
  document.getElementById('capMode').style.color='var(--green)';
}
let autoTimer=null;
let running=false;
function autoRun(){
  if(!BARS.length) return;
  clearTimeout(autoTimer);
  autoTimer=setTimeout(()=>{
    if(running) return;
    document.getElementById('run').click();
  },250);
}
function updateFormula(){
  const bm=document.getElementById('bmode').value;
  const sm=document.getElementById('smode').value;
  const b=+document.getElementById('buy').value||0;
  const sl=+document.getElementById('sell').value||0;
  const man=+document.getElementById('ma').value||3;
  const cp=+document.getElementById('cap2').value||5.5;
  const h=+document.getElementById('hold').value||3;
  const bt = bm==='low' ? `min(전일종가, 그제종가) × (1−${b}%)`
           : bm==='prev'? `전일종가 × (1−${b}%)`
           : `min(MA${man}×(1−${b}%), 전일×(1+${cp}%))`;
  const st = sm==='entry' ? `각 티어 진입가 × (1+${sl}%)`
           : `MA${man} × (1+${sl}%)`;
  document.getElementById('formulaText').innerHTML =
    `매수 = <b style="color:var(--green)">${bt}</b> 이하 (내림)<br>`+
    `매도 = <b style="color:var(--top)">${st}</b> 이상 (올림) 또는 ${h}일 경과 MOC`;
  // MA 필드 사용 여부 표시
  const useMA = (bm==='ma'||sm==='ma');
  const maBox=document.getElementById('ma');
  const maWrap = maBox.closest('div');
  if(maWrap) maWrap.style.display = useMA?'':'none';
  const gm=document.getElementById('growMode').value;
  const pl=document.getElementById('perLbl');
  if(pl) pl.textContent = '복리 (수익 N만마다 총계약 +1)';
  const perV=+document.getElementById('per').value||0;
  document.getElementById('cap').style.opacity = perV>0?'1':'0.4';
  const mg=+document.getElementById('margin').value||600;
  document.getElementById('marginText').textContent=`증거금 ${mg.toLocaleString()}만/계약`;
  const lm=document.getElementById('liqOn').value; const lo=lm!=='off';
  const mr=+document.getElementById('maintRatio').value||91;
  const lt=document.getElementById('liqText');
  if(lt) lt.innerHTML = lo
    ? `순자산 &lt; 보유계약 × ${Math.round(mg*mr/100).toLocaleString()}만이면 <b style="color:var(--gold)">마진콜</b>${lm==='stop'?' → <b style="color:var(--red)">운용 종료</b>':' → 청산 후 재시작'}`
    : `<span style="color:var(--dim)">마진콜 반영 끔 (이론값)</span>`;
  const capBox=document.getElementById('cap2');
  const capWrap = capBox.closest('div');
  if(capWrap) capWrap.style.display = (bm==='ma')?'':'none';
}
// 계약수·티어·증거금·여유% → 자본 자동 갱신
['qty','tiers','margin','buffer'].forEach(id=>{
  const el=document.getElementById(id); if(!el) return;
  const fn=()=>{ syncCap(); updateFormula(); autoRun(); };
  el.addEventListener('input',fn); el.addEventListener('change',fn);
});
// 자본을 직접 만지면 수동 모드
document.getElementById('cap').addEventListener('input',()=>{
  capManual=true;
  const cm=document.getElementById('capMode');
  cm.textContent='수동'; cm.style.color='var(--gold)';
  updateFormula(); autoRun();
});
document.getElementById('cap').addEventListener('dblclick',()=>{ capManual=false; syncCap(); autoRun(); });
['bmode','smode','buy','sell','ma','cap2','hold','per','minAdd','slip','norm','growMode','liqOn','maintRatio','ladOrder'].forEach(id=>{
  const el=document.getElementById(id); if(!el) return;
  const fn=()=>{ updateFormula(); autoRun(); };
  el.addEventListener('input',fn); el.addEventListener('change',fn);
});
['d1','d2'].forEach(id=>{
  const el=document.getElementById(id); if(el) el.addEventListener('change',autoRun);
});
document.getElementById('btnToday').addEventListener('click',()=>{
  if(BARS.length) document.getElementById('d2').value=BARS[BARS.length-1].date;
});
document.getElementById('src').addEventListener('change',loadData);
document.getElementById('adj').addEventListener('change',loadData);
renderPresets();
syncCap();
updateFormula();
loadData();
</script>
</body>
