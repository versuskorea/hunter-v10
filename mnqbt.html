<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>📊 MNQ 백테</title>
<meta http-equiv="Cache-Control" content="no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#08080a;--card:#111118;--card2:#1a1a1f;--border:#222233;--accent:#3b82f6;--green:#22c55e;--red:#ef4444;--text:#f0f0f0;--dim:#666;--top:#a78bfa;--gold:#fbbf24}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;padding:12px;max-width:640px;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;padding:6px 0 2px}
.back{font-size:13px;color:var(--accent);text-decoration:none;font-weight:700;padding:7px 12px;border:1px solid var(--border);border-radius:10px;white-space:nowrap}
.top h1{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:2px;color:#fff}
.top h1 span{color:var(--accent)}
.status{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;padding:5px 10px;border-radius:20px;background:var(--card);color:var(--dim)}
.status.live{color:var(--green);border:1px solid var(--green)}
.status.err{color:var(--red);border:1px solid var(--red)}
.asof{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--dim);margin:4px 2px 12px}

.panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px}
.pt{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--dim);letter-spacing:1.2px;text-transform:uppercase;margin-bottom:10px;font-weight:700}
.grid{display:grid;gap:8px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:1fr 1fr 1fr}
.g4{grid-template-columns:repeat(4,1fr)}
label{display:block;font-size:10px;color:var(--dim);margin-bottom:4px;font-weight:600}
input,select{width:100%;background:#0a0a0f;border:1px solid var(--border);border-radius:8px;padding:9px 10px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;text-align:center;outline:none;-webkit-appearance:none}
input:focus,select:focus{border-color:var(--accent)}
.run{width:100%;padding:14px;background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff;border:none;border-radius:11px;font-size:15px;font-weight:800;cursor:pointer;margin-top:12px;font-family:'DM Sans',sans-serif}
.run:active{transform:scale(.98)}
.run:disabled{opacity:.5}

.hero{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.hbox{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 6px;text-align:center}
.hbox .k{font-size:10px;color:var(--dim);font-weight:600}
.hbox .v{font-family:'JetBrains Mono',monospace;font-size:17px;font-weight:800;margin-top:4px}
.up{color:var(--green)}.down{color:var(--red)}.warn{color:var(--gold)}

.ct{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--dim);letter-spacing:1.2px;text-transform:uppercase;margin:14px 4px 8px;font-weight:700}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;font-family:'JetBrains Mono',monospace}
th,td{padding:9px 5px;text-align:right;font-size:12px;border-bottom:1px solid var(--border)}
th{background:var(--card2);color:var(--dim);font-weight:700;font-size:10px}
td:first-child,th:first-child{text-align:left;padding-left:12px;font-weight:800}
tr:last-child td{border-bottom:none}
.scroll{max-height:340px;overflow-y:auto;border-radius:12px}
.empty{color:var(--dim);text-align:center;padding:24px;font-style:italic}
.bar{display:inline-block;height:7px;border-radius:3px;background:var(--accent);vertical-align:middle}
.note{background:#0a0a14;border-radius:8px;padding:9px 11px;font-size:10px;color:var(--dim);line-height:1.6;margin-top:10px}
.preset-wrap{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pbtn{background:var(--card2);border:1px solid var(--border);border-radius:9px;padding:9px 8px;cursor:pointer;text-align:left;color:var(--text);font-family:'DM Sans',sans-serif}
.pbtn:active{background:#252535}
.pbtn .n{font-size:12px;font-weight:800;display:block}
.pbtn .r{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--dim);display:block;margin-top:2px}
.pbtn .dd{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;color:var(--red);display:block;margin-top:1px}
.pbtn.all{grid-column:1/-1;border-color:var(--accent)}
.pbtn.all .n{color:var(--accent)}
</style>
</head>
<body>
  <div class="top">
    <a href="/mnq.html" class="back">← MNQ</a>
    <h1>📊 <span>백테</span></h1><span style="font-size:10px;color:#444;font-family:monospace">v2</span>
    <span class="status" id="status">대기</span>
  </div>
  <div class="asof" id="asof">시세 불러오는 중…</div>

  <div class="panel">
    <div class="pt">⚡ 스트레스 테스트 · 사건별</div>
    <div id="presets" class="preset-wrap"></div>
    <div class="note" style="margin-top:8px">
      사건 직전에 시작했다면 살아남았을까? 클릭하면 그 기간으로 설정된다.
    </div>
  </div>

  <div class="panel">
    <div class="pt">기간 · 자본</div>
    <div class="grid g2">
      <div><label>시작일</label><input id="d1" type="date"></div>
      <div><label>종료일</label><input id="d2" type="date"></div>
    </div>
    <div class="grid g3" style="margin-top:8px">
      <div><label>자본 (만원)</label><input id="cap" type="number" value="2200"></div>
      <div><label>계약/티어</label><input id="qty" type="number" value="1"></div>
      <div><label>복리 (만원/계약)</label><input id="per" type="number" value="0" placeholder="0=고정"></div>
    </div>

    <div class="pt" style="margin-top:16px">전략 파라미터</div>
    <div class="grid g4">
      <div><label>매수 −%</label><input id="buy" type="number" step="0.1" value="0.6"></div>
      <div><label>매도 +%</label><input id="sell" type="number" step="0.1" value="0.7"></div>
      <div><label>MA</label><input id="ma" type="number" value="3"></div>
      <div><label>보유일</label><input id="hold" type="number" value="8"></div>
    </div>
    <div class="grid g3" style="margin-top:8px">
      <div><label>티어</label><input id="tiers" type="number" value="5"></div>
      <div><label>상한 캡 %</label><input id="cap2" type="number" step="0.1" value="5.5"></div>
      <div><label>슬리피지 pt</label><input id="slip" type="number" step="0.25" value="0.5"></div>
    </div>
    <div class="grid g2" style="margin-top:8px">
      <div><label>데이터</label><select id="src"><option value="auto">NQ=F (선물)</option><option value="qqq">QQQ 환산</option></select></div>
      <div><label>롤오버 보정</label><select id="adj"><option value="1">적용</option><option value="0">끄기</option></select></div>
    </div>
    <button class="run" id="run">▶ 백테 실행</button>
    <div class="note">
      매수 = min(MA×(1−매수%), 전일×(1+상한%)) 이하 · 매도 = MA×(1+매도%) 이상 or 보유일 초과<br>
      증거금 200만/계약 · 순자산이 요구증거금 50% 밑돌면 강제청산
    </div>
  </div>

  <div id="out"></div>

<script>
const MULT=2, MARGIN=200e4, FX=1390;
const etDate=off=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(Date.now()+(off||0)*86400000));

/* ── 주요 시장 사건 (사건 직전 시작 ~ 회복까지) ── */
const EVENTS=[
  {n:'2018 VIX 쇼크',      d1:'2018-01-15', d2:'2018-06-30', dd:'NQ −12%'},
  {n:'2018 4Q 폭락',       d1:'2018-09-20', d2:'2019-06-30', dd:'NQ −23%'},
  {n:'2020 코로나',        d1:'2020-02-10', d2:'2020-09-30', dd:'NQ −30%'},
  {n:'2021 말 고점',       d1:'2021-11-15', d2:'2022-12-31', dd:'NQ −35%'},
  {n:'2022 하락장 전체',   d1:'2022-01-01', d2:'2022-12-31', dd:'연 −33%'},
  {n:'2022 6월 저점',      d1:'2022-05-01', d2:'2023-06-30', dd:'NQ −24%'},
  {n:'2023 SVB 사태',      d1:'2023-02-20', d2:'2023-08-31', dd:'NQ −8%'},
  {n:'2024 8월 엔캐리',    d1:'2024-07-10', d2:'2024-12-31', dd:'NQ −15%'},
  {n:'2025 관세 폭락',     d1:'2025-01-28', d2:'2025-12-31', dd:'NQ −22%'},
  {n:'2026 상반기',        d1:'2026-01-01', d2:'2026-12-31', dd:'조정 −12%'},
];
function renderPresets(){
  const el=document.getElementById('presets');
  el.innerHTML=EVENTS.map((e,i)=>
    `<button class="pbtn" onclick="applyPreset(${i})">
      <span class="n">${e.n}</span><span class="r">${e.d1.slice(2)} ~ ${e.d2.slice(2)}</span>
      <span class="dd">${e.dd}</span></button>`).join('')
    + `<button class="pbtn all" onclick="applyPreset(-1)"><span class="n">전체 기간</span>
       <span class="r">데이터 처음부터 끝까지</span></button>`;
}
window.applyPreset=i=>{
  if(i<0){
    if(BARS.length){
      document.getElementById('d1').value=BARS[0].date;
      document.getElementById('d2').value=BARS[BARS.length-1].date;
    }
  }else{
    const e=EVENTS[i];
    document.getElementById('d1').value=e.d1;
    document.getElementById('d2').value=e.d2;
  }
  document.getElementById('run').click();
  setTimeout(()=>document.getElementById('out').scrollIntoView({behavior:'smooth',block:'start'}),120);
};

let BARS=[], ADJ_INFO='';

/* 선물 롤오버 갭 보정 (back-adjust)
   롤오버는 3·6·9·12월 셋째 금요일 전후에만 발생하므로 그 시점만 검사한다.
   (임계값만으로 판정하면 실제 폭락을 갭으로 오인함) */
function isRollWindow(dateStr){
  const d=new Date(dateStr+'T00:00:00Z');
  const m=d.getUTCMonth()+1;
  if(![3,6,9,12].includes(m)) return false;
  // 그 달 셋째 금요일 구하기
  const y=d.getUTCFullYear();
  let fri=0,cnt=0;
  for(let day=1;day<=31;day++){
    const t=new Date(Date.UTC(y,m-1,day));
    if(t.getUTCMonth()+1!==m) break;
    if(t.getUTCDay()===5){cnt++;if(cnt===3){fri=day;break;}}
  }
  const dd=d.getUTCDate();
  return Math.abs(dd-fri)<=4;      // 만기 ±4일
}
function backAdjust(bars){
  if(bars.length<10) return {bars,n:0};
  const out=bars.map(b=>({date:b.date,close:b.close}));
  const gaps=[];
  for(let i=1;i<out.length-1;i++){
    if(!isRollWindow(out[i].date)) continue;      // 만기 창 밖은 무시
    const r=out[i].close/out[i-1].close-1;
    if(Math.abs(r)>0.015){                        // 롤오버 갭은 보통 0.5~2%
      const nx=out[i+1].close/out[i].close-1;
      if(Math.sign(nx)!==Math.sign(r) && Math.abs(nx)>Math.abs(r)*0.6) continue;
      gaps.push({i, diff: out[i].close-out[i-1].close, date:out[i].date});
    }
  }
  for(const g of gaps.slice().reverse()){
    for(let k=0;k<g.i;k++) out[k].close+=g.diff;
  }
  return {bars:out.filter(b=>b.close>0), n:gaps.length};
}

async function fetchBars(sym,days){
  const url=`/api/history?symbol=${encodeURIComponent(sym)}&start=${etDate(-days)}&end=${etDate(1)}&_=${Date.now()}`;
  const r=await fetch(url,{cache:'no-store'});
  const d=await r.json();
  if(d.error||!d.bars||d.bars.length<30) throw new Error(d.error||'데이터 부족');
  return d.bars;
}
async function loadData(){
  const st=document.getElementById('status'),as=document.getElementById('asof');
  st.textContent='로딩'; st.className='status';
  const src=document.getElementById('src')?document.getElementById('src').value:'auto';
  const useAdj=document.getElementById('adj')?document.getElementById('adj').value==='1':true;
  if(src==='auto'){
    for(const sym of ['NQ=F','^NDX']){
      try{
        const b=await fetchBars(sym,4000);
        if(b[b.length-1].close>5000){
          const {bars:adj,n:ng}= useAdj? backAdjust(b) : {bars:b,n:0};
          BARS=adj;
          ADJ_INFO=useAdj?(ng?` · 롤오버 ${ng}건 보정`:' · 갭 없음'):' · 보정 끔';
          st.textContent='준비완료'; st.className='status live';
          as.textContent=`${sym} · ${adj[0].date} ~ ${adj[adj.length-1].date} · ${adj.length}일${ADJ_INFO}`;
          document.getElementById('d1').value=adj[0].date;
          document.getElementById('d2').value=adj[adj.length-1].date;
          return;
        }
      }catch(e){}
    }
  }
  // QQQ 환산 (갭 없음)
  try{
    const b=await fetchBars('QQQ',4000);
    const sc=+localStorage.getItem('mnq-scale')||41;
    BARS=b.map(x=>({date:x.date,close:x.close*sc}));
    st.textContent='QQQ환산'; st.className='status live';
    as.textContent=`QQQ×${sc.toFixed(1)} · ${b[0].date} ~ ${b[b.length-1].date} · ${b.length}일`;
    document.getElementById('d1').value=b[0].date;
    document.getElementById('d2').value=b[b.length-1].date;
  }catch(e){
    st.textContent='실패'; st.className='status err';
    as.textContent='데이터 로드 실패: '+e.message;
  }
}

function bizDays(a,b){let d=new Date(a),e=new Date(b),n=0;while(d<e){d.setDate(d.getDate()+1);const w=d.getDay();if(w!==0&&w!==6)n++;}return n;}

function backtest(P){
  const bars=BARS.filter(b=>b.date>=P.d1&&b.date<=P.d2);
  if(bars.length<P.ma+2) return null;
  const cl=bars.map(b=>b.close), dt=bars.map(b=>b.date);
  const n=cl.length;
  let equity=P.cap, pos=[], step=0, qty=P.qty;
  let peak=P.cap, mdd=0, wu=0, liq=0, skip=0, maxHeld=0;
  const trades=[], yearly={}, monthly={}, eqCurve=[];
  let ypk=P.cap, ymdd={};

  for(let i=P.ma;i<n;i++){
    const p=cl[i], pv=cl[i-1];
    let s=0; for(let k=i-P.ma+1;k<=i;k++) s+=cl[k];
    const ma=s/P.ma;
    let ps=0; for(let k=i-P.ma;k<i;k++) ps+=cl[k];
    const ym=dt[i].slice(0,7), yy=dt[i].slice(0,4);

    // 매도
    const keep=[];
    for(const x of pos.slice().sort((a,b)=>a.i-b.i)){
      const held=i-x.i;
      const bySell=p>=ma*(1+P.sell/100), byTime=held>=P.hold;
      if(bySell||byTime){
        const pnl=((p-P.slip)-x.e)*MULT*x.q*FX;
        equity+=pnl;
        trades.push({d:dt[i],pnl,pct:(p/x.e-1)*100,held,q:x.q,reason:bySell?'MA':'시간',entry:x.e,exit:p});
        monthly[ym]=(monthly[ym]||0)+pnl;
        yearly[yy]=(yearly[yy]||0)+pnl;
      } else keep.push(x);
    }
    if(!keep.length) step=0;
    pos=keep;

    // 복리 배수
    if(P.per>0 && !pos.length){
      const nq=Math.max(Math.floor(equity/P.per),1);
      if(nq!==qty) qty=nq;
    }

    // 매수
    if(step<P.tiers){
      const f=1-P.buy/100;
      const thr=Math.min(f*ps/(P.ma-f), pv*(1+P.cap2/100));
      if(p<=thr){
        const un0=pos.reduce((a,x)=>a+(p-x.e)*MULT*x.q*FX,0);
        const held=pos.reduce((a,x)=>a+x.q,0);
        if(equity+un0 >= (held+qty)*MARGIN){
          pos.push({e:p+P.slip,i,q:qty}); step++;
        } else skip++;
      }
    }
    const un=pos.reduce((a,x)=>a+(p-x.e)*MULT*x.q*FX,0);
    const heldQ=pos.reduce((a,x)=>a+x.q,0); maxHeld=Math.max(maxHeld,heldQ);
    let tot=equity+un;
    wu=Math.min(wu,un);
    if(heldQ>0 && tot<heldQ*MARGIN*0.5){
      for(const x of pos) equity+=((p-P.slip)-x.e)*MULT*x.q*FX;
      pos=[];step=0;liq++;tot=equity;
      if(equity<=0){ equity=0; tot=0; eqCurve.push({d:dt[i],v:0,y:yy}); break; }
    }
    peak=Math.max(peak,tot); if(peak>0) mdd=Math.max(Math.min(mdd,(tot-peak)/peak*100),-100);
    if(!(yy in ymdd)){ypk=tot;ymdd[yy]=0;}
    ypk=Math.max(ypk,tot); ymdd[yy]=Math.min(ymdd[yy],(tot-ypk)/ypk*100);
    eqCurve.push({d:dt[i],v:tot,y:yy});
  }
  const un=pos.reduce((a,x)=>a+(cl[n-1]-x.e)*MULT*x.q*FX,0);
  const final=equity+un;
  const years=(new Date(dt[n-1])-new Date(dt[P.ma]))/(365.25*864e5);
  const wins=trades.filter(t=>t.pnl>0);
  return {final,profit:final-P.cap,
    cagr:(years>0&&final>0)?(Math.pow(final/P.cap,1/years)-1)*100:(final<=0?-100:0),
    mdd,wu,liq,skip,trades,yearly,monthly,ymdd,years,qty,eqCurve,maxHeld,
    wr:trades.length?wins.length/trades.length*100:0,
    d1:dt[P.ma],d2:dt[n-1],nq0:cl[P.ma],nq1:cl[n-1]};
}

function fmt(v){const a=Math.abs(v);
  if(a>=1e8) return (v/1e8).toFixed(2)+'억';
  return Math.round(v/1e4).toLocaleString()+'만';}

function render(R,P){
  if(!R){document.getElementById('out').innerHTML='<div class="panel empty">데이터가 부족합니다</div>';return;}
  let h='';
  const survived = R.liq===0 && R.final>0;
  const room = P.cap + R.wu;
  const tight = survived && room < P.cap*0.2;
  const col = survived?(tight?'var(--gold)':'var(--green)'):'var(--red)';
  const bgc = survived?(tight?'#1a1508':'#0a1a10'):'#1a0a0a';
  h+=`<div class="panel" style="border-color:${col};background:${bgc};text-align:center;padding:16px">
      <div style="font-family:'JetBrains Mono',monospace;font-size:19px;font-weight:800;color:${col}">
        ${survived?(tight?'⚠️ 아슬아슬 생존':'✅ 생존'):'💀 청산'}</div>
      <div style="font-size:11px;color:var(--dim);margin-top:6px;line-height:1.6">
        자본 ${fmt(P.cap)} · 최악 평가손 ${fmt(R.wu)}<br>
        최악 시점 여유 <b style="color:${col}">${fmt(room)}</b> (자본의 ${(room/P.cap*100).toFixed(0)}%)
      </div></div>`;
  h+=`<div class="hero">
    <div class="hbox"><div class="k">수익금</div><div class="v ${R.profit>=0?'up':'down'}">${fmt(R.profit)}</div></div>
    <div class="hbox"><div class="k">CAGR</div><div class="v ${R.cagr>=0?'up':'down'}">${R.cagr>=0?'+':''}${R.cagr.toFixed(1)}%</div></div>
    <div class="hbox"><div class="k">MDD</div><div class="v ${R.mdd<-40?'down':'warn'}">${R.mdd.toFixed(1)}%</div></div>
    <div class="hbox"><div class="k">청산</div><div class="v ${R.liq?'down':''}">${R.liq}회</div></div>
  </div>`;

  h+=`<div class="panel"><div class="pt">사용된 설정 <span style="color:var(--dim);font-weight:400">v2</span></div><table><tbody>
    <tr><td>자본 / 계약</td><td>${(P.cap/1e4).toLocaleString()}만 / ${P.qty}계약</td></tr>
    <tr><td>복리</td><td style="color:${P.per>0?'var(--green)':'var(--dim)'}">${P.per>0?(P.per/1e4).toLocaleString()+'만당 1계약':'고정 (복리 없음)'}</td></tr>
    <tr><td>매수 / 매도</td><td>−${P.buy}% / +${P.sell}%</td></tr>
    <tr><td>MA / 보유일 / 티어</td><td>${P.ma} / ${P.hold}일 / ${P.tiers}</td></tr>
    <tr><td>상한캡 / 슬리피지</td><td>${P.cap2}% / ${P.slip}pt</td></tr>
  </tbody></table></div>`;

  h+=`<div class="panel"><div class="pt">요약</div><table><tbody>
    <tr><td>기간</td><td>${R.d1} ~ ${R.d2} (${R.years.toFixed(1)}년)</td></tr>
    <tr><td>NQ</td><td>${Math.round(R.nq0).toLocaleString()} → ${Math.round(R.nq1).toLocaleString()} (${((R.nq1/R.nq0-1)*100).toFixed(1)}%)</td></tr>
    <tr><td>최종자산</td><td>${fmt(R.final)}  (${((R.final/P.cap-1)*100).toFixed(0)}%)</td></tr>
    <tr><td>거래 / 승률</td><td>${R.trades.length}회 / ${R.wr.toFixed(0)}%</td></tr>
    <tr><td>최악 평가손</td><td class="down">${fmt(R.wu)}</td></tr>
    <tr><td>최종 계약</td><td>${R.qty}계약${R.skip?` · 증거금부족 ${R.skip}회`:''}</td></tr>
    <tr><td>최대 동시보유</td><td>${R.maxHeld}계약 (증거금 ${(R.maxHeld*200).toLocaleString()}만)</td></tr>
  </tbody></table></div>`;

  // 연도별
  const ys=Object.keys(R.yearly).sort();
  if(ys.length){
    const mx=Math.max(...ys.map(y=>Math.abs(R.yearly[y])));
    h+=`<div class="ct">연도별</div><table><thead><tr><th>연도</th><th>실현손익</th><th>MDD</th><th></th></tr></thead><tbody>`;
    for(const y of ys){
      const v=R.yearly[y], w=mx?Math.abs(v)/mx*100:0;
      h+=`<tr><td>${y}</td><td class="${v>=0?'up':'down'}">${fmt(v)}</td>
        <td class="warn">${(R.ymdd[y]||0).toFixed(1)}%</td>
        <td style="width:34%"><span class="bar" style="width:${w}%;background:${v>=0?'var(--green)':'var(--red)'}"></span></td></tr>`;
    }
    h+=`</tbody></table>`;
  }

  // 월별
  const ms=Object.keys(R.monthly).sort();
  if(ms.length&&ms.length<=60){
    h+=`<div class="ct">월별 실현손익</div><div class="scroll"><table><tbody>`;
    for(const m of ms){const v=R.monthly[m];
      h+=`<tr><td>${m}</td><td class="${v>=0?'up':'down'}">${fmt(v)}</td></tr>`;}
    h+=`</tbody></table></div>`;
  }

  // 거래 (최근 40)
  h+=`<div class="ct">거래 내역 (최근 40)</div><div class="scroll"><table>
    <thead><tr><th>청산일</th><th>진입</th><th>청산</th><th>보유</th><th>%</th><th>손익</th><th>사유</th></tr></thead><tbody>`;
  for(const t of R.trades.slice(-40).reverse()){
    h+=`<tr><td>${t.d.slice(5)}</td><td>${Math.round(t.entry).toLocaleString()}</td>
      <td>${Math.round(t.exit).toLocaleString()}</td><td>${t.held}일</td>
      <td class="${t.pct>=0?'up':'down'}">${t.pct>=0?'+':''}${t.pct.toFixed(2)}</td>
      <td class="${t.pnl>=0?'up':'down'}">${fmt(t.pnl)}</td><td style="font-size:10px;color:var(--dim)">${t.reason}</td></tr>`;
  }
  h+=`</tbody></table></div>`;
  document.getElementById('out').innerHTML=h;
}

document.getElementById('run').addEventListener('click',()=>{
  if(!BARS.length){alert('시세 데이터가 없습니다');return;}
  const P=readParams();
  const btn=document.getElementById('run');
  btn.disabled=true;btn.textContent='계산 중…';
  setTimeout(()=>{ 
    const R=backtest(P);
    render(R,P);
    // 청산났으면 필요 자본 자동 탐색
    if(R && R.liq>0){ findMinCap(P); }
    btn.disabled=false;btn.textContent='▶ 백테 실행';
  },30);
});

function readParams(){
  return {
    d1:document.getElementById('d1').value, d2:document.getElementById('d2').value,
    cap:(+document.getElementById('cap').value||2200)*1e4,
    qty:+document.getElementById('qty').value||1,
    per:(+document.getElementById('per').value||0)*1e4,
    buy:+document.getElementById('buy').value||0.6,
    sell:+document.getElementById('sell').value||0.7,
    ma:Math.max(+document.getElementById('ma').value||3,2),
    hold:+document.getElementById('hold').value||8,
    tiers:+document.getElementById('tiers').value||5,
    cap2:+document.getElementById('cap2').value||5.5,
    slip:+document.getElementById('slip').value||0,
  };
}

/* 청산 안 나는 최소 자본 탐색 */
function findMinCap(P0){
  let lo=+document.getElementById('cap').value, hi=lo, found=null;
  for(let k=0;k<12;k++){
    hi=Math.round(hi*1.4);
    const P={...P0, cap:hi*1e4};
    const R=backtest(P);
    if(R && R.liq===0 && R.final>0){ found={cap:hi,R}; break; }
  }
  const el=document.getElementById('out');
  if(!found){
    el.insertAdjacentHTML('afterbegin',
      `<div class="panel" style="border-color:var(--red);background:#1a0a0a">
        <div style="font-size:13px;font-weight:700;color:var(--red)">자본을 크게 늘려도 청산을 피하지 못함</div>
        <div style="font-size:11px;color:var(--dim);margin-top:6px">
          복리 설정이 켜져 있으면 자본이 늘수록 계약도 늘어 효과가 없다. 복리를 0으로 두고 다시 확인.
        </div></div>`);
    return;
  }
  // 정밀 탐색
  let a=Math.round(found.cap/1.4), b=found.cap;
  for(let k=0;k<8;k++){
    const mid=Math.round((a+b)/2);
    const R=backtest({...P0,cap:mid*1e4});
    if(R && R.liq===0 && R.final>0) b=mid; else a=mid;
  }
  const R=backtest({...P0,cap:b*1e4});
  el.insertAdjacentHTML('afterbegin',
    `<div class="panel" style="border-color:var(--gold);background:#1a1508">
      <div style="font-size:13px;font-weight:800;color:var(--gold)">🔎 이 구간을 버티려면</div>
      <table style="margin-top:10px;border:none;background:none"><tbody>
        <tr><td>최소 자본</td><td style="color:var(--gold);font-weight:800">${b.toLocaleString()}만원</td></tr>
        <tr><td>안전 자본 (+30%)</td><td style="color:var(--green);font-weight:800">${Math.round(b*1.3).toLocaleString()}만원</td></tr>
        <tr><td>그때 수익금</td><td>${fmt(R.profit)}</td></tr>
        <tr><td>그때 MDD</td><td>${R.mdd.toFixed(1)}%</td></tr>
        <tr><td>최악 평가손</td><td class="down">${fmt(R.wu)}</td></tr>
      </tbody></table></div>`);
}
document.getElementById('src').addEventListener('change',loadData);
document.getElementById('adj').addEventListener('change',loadData);
renderPresets();
loadData();
</script>
</body>
