<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HUNTER 백테 v4 - 유닛 통계</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { background: #0f0f1e !important; color: #fff !important; color-scheme: dark !important; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 16px; padding-bottom: 80px; max-width: 600px; margin: 0 auto; min-height: 100vh; }
.header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
h1 { font-size: 22px; font-weight: 700; color: #fff !important; }
h1 .grad { background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.back-btn { background: #1a1a2e !important; color: #fff !important; padding: 8px 14px; border-radius: 10px; text-decoration: none; font-size: 13px; border: 1px solid #333; }
.card { background: #1a1a2e !important; border-radius: 14px; padding: 16px; margin-bottom: 14px; color: #fff !important; }
.ct { font-weight: 700; font-size: 15px; margin-bottom: 12px; color: #667eea !important; }
.ir { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; background: #2a2a3e !important; padding: 10px 14px; border-radius: 10px; }
.ir label { font-size: 13px; color: #aaa !important; min-width: 50px; }
.ir input, .ir select { flex: 1; background: transparent !important; border: none; color: #fff !important; font-size: 15px; outline: none; }
.ir input::-webkit-calendar-picker-indicator { filter: invert(1); opacity: 0.7; }
.ir .u { color: #888 !important; font-size: 13px; }
.btn { width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 10px; color: #fff !important; }
.btn-primary { background: linear-gradient(135deg, #667eea, #764ba2) !important; box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4); }
.btn-analyze { background: linear-gradient(135deg, #f093fb, #f5576c) !important; }
.progress { text-align: center; margin-top: 14px; color: #667eea !important; font-size: 14px; min-height: 20px; }
.result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.result-box { padding: 14px; border-radius: 12px; text-align: center; }
.result-box.hold { background: #2a2a3e !important; }
.result-box.hunter { background: linear-gradient(135deg, #667eea, #764ba2) !important; }
.rb-label { font-size: 11px; opacity: 0.7; margin-bottom: 4px; }
.rb-value { font-size: 22px; font-weight: 700; margin-bottom: 2px; }
.rb-pct { font-size: 13px; opacity: 0.85; }
.metric-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #2a2a3e; font-size: 13px; }
.metric-row:last-child { border-bottom: none; }
.metric-label { color: #aaa !important; }
.metric-value { font-weight: 700; }
.quick-sym { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.quick-sym button { background: #2a2a3e !important; color: #fff !important; border: 1px solid #333; padding: 6px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; }
.tip { background: #1a1a2e !important; padding: 12px 14px; border-radius: 10px; font-size: 13px; color: #bbb !important; line-height: 1.6; margin-bottom: 14px; border: 1px solid #2a2a3e; }
.cycle-badge { display: inline-block; background: linear-gradient(135deg, #f59e0b, #ef4444); color: #fff !important; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 6px; margin-left: 6px; vertical-align: middle; }
.vol-result { background: linear-gradient(135deg, #1a2a4e, #2a1a4e) !important; padding: 16px; border-radius: 14px; margin-bottom: 14px; }
.vol-main { text-align: center; padding: 12px 0; }
.vol-num { font-size: 40px; font-weight: 800; color: #ffdd44 !important; }
.vol-cat { font-size: 15px; margin-top: 6px; }
.param-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 13px; }
.param-label { color: #bbb !important; }
.param-value { color: #ffdd88 !important; font-weight: 700; }
.warmup-info { background: rgba(0, 200, 83, 0.1); border: 1px solid rgba(0, 200, 83, 0.3); padding: 10px 12px; border-radius: 8px; margin-top: 10px; font-size: 12px; color: #8fe8b0 !important; line-height: 1.6; }
.cycle-card { background: linear-gradient(135deg, #1a3a2e, #1a2a4e) !important; border: 1px solid rgba(245, 158, 11, 0.4); padding: 16px; border-radius: 14px; margin-top: 12px; }
.cs-title { font-size: 14px; font-weight: 700; color: #fbbf24 !important; margin-bottom: 12px; }
.cycle-main { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.cycle-big { background: rgba(0,0,0,0.4); padding: 14px; border-radius: 10px; text-align: center; }
.cycle-big .lbl { font-size: 11px; color: #aaa !important; margin-bottom: 6px; }
.cycle-big .big { font-size: 28px; font-weight: 800; letter-spacing: -1px; }
.cycle-big .sub { font-size: 12px; color: #aaa !important; margin-top: 4px; }
.cycle-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
.cycle-mini { background: rgba(0,0,0,0.3); padding: 8px; border-radius: 8px; text-align: center; }
.cycle-mini .lbl { font-size: 10px; color: #999 !important; margin-bottom: 2px; }
.cycle-mini .val { font-size: 14px; font-weight: 700; }
.cycle-distribution { margin-top: 12px; padding: 10px; background: rgba(0,0,0,0.3); border-radius: 8px; }
.cycle-dist-row { display: flex; align-items: center; font-size: 11px; margin: 4px 0; color: #ddd !important; font-family: monospace; }
.cycle-dist-row .dist-label { width: 95px; flex-shrink: 0; color: #aaa !important; font-size: 10px; }
.cycle-dist-row .dist-bar { flex: 1; height: 14px; background: #2a2a3e; border-radius: 4px; margin: 0 8px; position: relative; overflow: hidden; display: block; min-width: 50px; }
.cycle-dist-row .dist-fill { display: block; height: 100%; border-radius: 4px; min-width: 2px; transition: width 0.5s; }
.cycle-dist-row .dist-cnt { width: 80px; flex-shrink: 0; text-align: right; font-size: 10px; }
.def-info { background: rgba(0,0,0,0.25); padding: 10px; border-radius: 8px; margin-top: 10px; font-size: 11px; color: #ccc !important; line-height: 1.7; }
.def-info b { color: #fbbf24 !important; }
.best-worst { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.bw-card { padding: 10px; border-radius: 8px; font-size: 11px; line-height: 1.5; }
.bw-card.best { background: rgba(0, 255, 0, 0.08); border: 1px solid rgba(0, 255, 0, 0.3); }
.bw-card.worst { background: rgba(255, 0, 0, 0.08); border: 1px solid rgba(255, 0, 0, 0.3); }
.bw-card .bw-pnl { font-size: 18px; font-weight: 800; margin: 4px 0; }
.bw-card.best .bw-pnl { color: #0f0 !important; }
.bw-card.worst .bw-pnl { color: #f88 !important; }
.bw-card .bw-date { color: #aaa !important; font-size: 10px; }
.unit-stats { background: rgba(123, 97, 255, 0.1); border: 1px solid rgba(123, 97, 255, 0.4); padding: 12px; border-radius: 10px; margin-top: 12px; }
.unit-stats-title { font-size: 12px; font-weight: 700; color: #a78bfa !important; margin-bottom: 8px; }
.unit-row { display: flex; align-items: center; font-size: 11px; margin: 4px 0; color: #ddd !important; font-family: monospace; }
.unit-row .ulbl { width: 60px; flex-shrink: 0; color: #aaa !important; font-size: 11px; }
.unit-row .ubar { flex: 1; height: 16px; background: #2a2a3e; border-radius: 4px; margin: 0 8px; overflow: hidden; }
.unit-row .ufill { display: block; height: 100%; border-radius: 4px; min-width: 2px; }
.unit-row .ucnt { width: 90px; flex-shrink: 0; text-align: right; font-size: 11px; color: #fff; }
</style>
</head>
<body>

<div class="header">
  <h1>📊 <span class="grad">HUNTER</span> 백테<span class="cycle-badge">v4 유닛통계</span></h1>
  <a href="/" class="back-btn">← 돌아가기</a>
</div>

<div class="tip">
  💡 <b>v4:</b> 사이클 종료 시 최대 유닛 통계 추가!<br>
  → 2u/4u/8u/12u/20u 종료 분포 = 시장 변동성 패턴 진단<br>
  → 4u 종료 多 = 건강한 변동, 20u 多 = 폭락 시장, 2u 多 = 단방향 (HUNTER 한계)
</div>

<div class="card">
  <div class="ct">🎯 백테 설정</div>
  <div class="ir">
    <label>종목</label>
    <input type="text" id="bt-sym" value="SOXL" placeholder="SOXL, POET, TSLA..." style="text-transform:uppercase">
    <span class="u">📊</span>
  </div>
  <div class="ir">
    <label>시작</label>
    <input type="date" id="bt-start" style="flex:1">
  </div>
  <div class="ir">
    <label>종료</label>
    <input type="date" id="bt-end" style="flex:1">
  </div>

  <div class="quick-sym">
    <button onclick="setRange('ytd')">올해</button>
    <button onclick="setRange(1)">1년</button>
    <button onclick="setRange(2)">2년</button>
    <button onclick="setRange(3)">3년</button>
    <button onclick="setRange(5)">5년</button>
    <button onclick="setRange(10)">10년</button>
    <button onclick="setRange(20)">최대</button>
  </div>

  <div class="quick-sym" style="margin-top:12px" id="sym-buttons"></div>

<button class="btn btn-analyze" onclick="analyzeVolatility()">📊 변동성 분석 & 자동 설정!</button>
<button class="btn btn-primary" onclick="runBacktest()">🚀 백테 실행!</button>
<button class="btn" onclick="runBacktestBasic()" style="background:linear-gradient(135deg,#00c853,#00897b) !important;">🏹 기본 HUNTER로 백테! (SOXL용)</button>
<button class="btn" onclick="runRuleCompare()" style="background:linear-gradient(135deg,#a78bfa,#3b82f6) !important;font-weight:800">🎯 룰 비교! (매수 유닛 / 매도 % / 강제 기간)</button>
<button class="btn" onclick="runHybridUltimate()" style="background:linear-gradient(135deg,#fbbf24,#ec4899,#a78bfa) !important;color:#000 !important;font-weight:800">💎 HYBRID ULTIMATE! (비중 조절 + 강세장 부스트) ⭐⭐⭐<br><small style="font-size:11px;font-weight:500">각 모드 클릭 시 → 연도별 분석</small></button>
<button class="btn" onclick="runPanicHybrid()" style="background:linear-gradient(135deg,#ef4444,#f97316,#fbbf24) !important;color:#000 !important;font-weight:800">🚨 PANIC 전환 백테! (HYBRID + PANIC 통합 운용) ⭐⭐⭐<br><small style="font-size:11px;font-weight:500">폭락 시그널 + 보유 ≤4u → PANIC 전환</small></button>
<button class="btn" onclick="runBossRule()" style="background:linear-gradient(135deg,#22c55e,#3b82f6,#a78bfa) !important;color:#fff !important;font-weight:800">👑 형님 룰 백테! (전년 SOXL < 0% → 다음해 HUNTER 100%) ⭐⭐⭐⭐<br><small style="font-size:11px;font-weight:500">16년 1,192배 검증 / 폭락 다음해 V자 풀베팅</small></button>
<button class="btn" onclick="runBossRuleMonth()" style="background:linear-gradient(135deg,#fbbf24,#f97316,#ef4444) !important;color:#000 !important;font-weight:800">👑 형님 룰 V2! 월 트리거 (전월 < 임계값 → 다음달 HUNTER 100%) ⭐⭐⭐⭐⭐<br><small style="font-size:11px;font-weight:500">-10/-15/-20/-25% 4가지 임계값 자동 비교 / 최강 패턴 탐색</small></button>

  <div class="progress" id="bt-progress"></div>
</div>

<div id="vol-panel"></div>
<div id="result"></div>

<script>
const DEFAULT_SYMS = ['SOXL', 'TQQQ', 'POET', 'UCO', 'USO', 'TSLA', 'NVDA', 'AMD', 'AAPL', 'MSFT', 'GOOGL', 'SPY', 'QQQ'];

function getRecentSyms() {
  const stored = localStorage.getItem('bt-recent-syms');
  if (stored) {
    try { const arr = JSON.parse(stored); if (Array.isArray(arr) && arr.length > 0) return arr; } catch(e) {}
  }
  return DEFAULT_SYMS.slice();
}
function saveRecentSyms(syms) { localStorage.setItem('bt-recent-syms', JSON.stringify(syms.slice(0, 15))); }
function addRecentSym(sym) {
  if (!sym) return;
  const u = sym.toUpperCase().trim();
  if (!u) return;
  let recent = getRecentSyms();
  recent = recent.filter(s => s !== u);
  recent.unshift(u);
  recent = recent.slice(0, 15);
  saveRecentSyms(recent);
  renderSymButtons();
}
function renderSymButtons() {
  const container = document.getElementById('sym-buttons');
  if (!container) return;
  const syms = getRecentSyms();
  let html = '';
  syms.forEach(s => { html += '<button onclick="setSym(\'' + s + '\')">' + s + '</button>'; });
  container.innerHTML = html;
}
function setSym(s) { document.getElementById('bt-sym').value = s; addRecentSym(s); }
function setRange(years) {
  const end = new Date();
  const start = new Date();
  if (years === 'ytd') start.setMonth(0, 1);
  else if (years === 20) start.setFullYear(2015, 0, 1);
  else start.setFullYear(end.getFullYear() - years);
  const fmt = d => d.toISOString().slice(0, 10);
  document.getElementById('bt-start').value = fmt(start);
  document.getElementById('bt-end').value = fmt(end);
}

window.addEventListener('DOMContentLoaded', () => { setRange(5); renderSymButtons(); });

async function analyzeVolatility() {
  const sym = document.getElementById('bt-sym').value.toUpperCase().trim();
  if (!sym) { alert('종목 입력!'); return; }
  const progressEl = document.getElementById('bt-progress');
  const volEl = document.getElementById('vol-panel');
  progressEl.innerHTML = '📊 1년 데이터 다운로드...';
  volEl.innerHTML = '';
  try {
    const end = new Date();
    const start = new Date();
    start.setFullYear(end.getFullYear() - 1);
    const fmt = d => d.toISOString().slice(0, 10);
    const url = '/api/history?symbol=' + sym + '&start=' + fmt(start) + '&end=' + fmt(end);
    const res = await fetch(url);
    const data = await res.json();
    if (data.error) { progressEl.innerHTML = '❌ ' + data.error; return; }
    if (!data.bars || data.bars.length < 30) { progressEl.innerHTML = '❌ 데이터 부족'; return; }
    const closes = data.bars.map(b => b.close);
    const returns = [];
    for (let i = 1; i < closes.length; i++) returns.push((closes[i] - closes[i-1]) / closes[i-1] * 100);
    const mean = returns.reduce((a,b) => a+b, 0) / returns.length;
    const variance = returns.reduce((s,r) => s + Math.pow(r-mean, 2), 0) / returns.length;
    const vol = Math.sqrt(variance);
    const params = calcParams(vol);
    const category = categorize(vol);
    let html = '<div class="vol-result"><div class="ct" style="color:#ffd">🎯 ' + sym + ' 변동성 분석</div><div class="vol-main"><div class="vol-num">' + vol.toFixed(2) + '%</div><div class="vol-cat">' + category.emoji + ' ' + category.name + '</div></div><div style="background:rgba(0,0,0,0.3);padding:12px;border-radius:10px;margin-top:10px"><div style="font-weight:700;margin-bottom:8px;color:#ffd">💡 추천 HUNTER 설정:</div><div class="param-row"><span class="param-label">유닛</span><span class="param-value">2u / 4u / TU20</span></div><div class="param-row"><span class="param-label">매도 (천/중/바)</span><span class="param-value">+' + (params.top_p*100).toFixed(1) + '% / +' + (params.mid_p*100).toFixed(1) + '% / +' + (params.bot_p*100).toFixed(1) + '%</span></div><div class="param-row"><span class="param-label">강제 기간</span><span class="param-value">' + params.top_d + '/' + params.mid_d + '/' + params.bot_d + '일</span></div></div><div style="background:rgba(255,255,100,0.1);padding:10px;border-radius:8px;margin-top:10px;font-size:12px"><b>💡 ' + category.recommendation + '</b></div></div>';
    volEl.innerHTML = html;
    progressEl.innerHTML = '✅ 분석 완료! [🚀 백테 실행] 클릭!';
    window.autoParams = params;
  } catch(e) { progressEl.innerHTML = '❌ ' + e.message; }
}

function categorize(vol) {
  if (vol < 1.0) return { emoji: '🟢', name: '안정주', recommendation: '변동성 너무 낮음! 단순 보유 추천!' };
  if (vol < 1.5) return { emoji: '🔵', name: '지수 ETF', recommendation: 'Ultra Long HUNTER. 년 3~5회 매매!' };
  if (vol < 2.5) return { emoji: '🟣', name: '안정 성장주', recommendation: 'Long HUNTER. 월 1~2회 매매!' };
  if (vol < 4.0) return { emoji: '🟠', name: '변동 개별주', recommendation: 'Mid HUNTER. 주 1회 매매!' };
  if (vol < 6.0) return { emoji: '🔴', name: '고변동 ETF', recommendation: 'Short-Mid HUNTER!' };
  return { emoji: '🚨', name: '극변동', recommendation: '기본 HUNTER! 자동화 필수!' };
}

function calcParams(vol) {
  const top_p = vol * 0.5 / 100;
  const mid_p = vol * 0.3 / 100;
  const bot_p = vol * 0.8 / 100;
  let top_d, mid_d, bot_d, lookback;
  if (vol >= 5) { top_d = 7; mid_d = 7; bot_d = 10; lookback = 20; }
  else if (vol >= 3) { top_d = 10; mid_d = 10; bot_d = 14; lookback = 30; }
  else if (vol >= 2) { top_d = 14; mid_d = 14; bot_d = 20; lookback = 40; }
  else if (vol >= 1.5) { top_d = 18; mid_d = 18; bot_d = 27; lookback = 50; }
  else { top_d = 25; mid_d = 25; bot_d = 40; lookback = 60; }
  return { top_p, mid_p, bot_p, top_d, mid_d, bot_d, lookback };
}

async function runBacktest() {
  const sym = document.getElementById('bt-sym').value.toUpperCase().trim();
  const userStartDate = document.getElementById('bt-start').value;
  const userEndDate = document.getElementById('bt-end').value;
  if (!sym) { alert('종목 입력!'); return; }
  if (!userStartDate || !userEndDate) { alert('날짜 선택!'); return; }
  addRecentSym(sym);
  const progressEl = document.getElementById('bt-progress');
  const resultEl = document.getElementById('result');
  progressEl.innerHTML = '📥 데이터 가져오는 중...';
  resultEl.innerHTML = '';
  try {
    let params = window.autoParams;
    let paramSource = '자동';
    let measuredVol = null;
    if (params && params._forced) paramSource = params._forced;
    if (!params) {
      const end1y = new Date(userEndDate);
      const start1y = new Date(end1y);
      start1y.setFullYear(start1y.getFullYear() - 1);
      const fmt = d => d.toISOString().slice(0, 10);
      const volRes = await fetch('/api/history?symbol=' + sym + '&start=' + fmt(start1y) + '&end=' + fmt(end1y));
      const volData = await volRes.json();
      if (volData.error) { progressEl.innerHTML = '❌ ' + volData.error; return; }
      const closes1y = volData.bars.map(b => b.close);
      const rets = [];
      for (let i = 1; i < closes1y.length; i++) rets.push((closes1y[i] - closes1y[i-1]) / closes1y[i-1] * 100);
      const mean = rets.reduce((a,b) => a+b, 0) / rets.length;
      const vr = rets.reduce((s,r) => s + Math.pow(r-mean, 2), 0) / rets.length;
      const vol = Math.sqrt(vr);
      measuredVol = vol;
      params = calcParams(vol);
      paramSource = '자동(측정값 ' + vol.toFixed(2) + '%)';
    }
    const warmupTradingDays = Math.max(params.lookback + 5, 25);
    const warmupCalendarDays = Math.ceil(warmupTradingDays * 1.6) + 10;
    const fetchStartDate = new Date(userStartDate);
    fetchStartDate.setDate(fetchStartDate.getDate() - warmupCalendarDays);
    const fmt = d => d.toISOString().slice(0, 10);
    const fetchStartStr = fmt(fetchStartDate);
    progressEl.innerHTML = '📥 데이터 가져오는 중...';
    const res = await fetch('/api/history?symbol=' + sym + '&start=' + fetchStartStr + '&end=' + userEndDate);
    const data = await res.json();
    if (data.error) { progressEl.innerHTML = '❌ ' + data.error; return; }
    if (!data.bars || data.bars.length < 30) { progressEl.innerHTML = '❌ 데이터 부족'; return; }
    const userStartTs = new Date(userStartDate).getTime();
    let userStartIdx = -1;
    for (let i = 0; i < data.bars.length; i++) {
      if (new Date(data.bars[i].date).getTime() >= userStartTs) { userStartIdx = i; break; }
    }
    if (userStartIdx < 0) { progressEl.innerHTML = '❌ 시작일 데이터 없음'; return; }
    progressEl.innerHTML = '✅ 총 ' + data.bars.length + '일 (warmup ' + userStartIdx + '일 + 거래 ' + (data.bars.length - userStartIdx) + '일)';
    const result = simulateHunter(data.bars, params, userStartIdx);
    const userStartPrice = data.bars[userStartIdx].close;
    const userEndPrice = data.bars[data.bars.length - 1].close;
    const buyHoldMult = userEndPrice / userStartPrice;
    const vsHold = result.mult / buyHoldMult;
    
    const dist = [
      { label: '+10% 이상 🌟', min: 10, max: 999, color: '#0f0' },
      { label: '+5%~+10%', min: 5, max: 10, color: '#0d8' },
      { label: '+3%~+5%', min: 3, max: 5, color: '#0c6' },
      { label: '+1%~+3%', min: 1, max: 3, color: '#0a4' },
      { label: '0%~+1%', min: 0, max: 1, color: '#066' },
      { label: '-3%~0%', min: -3, max: 0, color: '#a44' },
      { label: '-5%~-3%', min: -5, max: -3, color: '#c33' },
      { label: '-5% 이하 💀', min: -999, max: -5, color: '#f00' }
    ];
    const completed = result.cycles.filter(c => !c.incomplete);
    const maxCnt = Math.max(...dist.map(d => completed.filter(c => c.pnl >= d.min && c.pnl < d.max).length), 1);
    let distHtml = '';
    dist.forEach(d => {
      const cnt = completed.filter(c => c.pnl >= d.min && c.pnl < d.max).length;
      const pct = completed.length > 0 ? cnt / completed.length * 100 : 0;
      const barW = cnt / maxCnt * 100;
      distHtml += '<div class="cycle-dist-row"><div class="dist-label">' + d.label + '</div><div class="dist-bar"><div class="dist-fill" style="width:' + barW + '%;background:' + d.color + '"></div></div><div class="dist-cnt">' + cnt + '회 (' + pct.toFixed(1) + '%)</div></div>';
    });
    
    // 🆕 사이클 종료 유닛 통계
    const unitBuckets = [
      { label: '2u', min: 2, max: 2, color: '#22c55e' },
      { label: '3-4u', min: 3, max: 4, color: '#3b82f6' },
      { label: '5-6u', min: 5, max: 6, color: '#a78bfa' },
      { label: '7-8u', min: 7, max: 8, color: '#f59e0b' },
      { label: '9-12u', min: 9, max: 12, color: '#f97316' },
      { label: '13-16u', min: 13, max: 16, color: '#ef4444' },
      { label: '17-20u', min: 17, max: 20, color: '#dc2626' }
    ];
    const maxUnitCnt = Math.max(...unitBuckets.map(b => completed.filter(c => c.maxUnits >= b.min && c.maxUnits <= b.max).length), 1);
    let unitHtml = '';
    unitBuckets.forEach(b => {
      const cnt = completed.filter(c => c.maxUnits >= b.min && c.maxUnits <= b.max).length;
      if (cnt === 0) return;
      const pct = completed.length > 0 ? cnt / completed.length * 100 : 0;
      const barW = cnt / maxUnitCnt * 100;
      unitHtml += '<div class="unit-row"><div class="ulbl">' + b.label + '</div><div class="ubar"><div class="ufill" style="width:' + barW + '%;background:' + b.color + '"></div></div><div class="ucnt">' + cnt + '회 (' + pct.toFixed(1) + '%)</div></div>';
    });
    
    let html = '<div class="card">';
    html += '<div class="ct">📈 ' + data.symbol + ' · ' + userStartDate + ' ~ ' + userEndDate + '</div>';
    html += '<div class="result-grid"><div class="result-box hold"><div class="rb-label">📌 단순 보유</div><div class="rb-value" style="color:' + (buyHoldMult>=1?'#0f0':'#f44') + '">' + (buyHoldMult>=1?'+':'') + ((buyHoldMult-1)*100).toFixed(1) + '%</div><div class="rb-pct">' + buyHoldMult.toFixed(2) + '배</div></div><div class="result-box hunter"><div class="rb-label">🏹 HUNTER</div><div class="rb-value">+' + ((result.mult-1)*100).toFixed(1) + '%</div><div class="rb-pct">' + result.mult.toFixed(2) + '배</div></div></div>';
    html += '<div class="metric-row"><span class="metric-label">HUNTER 추가 수익</span><span class="metric-value" style="color:' + (vsHold>1?'#0f0':'#f44') + ';font-size:16px">' + (vsHold>1?'+':'') + ((result.mult - buyHoldMult) * 100).toFixed(1) + '%p ' + (vsHold>1?'🚀':'📉') + '</span></div>';
    html += '<div class="metric-row"><span class="metric-label">vs 단순보유 배율</span><span class="metric-value" style="color:' + (vsHold>1?'#0f0':'#f44') + '">' + vsHold.toFixed(2) + '배</span></div>';
    html += '<div class="metric-row"><span class="metric-label">최대 낙폭 (MDD)</span><span class="metric-value" style="color:#f88">' + result.mdd.toFixed(1) + '%</span></div>';

    html += '<div class="metric-row"><span class="metric-label">티어 승률 (참고)</span><span class="metric-value" style="color:#aaa">' + result.tierWinRate.toFixed(0) + '%</span></div>';
    
    // 연도별 (생략 - 기존과 동일)
    const snapshots = result.periodSnapshots || {};
    const yearKeys = Object.keys(snapshots).filter(k => k.length === 4).sort();
    if (yearKeys.length > 0) {
      let yearHtml = '<div class="card"><div class="ct">📊 연도별 수익률 + MDD (사이클 기준) · 행 클릭 시 월별 펼침</div>';

      for (const yKey of yearKeys) {
        const snap = snapshots[yKey];
        const yearReturn = snap.startCap > 0 ? ((snap.endCap - snap.startCap) / snap.startCap * 100) : 0;
        const yearMdd = snap.mdd || 0;
        const returnCls = yearReturn >= 0 ? '#22c55e' : '#ef4444';
        yearHtml += '<tr style="border-bottom:1px solid #222;cursor:pointer" onclick="toggleYearMonths(\'' + yKey + '\')">';
        yearHtml += '<td style="padding:12px 8px;color:#fff;font-weight:700">' + yKey + ' <span id="year-arrow-' + yKey + '" style="color:#666;font-size:11px">▼</span></td>';
        yearHtml += '<td style="padding:12px 8px;text-align:right;font-weight:800;color:' + returnCls + ';font-size:15px">' + (yearReturn >= 0 ? '+' : '') + yearReturn.toFixed(1) + '%</td>';
        yearHtml += '<td style="padding:12px 8px;text-align:right;color:#ef4444;font-size:13px">' + yearMdd.toFixed(1) + '%</td>';
        yearHtml += '</tr>';
        const monthKeys = Object.keys(snapshots).filter(k => k.length === 7 && k.startsWith(yKey)).sort();
        if (monthKeys.length > 0) {
          yearHtml += '<tr id="months-' + yKey + '" style="display:none"><td colspan="3" style="padding:0;background:#0a0a14"><div style="padding:10px"><table style="width:100%;border-collapse:collapse;font-family:monospace;font-size:13px">';
          yearHtml += '<thead><tr style="border-bottom:1px solid #333"><th style="padding:8px;text-align:left;color:#666;font-size:11px">월</th><th style="padding:8px;text-align:right;color:#888;font-size:11px">수익률</th><th style="padding:8px;text-align:right;color:#666;font-size:11px">MDD</th></tr></thead><tbody>';

            const mMdd = mSnap.mdd || 0;
            const mCls = mReturn >= 0 ? '#22c55e' : '#ef4444';
            const monthOnly = mKey.slice(5);
            yearHtml += '<tr style="border-bottom:1px solid #1a1a1a"><td style="padding:8px;color:#aaa">' + monthOnly + '월</td><td style="padding:8px;text-align:right;color:' + mCls + ';font-weight:700">' + (mReturn >= 0 ? '+' : '') + mReturn.toFixed(1) + '%</td><td style="padding:8px;text-align:right;color:#ef4444">' + mMdd.toFixed(1) + '%</td></tr>';
          }
          yearHtml += '</tbody></table></div></td></tr>';
        }
      }
      yearHtml += '</tbody></table></div>';
      html += yearHtml;
    }
    
    // 사이클 분석
    html += '<div class="cycle-card">';
    html += '<div class="cs-title">🏆 사이클 분석 (0u → 매수 → ... → 0u 복귀)</div>';
    html += '<div class="cycle-main"><div class="cycle-big"><div class="lbl">🎯 사이클 승률</div><div class="big" style="color:' + (result.cycleWinRate>=80?'#0f0':result.cycleWinRate>=60?'#fbbf24':'#f88') + '">' + result.cycleWinRate.toFixed(1) + '%</div><div class="sub">' + result.cycleWins + '승 : ' + result.cycleLosses + '패</div></div><div class="cycle-big"><div class="lbl">📊 총 사이클</div><div class="big" style="color:#fbbf24">' + result.cycleTotal + '<span style="font-size:14px;color:#aaa">회</span></div><div class="sub">' + (result.incompleteCount > 0 ? '진행중 ' + result.incompleteCount + '회 포함' : '모두 완료') + '</div></div></div>';
    html += '<div class="cycle-grid"><div class="cycle-mini"><div class="lbl">평균 수익</div><div class="val" style="color:' + (result.avgCyclePnl>=0?'#0f0':'#f88') + '">' + (result.avgCyclePnl>=0?'+':'') + result.avgCyclePnl.toFixed(2) + '%</div></div><div class="cycle-mini"><div class="lbl">평균 기간</div><div class="val">' + result.avgCycleDuration.toFixed(1) + '일</div></div><div class="cycle-mini"><div class="lbl">중앙값 기간</div><div class="val">' + result.medianCycleDuration + '일</div></div></div>';
    
    if (result.bestCycle && result.worstCycle) {
      html += '<div class="best-worst"><div class="bw-card best"><div style="color:#0f0;font-weight:700">🌟 최고 사이클</div><div class="bw-pnl" style="color:' + (result.bestCycle.pnl>=0?'#0f0':'#f88') + ' !important">' + (result.bestCycle.pnl>=0?'+':'') + result.bestCycle.pnl.toFixed(2) + '%</div><div class="bw-date">' + result.bestCycle.startDate + '<br>→ ' + result.bestCycle.endDate + '<br>(' + result.bestCycle.duration + '일, max ' + result.bestCycle.maxUnits + 'u)</div></div><div class="bw-card worst"><div style="color:#f88;font-weight:700">💀 최악 사이클</div><div class="bw-pnl" style="color:' + (result.worstCycle.pnl>=0?'#0f0':'#f88') + ' !important">' + (result.worstCycle.pnl>=0?'+':'') + result.worstCycle.pnl.toFixed(2) + '%</div><div class="bw-date">' + result.worstCycle.startDate + '<br>→ ' + result.worstCycle.endDate + '<br>(' + result.worstCycle.duration + '일, max ' + result.worstCycle.maxUnits + 'u)</div></div></div>';
    }
    
    html += '<div class="cycle-distribution"><div style="font-size:12px;font-weight:700;color:#fbbf24;margin-bottom:6px">📊 사이클 수익률 분포</div>' + distHtml + '</div>';
    
    // 🆕 사이클 종료 유닛 통계
    if (unitHtml) {
      html += '<div class="unit-stats"><div class="unit-stats-title">🎯 사이클 최대 유닛 분포 (얼마나 진입했나)</div>' + unitHtml;
      // 평균/중앙값
      const allMax = completed.map(c => c.maxUnits).filter(u => u > 0);
      if (allMax.length > 0) {
        const avgMax = allMax.reduce((s,u) => s+u, 0) / allMax.length;
        const sortedMax = [...allMax].sort((a,b) => a-b);
        const medMax = sortedMax[Math.floor(sortedMax.length/2)];
        html += '<div style="margin-top:8px;font-size:11px;color:#aaa;text-align:center">평균 ' + avgMax.toFixed(1) + 'u · 중앙값 ' + medMax + 'u</div>';
        html += '<div style="margin-top:6px;font-size:10px;color:#888;line-height:1.5">💡 2-4u 多 = 건강한 변동 / 12-20u 多 = 폭락 시장 / 2u 만 多 = 단방향 (HUNTER 한계)</div>';
      }
      html += '</div>';
    }
    
    html += '<div class="def-info"><b>📐 사이클 정의:</b> 0u 상태 → 매수 진입 → 모든 티어 매도 후 0u 복귀 = 1 사이클<br><b>💡 의미:</b> 떨사 시스템의 "회차"와 동일! 실제 시드 투입/회수 1세트<br><b>🎯 승률:</b> 사이클 종료 시 cap 증가 = 승, 감소 = 패</div>';
    html += '</div>';
    html += '<div class="warmup-info">🔧 사용자 시작일(' + userStartDate + ')부터 <b>실제 거래 시작</b><br>· warmup ' + userStartIdx + '일 + 실거래 ' + (data.bars.length - userStartIdx) + '일</div>';
    html += '</div>';
    html += '<div class="card" style="font-size:12px;color:#aaa;line-height:1.7"><b style="color:#ffd">⚙️ 사용된 HUNTER 파라미터:</b><br>매도: +' + (params.top_p*100).toFixed(1) + '% / +' + (params.mid_p*100).toFixed(1) + '% / +' + (params.bot_p*100).toFixed(1) + '% (천/중/바)<br>기간: ' + params.top_d + ' / ' + params.mid_d + ' / ' + params.bot_d + '일 · Lookback ' + params.lookback + '일<br>파라미터: ' + paramSource + '</div>';
    
    resultEl.innerHTML = html;
    progressEl.innerHTML = '✅ 완료!';
  } catch(e) {
    progressEl.innerHTML = '❌ ' + e.message;
    console.error(e);
  }
}

function toggleYearMonths(yKey) {
  const monthsRow = document.getElementById('months-' + yKey);
  const arrow = document.getElementById('year-arrow-' + yKey);
  if (!monthsRow) return;
  const isHidden = monthsRow.style.display === 'none';
  monthsRow.style.display = isHidden ? 'table-row' : 'none';
  if (arrow) arrow.textContent = isHidden ? '▲' : '▼';
}

function toggleVsDetail(idx) {
  const detailRow = document.getElementById('vs-detail-' + idx);
  const contentDiv = document.getElementById('vs-detail-content-' + idx);
  if (!detailRow || !contentDiv) return;
  const wasOpen = detailRow.style.display === 'table-row';
  for (let i = 0; i < 5; i++) {
    const otherRow = document.getElementById('vs-detail-' + i);
    if (otherRow) otherRow.style.display = 'none';
  }
  if (!wasOpen) {
    if (!contentDiv.innerHTML) {
      const r = window._vsResults[idx];
      const showMonthly = window._vsShowMonthly;
      const snapshots = r.periodSnapshots;
      const boostLabel = r.boost === 0 ? '정상 (0%)' : '+' + (r.boost * 100).toFixed(0) + '%';
      const boostColor = r.boost === 0 ? '#888' : (r.boost === 0.10 ? '#22c55e' : (r.boost === 0.20 ? '#3b82f6' : (r.boost === 0.30 ? '#a78bfa' : (r.boost === 0.50 ? '#f97316' : '#ef4444'))));
      let detailHtml = '<div style="font-size:14px;color:' + boostColor + ';font-weight:800;margin-bottom:12px">📊 ' + boostLabel + ' - ' + (showMonthly ? '월별' : '연도별') + ' 수익률 (사이클 기준)</div>';
      const keys = Object.keys(snapshots).filter(k => { if (showMonthly) return k.length === 7; else return k.length === 4; }).sort();
      if (keys.length === 0) detailHtml += '<div style="color:#666;font-style:italic">데이터 없음</div>';
      else {
        detailHtml += '<table style="width:100%;border-collapse:collapse;font-family:monospace;font-size:15px">';
        detailHtml += '<thead><tr style="border-bottom:2px solid #333"><th style="padding:10px 8px;text-align:left;color:#888;font-size:13px">' + (showMonthly ? '월' : '년도') + '</th><th style="padding:10px 8px;text-align:right;color:#fbbf24;font-size:13px">수익률</th><th style="padding:10px 8px;text-align:right;color:#888;font-size:13px">MDD</th></tr></thead><tbody>';
        for (const key of keys) {
          const snap = snapshots[key];
          const ret = (snap.endCap - snap.startCap) / snap.startCap * 100;
          const cls = ret >= 0 ? '#22c55e' : '#ef4444';
          const periodMdd = snap.mdd || 0;
          const mddCls = periodMdd < 0 ? '#ef4444' : '#888';
          detailHtml += '<tr style="border-bottom:1px solid #1a1a2a"><td style="padding:12px 8px;color:#fff;font-weight:700;font-size:15px">' + key + '</td><td style="padding:12px 8px;text-align:right;font-weight:800;color:' + cls + ';font-size:18px">' + (ret >= 0 ? '+' : '') + ret.toFixed(1) + '%</td><td style="padding:12px 8px;text-align:right;color:' + mddCls + ';font-size:14px">' + (periodMdd < 0 ? periodMdd.toFixed(1) + '%' : '-') + '</td></tr>';
        }
        detailHtml += '</tbody></table>';
      }
      contentDiv.innerHTML = detailHtml;
    }
    detailRow.style.display = 'table-row';
  }
}

async function runVirtualSeedCompare() {
  const sym = document.getElementById('bt-sym').value.toUpperCase().trim();
  const userStartDate = document.getElementById('bt-start').value;
  const userEndDate = document.getElementById('bt-end').value;
  if (!sym) { alert('종목 입력!'); return; }
  if (!userStartDate || !userEndDate) { alert('날짜 선택!'); return; }
  const progressEl = document.getElementById('bt-progress');
  const resultEl = document.getElementById('result');
  progressEl.innerHTML = '⚡ 가상 시드 비교 백테 시작...';
  resultEl.innerHTML = '';
  try {
    const params = { top_p: 0.025, mid_p: 0.005, bot_p: 0.03, top_d: 7, mid_d: 7, bot_d: 10, lookback: 20 };
    const warmupCalendarDays = Math.ceil(25 * 1.6) + 10;
    const fetchStartDate = new Date(userStartDate);
    fetchStartDate.setDate(fetchStartDate.getDate() - warmupCalendarDays);
    const fmt = d => d.toISOString().slice(0, 10);
    const fetchStartStr = fmt(fetchStartDate);
    progressEl.innerHTML = '📥 데이터 가져오는 중...';
    const res = await fetch('/api/history?symbol=' + sym + '&start=' + fetchStartStr + '&end=' + userEndDate);
    const data = await res.json();
    if (data.error) { progressEl.innerHTML = '❌ ' + data.error; return; }
    if (!data.bars || data.bars.length < 30) { progressEl.innerHTML = '❌ 데이터 부족'; return; }
    const userStartTs = new Date(userStartDate).getTime();
    let userStartIdx = -1;
    for (let i = 0; i < data.bars.length; i++) {
      if (new Date(data.bars[i].date).getTime() >= userStartTs) { userStartIdx = i; break; }
    }
    if (userStartIdx < 0) { progressEl.innerHTML = '❌ 시작일 데이터 없음'; return; }
    progressEl.innerHTML = '🔥 5가지 시뮬레이션 실행 중...';
    const boosts = [0, 0.10, 0.20, 0.30, 0.50, 1.00];
    const results = [];
    for (const boost of boosts) {
      const r = simulateHunter(data.bars, params, userStartIdx, boost);
      results.push({ boost: boost, ...r });
    }
    const userStartPrice = data.bars[userStartIdx].close;
    const userEndPrice = data.bars[data.bars.length - 1].close;
    const buyHoldMult = userEndPrice / userStartPrice;
    progressEl.innerHTML = '✅ 비교 완료!';
    const baseResult = results[0];
    const baseMult = baseResult.mult;
    let html = '<div class="cycle-card" style="margin-top:14px"><div class="cs-title">⚡ 가상 시드 비교 결과 (' + sym + ' / 기본 SOXL 룰)</div>';
    const totalDaysActual = data.bars.length - userStartIdx;
    const yearsDisplay = (totalDaysActual / 252).toFixed(2);
    html += '<div style="background:#0a1a2a;border-radius:10px;padding:12px;margin-bottom:12px;font-size:13px;color:#3b82f6;font-weight:700;text-align:center">📅 백테 기간: ' + userStartDate + ' ~ ' + userEndDate + ' (약 ' + yearsDisplay + '년 / ' + totalDaysActual + ' 거래일)</div>';
    html += '<div style="background:#1a1a2a;border-radius:10px;padding:14px;margin-bottom:14px;font-size:13px;line-height:1.7"><b style="color:#fbbf24">💡 가상 시드 시스템:</b><br>• 0~14u: 가상 시드 풀 적용 (+X%)<br>• 15u+: 정상 시드 (실전 매일 관리)<br>• <span style="color:#fbbf24">📌 형님 운영: 보유 15u+ 시 v13 시드 $100K로 변경</span></div>';
    html += '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-family:monospace;font-size:14px">';
    html += '<thead><tr style="border-bottom:2px solid #444"><th style="padding:12px 8px;text-align:left;color:#888;font-size:13px">가상비율</th><th style="padding:12px 8px;text-align:right;color:#fbbf24;font-size:13px">수익률</th><th style="padding:12px 8px;text-align:right;color:#888;font-size:13px">CAGR</th><th style="padding:12px 8px;text-align:right;color:#888;font-size:13px">MDD</th><th style="padding:12px 8px;text-align:right;color:#ef4444;font-size:13px">자금부족</th><th style="padding:12px 8px;text-align:right;color:#888;font-size:13px">vs정상</th></tr></thead><tbody>';
    const totalDays = data.bars.length - userStartIdx;
    const years = totalDays / 252;
    const showMonthly = years < 1.5;
    window._vsResults = results;
    window._vsShowMonthly = showMonthly;
    for (let idx = 0; idx < results.length; idx++) {
      const r = results[idx];
      const cagr = (Math.pow(r.mult, 1/years) - 1) * 100;
      const periodReturn = (r.mult - 1) * 100;

// 추세 비중 조절 시뮬 (매일 매수 + 강도별 비중)
function simulateHunterWeighted(bars, params, userStartIdx, weightFn) {
  const closes = bars.map(b => b.close);
  const n = closes.length;
  const minWarmup = 200;
  const warmup = Math.max(userStartIdx, minWarmup);
  const TU = 20;
  
  let SEED = 100000;
  let unitPrice = SEED / TU;
  let cash = SEED;
  let pe = [], pu = [], pd = [], zones = [], ps = [];
  let pk = SEED, mdd = 0;
  let nBuys = 0, nSells = 0, tierWins = 0;
  let fundShortageCount = 0;
  let inCycle = false;
  const weightStats = { full: 0, high: 0, mid: 0, low: 0, min: 0, totalW: 0, days: 0 };
  
  const calcTotalValue = (cl) => {
    let assetValue = 0;
    for (let j = 0; j < pe.length; j++) assetValue += ps[j] * cl;
    return cash + assetValue;
  };
  
  const calcMA = (arr, period, idx) => {
    if (idx < period - 1) return 0;
    let sum = 0;
    for (let k = idx - period + 1; k <= idx; k++) sum += arr[k];
    return sum / period;
  };
  
  for (let i = warmup; i < n; i++) {
    const cl = closes[i];
    const prev = closes[i-1];
    const ma50 = calcMA(closes, 50, i);
    const ma200 = calcMA(closes, 200, i);
    
    // 추세 비중 계산
    const weight = weightFn(cl, ma50, ma200);
    weightStats.days++;
    weightStats.totalW += weight;
    if (weight >= 1.0) weightStats.full++;
    else if (weight >= 0.85) weightStats.high++;
    else if (weight >= 0.65) weightStats.mid++;
    else if (weight >= 0.4) weightStats.low++;
    else weightStats.min++;
    
    const UP = params.up || 2;
    const DN = params.dn || 4;
    const baseUnits = (cl < prev ? DN : UP) * weight;
    
    const start = Math.max(0, i - params.lookback);
    const recentHigh = Math.max(...closes.slice(start, i+1));
    const dd = (cl - recentHigh) / recentHigh * 100;
    let zone;
    if (dd >= -10) zone = 'top';
    else if (dd <= -15) zone = 'bot';
    else zone = 'mid';
    
    // 매도 (항상 시스템 룰대로)
    const re=[], rd=[], ru=[], rz=[], rs=[];
    for (let j = 0; j < pe.length; j++) {
      pd[j] += 1;
      const p = (cl - pe[j]) / pe[j];
      let tp, fd;
      if (zones[j] === 'top') { tp = params.top_p; fd = params.top_d; }
      else if (zones[j] === 'bot') { tp = params.bot_p; fd = params.bot_d; }
      else { tp = params.mid_p; fd = params.mid_d; }
      if (p >= tp || pd[j] >= fd) {
        cash += ps[j] * cl;
        nSells++;
        if (p > 0) tierWins++;
      } else { re.push(pe[j]); rd.push(pd[j]); ru.push(pu[j]); rz.push(zones[j]); rs.push(ps[j]); }
    }
    pe = re; pd = rd; pu = ru; zones = rz; ps = rs;
    
    // 🔥 사이클 종료 시 SEED 갱신 (복리)
    if (inCycle && pe.length === 0) {
      inCycle = false;
      SEED = cash;
      unitPrice = SEED / TU;
    }
    
    // 매수 (매일 매수 + 비중 조절)
    const ti = pu.reduce((s, u) => s + u, 0);
    if (ti < TU && baseUnits > 0) {
      if (!inCycle) inCycle = true;
      const intendedUnits = Math.min(baseUnits, TU - ti);
      const intendedAmount = intendedUnits * unitPrice;
      let actualUnits, actualShares;
      
      if (cash >= intendedAmount) {
        actualUnits = intendedUnits;
        actualShares = Math.floor(intendedAmount / cl);
      } else if (cash >= cl) {
        // 🆕 자금 한도 내에서 매수 (1주라도 가능하면)
        const amt = cash * 0.99;
        actualUnits = amt / unitPrice;
        actualShares = Math.floor(amt / cl);
        fundShortageCount++;
      } else {
        fundShortageCount++;
        continue;
      }
      
      if (actualShares > 0) {
        cash -= actualShares * cl;
        pe.push(cl); pd.push(0); pu.push(actualUnits); zones.push(zone); ps.push(actualShares);
        nBuys++;
      }
    }
    
    const tv = calcTotalValue(cl);
    if (tv > pk) pk = tv;
    const ddv = (tv - pk) / pk * 100;
    if (ddv < mdd) mdd = ddv;
  }
  
  const lastClose = closes[n-1];
  const final = calcTotalValue(lastClose);
  weightStats.avgWeight = weightStats.days > 0 ? weightStats.totalW / weightStats.days : 1;
  
  return {
    mult: final / 100000, mdd: mdd, nBuys: nBuys, nSells: nSells,
    fundShortageCount: fundShortageCount,
    weightStats: weightStats
  };
}

  const progressEl = document.getElementById('bt-progress');
  const resultEl = document.getElementById('result');
  progressEl.innerHTML = '📅 연도별 분석 시작...';
  resultEl.innerHTML = '';
  
  try {
    const params = { top_p: 0.025, mid_p: 0.005, bot_p: 0.03, top_d: 7, mid_d: 7, bot_d: 10, lookback: 20 };
    const warmupCalendarDays = Math.ceil(220 * 1.6) + 30;
    const fetchStartDate = new Date(userStartDate);
    fetchStartDate.setDate(fetchStartDate.getDate() - warmupCalendarDays);
    const fmt = d => d.toISOString().slice(0, 10);
    progressEl.innerHTML = '📥 데이터 가져오는 중...';
    const res = await fetch('/api/history?symbol=' + sym + '&start=' + fmt(fetchStartDate) + '&end=' + userEndDate);
    const data = await res.json();
    if (data.error) { progressEl.innerHTML = '❌ ' + data.error; return; }
    if (!data.bars || data.bars.length < 230) { progressEl.innerHTML = '❌ 230일+ 필요'; return; }
    
    const userStartTs = new Date(userStartDate).getTime();
    let userStartIdx = -1;
    for (let i = 0; i < data.bars.length; i++) {
      if (new Date(data.bars[i].date).getTime() >= userStartTs) { userStartIdx = i; break; }
    }
    if (userStartIdx < 0 || userStartIdx < 200) { progressEl.innerHTML = '❌ 200일+ 워밍업 필요'; return; }
    
    progressEl.innerHTML = '🔥 연도별 시뮬...';
    
    // 비중조절 강 모드 (베스트 검증됨)
    const strongWeightFn = (cl, ma50, ma200) => {
      if (!ma50 || !ma200) return 1.0;
      const trend = (ma50 - ma200) / ma200 * 100;
      const gap = (cl - ma200) / ma200 * 100;
      if (trend > 5 && gap > 0) return 1.0;
      if (trend > 0) return 0.9;
      if (trend > -5) return 0.6;
      if (trend > -10) return 0.4;
      if (gap < -30) return 0.5;

// 연도별 상세 추적 함수
function runYearlyDetail(bars, params, userStartIdx, weightFn) {
  const closes = bars.map(b => b.close);
  const dates = bars.map(b => b.date);
  const n = closes.length;
  const warmup = Math.max(userStartIdx, 200);
  const TU = 20;
  
  let SEED = 100000;
  let unitPrice = SEED / TU;
  let cash = SEED;
  let pe = [], pu = [], pd = [], zones = [], ps = [];
  let inCycle = false;
  
  const yearly = {}; // {year: {startAsset, endAsset, peakAsset, mdd}}
  let curYear = '';
  let yearStartAsset = 100000;
  let yearPeakAsset = 100000;
  let yearMddAsset = 100000; // 연중 최저
  
  const calcTotalValue = (cl) => {
    let assetValue = 0;
    for (let j = 0; j < pe.length; j++) assetValue += ps[j] * cl;
    return cash + assetValue;
  };
  
  const calcMA = (arr, period, idx) => {
    if (idx < period - 1) return 0;
    let sum = 0;
    for (let k = idx - period + 1; k <= idx; k++) sum += arr[k];
    return sum / period;
  };
  
  for (let i = warmup; i < n; i++) {
    const cl = closes[i];
    const prev = closes[i-1];
    const ma50 = calcMA(closes, 50, i);
    const ma200 = calcMA(closes, 200, i);
    const year = dates[i].substring(0, 4);
    
    // 연도 변경 시 기록
    if (year !== curYear) {
      const curAsset = calcTotalValue(cl);
      if (curYear !== '') {
        yearly[curYear].endAsset = curAsset;
        // 연중 MDD: 연중 peak 대비 최저
        const mdd = (yearMddAsset - yearPeakAsset) / yearPeakAsset * 100;
        yearly[curYear].mdd = mdd;
      }
      yearly[year] = { startAsset: curAsset, endAsset: curAsset, mdd: 0 };
      curYear = year;
      yearStartAsset = curAsset;
      yearPeakAsset = curAsset;  // 연초 자산을 peak로
      yearMddAsset = curAsset;   // 연초 자산을 최저로
    }
    
    const weight = weightFn(cl, ma50, ma200);
    const UP = params.up || 2;
    const DN = params.dn || 4;
    const baseUnits = (cl < prev ? DN : UP) * weight;
    
    const start = Math.max(0, i - params.lookback);
    const recentHigh = Math.max(...closes.slice(start, i+1));
    const dd = (cl - recentHigh) / recentHigh * 100;
    let zone;
    if (dd >= -10) zone = 'top';
    else if (dd <= -15) zone = 'bot';
    else zone = 'mid';
    
    // 매도
    const re=[], rd=[], ru=[], rz=[], rs=[];
    for (let j = 0; j < pe.length; j++) {
      pd[j] += 1;
      const p = (cl - pe[j]) / pe[j];
      let tp, fd;
      if (zones[j] === 'top') { tp = params.top_p; fd = params.top_d; }
      else if (zones[j] === 'bot') { tp = params.bot_p; fd = params.bot_d; }
      else { tp = params.mid_p; fd = params.mid_d; }
      if (p >= tp || pd[j] >= fd) {
        cash += ps[j] * cl;
      } else { re.push(pe[j]); rd.push(pd[j]); ru.push(pu[j]); rz.push(zones[j]); rs.push(ps[j]); }
    }
    pe = re; pd = rd; pu = ru; zones = rz; ps = rs;
    
    // 사이클 종료 시 SEED 갱신
    if (inCycle && pe.length === 0) {
      inCycle = false;
      SEED = cash;
      unitPrice = SEED / TU;
    }
    
    // 매수
    const ti = pu.reduce((s, u) => s + u, 0);
    if (ti < TU && baseUnits > 0) {
      if (!inCycle) inCycle = true;
      const intendedUnits = Math.min(baseUnits, TU - ti);
      const intendedAmount = intendedUnits * unitPrice;
      let actualShares;
      
      if (cash >= intendedAmount) {
        actualShares = Math.floor(intendedAmount / cl);
      } else if (cash >= cl) {
        // 🆕 자금 한도 내에서 매수 (1주라도 가능하면)
        actualShares = Math.floor(cash * 0.99 / cl);
      } else continue;
      
      if (actualShares > 0) {
        cash -= actualShares * cl;
        pe.push(cl); pd.push(0); pu.push(intendedUnits); zones.push(zone); ps.push(actualShares);
      }
    }
    
    // 자산값 기반 MDD 추적 (절대값으로 정확)
    const tv = calcTotalValue(cl);
    if (tv > yearPeakAsset) yearPeakAsset = tv;
    if (tv < yearMddAsset || yearMddAsset === yearStartAsset) {
      // 연중 최저 자산 (단, peak 갱신 후만)
    }
    // MDD = peak 대비 현재 (실시간)
    const ddRealtime = (tv - yearPeakAsset) / yearPeakAsset * 100;
    const curMddPct = (yearly[curYear].mdd || 0);
    if (ddRealtime < curMddPct) {
      yearly[curYear].mdd = ddRealtime;
    }
  }
  
  // 마지막 연도 기록
  if (curYear !== '') {
    yearly[curYear].endAsset = calcTotalValue(closes[n-1]);
  }
  
  // 호환: startMult, endMult도 제공
  for (const y in yearly) {
    yearly[y].startMult = yearly[y].startAsset / 100000;
    yearly[y].endMult = yearly[y].endAsset / 100000;
  }
  
  return yearly;
}

// HYBRID 연도별 시뮬 (비중 + 부스트)
function runYearlyHybridDetail(bars, params, userStartIdx, hybridFn) {
  const closes = bars.map(b => b.close);
  const dates = bars.map(b => b.date);
  const n = closes.length;
  const warmup = Math.max(userStartIdx, 200);
  const TU = 20;
  
  let SEED = 100000;
  let unitPrice = SEED / TU;
  let cash = SEED;
  let pe = [], pu = [], pd = [], zones = [], ps = [];
  let inCycle = false;
  
  const yearly = {};
  let curYear = '';
  let yearStartAsset = 100000;
  let yearPeakAsset = 100000;
  
  const calcTotalValue = (cl) => {
    let assetValue = 0;
    for (let j = 0; j < pe.length; j++) assetValue += ps[j] * cl;
    return cash + assetValue;
  };
  
  const calcMA = (arr, period, idx) => {
    if (idx < period - 1) return 0;
    let sum = 0;
    for (let k = idx - period + 1; k <= idx; k++) sum += arr[k];
    return sum / period;
  };
  
  for (let i = warmup; i < n; i++) {
    const cl = closes[i];
    const prev = closes[i-1];
    const ma50 = calcMA(closes, 50, i);
    const ma200 = calcMA(closes, 200, i);
    const year = dates[i].substring(0, 4);
    
    if (year !== curYear) {
      const curAsset = calcTotalValue(cl);
      if (curYear !== '') {
        yearly[curYear].endAsset = curAsset;
      }
      yearly[year] = { startAsset: curAsset, endAsset: curAsset, mdd: 0 };
      curYear = year;
      yearStartAsset = curAsset;
      yearPeakAsset = curAsset;
    }
    
    const { weight, boost } = hybridFn(cl, ma50, ma200);
    const UP = params.up || 2;
    const DN = params.dn || 4;
    const baseUnits = (cl < prev ? DN : UP) * weight;
    
    const start = Math.max(0, i - params.lookback);
    const recentHigh = Math.max(...closes.slice(start, i+1));
    const dd = (cl - recentHigh) / recentHigh * 100;
    let zone;
    if (dd >= -10) zone = 'top';
    else if (dd <= -15) zone = 'bot';
    else zone = 'mid';
    
    // 매도
    const re=[], rd=[], ru=[], rz=[], rs=[];
    for (let j = 0; j < pe.length; j++) {
      pd[j] += 1;
      const p = (cl - pe[j]) / pe[j];
      let tp, fd;
      if (zones[j] === 'top') { tp = params.top_p; fd = params.top_d; }
      else if (zones[j] === 'bot') { tp = params.bot_p; fd = params.bot_d; }
      else { tp = params.mid_p; fd = params.mid_d; }
      if (p >= tp || pd[j] >= fd) {
        cash += ps[j] * cl;
      } else { re.push(pe[j]); rd.push(pd[j]); ru.push(pu[j]); rz.push(zones[j]); rs.push(ps[j]); }
    }
    pe = re; pd = rd; pu = ru; zones = rz; ps = rs;
    
    if (inCycle && pe.length === 0) {
      inCycle = false;
      SEED = cash;
      unitPrice = SEED / TU;
    }
    
    const ti = pu.reduce((s, u) => s + u, 0);
    if (ti < TU && baseUnits > 0) {
      if (!inCycle) inCycle = true;
      let intendedUnits;
      if (boost > 0 && ti < 15) {
        intendedUnits = Math.min(baseUnits * (1 + boost), TU - ti);
      } else {
        intendedUnits = Math.min(baseUnits, TU - ti);
      }
      const intendedAmount = intendedUnits * unitPrice;
      let actualShares;
      if (cash >= intendedAmount) {
        actualShares = Math.floor(intendedAmount / cl);
      } else if (cash >= cl) {
        // 🆕 자금 한도 내에서 매수 (1주라도 가능하면)
        actualShares = Math.floor(cash * 0.99 / cl);
      } else continue;
      if (actualShares > 0) {
        cash -= actualShares * cl;
        pe.push(cl); pd.push(0); pu.push(intendedUnits); zones.push(zone); ps.push(actualShares);
      }
    }
    
    // MDD 추적 (peak 대비)
    const tv = calcTotalValue(cl);
    if (tv > yearPeakAsset) yearPeakAsset = tv;
    const ddYear = (tv - yearPeakAsset) / yearPeakAsset * 100;
    if (ddYear < (yearly[curYear].mdd || 0)) yearly[curYear].mdd = ddYear;
  }
  
  if (curYear !== '') {
    yearly[curYear].endAsset = calcTotalValue(closes[n-1]);
  }
  
  return yearly;
}

async function runPanicHybrid() {

    const userStartTs = new Date(userStartDate).getTime();
    let userStartIdx = -1;
    for (let i = 0; i < data.bars.length; i++) {
      if (new Date(data.bars[i].date).getTime() >= userStartTs) { userStartIdx = i; break; }
    }
    if (userStartIdx < 0 || userStartIdx < 200) { progressEl.innerHTML = '❌ 200일+ 워밍업 필요'; return; }
    
    progressEl.innerHTML = '🔥 4가지 운용 비교 중...';
    
    // HYBRID 강 비중 함수 (부스트 ON)
    const hybridStrongFn = (cl, ma50, ma200) => {
      if (!ma50 || !ma200) return { weight: 1.0, boost: 0 };
      const trend = (ma50 - ma200) / ma200 * 100;

            }

          }
        }
        html += '</tbody></table>';
      }
      
      // PANIC 거래 상세
      if (r.panicHistory && r.panicHistory.length > 0) {

// 👑 형님 룰: 전년 SOXL < 0% → 다음해 HUNTER 100% / 평소 PANIC 비중조절
async function runBossRule() {
  const sym = document.getElementById('bt-sym').value.toUpperCase().trim();
  const userStartDate = document.getElementById('bt-start').value;
  const userEndDate = document.getElementById('bt-end').value;
  if (!sym) { alert('종목 입력!'); return; }
  if (!userStartDate || !userEndDate) { alert('날짜 선택!'); return; }
  const progressEl = document.getElementById('bt-progress');
  const resultEl = document.getElementById('result');
  progressEl.innerHTML = '👑 형님 룰 백테 시작...';
  resultEl.innerHTML = '';
  
  try {
    const params = { top_p: 0.025, mid_p: 0.005, bot_p: 0.03, top_d: 7, mid_d: 7, bot_d: 10, lookback: 20 };
    const warmupCalendarDays = Math.ceil(220 * 1.6) + 30;
    const fetchStartDate = new Date(userStartDate);
    fetchStartDate.setDate(fetchStartDate.getDate() - warmupCalendarDays);
    const fmt = d => d.toISOString().slice(0, 10);
    progressEl.innerHTML = '📥 데이터 가져오는 중...';
    const res = await fetch('/api/history?symbol=' + sym + '&start=' + fmt(fetchStartDate) + '&end=' + userEndDate);
    const data = await res.json();
    if (data.error) { progressEl.innerHTML = '❌ ' + data.error; return; }
    if (!data.bars || data.bars.length < 230) { progressEl.innerHTML = '❌ 230일+ 필요'; return; }
    
    const userStartTs = new Date(userStartDate).getTime();
    let userStartIdx = -1;
    for (let i = 0; i < data.bars.length; i++) {
      if (new Date(data.bars[i].date).getTime() >= userStartTs) { userStartIdx = i; break; }
    }
    if (userStartIdx < 0 || userStartIdx < 200) { progressEl.innerHTML = '❌ 200일+ 워밍업 필요'; return; }
    
    progressEl.innerHTML = '👑 형님 룰 시뮬레이션 중...';
    
    // 1. 종목 연간 수익률 계산 (모드 전환용)
    const yearlyReturns = calcYearlyReturns(data.bars);
    
    // 2. 비중조절 함수 (PANIC 모드)
    const weightOnlyFn = (cl, ma50, ma200) => {
      if (!ma50 || !ma200) return { weight: 1.0, boost: 0 };
      const trend = (ma50 - ma200) / ma200 * 100;
      const gap = (cl - ma200) / ma200 * 100;
      if (trend > 5 && gap > 0) return { weight: 1.0, boost: 0 };
      if (trend > 0) return { weight: 0.9, boost: 0 };
      if (trend > -5) return { weight: 0.6, boost: 0 };
      if (trend > -10) return { weight: 0.4, boost: 0 };
      if (gap < -30) return { weight: 0.5, boost: 0 };
      return { weight: 0.3, boost: 0 };
    };
    
    // 3. HUNTER 100% 함수 (강세 모드)
    const hunterFullFn = () => ({ weight: 1.0, boost: 0 });
    
    // 4. 형님 룰: 매년 전년 수익률 보고 모드 결정
    const bossRuleFn = (cl, ma50, ma200, year) => {
      const prevYearRet = yearlyReturns[year - 1];
      if (prevYearRet === undefined) return weightOnlyFn(cl, ma50, ma200);
      // 전년 < 0% → 올해 HUNTER 100%
      if (prevYearRet < 0) return hunterFullFn();
      return weightOnlyFn(cl, ma50, ma200);
    };
    
    // 5. 비교 4가지
    const results = [
      { name: '기본 HUNTER (항상 100%)', color: '#888', fn: hunterFullFn, useYear: false, panic: false },
      { name: '⚙️ 비중조절만 (PANIC X)', color: '#3b82f6', fn: weightOnlyFn, useYear: false, panic: false },
      { name: '⭐ 비중조절 + 강화1 PANIC', color: '#22c55e', fn: weightOnlyFn, useYear: false, panic: true },
      { name: '👑 형님 룰 (전년<0%→HUNTER100%)', color: '#fbbf24', fn: bossRuleFn, useYear: true, panic: true }
    ];
    
    const simResults = results.map(m => {
      return {
        ...m,
        result: simulatePanicHybrid(
          data.bars, params, userStartIdx, 
          m.fn, 
          m.panic, 4, 3, 
          m.panic ? { dropPct: -7, volRatio: 1.5 } : null
        )
      };
    });
    
    const totalDaysActual = data.bars.length - userStartIdx;
    const yearsDisplay = (totalDaysActual / 252).toFixed(2);
    const baseMult = simResults[0].result.mult;

// 종목 연간 수익률 계산 (Buy&Hold)
function calcYearlyReturns(bars) {
  const yearly = {};
  for (const b of bars) {
    const y = b.date.substring(0, 4);
    if (!yearly[y]) yearly[y] = { start: b.close, end: b.close };
    yearly[y].end = b.close;
  }
  const result = {};
  for (const y in yearly) {
    result[Number(y)] = (yearly[y].end / yearly[y].start - 1) * 100;
  }
  return result;
}

// 종목 월간 수익률 계산 (YYYY-MM 키)
function calcMonthlyReturns(bars) {
  const monthly = {};
  for (const b of bars) {
    const m = b.date.substring(0, 7); // YYYY-MM
    if (!monthly[m]) monthly[m] = { start: b.close, end: b.close };
    monthly[m].end = b.close;
  }
  const result = {};
  for (const m in monthly) {
    result[m] = (monthly[m].end / monthly[m].start - 1) * 100;
  }
  return result;
}

// simulatePanicHybrid 래퍼 - monthKey 전달
function simulatePanicHybridMonth(bars, params, userStartIdx, hybridFn, panicEnabled, panicMaxUnits, panicWait, panicCondition) {

  const wrappedFn = (cl, ma50, ma200, year, monthKey) => hybridFn(cl, ma50, ma200, year, monthKey);
  return simulatePanicHybrid(bars, params, userStartIdx, wrappedFn, panicEnabled, panicMaxUnits, panicWait, panicCondition);
}

// HYBRID + PANIC 통합 시뮬레이션
function simulatePanicHybrid(bars, params, userStartIdx, hybridFn, panicEnabled, panicMaxUnits, panicWait, panicCondition) {
  panicWait = panicWait || 1; // 기본 1일 후
  panicCondition = panicCondition || { dropPct: -5, volRatio: 1.3 };
  const closes = bars.map(b => b.close);
  const dates = bars.map(b => b.date);

  const volumes = bars.map(b => b.volume || 0);
  const n = closes.length;
  const warmup = Math.max(userStartIdx, 200);
  const TU = 20;
  
  let SEED = 100000;
  let unitPrice = SEED / TU;
  let cash = SEED;
  let pe = [], pu = [], pd = [], zones = [], ps = [];
  let pk = SEED, mdd = 0;
  let nBuys = 0, nSells = 0, fundShortageCount = 0;
  let inCycle = false;
  
  // PANIC 상태
  let panicMode = false;
  let panicShares = 0;
  let panicEntry = 0;
  let panicHigh = 0;
  let panicDays = 0;
  let panicEntryDate = '';
  let panicSignalDay = -1; // 시그널 발생일
  let panicSignalLevel = 0; // 1=S1, 2=S2
  let panicWaitDays = 0; // S2는 3일 대기
  const panicHistory = [];
  
  // 🆕 연도별/월별 추적
  const yearly = {}; // {year: {startAsset, endAsset, peakAsset, mdd, monthly: {month: {...}}}}
  let curYear = '';
  let curMonth = '';
  let yearPeak = 100000;
  let monthPeak = 100000;
  
  const calcTotalValue = (cl) => {
    if (panicMode) return cash + panicShares * cl;
    let assetValue = 0;
    for (let j = 0; j < pe.length; j++) assetValue += ps[j] * cl;
    return cash + assetValue;
  };
  
  const calcMA = (arr, period, idx) => {
    if (idx < period - 1) return 0;
    let sum = 0;
    for (let k = idx - period + 1; k <= idx; k++) sum += arr[k];
    return sum / period;
  };
  
  for (let i = warmup; i < n; i++) {
    const cl = closes[i];
    const prev = closes[i-1];
    const op = opens[i];
    const ma50 = calcMA(closes, 50, i);
    const ma200 = calcMA(closes, 200, i);
    const todayChange = (cl - prev) / prev * 100;
    
    // 🆕 연도/월 변경 감지
    const year = dates[i].substring(0, 4);
    const month = dates[i].substring(0, 7); // YYYY-MM
    const monthOnly = dates[i].substring(5, 7); // MM
    
    if (year !== curYear) {
      const curAsset = calcTotalValue(cl);
      if (curYear !== '') yearly[curYear].endAsset = curAsset;
      yearly[year] = { startAsset: curAsset, endAsset: curAsset, mdd: 0, monthly: {} };
      curYear = year;
      yearPeak = curAsset;
    }
    
    if (month !== curMonth) {
      const curAsset = calcTotalValue(cl);
      if (curMonth !== '' && yearly[curYear] && yearly[curYear].monthly[curMonth.substring(5,7)]) {
        yearly[curYear].monthly[curMonth.substring(5,7)].endAsset = curAsset;
      }
      if (yearly[year]) {
        yearly[year].monthly[monthOnly] = { startAsset: curAsset, endAsset: curAsset, mdd: 0 };
      }
      curMonth = month;
      monthPeak = curAsset;
    }
    
    // 거래량 비교
    let volRatio = 1;
    if (i >= 30 && volumes[i] > 0) {
      let avgVol = 0;
      for (let k = i-30; k < i; k++) avgVol += volumes[k];
      avgVol /= 30;
      if (avgVol > 0) volRatio = volumes[i] / avgVol;
    }
    
    // ===== PANIC 모드 =====
    if (panicMode) {
      panicDays++;
      
      // 🆕 일중 추적 (high/low 사용)
      const dayHigh = bars[i].high || cl;
      const dayLow = bars[i].low || cl;
      
      // 🆕 시초가 갭다운 체크 (스탑 가격보다 시초가가 낮으면)
      const stopPrice = panicEntry * 0.97;  // -3% 스탑가
      const trailStopPrice = panicHigh * 0.98;  // -2% 트레일 스탑가
      const targetPrice = panicEntry * 1.20;  // +20% 목표가
      
      let exitReason = null;
      let exitPrice = cl;
      
      // 1️⃣ 시초가 갭다운 체크
      if (op <= stopPrice) {
        // 시초가가 이미 스탑 아래 = 시초가에 매도
        exitReason = '🛑 -3% 스탑 (갭다운)';
        exitPrice = op;
      }
      // 2️⃣ 일중 스탑 체크
      else if (dayLow <= stopPrice) {
        // 일중 스탑가 터치 = 스탑가에 매도
        exitReason = '🛑 -3% 스탑';
        exitPrice = stopPrice;
      }
      // 3️⃣ 일중 목표가 체크
      else if (dayHigh >= targetPrice) {
        // 일중 +20% 터치 = 목표가에 매도
        exitReason = '🎯 +20% 목표!';
        exitPrice = targetPrice;
      }
      // 4️⃣ 트레일 체크 (수익 +5% 이상 있을 때만)
      else if (panicHigh > panicEntry * 1.05) {
        // 일중 high가 panicHigh 갱신
        if (dayHigh > panicHigh) panicHigh = dayHigh;
        const newTrailStop = panicHigh * 0.98;
        if (dayLow <= newTrailStop) {
          exitReason = '📉 -2% 트레일';
          exitPrice = newTrailStop;
        }
      }
      // 5️⃣ panicHigh 업데이트 (수익 +5% 미만일 때)
      if (!exitReason && dayHigh > panicHigh) {
        panicHigh = dayHigh;
      }
      
      if (exitReason) {
        // PANIC 청산
        const totalGain = (exitPrice - panicEntry) / panicEntry * 100;
        cash += panicShares * exitPrice;
        panicHistory.push({
          entryDate: panicEntryDate,
          entryPrice: panicEntry,
          exitDate: dates[i],
          exitPrice: exitPrice,
          days: panicDays,
          pnl: totalGain,
          reason: exitReason
        });
        panicMode = false;
        panicShares = 0;
        // HUNTER 모드로 복귀 (SEED 갱신)
        SEED = cash;
        unitPrice = SEED / TU;
      }
      
      // MDD 추적
      const tv = calcTotalValue(cl);
      if (tv > pk) pk = tv;
      const ddv = (tv - pk) / pk * 100;
      if (ddv < mdd) mdd = ddv;
      continue;
    }
    
    // ===== PANIC 시그널 대기 (진입 일수 대기) =====
    if (panicSignalDay > 0) {
      panicWaitDays++;
      const requiredWait = panicWait;
      if (panicWaitDays >= requiredWait) {
        // PANIC 매수 진입!
        const totalU = pu.reduce((s, u) => s + u, 0);
        const tv = calcTotalValue(cl);
        
        // HUNTER 보유 전액 매도 (시초가)
        if (pe.length > 0) {
          for (let j = 0; j < pe.length; j++) {
            cash += ps[j] * op;
            nSells++;
          }
          pe = []; pu = []; pd = []; zones = []; ps = [];
        }
        
        // PANIC 매수 (시초가)
        panicShares = Math.floor(cash / op);
        cash -= panicShares * op;
        panicEntry = op;
        panicHigh = op;
        panicDays = 0;
        panicEntryDate = dates[i];
        panicMode = true;
        panicSignalDay = -1;
        panicWaitDays = 0;
        
        continue;
      }
    }
    
    // ===== PANIC 시그널 감지 =====
    if (panicEnabled && panicSignalDay < 0 && !panicMode) {
      const totalU = pu.reduce((s, u) => s + u, 0);
      
      // 기본 조건
      let hasSignal = todayChange <= panicCondition.dropPct && volRatio >= panicCondition.volRatio;
      
      // 추가 조건들
      if (hasSignal && panicCondition.requireBelowMA200) {
        // 200MA 아래 (약세 확인)
        if (cl >= ma200) hasSignal = false;
      }
      
      if (hasSignal && panicCondition.require2DayDrop) {
        // 이틀 연속 -X% 폭락
        if (i >= 2) {
          const prevChange = (closes[i-1] - closes[i-2]) / closes[i-2] * 100;
          if (prevChange > panicCondition.require2DayDrop) hasSignal = false;
        }
      }
      
      if (hasSignal && panicCondition.requireRsiLow) {
        // RSI 30 이하 (과매도 확인)
        // 간단한 RSI 계산
        let gains = 0, losses = 0;
        const rsiLen = 14;
        if (i >= rsiLen) {
          for (let k = i - rsiLen + 1; k <= i; k++) {
            const ch = closes[k] - closes[k-1];
            if (ch > 0) gains += ch; else losses -= ch;
          }
          const avgG = gains / rsiLen;
          const avgL = losses / rsiLen;
          const rsi = avgL === 0 ? 100 : 100 - 100 / (1 + avgG / avgL);
          if (rsi >= panicCondition.requireRsiLow) hasSignal = false;
        }
      }
      
      if (hasSignal && panicCondition.requireGap20) {
        // 200MA 대비 -20% 이상 떨어짐 (큰 폭락)
        const gap = (cl - ma200) / ma200 * 100;
        if (gap >= -20) hasSignal = false;
      }
      
      if (hasSignal && totalU <= panicMaxUnits) {
        // 시그널 감지!
        panicSignalDay = i;
        panicSignalLevel = todayChange <= -10 ? 2 : 1;
        panicWaitDays = 0;
        // 다음 영업일/3일 후 진입
        continue;
      }
    }
    
    // ===== HUNTER 모드 (HYBRID) =====
    const curYearNum = Number(dates[i].substring(0, 4));
    const curMonthKey = dates[i].substring(0, 7); // YYYY-MM
    const { weight, boost } = hybridFn(cl, ma50, ma200, curYearNum, curMonthKey);
    const UP = params.up || 2;
    const DN = params.dn || 4;
    const baseUnits = (cl < prev ? DN : UP) * weight;
    
    const start = Math.max(0, i - params.lookback);
    const recentHigh = Math.max(...closes.slice(start, i+1));
    const dd = (cl - recentHigh) / recentHigh * 100;
    let zone;
    if (dd >= -10) zone = 'top';
    else if (dd <= -15) zone = 'bot';
    else zone = 'mid';
    
    // 매도
    const re=[], rd=[], ru=[], rz=[], rs=[];
    for (let j = 0; j < pe.length; j++) {
      pd[j] += 1;
      const p = (cl - pe[j]) / pe[j];
      let tp, fd;
      if (zones[j] === 'top') { tp = params.top_p; fd = params.top_d; }
      else if (zones[j] === 'bot') { tp = params.bot_p; fd = params.bot_d; }
      else { tp = params.mid_p; fd = params.mid_d; }
      if (p >= tp || pd[j] >= fd) {
        cash += ps[j] * cl;
        nSells++;
      } else { re.push(pe[j]); rd.push(pd[j]); ru.push(pu[j]); rz.push(zones[j]); rs.push(ps[j]); }
    }
    pe = re; pd = rd; pu = ru; zones = rz; ps = rs;
    
    if (inCycle && pe.length === 0) {
      inCycle = false;
      SEED = cash;
      unitPrice = SEED / TU;
    }
    
    // 매수 (🆕 자금 한도 내에서 매수 - 형님 진짜 룰)
    const ti = pu.reduce((s, u) => s + u, 0);
    if (ti < TU && baseUnits > 0) {
      if (!inCycle) inCycle = true;
      let intendedUnits;
      if (boost > 0 && ti < 15) {
        intendedUnits = Math.min(baseUnits * (1 + boost), TU - ti);
      } else {
        intendedUnits = Math.min(baseUnits, TU - ti);
      }
      const intendedAmount = intendedUnits * unitPrice;
      let actualShares;
      if (cash >= intendedAmount) {
        // 충분 → 정상 매수 (의도대로)
        actualShares = Math.floor(intendedAmount / cl);
      } else if (cash >= cl) {
        // 🆕 자금 부족하지만 1주라도 살 수 있으면 → 잔여 자금만큼 매수
        actualShares = Math.floor(cash * 0.99 / cl);
      } else continue;  // 1주도 못 사면 스킵
      if (actualShares > 0) {
        cash -= actualShares * cl;
        pe.push(cl); pd.push(0); pu.push(intendedUnits); zones.push(zone); ps.push(actualShares);
        nBuys++;
      }
    }
    
    const tv = calcTotalValue(cl);
    if (tv > pk) pk = tv;
    const ddv = (tv - pk) / pk * 100;
    if (ddv < mdd) mdd = ddv;
    
    // 🆕 연/월 MDD 추적
    if (tv > yearPeak) yearPeak = tv;
    const yearDd = (tv - yearPeak) / yearPeak * 100;
    if (yearly[curYear] && yearDd < yearly[curYear].mdd) yearly[curYear].mdd = yearDd;
    
    if (tv > monthPeak) monthPeak = tv;
    const monthDd = (tv - monthPeak) / monthPeak * 100;
    if (yearly[curYear] && yearly[curYear].monthly[monthOnly] && monthDd < yearly[curYear].monthly[monthOnly].mdd) {
      yearly[curYear].monthly[monthOnly].mdd = monthDd;
    }
  }
  
  // 🆕 마지막 연도/월 종료 자산 기록
  if (curYear !== '' && yearly[curYear]) {
    yearly[curYear].endAsset = calcTotalValue(closes[n-1]);
    const lastMonthOnly = dates[n-1].substring(5,7);
    if (yearly[curYear].monthly[lastMonthOnly]) {
      yearly[curYear].monthly[lastMonthOnly].endAsset = calcTotalValue(closes[n-1]);
    }
  }
  
  const lastClose = closes[n-1];
  const final = calcTotalValue(lastClose);
  const panicWins = panicHistory.filter(t => t.pnl > 0).length;
  
  return {
    mult: final / 100000,
    mdd,
    nBuys, nSells,
    panicTrades: panicHistory.length,
    panicWins,
    panicHistory,
    yearly  // 🆕 연도별/월별 데이터
  };
}

// HYBRID ULTIMATE 시뮬레이션 (비중 + 부스트 동시 조절)
function simulateHybridUltimate(bars, params, userStartIdx, hybridFn) {
  const closes = bars.map(b => b.close);
  const n = closes.length;
  const warmup = Math.max(userStartIdx, 200);
  const TU = 20;
  
  let SEED = 100000;
  let unitPrice = SEED / TU;
  let cash = SEED;
  let pe = [], pu = [], pd = [], zones = [], ps = [];
  let pk = SEED, mdd = 0;
  let nBuys = 0, nSells = 0, fundShortageCount = 0;
  let inCycle = false;
  
  const calcTotalValue = (cl) => {
    let assetValue = 0;
    for (let j = 0; j < pe.length; j++) assetValue += ps[j] * cl;
    return cash + assetValue;
  };
  
  const calcMA = (arr, period, idx) => {
    if (idx < period - 1) return 0;
    let sum = 0;
    for (let k = idx - period + 1; k <= idx; k++) sum += arr[k];
    return sum / period;
  };
  
  for (let i = warmup; i < n; i++) {
    const cl = closes[i];
    const prev = closes[i-1];
    const ma50 = calcMA(closes, 50, i);
    const ma200 = calcMA(closes, 200, i);
    
    // HYBRID 결정
    const { weight, boost } = hybridFn(cl, ma50, ma200);
    
    const UP = params.up || 2;
    const DN = params.dn || 4;
    const baseUnits = (cl < prev ? DN : UP) * weight;
    
    const start = Math.max(0, i - params.lookback);
    const recentHigh = Math.max(...closes.slice(start, i+1));
    const dd = (cl - recentHigh) / recentHigh * 100;
    let zone;
    if (dd >= -10) zone = 'top';
    else if (dd <= -15) zone = 'bot';
    else zone = 'mid';
    
    // 매도 (항상 시스템 룰대로)
    const re=[], rd=[], ru=[], rz=[], rs=[];
    for (let j = 0; j < pe.length; j++) {
      pd[j] += 1;
      const p = (cl - pe[j]) / pe[j];
      let tp, fd;
      if (zones[j] === 'top') { tp = params.top_p; fd = params.top_d; }
      else if (zones[j] === 'bot') { tp = params.bot_p; fd = params.bot_d; }
      else { tp = params.mid_p; fd = params.mid_d; }
      if (p >= tp || pd[j] >= fd) {
        cash += ps[j] * cl;
        nSells++;
      } else { re.push(pe[j]); rd.push(pd[j]); ru.push(pu[j]); rz.push(zones[j]); rs.push(ps[j]); }
    }
    pe = re; pd = rd; pu = ru; zones = rz; ps = rs;
    
    // 사이클 종료 시 SEED 갱신
    if (inCycle && pe.length === 0) {
      inCycle = false;
      SEED = cash;
      unitPrice = SEED / TU;
    }
    
    // 매수 (비중 + 부스트 동시 적용)
    const ti = pu.reduce((s, u) => s + u, 0);
    if (ti < TU && baseUnits > 0) {
      if (!inCycle) inCycle = true;
      
      // 부스트 적용 (15u 미만일 때만)
      let intendedUnits;
      if (boost > 0 && ti < 15) {
        intendedUnits = Math.min(baseUnits * (1 + boost), TU - ti);
      } else {
        intendedUnits = Math.min(baseUnits, TU - ti);
      }
      
      const intendedAmount = intendedUnits * unitPrice;
      let actualShares;
      
      if (cash >= intendedAmount) {
        actualShares = Math.floor(intendedAmount / cl);
      } else if (cash >= cl) {
        // 🆕 자금 한도 내에서 매수 (1주라도 가능하면)
        const amt = cash * 0.99;
        actualShares = Math.floor(amt / cl);
        fundShortageCount++;
      } else {
        fundShortageCount++;
        continue;
      }
      
      if (actualShares > 0) {
        cash -= actualShares * cl;
        pe.push(cl); pd.push(0); pu.push(intendedUnits); zones.push(zone); ps.push(actualShares);
        nBuys++;
      }
    }
    
    const tv = calcTotalValue(cl);
    if (tv > pk) pk = tv;
    const ddv = (tv - pk) / pk * 100;
    if (ddv < mdd) mdd = ddv;
  }
  
  const lastClose = closes[n-1];
  const final = calcTotalValue(lastClose);
  
  return {
    mult: final / 100000, mdd: mdd, nBuys: nBuys, nSells: nSells,
    fundShortageCount: fundShortageCount
  };
}

// ULTIMATE 시뮬레이션 (필터 + 부스트 결합)
function simulateUltimate(bars, params, userStartIdx, filter, boost, dynamicBoostFn) {
  const closes = bars.map(b => b.close);
  const n = closes.length;
  const warmup = Math.max(userStartIdx, 200);
  const TU = 20;
  
  let SEED = 100000;
  let unitPrice = SEED / TU;
  let cash = SEED;
  let pe = [], pu = [], pd = [], zones = [], ps = [];
  let pk = SEED, mdd = 0;
  let nBuys = 0, nSells = 0, fundShortageCount = 0;
  let inCycle = false;
  
  const calcTotalValue = (cl) => {
    let assetValue = 0;
    for (let j = 0; j < pe.length; j++) assetValue += ps[j] * cl;
    return cash + assetValue;
  };
  
  const calcMA = (arr, period, idx) => {
    if (idx < period - 1) return 0;
    let sum = 0;
    for (let k = idx - period + 1; k <= idx; k++) sum += arr[k];
    return sum / period;
  };
  
  const calcRsi = (arr, len) => {
    if (arr.length < len + 1) return 50;
    let gains = 0, losses = 0;
    for (let i = 1; i <= len; i++) {
      const d = arr[i] - arr[i-1];
      if (d > 0) gains += d; else losses -= d;
    }
    let avgGain = gains/len, avgLoss = losses/len;
    for (let i = len + 1; i < arr.length; i++) {
      const d = arr[i] - arr[i-1];
      if (d > 0) { avgGain = (avgGain*(len-1)+d)/len; avgLoss = (avgLoss*(len-1))/len; }
      else { avgGain = (avgGain*(len-1))/len; avgLoss = (avgLoss*(len-1)-d)/len; }
    }
    if (avgLoss === 0) return 100;
    return 100 - 100/(1 + avgGain/avgLoss);
  };
  
  for (let i = warmup; i < n; i++) {
    const cl = closes[i];
    const prev = closes[i-1];
    const ma50 = calcMA(closes, 50, i);
    const ma200 = calcMA(closes, 200, i);
    
    // 필터 체크
    let canBuy = true;
    if (filter === '200MA' && cl <= ma200) canBuy = false;
    if (filter === '50MA' && cl <= ma50) canBuy = false;
    if (filter === 'golden' && ma50 <= ma200) canBuy = false;
    
    // 부스트 결정
    let curBoost = 0;
    if (boost === 'dynamic30') {
      const todayRsi = calcRsi(closes.slice(0, i+1), 14);
      const prevRsi = calcRsi(closes.slice(0, i), 14);
      curBoost = dynamicBoostFn(todayRsi, prevRsi);
    } else if (boost === 'dynamic50') {
      const todayRsi = calcRsi(closes.slice(0, i+1), 14);
      const prevRsi = calcRsi(closes.slice(0, i), 14);
      const base30 = dynamicBoostFn(todayRsi, prevRsi);
      curBoost = base30 * (0.50 / 0.30); // 30%→50%로 스케일
    } else if (typeof boost === 'number') {
      curBoost = boost;
    }
    
    const UP = params.up || 2;
    const DN = params.dn || 4;
    const baseUnits = cl < prev ? DN : UP;
    
    const start = Math.max(0, i - params.lookback);
    const recentHigh = Math.max(...closes.slice(start, i+1));
    const dd = (cl - recentHigh) / recentHigh * 100;
    let zone;
    if (dd >= -10) zone = 'top';
    else if (dd <= -15) zone = 'bot';
    else zone = 'mid';
    
    // 매도 (항상 시스템 룰대로)
    const re=[], rd=[], ru=[], rz=[], rs=[];
    for (let j = 0; j < pe.length; j++) {
      pd[j] += 1;
      const p = (cl - pe[j]) / pe[j];
      let tp, fd;
      if (zones[j] === 'top') { tp = params.top_p; fd = params.top_d; }
      else if (zones[j] === 'bot') { tp = params.bot_p; fd = params.bot_d; }
      else { tp = params.mid_p; fd = params.mid_d; }
      if (p >= tp || pd[j] >= fd) {
        cash += ps[j] * cl;
        nSells++;
      } else { re.push(pe[j]); rd.push(pd[j]); ru.push(pu[j]); rz.push(zones[j]); rs.push(ps[j]); }
    }
    pe = re; pd = rd; pu = ru; zones = rz; ps = rs;
    
    // 🔥 사이클 종료 시 SEED 갱신 (복리)
    if (inCycle && pe.length === 0) {
      inCycle = false;
      SEED = cash;
      unitPrice = SEED / TU;
    }
    
    // 매수 (필터 + 부스트)
    const ti = pu.reduce((s, u) => s + u, 0);
    if (canBuy && ti < TU && baseUnits > 0) {
      if (!inCycle) inCycle = true;
      let intendedUnits;
      if (curBoost > 0 && ti < 15) intendedUnits = Math.min(baseUnits * (1 + curBoost), TU - ti);
      else intendedUnits = Math.min(baseUnits, TU - ti);
      
      const intendedAmount = intendedUnits * unitPrice;
      let actualShares;
      
      if (cash >= intendedAmount) {
        actualShares = Math.floor(intendedAmount / cl);
      } else if (cash >= cl) {
        // 🆕 자금 한도 내에서 매수 (1주라도 가능하면)
        const amt = cash * 0.99;
        actualShares = Math.floor(amt / cl);
        fundShortageCount++;
      } else {
        fundShortageCount++;
        continue;
      }
      
      if (actualShares > 0) {
        cash -= actualShares * cl;
        pe.push(cl); pd.push(0); pu.push(intendedUnits); zones.push(zone); ps.push(actualShares);
        nBuys++;
      }
    }
    
    const tv = calcTotalValue(cl);
    if (tv > pk) pk = tv;
    const ddv = (tv - pk) / pk * 100;
    if (ddv < mdd) mdd = ddv;
  }
  
  const lastClose = closes[n-1];
  const final = calcTotalValue(lastClose);
  
  return {
    mult: final / 100000, mdd: mdd, nBuys: nBuys, nSells: nSells,
    fundShortageCount: fundShortageCount
  };
}
