// 추세 필터 적용 시뮬레이션 (v6b: 사이클 종료 시 SEED 갱신)
function simulateHunterWithFilter(bars, params, userStartIdx, filterFn) {
  const closes = bars.map(b => b.close);
  const dates = bars.map(b => b.date);
  const n = closes.length;
  const minWarmup = 200;
  const warmup = Math.max(userStartIdx, minWarmup);
  const TU = 20;
  
  let SEED = 100000;
  let unitPrice = SEED / TU;
  let cash = SEED;
  let pe = [], pu = [], pd = [], zones = [], ps = [];
  let pk = SEED, mdd = 0;
  let nBuys = 0, nSells = 0, tierWins = 0;
  let fundShortageCount = 0;
  let buyDays = 0;
  let inCycle = false;
  
  const calcTotalValue = (cl) => {
    let assetValue = 0;
    for (let j = 0; j < pe.length; j++) assetValue += ps[j] * cl;
    return cash + assetValue;
  };
  
  const calcMA = (arr, period, idx) => {
    if (idx < period - 1) return 0;
    let sum = 0;
    for (let k = idx - period + 1; k <= idx; k++) sum += arr[k];
    return sum / period;
  };
  
  for (let i = warmup; i < n; i++) {
    const cl = closes[i];
    const prev = closes[i-1];
    const ma50 = calcMA(closes, 50, i);
    const ma200 = calcMA(closes, 200, i);
    
    // 필터 체크
    const filterResult = filterFn(cl, ma50, ma200);
    let unitMultiplier = 1;
    if (filterResult === false) unitMultiplier = 0;
    else if (typeof filterResult === 'number') unitMultiplier = filterResult;
    
    const UP = params.up || 2;
    const DN = params.dn || 4;
    const baseUnits = (cl < prev ? DN : UP) * unitMultiplier;
    
    const start = Math.max(0, i - params.lookback);
    const recentHigh = Math.max(...closes.slice(start, i+1));
    const dd = (cl - recentHigh) / recentHigh * 100;
    let zone;
    if (dd >= -10) zone = 'top';
    else if (dd <= -15) zone = 'bot';
    else zone = 'mid';
    
    // 매도 (항상 시스템 룰대로)
    const re=[], rd=[], ru=[], rz=[], rs=[];
    for (let j = 0; j < pe.length; j++) {
      pd[j] += 1;
      const p = (cl - pe[j]) / pe[j];
      let tp, fd;
      if (zones[j] === 'top') { tp = params.top_p; fd = params.top_d; }
      else if (zones[j] === 'bot') { tp = params.bot_p; fd = params.bot_d; }
      else { tp = params.mid_p; fd = params.mid_d; }
      if (p >= tp || pd[j] >= fd) {
        cash += ps[j] * cl;
        nSells++;
        if (p > 0) tierWins++;
      } else { re.push(pe[j]); rd.push(pd[j]); ru.push(pu[j]); rz.push(zones[j]); rs.push(ps[j]); }
    }
    pe = re; pd = rd; pu = ru; zones = rz; ps = rs;
    
    // 🔥 사이클 종료 시 SEED 갱신 (복리)
    if (inCycle && pe.length === 0) {
      inCycle = false;
      SEED = cash;
      unitPrice = SEED / TU;
    }
    
    // 매수
    const ti = pu.reduce((s, u) => s + u, 0);
    if (ti < TU && baseUnits > 0) {
      buyDays++;
      if (!inCycle) inCycle = true;
      const intendedUnits = Math.min(baseUnits, TU - ti);
      const intendedAmount = intendedUnits * unitPrice;
      let actualUnits, actualShares;
      
      if (cash >= intendedAmount) {
        actualUnits = intendedUnits;
        actualShares = Math.floor(intendedAmount / cl);
      } else if (cash >= cl) {
        // 🆕 자금 한도 내에서 매수 (1주라도 가능하면)
        const amt = cash * 0.99;
        actualUnits = amt / unitPrice;
        actualShares = Math.floor(amt / cl);
        fundShortageCount++;
      } else {
        fundShortageCount++;
        continue;
      }
      
      if (actualShares > 0) {
        cash -= actualShares * cl;
        pe.push(cl); pd.push(0); pu.push(actualUnits); zones.push(zone); ps.push(actualShares);
        nBuys++;
      }
    }
    
    const tv = calcTotalValue(cl);
    if (tv > pk) pk = tv;
    const ddv = (tv - pk) / pk * 100;
    if (ddv < mdd) mdd = ddv;
  }
  
  const lastClose = closes[n-1];
  const final = calcTotalValue(lastClose);
  
  return {
    mult: final / 100000, mdd: mdd, nBuys: nBuys, nSells: nSells,
    tierWinRate: nSells > 0 ? tierWins / nSells * 100 : 0,
    fundShortageCount: fundShortageCount,
    buyDays: buyDays
  };
}

// RSI 계산 함수
function calcRsi(closes, period) {
  if (closes.length < period + 1) return 50;
  let gains = 0, losses = 0;
  for (let i = 1; i <= period; i++) {
    const d = closes[i] - closes[i-1];
    if (d > 0) gains += d;
    else losses -= d;
  }
  let avgGain = gains / period;
  let avgLoss = losses / period;
  for (let i = period + 1; i < closes.length; i++) {
    const d = closes[i] - closes[i-1];
    if (d > 0) {
      avgGain = (avgGain * (period - 1) + d) / period;
      avgLoss = (avgLoss * (period - 1)) / period;
    } else {
      avgGain = (avgGain * (period - 1)) / period;
      avgLoss = (avgLoss * (period - 1) - d) / period;
    }
  }
  if (avgLoss === 0) return 100;
  return 100 - 100 / (1 + avgGain / avgLoss);
}

// RSI 동적 부스트 시뮬레이션
function simulateHunterDynamic(bars, params, userStartIdx, boostFn) {
  const closes = bars.map(b => b.close);
  const dates = bars.map(b => b.date);
  const n = closes.length;
  const minWarmup = Math.max(params.lookback + 15, 25);
  const warmup = Math.max(userStartIdx, minWarmup);
  const TU = 20;
  
  let SEED = 100000;
  let unitPrice = SEED / TU;
  let cash = SEED;
  let pe = [], pu = [], pd = [], zones = [], ps = [];
  let pk = SEED, mdd = 0;
  let nBuys = 0, nSells = 0, tierWins = 0;
  let fundShortageCount = 0;
  const cycles = [];
  let inCycle = false;
  let cycleStartCap = SEED;
  let cycleStartIdx = warmup;
  let cycleMaxUnits = 0;
  
  // 부스트 통계
  const boostStats = { normalDays: 0, boost10Days: 0, boost15Days: 0, boost20Days: 0, boost30Days: 0, totalBoost: 0, days: 0 };
  
  const calcTotalValue = (cl) => {
    let assetValue = 0;
    for (let j = 0; j < pe.length; j++) assetValue += ps[j] * cl;
    return cash + assetValue;
  };
  
  for (let i = warmup; i < n; i++) {
    const cl = closes[i];
    const prev = closes[i-1];
    const UP = params.up || 2;
    const DN = params.dn || 4;
    const baseUnits = cl < prev ? DN : UP;
    
    // 🆕 RSI 계산 (오늘/어제)
    const todayRsi = calcRsi(closes.slice(0, i+1), 14);
    const prevRsi = calcRsi(closes.slice(0, i), 14);
    const currentBoost = boostFn(todayRsi, prevRsi);
    
    // 통계
    boostStats.days++;
    boostStats.totalBoost += currentBoost;
    if (currentBoost === 0) boostStats.normalDays++;
    else if (currentBoost === 0.10) boostStats.boost10Days++;
    else if (currentBoost === 0.15) boostStats.boost15Days++;
    else if (currentBoost === 0.20) boostStats.boost20Days++;
    else if (currentBoost === 0.30) boostStats.boost30Days++;
    
    const start = Math.max(0, i - params.lookback);
    const recentHigh = Math.max(...closes.slice(start, i+1));
    const dd = (cl - recentHigh) / recentHigh * 100;
    let zone;
    if (dd >= -10) zone = 'top';
    else if (dd <= -15) zone = 'bot';
    else zone = 'mid';
    
    // 매도
    const re=[], rd=[], ru=[], rz=[], rs=[];
    for (let j = 0; j < pe.length; j++) {
      pd[j] += 1;
      const p = (cl - pe[j]) / pe[j];
      let tp, fd;
      if (zones[j] === 'top') { tp = params.top_p; fd = params.top_d; }
      else if (zones[j] === 'bot') { tp = params.bot_p; fd = params.bot_d; }
      else { tp = params.mid_p; fd = params.mid_d; }
      if (p >= tp || pd[j] >= fd) {
        cash += ps[j] * cl;
        nSells++;
        if (p > 0) tierWins++;
      } else { re.push(pe[j]); rd.push(pd[j]); ru.push(pu[j]); rz.push(zones[j]); rs.push(ps[j]); }
    }
    pe = re; pd = rd; pu = ru; zones = rz; ps = rs;
    
    if (inCycle && pe.length === 0) {
      const tv = calcTotalValue(cl);
      const cyclePnl = (tv - cycleStartCap) / cycleStartCap * 100;
      cycles.push({ startIdx: cycleStartIdx, endIdx: i, startDate: dates[cycleStartIdx], endDate: dates[i], duration: i - cycleStartIdx + 1, pnl: cyclePnl, incomplete: false, maxUnits: cycleMaxUnits });
      inCycle = false;
      SEED = cash;
      unitPrice = SEED / TU;
    }
    
    // 매수 (RSI 기반 동적 부스트)
    const ti = pu.reduce((s, u) => s + u, 0);
    if (ti < TU && baseUnits > 0) {
      if (!inCycle) { inCycle = true; cycleStartCap = calcTotalValue(cl); cycleStartIdx = i; cycleMaxUnits = 0; }
      
      let intendedUnits;
      if (currentBoost > 0 && ti < 15) intendedUnits = Math.min(baseUnits * (1 + currentBoost), TU - ti);
      else intendedUnits = Math.min(baseUnits, TU - ti);
      
      const intendedAmount = intendedUnits * unitPrice;
      let actualUnits, actualShares;
      
      if (cash >= intendedAmount) {
        actualUnits = intendedUnits;
        actualShares = Math.floor(intendedAmount / cl);
      } else if (cash >= cl) {
        // 🆕 자금 한도 내에서 매수 (1주라도 가능하면)
        const amt = cash * 0.99;
        actualUnits = amt / unitPrice;
        actualShares = Math.floor(amt / cl);
        fundShortageCount++;
      } else {
        fundShortageCount++;
        continue;
      }
      
      if (actualShares > 0) {
        cash -= actualShares * cl;
        pe.push(cl); pd.push(0); pu.push(actualUnits); zones.push(zone); ps.push(actualShares);
        nBuys++;
        const currentTotalU = pu.reduce((s,u) => s+u, 0);
        if (currentTotalU > cycleMaxUnits) cycleMaxUnits = Math.round(currentTotalU);
      }
    }
    
    const tv = calcTotalValue(cl);
    if (tv > pk) pk = tv;
    const ddv = (tv - pk) / pk * 100;
    if (ddv < mdd) mdd = ddv;
  }
  
  const lastClose = closes[n-1];
  const final = calcTotalValue(lastClose);
  
  boostStats.avgBoost = boostStats.days > 0 ? boostStats.totalBoost / boostStats.days : 0;
  
  return {
    mult: final / 100000, mdd: mdd, nBuys: nBuys, nSells: nSells, tierWins: tierWins,
    tierWinRate: nSells > 0 ? tierWins / nSells * 100 : 0,
    cycles: cycles, cycleTotal: cycles.length,
    fundShortageCount: fundShortageCount,
    boostStats: boostStats
  };
}

function simulateHunter(bars, params, userStartIdx, virtualBoost) {
  virtualBoost = virtualBoost || 0;
  const closes = bars.map(b => b.close);
  const dates = bars.map(b => b.date);
  const n = closes.length;
  const minWarmup = Math.max(params.lookback + 5, 25);
  const warmup = Math.max(userStartIdx, minWarmup);
  const TU = 20;

  let SEED = 100000;  // 실제 시드 $100K (사이클 종료 시 자동 증액)
  let unitPrice = SEED / TU;  // 1u = $5K (시드 변경 시 자동 갱신)
  let cash = SEED;
  let pe = [], pu = [], pd = [], zones = [], ps = []; // ps = shares per tier
  let pk = SEED, mdd = 0;
  let nBuys = 0, nSells = 0, tierWins = 0;
  let fundShortageCount = 0;
  let realized = 0;
  const cycles = [];
  let inCycle = false;
  let cycleStartCap = SEED;
  let cycleStartIdx = warmup;
  let cycleMaxUnits = 0;
  const periodSnapshots = {};
  let lastYear = null;
  let lastMonth = null;
  
  // 🆕 진짜 총 자산 = 현금 + 보유주식 평가액
  const calcTotalValue = (cl) => {
    let assetValue = 0;
    for (let j = 0; j < pe.length; j++) assetValue += ps[j] * cl;
    return cash + assetValue;
  };
  
  for (let i = warmup; i < n; i++) {
    const cl = closes[i];
    const prev = closes[i-1];
    const UP = params.up || 2;
    const DN = params.dn || 4;
    const baseUnits = cl < prev ? DN : UP;
    const start = Math.max(0, i - params.lookback);
    const recentHigh = Math.max(...closes.slice(start, i+1));
    const dd = (cl - recentHigh) / recentHigh * 100;
    let zone;
    if (dd >= -10) zone = 'top';
    else if (dd <= -15) zone = 'bot';
    else zone = 'mid';
    
    const dateStr = dates[i];
    const year = dateStr.slice(0, 4);
    const month = dateStr.slice(0, 7);
    if (year !== lastYear) {
      if (!periodSnapshots[year]) {
        const tv = calcTotalValue(cl);
        periodSnapshots[year] = { startCap: tv, endCap: tv, peak: tv, mdd: 0 };
      }
      lastYear = year;
    }
    if (month !== lastMonth) {
      if (!periodSnapshots[month]) {
        const tv = calcTotalValue(cl);
        periodSnapshots[month] = { startCap: tv, endCap: tv, peak: tv, mdd: 0 };
      }
      lastMonth = month;
    }
    
    // 매도 처리 (진짜 cash 회수)
    const re = [], rd = [], ru = [], rz = [], rs = [];
    for (let j = 0; j < pe.length; j++) {
      pd[j] += 1;
      const p = (cl - pe[j]) / pe[j];
      let tp, fd;
      if (zones[j] === 'top') { tp = params.top_p; fd = params.top_d; }
      else if (zones[j] === 'bot') { tp = params.bot_p; fd = params.bot_d; }
      else { tp = params.mid_p; fd = params.mid_d; }
      if (p >= tp || pd[j] >= fd) {
        const sellValue = ps[j] * cl;
        const buyValue = ps[j] * pe[j];
        cash += sellValue;
        realized += (sellValue - buyValue);
        nSells++;
        if (p > 0) tierWins++;
      } else {
        re.push(pe[j]); rd.push(pd[j]); ru.push(pu[j]); rz.push(zones[j]); rs.push(ps[j]);
      }
    }
    pe = re; pd = rd; pu = ru; zones = rz; ps = rs;
    
    if (inCycle && pe.length === 0) {
      const tv = calcTotalValue(cl);
      const cyclePnl = (tv - cycleStartCap) / cycleStartCap * 100;
      cycles.push({
        startIdx: cycleStartIdx, endIdx: i,
        startDate: dates[cycleStartIdx], endDate: dates[i],
        duration: i - cycleStartIdx + 1, pnl: cyclePnl,
        incomplete: false, maxUnits: cycleMaxUnits
      });
      inCycle = false;
      // 🆕 사이클 종료 = 시드 자동 증액 (복리)
      SEED = cash;  // 매도 후 잔여 현금 = 새 시드
      unitPrice = SEED / TU;  // 새 1u 단가
    }
    
    // 매수 처리 (진짜 자금 체크 + 부분 매수)
    const ti = pu.reduce((s, u) => s + u, 0);
    if (ti < TU && baseUnits > 0) {
      if (!inCycle) {
        inCycle = true;
        cycleStartCap = calcTotalValue(cl);
        cycleStartIdx = i;
        cycleMaxUnits = 0;
      }
      
      // 의도된 유닛 (부스트 적용)
      let intendedUnits;
      if (virtualBoost > 0 && ti < 15) {
        intendedUnits = Math.min(baseUnits * (1 + virtualBoost), TU - ti);
      } else {
        intendedUnits = Math.min(baseUnits, TU - ti);
      }
      
      // 의도된 매수 금액
      const intendedAmount = intendedUnits * unitPrice;
      
      // 🆕 진짜 자금 체크
      let actualUnits, actualAmount, actualShares;
      if (cash >= intendedAmount) {
        // 자금 충분 → 의도대로 매수
        actualUnits = intendedUnits;
        actualAmount = intendedAmount;
        actualShares = Math.floor(actualAmount / cl);
      } else if (cash >= cl) {
        // 🆕 자금 한도 내에서 매수 (1주라도 가능하면)
        actualAmount = cash * 0.99; // 1% 여유 남김
        actualUnits = actualAmount / unitPrice;
        actualShares = Math.floor(actualAmount / cl);
        fundShortageCount++;
      } else {
        // 자금 너무 적음 → 매수 스킵
        fundShortageCount++;
        continue;
      }
      
      if (actualShares > 0) {
        const realCost = actualShares * cl;
        cash -= realCost;
        pe.push(cl); pd.push(0); pu.push(actualUnits); zones.push(zone); ps.push(actualShares);
        nBuys++;
        const currentTotalU = pu.reduce((s,u) => s+u, 0);
        if (currentTotalU > cycleMaxUnits) cycleMaxUnits = Math.round(currentTotalU);
      }
    }
    
    // 평가액 추적 (실제 자산)
    const tv = calcTotalValue(cl);
    if (periodSnapshots[year]) {
      periodSnapshots[year].endCap = tv;
      if (tv > periodSnapshots[year].peak) periodSnapshots[year].peak = tv;
      const yearDd = (tv - periodSnapshots[year].peak) / periodSnapshots[year].peak * 100;
      if (yearDd < periodSnapshots[year].mdd) periodSnapshots[year].mdd = yearDd;
    }
    if (periodSnapshots[month]) {
      periodSnapshots[month].endCap = tv;
      if (tv > periodSnapshots[month].peak) periodSnapshots[month].peak = tv;
      const monthDd = (tv - periodSnapshots[month].peak) / periodSnapshots[month].peak * 100;
      if (monthDd < periodSnapshots[month].mdd) periodSnapshots[month].mdd = monthDd;
    }
    if (tv > pk) pk = tv;
    const ddv = (tv - pk) / pk * 100;
    if (ddv < mdd) mdd = ddv;
  }
  
  // 최종 평가
  const lastClose = closes[n-1];
  const final = calcTotalValue(lastClose);
  
  let incompleteCount = 0;
  if (inCycle) {
    incompleteCount = 1;
    cycles.push({
      startIdx: cycleStartIdx, endIdx: n-1,
      startDate: dates[cycleStartIdx], endDate: dates[n-1],
      duration: n - cycleStartIdx,
      pnl: (final - cycleStartCap) / cycleStartCap * 100,
      incomplete: true, maxUnits: cycleMaxUnits
    });
  }
  
  const completed = cycles.filter(c => !c.incomplete);
  const cycleWins = completed.filter(c => c.pnl > 0).length;
  const cycleLosses = completed.length - cycleWins;
  const cycleWinRate = completed.length > 0 ? cycleWins / completed.length * 100 : 0;
  const avgCyclePnl = completed.length > 0 ? completed.reduce((s,c) => s+c.pnl, 0) / completed.length : 0;
  const durations = completed.map(c => c.duration);
  const avgCycleDuration = durations.length > 0 ? durations.reduce((s,d) => s+d, 0) / durations.length : 0;
  const sortedDur = [...durations].sort((a,b) => a-b);
  const medianCycleDuration = sortedDur.length > 0 ? sortedDur[Math.floor(sortedDur.length / 2)] : 0;
  let bestCycle = null, worstCycle = null;
  if (completed.length > 0) {
    bestCycle = completed.reduce((best, c) => c.pnl > best.pnl ? c : best);
    worstCycle = completed.reduce((worst, c) => c.pnl < worst.pnl ? c : worst);
  }
  
  return {
    mult: final / 100000, mdd: mdd, nBuys: nBuys, nSells: nSells, tierWins: tierWins,
    tierWinRate: nSells > 0 ? tierWins / nSells * 100 : 0,
    cycles: cycles, completedCycles: completed, periodSnapshots: periodSnapshots,
    cycleTotal: cycles.length, cycleWins: cycleWins, cycleLosses: cycleLosses,
    cycleWinRate: cycleWinRate, avgCyclePnl: avgCyclePnl, avgCycleDuration: avgCycleDuration,
    medianCycleDuration: medianCycleDuration, bestCycle: bestCycle, worstCycle: worstCycle,
    incompleteCount: incompleteCount, fundShortageCount: fundShortageCount
  };
}
