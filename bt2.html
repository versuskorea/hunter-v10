<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNIPER 백테 - 스나이퍼 전용</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { background: #0f0f1e !important; color: #fff !important; color-scheme: dark !important; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 16px; padding-bottom: 80px; max-width: 600px; margin: 0 auto; min-height: 100vh; }
.header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
h1 { font-size: 22px; font-weight: 700; color: #fff !important; }
h1 .grad { background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.back-btn { background: #1a1a2e !important; color: #fff !important; padding: 8px 14px; border-radius: 10px; text-decoration: none; font-size: 13px; border: 1px solid #333; }
.card { background: #1a1a2e !important; border-radius: 14px; padding: 16px; margin-bottom: 14px; color: #fff !important; }
.ct { font-weight: 700; font-size: 15px; margin-bottom: 12px; color: #667eea !important; }
.ir { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; background: #2a2a3e !important; padding: 10px 14px; border-radius: 10px; }
.ir label { font-size: 13px; color: #aaa !important; min-width: 50px; }
.ir input, .ir select { flex: 1; background: transparent !important; border: none; color: #fff !important; font-size: 15px; outline: none; }
.ir input::-webkit-calendar-picker-indicator { filter: invert(1); opacity: 0.7; }
.ir .u { color: #888 !important; font-size: 13px; }
.btn { width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 10px; color: #fff !important; }
.btn-primary { background: linear-gradient(135deg, #667eea, #764ba2) !important; box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4); }
.btn-analyze { background: linear-gradient(135deg, #f093fb, #f5576c) !important; }
.progress { text-align: center; margin-top: 14px; color: #667eea !important; font-size: 14px; min-height: 20px; }
.result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.result-box { padding: 14px; border-radius: 12px; text-align: center; }
.result-box.hold { background: #2a2a3e !important; }
.result-box.hunter { background: linear-gradient(135deg, #667eea, #764ba2) !important; }
.rb-label { font-size: 11px; opacity: 0.7; margin-bottom: 4px; }
.rb-value { font-size: 22px; font-weight: 700; margin-bottom: 2px; }
.rb-pct { font-size: 13px; opacity: 0.85; }
.metric-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #2a2a3e; font-size: 13px; }
.metric-row:last-child { border-bottom: none; }
.metric-label { color: #aaa !important; }
.metric-value { font-weight: 700; }
.quick-sym { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.quick-sym button { background: #2a2a3e !important; color: #fff !important; border: 1px solid #333; padding: 6px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; }
.tip { background: #1a1a2e !important; padding: 12px 14px; border-radius: 10px; font-size: 13px; color: #bbb !important; line-height: 1.6; margin-bottom: 14px; border: 1px solid #2a2a3e; }
.cycle-badge { display: inline-block; background: linear-gradient(135deg, #f59e0b, #ef4444); color: #fff !important; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 6px; margin-left: 6px; vertical-align: middle; }
.vol-result { background: linear-gradient(135deg, #1a2a4e, #2a1a4e) !important; padding: 16px; border-radius: 14px; margin-bottom: 14px; }
.vol-main { text-align: center; padding: 12px 0; }
.vol-num { font-size: 40px; font-weight: 800; color: #ffdd44 !important; }
.vol-cat { font-size: 15px; margin-top: 6px; }
.param-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 13px; }
.param-label { color: #bbb !important; }
.param-value { color: #ffdd88 !important; font-weight: 700; }
.warmup-info { background: rgba(0, 200, 83, 0.1); border: 1px solid rgba(0, 200, 83, 0.3); padding: 10px 12px; border-radius: 8px; margin-top: 10px; font-size: 12px; color: #8fe8b0 !important; line-height: 1.6; }
.cycle-card { background: linear-gradient(135deg, #1a3a2e, #1a2a4e) !important; border: 1px solid rgba(245, 158, 11, 0.4); padding: 16px; border-radius: 14px; margin-top: 12px; }
.cs-title { font-size: 14px; font-weight: 700; color: #fbbf24 !important; margin-bottom: 12px; }
.cycle-main { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.cycle-big { background: rgba(0,0,0,0.4); padding: 14px; border-radius: 10px; text-align: center; }
.cycle-big .lbl { font-size: 11px; color: #aaa !important; margin-bottom: 6px; }
.cycle-big .big { font-size: 28px; font-weight: 800; letter-spacing: -1px; }
.cycle-big .sub { font-size: 12px; color: #aaa !important; margin-top: 4px; }
.cycle-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
.cycle-mini { background: rgba(0,0,0,0.3); padding: 8px; border-radius: 8px; text-align: center; }
.cycle-mini .lbl { font-size: 10px; color: #999 !important; margin-bottom: 2px; }
.cycle-mini .val { font-size: 14px; font-weight: 700; }
.cycle-distribution { margin-top: 12px; padding: 10px; background: rgba(0,0,0,0.3); border-radius: 8px; }
.cycle-dist-row { display: flex; align-items: center; font-size: 11px; margin: 4px 0; color: #ddd !important; font-family: monospace; }
.cycle-dist-row .dist-label { width: 95px; flex-shrink: 0; color: #aaa !important; font-size: 10px; }
.cycle-dist-row .dist-bar { flex: 1; height: 14px; background: #2a2a3e; border-radius: 4px; margin: 0 8px; position: relative; overflow: hidden; display: block; min-width: 50px; }
.cycle-dist-row .dist-fill { display: block; height: 100%; border-radius: 4px; min-width: 2px; transition: width 0.5s; }
.cycle-dist-row .dist-cnt { width: 80px; flex-shrink: 0; text-align: right; font-size: 10px; }
.def-info { background: rgba(0,0,0,0.25); padding: 10px; border-radius: 8px; margin-top: 10px; font-size: 11px; color: #ccc !important; line-height: 1.7; }
.def-info b { color: #fbbf24 !important; }
.best-worst { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.bw-card { padding: 10px; border-radius: 8px; font-size: 11px; line-height: 1.5; }
.bw-card.best { background: rgba(0, 255, 0, 0.08); border: 1px solid rgba(0, 255, 0, 0.3); }
.bw-card.worst { background: rgba(255, 0, 0, 0.08); border: 1px solid rgba(255, 0, 0, 0.3); }
.bw-card .bw-pnl { font-size: 18px; font-weight: 800; margin: 4px 0; }
.bw-card.best .bw-pnl { color: #0f0 !important; }
.bw-card.worst .bw-pnl { color: #f88 !important; }
.bw-card .bw-date { color: #aaa !important; font-size: 10px; }
.unit-stats { background: rgba(123, 97, 255, 0.1); border: 1px solid rgba(123, 97, 255, 0.4); padding: 12px; border-radius: 10px; margin-top: 12px; }
.unit-stats-title { font-size: 12px; font-weight: 700; color: #a78bfa !important; margin-bottom: 8px; }
.unit-row { display: flex; align-items: center; font-size: 11px; margin: 4px 0; color: #ddd !important; font-family: monospace; }
.unit-row .ulbl { width: 60px; flex-shrink: 0; color: #aaa !important; font-size: 11px; }
.unit-row .ubar { flex: 1; height: 16px; background: #2a2a3e; border-radius: 4px; margin: 0 8px; overflow: hidden; }
.unit-row .ufill { display: block; height: 100%; border-radius: 4px; min-width: 2px; }
.unit-row .ucnt { width: 90px; flex-shrink: 0; text-align: right; font-size: 11px; color: #fff; }
</style>
</head>
<body>

<div class="header">
  <h1>📊 <span class="grad">HUNTER</span> 백테</h1>
  <a href="/" class="back-btn">← 돌아가기</a>
</div>

<div class="card">

  <div class="ir">

    <label>종료</label>

  </div>

  <div class="quick-sym">
    <button onclick="setRange('ytd')">올해</button>

  <div class="quick-sym" style="margin-top:12px" id="sym-buttons"></div>

  <div style="margin-top:12px;display:flex;gap:6px">
    <label style="flex:1;cursor:pointer"><input type="radio" name="bt-mode" value="auto" checked style="display:none"><div class="bt-mode-btn">🤖 자동</div></label>
    <label style="flex:1;cursor:pointer"><input type="radio" name="bt-mode" value="attack" style="display:none"><div class="bt-mode-btn">🟢 공격</div></label>
    <label style="flex:1;cursor:pointer"><input type="radio" name="bt-mode" value="defense" style="display:none"><div class="bt-mode-btn">🔵 방어</div></label>
  </div>
  <!-- bt2: 공격 매수 균등 1/6 고정 (3/5·3/4 제거) -->
  <input type="radio" name="bt-buyunit" value="35" checked style="display:none">

  <div style="margin-bottom:14px;padding:10px 12px;background:#1a1a2a;border:1px solid #444;border-radius:8px">
    <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;font-weight:700;color:#aaa">
      <input type="checkbox" id="bt-vrule" style="accent-color:#ef4444;width:18px;height:18px">
      <span>⚡ V자 룰 (전년 -50%↓ → 다음해 공격 강제)</span>
    </label>
  </div>

  <!-- ── bt2 스나이퍼 조절 패널 ── -->
  <div style="margin-bottom:14px;padding:12px;background:#0d1a2a;border:1px solid #00b4d8;border-radius:8px">
    <div style="font-size:13px;font-weight:800;color:#00d8ff;margin-bottom:10px">🎯 스나이퍼 조절 (bt2 전용)</div>

    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
      <span style="font-size:11px;color:#888;width:70px">공격 부스트</span>
      <input type="range" id="bt2-boost-atk" min="1.0" max="1.7" step="0.1" value="1.0" style="flex:1;accent-color:#ef4444" oninput="document.getElementById('bt2-boost-atk-v').textContent=this.value+'x'">
      <span id="bt2-boost-atk-v" style="font-size:12px;font-weight:800;color:#ef4444;width:36px">1.0x</span>

      <span style="font-size:11px;color:#888;width:70px">방어 부스트</span>
      <input type="range" id="bt2-boost-def" min="1.0" max="1.7" step="0.1" value="1.0" style="flex:1;accent-color:#00b4d8" oninput="document.getElementById('bt2-boost-def-v').textContent=this.value+'x'">
      <span id="bt2-boost-def-v" style="font-size:12px;font-weight:800;color:#00b4d8;width:36px">1.0x</span>
    </div>
    <div style="font-size:10px;color:#666;margin-top:8px">※ 부스트 = 매수량 배율. 공격(빨강)·방어(파랑) 따로 조절</div>
  </div>
  <style>
    .bt-mode-btn { padding:11px 4px; border-radius:8px; border:2px solid #444; background:#1a1a2a; color:#888; text-align:center; font-size:13px; font-weight:700; transition:all 0.15s; white-space:nowrap; overflow:hidden; }
    label input[name="bt-mode"]:checked + .bt-mode-btn, label input[name="bt-buyunit"]:checked + .bt-mode-btn { border-color:#00d8ff; background:#00b4d8; color:#fff; box-shadow:0 0 14px rgba(0,180,216,0.5); transform:scale(1.03); }
  </style>

<button class="btn btn-primary" onclick="runNewSystem()" style="background:linear-gradient(135deg,#00b4d8,#0077b6,#03045e) !important;color:#fff !important;font-weight:800;font-size:16px;padding:16px">🚀 백테2 실행! (스나이퍼 조절)</button>
<a href="bt.html" style="display:block;text-align:center;margin-top:10px;padding:10px;background:#1a1a2a;border:1px solid #444;border-radius:8px;color:#888;font-weight:700;font-size:13px;text-decoration:none">← 원본 백테로</a>

  <div class="progress" id="bt-progress"></div>
</div>

<div id="vol-panel"></div>
<div id="result"></div>

<script>
const DEFAULT_SYMS = ['SOXL', 'TQQQ', 'POET', 'UCO', 'USO', 'TSLA', 'NVDA', 'AMD', 'AAPL', 'MSFT', 'GOOGL', 'SPY', 'QQQ'];

function getRecentSyms() {
  const stored = localStorage.getItem('bt-recent-syms');
  if (stored) {
    try { const arr = JSON.parse(stored); if (Array.isArray(arr) && arr.length > 0) return arr; } catch(e) {}
  }
  return DEFAULT_SYMS.slice();
}
function saveRecentSyms(syms) { localStorage.setItem('bt-recent-syms', JSON.stringify(syms.slice(0, 20))); }
function addRecentSym(sym) {
  if (!sym) return;
  const u = sym.toUpperCase().trim();
  if (!u) return;
  let recent = getRecentSyms();
  recent = recent.filter(s => s !== u);
  recent.unshift(u);
  recent = recent.slice(0, 20);
  saveRecentSyms(recent);
  renderSymButtons();
}
function renderSymButtons() {
  const container = document.getElementById('sym-buttons');
  if (!container) return;
  const syms = getRecentSyms();
  let html = '';
  syms.forEach(s => { html += '<button onclick="setSym(\'' + s + '\')">' + s + '</button>'; });
  container.innerHTML = html;
}
function setSym(s) { document.getElementById('bt-sym').value = s; addRecentSym(s); }
function setRange(years) {
  const end = new Date();
  const start = new Date();
  if (years === 'ytd') start.setMonth(0, 1);
  else if (years === 20) start.setFullYear(2015, 0, 1);
  else start.setFullYear(end.getFullYear() - years);
  const fmt = d => d.toISOString().slice(0, 10);
  document.getElementById('bt-start').value = fmt(start);
  document.getElementById('bt-end').value = fmt(end);
}

// 특수 환경 빠른 선택
function setRangeSpecial(type) {
  const ranges = {
    'covid':     { start: '2020-01-01', end: '2020-12-31', name: '🦠 코로나 V자' },
    'bear2022':  { start: '2022-01-01', end: '2022-12-31', name: '📉 2022 약세장 (SOXL -85%)' },
    'vol2018':   { start: '2018-01-01', end: '2018-12-31', name: '⚡ 2018 변동성' },
    'rally2023': { start: '2022-10-01', end: '2024-12-31', name: '🚀 2022 바닥 + 2023-2024 V자' },
    'bear2024':  { start: '2024-07-01', end: '2025-04-30', name: '📉 2024-2025 약세' },
    'full':      { start: '2011-01-01', end: new Date().toISOString().slice(0, 10), name: '📅 16년 전체' }
  };
  const r = ranges[type];
  if (!r) return;
  document.getElementById('bt-start').value = r.start;
  document.getElementById('bt-end').value = r.end;
  // 잠깐 안내 표시
  const progressEl = document.getElementById('bt-progress');
  if (progressEl) progressEl.innerHTML = '✅ 기간 설정: ' + r.name + ' (' + r.start + ' ~ ' + r.end + ')';
}

window.addEventListener('DOMContentLoaded', () => { setRange(5); renderSymButtons(); });

async function analyzeVolatility() {
  const sym = document.getElementById('bt-sym').value.toUpperCase().trim();
  if (!sym) { alert('종목 입력!'); return; }
  const progressEl = document.getElementById('bt-progress');
  const volEl = document.getElementById('vol-panel');
  progressEl.innerHTML = '📊 1년 데이터 다운로드...';
  volEl.innerHTML = '';
  try {
    const end = new Date();
    const start = new Date();
    start.setFullYear(end.getFullYear() - 1);
    const fmt = d => d.toISOString().slice(0, 10);
    const url = '/api/history?symbol=' + sym + '&start=' + fmt(start) + '&end=' + fmt(end);
    const res = await fetch(url);
    const data = await res.json();
    if (data.error) { progressEl.innerHTML = '❌ ' + data.error; return; }
    if (!data.bars || data.bars.length < 30) { progressEl.innerHTML = '❌ 데이터 부족'; return; }
    const closes = data.bars.map(b => b.close);
    const returns = [];
    for (let i = 1; i < closes.length; i++) returns.push((closes[i] - closes[i-1]) / closes[i-1] * 100);
    const mean = returns.reduce((a,b) => a+b, 0) / returns.length;
    const variance = returns.reduce((s,r) => s + Math.pow(r-mean, 2), 0) / returns.length;
    const vol = Math.sqrt(variance);
    const params = calcParams(vol);
    const category = categorize(vol);
    let html = '<div class="vol-result"><div class="ct" style="color:#ffd">🎯 ' + sym + ' 변동성 분석</div><div class="vol-main"><div class="vol-num">' + vol.toFixed(2) + '%</div><div class="vol-cat">' + category.emoji + ' ' + category.name + '</div></div><div style="background:rgba(0,0,0,0.3);padding:12px;border-radius:10px;margin-top:10px"><div style="font-weight:700;margin-bottom:8px;color:#ffd">💡 추천 HUNTER 설정:</div><div class="param-row"><span class="param-label">유닛</span><span class="param-value">2u / 4u / TU20</span></div><div class="param-row"><span class="param-label">매도 (천/중/바)</span><span class="param-value">+' + (params.top_p*100).toFixed(1) + '% / +' + (params.mid_p*100).toFixed(1) + '% / +' + (params.bot_p*100).toFixed(1) + '%</span></div><div class="param-row"><span class="param-label">강제 기간</span><span class="param-value">' + params.top_d + '/' + params.mid_d + '/' + params.bot_d + '일</span></div></div><div style="background:rgba(255,255,100,0.1);padding:10px;border-radius:8px;margin-top:10px;font-size:12px"><b>💡 ' + category.recommendation + '</b></div></div>';
    volEl.innerHTML = html;
    progressEl.innerHTML = '✅ 분석 완료! [🚀 백테 실행] 클릭!';
    window.autoParams = params;
  } catch(e) { progressEl.innerHTML = '❌ ' + e.message; }
}

function categorize(vol) {
  if (vol < 1.0) return { emoji: '🟢', name: '안정주', recommendation: '변동성 너무 낮음! 단순 보유 추천!' };
  if (vol < 1.5) return { emoji: '🔵', name: '지수 ETF', recommendation: 'Ultra Long HUNTER. 년 3~5회 매매!' };
  if (vol < 2.5) return { emoji: '🟣', name: '안정 성장주', recommendation: 'Long HUNTER. 월 1~2회 매매!' };
  if (vol < 4.0) return { emoji: '🟠', name: '변동 개별주', recommendation: 'Mid HUNTER. 주 1회 매매!' };
  if (vol < 6.0) return { emoji: '🔴', name: '고변동 ETF', recommendation: 'Short-Mid HUNTER!' };
  return { emoji: '🚨', name: '극변동', recommendation: '기본 HUNTER! 자동화 필수!' };
}

function calcParams(vol) {
  const top_p = vol * 0.5 / 100;
  const mid_p = vol * 0.3 / 100;
  const bot_p = vol * 0.8 / 100;
  let top_d, mid_d, bot_d, lookback;
  if (vol >= 5) { top_d = 7; mid_d = 7; bot_d = 10; lookback = 20; }
  else if (vol >= 3) { top_d = 10; mid_d = 10; bot_d = 14; lookback = 30; }
  else if (vol >= 2) { top_d = 14; mid_d = 14; bot_d = 20; lookback = 40; }
  else if (vol >= 1.5) { top_d = 18; mid_d = 18; bot_d = 27; lookback = 50; }
  else { top_d = 25; mid_d = 25; bot_d = 40; lookback = 60; }
  return { top_p, mid_p, bot_p, top_d, mid_d, bot_d, lookback };
}


function toggleYearMonths(yKey) {
  const monthsRow = document.getElementById('months-' + yKey);
  const arrow = document.getElementById('year-arrow-' + yKey);
  if (!monthsRow) return;
  const isHidden = monthsRow.style.display === 'none';
  monthsRow.style.display = isHidden ? 'table-row' : 'none';
  if (arrow) arrow.textContent = isHidden ? '▲' : '▼';
}

function buildModeMap(bars, n) {
  const weekClose = {};
  const weekOrder = [];
  for (let i = 0; i < n; i++) {
    const d = new Date(bars[i].date);
    const day = d.getDay();
    const monday = new Date(d);
    monday.setDate(d.getDate() - (day === 0 ? 6 : day - 1));
    const key = monday.toISOString().slice(0, 10);
    if (weekClose[key] === undefined) weekOrder.push(key);
    weekClose[key] = bars[i].close;
    bars[i]._wk = key;
  }
  const wkeys = weekOrder.slice().sort();
  const wcloses = wkeys.map(k => weekClose[k]);
  function rsiSeries(arr) {
    const out = new Array(arr.length).fill(50);
    if (arr.length < 16) return out;
    let ag = 0, al = 0;
    for (let i = 1; i <= 14; i++) { const d = arr[i]-arr[i-1]; if (d>0) ag+=d; else al-=d; }
    ag/=14; al/=14;
    out[14] = al === 0 ? 100 : 100 - 100/(1+ag/al);
    for (let i = 15; i < arr.length; i++) {
      const d = arr[i]-arr[i-1];
      if (d>0){ ag=(ag*13+d)/14; al=(al*13)/14; } else { ag=(ag*13)/14; al=(al*13-d)/14; }
      out[i] = al === 0 ? 100 : 100 - 100/(1+ag/al);
    }
    return out;
  }
  const wrsi = rsiSeries(wcloses);
  const wkIndex = {}; wkeys.forEach((k,j)=>wkIndex[k]=j);
  const modeArr = new Array(n).fill('attack');
  let cur = 'attack', prevWk = null;
  for (let i = 0; i < n; i++) {
    const wk = bars[i]._wk;
    if (wk !== prevWk) {
      const mi = wkIndex[wk];
      const ri = mi - 1;
      if (ri >= 15) {
        const c2 = wrsi[ri], p2 = wrsi[ri-1], rising = c2 > p2;
        if      (p2 < 50 && c2 >= 50)          cur = 'attack';
        else if (rising && c2 >= 50 && c2 <= 60) cur = 'attack';
        else if (rising && c2 < 35)             cur = 'attack';
        else if (p2 >= 50 && c2 < 50)           cur = 'defense';
        else if (!rising && c2 >= 40 && c2 <= 50) cur = 'defense';
        else if (!rising && c2 > 65)            cur = 'defense';
      }
      prevWk = wk;
    }
    modeArr[i] = cur;
  }
  return modeArr;
}

function simulateNewSystem(bars, userStartIdx, manualMode, atkUpU, atkDnU, vRuleOn, opts) {
  manualMode = manualMode || 'auto';
  atkUpU = atkUpU || 3;
  atkDnU = atkDnU || 5;
  opts = opts || {};
  // bt2 = 순수 스나이퍼 전용 (공격 매도 MA3 / 매수 균등 1/6 / 상한 1.08)
  const ATK_CAP = 1.08;          // 공격 매수 상한 (스나이퍼 고정)
  const ATK_UNIT = 3;            // 균등 1/6 = 시드의 약 16% (TU=20, 3유닛 = 15%)
  const BOOST_ATK = opts.boostAtk || 1.0;
  const BOOST_DEF = opts.boostDef || 1.0;
  const V_RULE = !!vRuleOn;
  const TU = 20;
  const closes = bars.map(b => b.close);
  const dates  = bars.map(b => b.date);
  const n = closes.length;
  const warmup = Math.max(userStartIdx, 1);

  // ── 일간 RSI(14) 시리즈 (스나이퍼 동적 매도용) ──
  const dRSI = new Array(n).fill(50);
  (function(){
    const P=14;
    if(n>P){
      let ag=0,al=0;
      for(let k=1;k<=P;k++){const d=closes[k]-closes[k-1]; if(d>0)ag+=d; else al+=-d;}
      ag/=P; al/=P;
      dRSI[P]= al===0?100:100-100/(1+ag/al);
      for(let i=P+1;i<n;i++){
        const d=closes[i]-closes[i-1];
        const g=d>0?d:0, l=d<0?-d:0;
        ag=(ag*(P-1)+g)/P; al=(al*(P-1)+l)/P;
        dRSI[i]= al===0?100:100-100/(1+ag/al);
      }
    }
  })();
  // 스나이퍼 동적 매도: 매수RSI → 매도폭%, 보유일 (a=2)
  const SNIPER_A_SELL=0.4;  // 매도폭 정규화 계수
  const SNIPER_A_HOLD=2;     // 보유일 정규화 계수
  function sniperSell(buyRsi){
    let x=(buyRsi-35)/30; x=Math.max(0,Math.min(1,x));
    return {
      pct:  0.1 + 2.9*Math.pow(1-x, 1/SNIPER_A_SELL),
      hold: 7   + 23 *Math.pow(1-x, 1/SNIPER_A_HOLD)
    };
  }

  const modeArr = buildModeMap(bars, n);

  // V자 룰: 전년 SOXL 연수익률 계산 (-50% 이하면 다음해 공격 고정)
  const yrRet = {};
  if (V_RULE) {
    const yrFirst = {}, yrLast = {};
    for (let i = 0; i < n; i++) {
      const y = dates[i].slice(0, 4);
      if (yrFirst[y] === undefined) yrFirst[y] = closes[i];
      yrLast[y] = closes[i];
    }
    for (const y in yrFirst) yrRet[y] = (yrLast[y] / yrFirst[y] - 1) * 100;
  }

  let SEED = 100000;
  let cash = SEED;
  let pos  = [];
  let pk = SEED, mdd = 0;
  let nBuys = 0, nSells = 0, W = 0, L = 0;
  let atkDays = 0, defDays = 0;  // 모드별 일수 카운트
  const modeTimeline = [];  // 모드 구간 [{mode, startDate, endDate, days}]
  let curSeg = null;
  const equityCurve = [];  // 일별 [{date, value, mode}] 누적 자산곡선

  function high20(i) { return Math.max(...closes.slice(Math.max(0, i - 19), i + 1)); }
  function snapTV(i) { let v = cash; for (const x of pos) v += x.sh * closes[i]; return v; }

  const periodSnapshots = {};
  let lastYear = '', lastMonth = '';
  const cycles = [];
  let inCycle = false, cycleStartCap = SEED, cycleStartIdx = warmup, cycleMaxU = 0;
  let defLadder = 0;  // 방어 점증 단계 (1,2,4,6,7 사다리). 방어 포지션 전량 청산시 0으로 리셋

  // 시작 시드 진입 (공격 2u)
  {
    const p0 = closes[warmup];
    const sh0 = Math.floor((SEED * (1/6)) / p0);  // 균등 1/6 첫 티어
    if (sh0 > 0) {
      cash -= sh0 * p0;
      { const _s=sniperSell(dRSI[warmup]); pos.push({ bp: p0, sh: sh0, bi: warmup, mode: 'attack', zone: 'top', uu: 0, sellPct:_s.pct, holdDays:_s.hold }); }
      inCycle = true; cycleStartCap = SEED; cycleStartIdx = warmup; cycleMaxU = 1;
    }
    const tv = snapTV(warmup);
    if (tv > pk) pk = tv;
  }

  for (let i = warmup + 1; i < n; i++) {
    const p  = closes[i];
    const pv = closes[i - 1];
    const fi = p > pv;
    let mode = modeArr[i];
    // 수동 모드 고정 (auto면 자동, attack/defense면 강제)
    if (manualMode === 'attack') mode = 'attack';
    else if (manualMode === 'defense') mode = 'defense';
    else if (V_RULE) {
      // V자 룰: 자동 모드에서 전년 -50%↓면 공격 강제
      const prevYr = (parseInt(dates[i].slice(0, 4)) - 1).toString();
      if (yrRet[prevYr] !== undefined && yrRet[prevYr] <= -50) mode = 'attack';
    }
    // 모드별 일수 카운트
    if (mode === 'attack') atkDays++; else defDays++;
    // 모드 타임라인: 전환되면 구간 닫고 새로 시작
    const tvNow = snapTV(i);
    if (!curSeg || curSeg.mode !== mode) {
      if (curSeg) { curSeg.endDate = dates[i-1]; curSeg.endCap = snapTV(i-1); modeTimeline.push(curSeg); }
      curSeg = { mode: mode, startDate: dates[i], endDate: dates[i], days: 1, startPrice: p, startCap: tvNow, endCap: tvNow };
    } else {
      curSeg.days++;
    }

    const h20 = high20(i);
    const drop = (p - h20) / h20 * 100;
    let zone;
    if (drop > -12)      zone = 'top';
    else if (drop > -20) zone = 'middle';
    else                 zone = 'bottom';

    const yr = dates[i].slice(0, 4);
    const mo = dates[i].slice(0, 7);
    const tv0 = snapTV(i);
    // 기간 startCap = 직전 거래일 종가 기준 자산(prevTV)으로 잡아야 월별 곱=연도값이 맞음
    const prevTVforPeriod = (i > 0) ? snapTV(i - 1) : tv0;
    if (yr !== lastYear) { if (!periodSnapshots[yr]) periodSnapshots[yr] = { startCap: prevTVforPeriod, endCap: tv0, peak: tv0, mdd: 0 }; lastYear = yr; }
    if (mo !== lastMonth) { if (!periodSnapshots[mo]) periodSnapshots[mo] = { startCap: prevTVforPeriod, endCap: tv0, peak: tv0, mdd: 0 }; lastMonth = mo; }

    // ── 매도: 공격·방어 모두 스나이퍼 MA3 (종가가 MA3×1.007 위 반등시 익절 / 9일 만기) ──
    const ma3sell = (closes[i] + closes[i-1] + (i >= 2 ? closes[i-2] : closes[i-1])) / 3;
    const sorted = [...pos].sort((a, b) => a.bi - b.bi);
    const newPos = [];
    let t1Sold = false, t1Profit = false;
    sorted.forEach((x, idx) => {
      const td = i - x.bi;
      let sell = false;
      if (x.mode === 'defense') {
        // 스나이퍼 방어 매도: 종가 ≥ MA3×1.007 (0.7% 위) OR 보유 8일 경과시 MOC 강제청산
        if (p >= ma3sell * 1.007 || td >= 8) sell = true;
      } else {
        // 공격 매도 = 스나이퍼 동적: 매수가×(1+n%) OR 보유 n일 만기 (둘다 매수RSI로 결정)
        const ss = x.sellPct, hh = x.holdDays;
        if (p >= x.bp * (1 + ss/100) || td >= hh) sell = true;
      }
      if (sell) {
        cash += x.sh * p; nSells++;
        (p >= x.bp) ? W++ : L++;
        if (idx === 0) { t1Sold = true; t1Profit = (p >= x.bp); }
      } else newPos.push(x);
    });
    pos = newPos;

    // 방어 포지션이 전부 청산되면 점증 사다리 리셋 (다음 방어 사이클은 1u부터)
    if (!pos.some(x => x.mode === 'defense')) defLadder = 0;

    if (t1Sold) {
      const tv = snapTV(i);
      if (inCycle) {
        const cycPnl = (tv - cycleStartCap) / cycleStartCap * 100;
        cycles.push({ startIdx: cycleStartIdx, endIdx: i, startDate: dates[cycleStartIdx], endDate: dates[i],
          duration: i - cycleStartIdx + 1, pnl: cycPnl, incomplete: false, maxUnits: cycleMaxU });
        inCycle = false;
      }
      SEED = tv;
      // 스나이퍼: 재매수 특별룰 없음. 아래 '매일 1티어 매수' 루프가 처리
    }

    // ── 잔여 포지션도 모두 청산되면 사이클 종료 (방어모드 등 T1 없이 끝나는 경우) ──
    if (inCycle && pos.length === 0) {
      const tv = snapTV(i);
      const cycPnl = (tv - cycleStartCap) / cycleStartCap * 100;
      cycles.push({ startIdx: cycleStartIdx, endIdx: i, startDate: dates[cycleStartIdx], endDate: dates[i],
        duration: i - cycleStartIdx + 1, pnl: cycPnl, incomplete: false, maxUnits: cycleMaxU });
      inCycle = false;
      SEED = tv;
    }

    // 평가액(매수 전) 기록 + 전체 MDD
    {
      const tv = snapTV(i);
      if (tv > pk) pk = tv;
      const ddv = (tv - pk) / pk * 100;
      if (ddv < mdd) mdd = ddv;
      equityCurve.push({ date: dates[i], value: tv, mode: mode, price: closes[i] });
      if (periodSnapshots[yr]) { periodSnapshots[yr].endCap = tv; if (tv > periodSnapshots[yr].peak) periodSnapshots[yr].peak = tv;
        const dd = (tv - periodSnapshots[yr].peak) / periodSnapshots[yr].peak * 100; if (dd < periodSnapshots[yr].mdd) periodSnapshots[yr].mdd = dd; }
      if (periodSnapshots[mo]) { periodSnapshots[mo].endCap = tv; if (tv > periodSnapshots[mo].peak) periodSnapshots[mo].peak = tv;
        const dd = (tv - periodSnapshots[mo].peak) / periodSnapshots[mo].peak * 100; if (dd < periodSnapshots[mo].mdd) periodSnapshots[mo].mdd = dd; }
    }

    // ── 매수 ──
    const usedU = pos.reduce((s, x) => s + x.uu, 0);
    if (mode === 'attack') {
      const ATK_TIERS = 6;  // 균등 6분할 (최대 6티어)
      const atkHeld = pos.filter(z => z.mode === 'attack').length;
      if (atkHeld < ATK_TIERS && cash > 0) {
        // 할당금 = 그 시점 총자산 × 1/6 (실거래 로그 검증: 매 티어 ~16%)
        const curTV = snapTV(i);
        const a = curTV * (1 / ATK_TIERS) * BOOST_ATK;
        const thr = fi ? Math.round(pv * ATK_CAP * 100) / 100 : Math.round(pv * 0.999 * 100) / 100;
        if (p <= thr) {
          const sh = Math.floor(Math.min(a, cash) / p);
          if (sh > 0) {
            cash -= sh * p;
            { const _s=sniperSell(dRSI[i]); pos.push({ bp: p, sh, bi: i, mode: 'attack', zone, uu: 0, sellPct:_s.pct, holdDays:_s.hold }); }
            nBuys++;
            if (!inCycle) { inCycle = true; cycleStartCap = snapTV(i); cycleStartIdx = i; cycleMaxU = 0; }
          }
        }
      }
    } else if (cash > 0) {
      // 방어 매수 (스나이퍼: 비중 6·13·20·27·34%, 할당 = 시작현금×(다음비중/남은비중합))
      const DEF_W = [6, 13, 20, 27, 34];  // 티어별 매수비중 % (실거래 로그 검증)
      const step = (defLadder < DEF_W.length) ? defLadder : DEF_W.length - 1;
      // 할당금 = 그 시점 총자산 × 절대비중(%) × 부스트 (로그: 자산의 6·13·20·27·34%)
      const curTV = snapTV(i);
      const a = curTV * (DEF_W[step] / 100) * BOOST_DEF;
      const pp = (i >= 2) ? closes[i - 2] : pv;
      const f = 0.994;                       // 매수조건1: MA -0.6%
      const cond1 = f * (pv + pp) / (3 - f); // MA기준 3 (2일 종가합)
      const cond2 = pv * 1.055;              // 매수조건2: 전일 +5.5%
      const thr = Math.round(Math.min(cond1, cond2) * 100) / 100;
      if (p <= thr) {
        const sh = Math.floor(Math.min(a, cash) / p);
        if (sh > 0) {
          cash -= sh * p;
          pos.push({ bp: p, sh, bi: i, mode: 'defense', zone, tier: step, uu: 0 });
          if (defLadder < DEF_W.length - 1) defLadder++;
          nBuys++;
          if (!inCycle) { inCycle = true; cycleStartCap = snapTV(i); cycleStartIdx = i; cycleMaxU = 0; }
        }
      }
    }
  }

  const lastClose = closes[n - 1];
  const final = cash + pos.reduce((s, x) => s + x.sh * lastClose, 0);
  if (curSeg) { curSeg.endDate = dates[n-1]; curSeg.endCap = snapTV(n-1); modeTimeline.push(curSeg); }
  let incompleteCount = 0;
  if (inCycle) {
    incompleteCount = 1;
    cycles.push({ startIdx: cycleStartIdx, endIdx: n-1, startDate: dates[cycleStartIdx], endDate: dates[n - 1],
      duration: n - cycleStartIdx, pnl: (final - cycleStartCap) / cycleStartCap * 100, incomplete: true, maxUnits: cycleMaxU });
  }

  const completed = cycles.filter(c => !c.incomplete);
  const cycleWins = completed.filter(c => c.pnl > 0).length;
  const cycleLosses = completed.length - cycleWins;
  const avgPnl = completed.length ? completed.reduce((s, c) => s + c.pnl, 0) / completed.length : 0;
  const durations = completed.map(c => c.duration);
  const avgDur = durations.length ? durations.reduce((s,d)=>s+d,0)/durations.length : 0;
  const sortedDur = [...durations].sort((a,b)=>a-b);
  const medianDur = sortedDur.length ? sortedDur[Math.floor(sortedDur.length/2)] : 0;
  let bestCycle = null, worstCycle = null;
  if (completed.length) {
    bestCycle = completed.reduce((b,c)=>c.pnl>b.pnl?c:b);
    worstCycle = completed.reduce((w,c)=>c.pnl<w.pnl?c:w);
  }

  // 모드별 누적 수익률 (각 구간 수익률 복리 합성)
  let atkMult = 1, defMult = 1;
  for (const seg of modeTimeline) {
    if (seg.startCap > 0 && seg.endCap > 0) {
      const segMult = seg.endCap / seg.startCap;
      if (seg.mode === 'attack') atkMult *= segMult;
      else defMult *= segMult;
    }
  }
  const atkReturn = (atkMult - 1) * 100;
  const defReturn = (defMult - 1) * 100;

  return {
    mult: final / 100000, mdd, nBuys, nSells,
    tierWinRate: nSells > 0 ? W / nSells * 100 : 0,
    cycles, completedCycles: completed, periodSnapshots,
    cycleTotal: cycles.length, cycleWins, cycleLosses,
    cycleWinRate: completed.length ? cycleWins / completed.length * 100 : 0,
    avgCyclePnl: avgPnl, avgCycleDuration: avgDur, medianCycleDuration: medianDur,
    bestCycle, worstCycle, incompleteCount,
    atkDays, defDays, totalDays: atkDays + defDays,
    atkPct: (atkDays+defDays)>0 ? atkDays/(atkDays+defDays)*100 : 0,
    defPct: (atkDays+defDays)>0 ? defDays/(atkDays+defDays)*100 : 0,
    modeTimeline, atkReturn, defReturn, equityCurve
  };
}

async function runNewSystem() {
  const sym = document.getElementById('bt-sym').value.toUpperCase().trim();
  const userStartDate = document.getElementById('bt-start').value;
  const userEndDate   = document.getElementById('bt-end').value;
  if (!sym)                           { alert('종목 입력!'); return; }
  if (!userStartDate || !userEndDate) { alert('날짜 선택!'); return; }
  addRecentSym(sym);  // 검색한 티커 하단 히스토리에 저장 (최근 20개)
  const progressEl = document.getElementById('bt-progress');
  const resultEl   = document.getElementById('result');
  progressEl.innerHTML = '🚀 HUNTER 백테 중...';
  resultEl.innerHTML   = '';
  try {
    const fetchStart = new Date(userStartDate);
    fetchStart.setDate(fetchStart.getDate() - 250);  // wRSI 주간14주+모드관성 확보(60일은 부족→단독연도 모드 깨짐)
    const fmt = d => d.toISOString().slice(0, 10);
    const res  = await fetch('/api/history?symbol=' + sym + '&start=' + fmt(fetchStart) + '&end=' + userEndDate);
    const data = await res.json();
    if (data.error) { progressEl.innerHTML = '❌ ' + data.error; return; }
    if (!data.bars || data.bars.length < 30) { progressEl.innerHTML = '❌ 데이터 부족'; return; }
    const userStartTs = new Date(userStartDate).getTime();
    let userStartIdx = 0;
    for (let i = 0; i < data.bars.length; i++) {
      if (new Date(data.bars[i].date).getTime() >= userStartTs) { userStartIdx = i; break; }
    }
    const manualMode = (document.querySelector('input[name="bt-mode"]:checked')||{}).value || 'auto';
    const buyUnit = (document.querySelector('input[name="bt-buyunit"]:checked')||{}).value || '35';
    const atkUpU = 3;
    const atkDnU = (buyUnit === '34') ? 4 : 5;
    const vRuleOn = !!(document.getElementById('bt-vrule')||{}).checked;
    // bt2 = 순수 스나이퍼. 부스트만 조절
    const boostAtk = parseFloat((document.getElementById('bt2-boost-atk')||{}).value || '1.0');
    const boostDef = parseFloat((document.getElementById('bt2-boost-def')||{}).value || '1.0');
    const opts = { boostAtk, boostDef };
    const vLabel = vRuleOn ? ' · ⚡ V자' : '';
    const boostLabel = (boostAtk>1||boostDef>1) ? ` · 부스트공${boostAtk}/방${boostDef}` : '';
    const modeLabel = manualMode==='attack'?'🟢 공격 고정':(manualMode==='defense'?'🔵 방어 고정':'🤖 자동 모드전환');
    progressEl.innerHTML = '🎯 스나이퍼 백테 중... ('+modeLabel+boostLabel+vLabel+')';
    const result = simulateNewSystem(data.bars, userStartIdx, manualMode, atkUpU, atkDnU, vRuleOn, opts);
    const userStartPrice = data.bars[userStartIdx].close;
    const userEndPrice   = data.bars[data.bars.length - 1].close;
    const buyHoldMult = userEndPrice / userStartPrice;
    const vsHold = result.mult / buyHoldMult;
    // 단순 보유 MDD 계산
    let bhPeak = userStartPrice, bhMdd = 0;
    for (let i = userStartIdx; i < data.bars.length; i++) {
      const p = data.bars[i].close;
      if (p > bhPeak) bhPeak = p;
      const dd = (p - bhPeak) / bhPeak;
      if (dd < bhMdd) bhMdd = dd;
    }

    // 사이클 수익률 분포
    const dist = [
      { label: '+10% 이상 🌟', min: 10, max: 999, color: '#0f0' },
      { label: '+5%~+10%', min: 5, max: 10, color: '#0d8' },
      { label: '+3%~+5%', min: 3, max: 5, color: '#0c6' },
      { label: '+1%~+3%', min: 1, max: 3, color: '#0a4' },
      { label: '0%~+1%', min: 0, max: 1, color: '#066' },
      { label: '-3%~0%', min: -3, max: 0, color: '#a44' },
      { label: '-5%~-3%', min: -5, max: -3, color: '#c33' },
      { label: '-5% 이하 💀', min: -999, max: -5, color: '#f00' }
    ];
    const completed = result.completedCycles;
    const maxCnt = Math.max(...dist.map(d => completed.filter(c => c.pnl >= d.min && c.pnl < d.max).length), 1);
    let distHtml = '';
    dist.forEach(d => {
      const cnt = completed.filter(c => c.pnl >= d.min && c.pnl < d.max).length;
      const pct = completed.length > 0 ? cnt / completed.length * 100 : 0;
      const barW = cnt / maxCnt * 100;
      distHtml += '<div class="cycle-dist-row"><div class="dist-label">' + d.label + '</div><div class="dist-bar"><div class="dist-fill" style="width:' + barW + '%;background:' + d.color + '"></div></div><div class="dist-cnt">' + cnt + '회 (' + pct.toFixed(1) + '%)</div></div>';
    });

    // 유닛 분포
    const unitBuckets = [
      { label: '2u', min: 2, max: 2, color: '#22c55e' },
      { label: '3-4u', min: 3, max: 4, color: '#3b82f6' },
      { label: '5-6u', min: 5, max: 6, color: '#a78bfa' },
      { label: '7-8u', min: 7, max: 8, color: '#f59e0b' },
      { label: '9-12u', min: 9, max: 12, color: '#f97316' },
      { label: '13-16u', min: 13, max: 16, color: '#ef4444' },
      { label: '17-20u', min: 17, max: 20, color: '#dc2626' }
    ];
    const maxUnitCnt = Math.max(...unitBuckets.map(b => completed.filter(c => c.maxUnits >= b.min && c.maxUnits <= b.max).length), 1);
    let unitHtml = '';
    unitBuckets.forEach(b => {
      const cnt = completed.filter(c => c.maxUnits >= b.min && c.maxUnits <= b.max).length;
      if (cnt === 0) return;
      const pct = completed.length > 0 ? cnt / completed.length * 100 : 0;
      const barW = cnt / maxUnitCnt * 100;
      unitHtml += '<div class="unit-row"><div class="ulbl">' + b.label + '</div><div class="ubar"><div class="ufill" style="width:' + barW + '%;background:' + b.color + '"></div></div><div class="ucnt">' + cnt + '회 (' + pct.toFixed(1) + '%)</div></div>';
    });

    let html = '<div class="card">';
    html += '<div class="ct">📈 ' + data.symbol + ' · ' + userStartDate + ' ~ ' + userEndDate + '</div>';
    html += '<div class="result-grid"><div class="result-box hold"><div class="rb-label">📌 단순 보유</div><div class="rb-value" style="color:' + (buyHoldMult>=1?'#0f0':'#f44') + '">' + (buyHoldMult>=1?'+':'') + ((buyHoldMult-1)*100).toFixed(1) + '%</div><div class="rb-pct">' + buyHoldMult.toFixed(2) + '배</div><div class="rb-pct" style="color:#f44;font-size:11px;margin-top:4px">MDD ' + (bhMdd*100).toFixed(1) + '%</div></div><div class="result-box hunter"><div class="rb-label">🏹 HUNTER</div><div class="rb-value">+' + ((result.mult-1)*100).toFixed(1) + '%</div><div class="rb-pct">' + result.mult.toFixed(2) + '배</div><div class="rb-pct" style="color:#0f0;font-size:11px;margin-top:4px">MDD ' + result.mdd.toFixed(1) + '%</div></div></div>';
    html += '<div class="metric-row"><span class="metric-label">HUNTER 추가 수익</span><span class="metric-value" style="color:' + (vsHold>1?'#0f0':'#f44') + ';font-size:16px">' + (vsHold>1?'+':'') + ((result.mult - buyHoldMult) * 100).toFixed(1) + '%p ' + (vsHold>1?'🚀':'📉') + '</span></div>';
    html += '<div class="metric-row"><span class="metric-label">vs 단순보유 배율</span><span class="metric-value" style="color:' + (vsHold>1?'#0f0':'#f44') + '">' + vsHold.toFixed(2) + '배</span></div>';
    html += '<div class="metric-row"><span class="metric-label">최대 낙폭 (MDD)</span><span class="metric-value" style="color:#f88">' + result.mdd.toFixed(1) + '%</span></div>';
    html += '<div class="metric-row"><span class="metric-label">매수 / 매도</span><span class="metric-value">' + result.nBuys + '회 / ' + result.nSells + '회</span></div>';
    html += '<div class="metric-row"><span class="metric-label">티어 승률 (참고)</span><span class="metric-value" style="color:#aaa">' + result.tierWinRate.toFixed(0) + '%</span></div>';
    html += '<div class="metric-row"><span class="metric-label">🟢 공격모드 비중</span><span class="metric-value" style="color:#22c55e">' + result.atkPct.toFixed(1) + '% (' + result.atkDays + '일)</span></div>';
    html += '<div class="metric-row"><span class="metric-label">🟢 공격 동안 수익률</span><span class="metric-value" style="color:' + (result.atkReturn>=0?'#22c55e':'#f44') + '">' + (result.atkReturn>=0?'+':'') + result.atkReturn.toFixed(1) + '%</span></div>';
    html += '<div class="metric-row"><span class="metric-label">🔵 방어모드 비중</span><span class="metric-value" style="color:#3b82f6">' + result.defPct.toFixed(1) + '% (' + result.defDays + '일)</span></div>';
    html += '<div class="metric-row"><span class="metric-label">🔵 방어 동안 수익률</span><span class="metric-value" style="color:' + (result.defReturn>=0?'#3b82f6':'#f44') + '">' + (result.defReturn>=0?'+':'') + result.defReturn.toFixed(1) + '%</span></div>';

    // 시간축 누적 수익률 곡선 (공격=초록, 방어=파랑)
    if (result.equityCurve && result.equityCurve.length > 1) {
      const ec = result.equityCurve;
      const seed0 = 100000;
      const W = 340, H = 160, padL = 8, padR = 8, padT = 10, padB = 18;
      const rets = ec.map(p => (p.value / seed0 - 1) * 100);
      // 주가 변화율(시작일 대비 %) — 헌터 수익률과 같은 축에서 비교
      const price0 = ec[0].price;
      const priceRets = ec.map(p => (p.price / price0 - 1) * 100);
      let minR = Math.min(...rets, ...priceRets, 0), maxR = Math.max(...rets, ...priceRets, 0);
      if (maxR === minR) maxR = minR + 1;
      const xOf = idx => padL + idx / (ec.length - 1) * (W - padL - padR);
      const yOf = r => padT + (maxR - r) / (maxR - minR) * (H - padT - padB);
      // 0% 기준선
      const yZero = yOf(0);
      // 주가 라인(회색, 배경) — 먼저 그려서 헌터 곡선이 위에 오게
      let pricePath = 'M' + xOf(0).toFixed(1) + ',' + yOf(priceRets[0]).toFixed(1);
      for (let k = 1; k < ec.length; k++) pricePath += ' L' + xOf(k).toFixed(1) + ',' + yOf(priceRets[k]).toFixed(1);
      // 구간별 색칠 선 (모드 바뀌면 path 끊어서 색 변경)
      let paths = '', curMode = null, d = '';
      for (let k = 0; k < ec.length; k++) {
        const x = xOf(k), y = yOf(rets[k]);
        if (ec[k].mode !== curMode) {
          if (d) { const col = curMode==='attack'?'#22c55e':'#3b82f6'; paths += '<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="2"/>'; }
          curMode = ec[k].mode;
          d = 'M' + x.toFixed(1) + ',' + y.toFixed(1);
          if (k>0){ const px=xOf(k-1),py=yOf(rets[k-1]); d='M'+px.toFixed(1)+','+py.toFixed(1)+' L'+x.toFixed(1)+','+y.toFixed(1); }
        } else {
          d += ' L' + x.toFixed(1) + ',' + y.toFixed(1);
        }
      }
      if (d) { const col = curMode==='attack'?'#22c55e':'#3b82f6'; paths += '<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="2"/>'; }
      // 연도 눈금
      let yearTicks = '';
      let lastY = '';
      ec.forEach((p, k) => {
        const y4 = p.date.slice(0,4);
        if (y4 !== lastY) { const x = xOf(k); yearTicks += '<line x1="'+x.toFixed(1)+'" y1="'+padT+'" x2="'+x.toFixed(1)+'" y2="'+(H-padB)+'" stroke="#333" stroke-width="0.5"/><text x="'+x.toFixed(1)+'" y="'+(H-5)+'" fill="#666" font-size="9" text-anchor="middle">'+y4+'</text>'; lastY = y4; }
      });
      const finalRet = rets[rets.length-1];
      const finalPriceRet = priceRets[priceRets.length-1];
      const svg = '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;background:#0a0a14;border-radius:8px">' +
        yearTicks +
        '<line x1="'+padL+'" y1="'+yZero.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+yZero.toFixed(1)+'" stroke="#555" stroke-width="0.8" stroke-dasharray="3,3"/>' +
        '<text x="'+(padL+2)+'" y="'+(yZero-3).toFixed(1)+'" fill="#888" font-size="9">0%</text>' +
        '<path d="'+pricePath+'" fill="none" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="2,2" opacity="0.7"/>' +
        paths +
        '<text x="'+(W-padR)+'" y="'+(padT+8)+'" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="end">헌터 +'+finalRet.toFixed(0)+'%</text>' +
        '<text x="'+(W-padR)+'" y="'+(padT+20)+'" fill="#9ca3af" font-size="9" text-anchor="end">주가 '+(finalPriceRet>=0?'+':'')+finalPriceRet.toFixed(0)+'%</text>' +
        '</svg>';
      html += '<div class="card" style="margin-top:14px"><div class="ct">📈 누적 수익률 곡선 (🟢공격 / 🔵방어 + 주가)</div>' + svg +
        '<div style="font-size:11px;color:#888;margin-top:6px;text-align:center">초록=공격 · 파랑=방어 · <span style="color:#9ca3af">회색점선=실제 주가</span> · 점선=0%(본전)</div></div>';
    }

    // 모드 타임라인 (언제부터 언제까지 공격/방어 + 구간 수익률)
    if (result.modeTimeline && result.modeTimeline.length > 0) {
      const tl = result.modeTimeline;
      const totalD = result.totalDays || 1;
      let barHtml = '<div style="display:flex;height:24px;border-radius:6px;overflow:hidden;margin:10px 0">';
      tl.forEach(s => {
        const w = s.days / totalD * 100;
        const c = s.mode === 'attack' ? '#22c55e' : '#3b82f6';
        barHtml += '<div style="width:' + w + '%;background:' + c + '"></div>';
      });
      barHtml += '</div>';
      let listHtml = '';
      tl.forEach(s => {
        const isAtk = s.mode === 'attack';
        const emoji = isAtk ? '🟢' : '🔵';
        const nm = isAtk ? '공격' : '방어';
        const col = isAtk ? '#22c55e' : '#3b82f6';
        const segRet = (s.startCap > 0) ? (s.endCap / s.startCap - 1) * 100 : 0;
        const retCol = segRet >= 0 ? '#22c55e' : '#f44';
        listHtml += '<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-bottom:1px solid #222;font-size:12px">' +
          '<span style="color:' + col + ';font-weight:700;width:48px">' + emoji + ' ' + nm + '</span>' +
          '<span style="color:#bbb;font-family:monospace;flex:1;text-align:center">' + s.startDate + ' ~ ' + s.endDate + '</span>' +
          '<span style="color:#888;width:46px;text-align:right">' + s.days + '일</span>' +
          '<span style="color:' + retCol + ';width:62px;text-align:right;font-weight:700">' + (segRet>=0?'+':'') + segRet.toFixed(1) + '%</span>' +
          '</div>';
      });
      html += '<div class="card" style="margin-top:14px"><div class="ct">📅 모드 타임라인 (공격/방어 구간) · 총 ' + tl.length + '개 구간</div>' +
        barHtml + '<div style="max-height:280px;overflow-y:auto;margin-top:8px">' + listHtml + '</div></div>';
    }

    // 연도별
    const snapshots = result.periodSnapshots || {};
    const yearKeys = Object.keys(snapshots).filter(k => k.length === 4).sort();
    if (yearKeys.length > 0) {
      let yearHtml = '<div class="card"><div class="ct">📊 연도별 수익률 + MDD (사이클 기준) · 행 클릭 시 월별 펼침</div>';
      yearHtml += '<table style="width:100%;border-collapse:collapse;font-family:monospace;font-size:14px">';
      yearHtml += '<thead><tr style="border-bottom:2px solid #444"><th style="padding:10px 8px;text-align:left;color:#888;font-size:12px">년도</th><th style="padding:10px 8px;text-align:right;color:#fbbf24;font-size:12px">수익률</th><th style="padding:10px 8px;text-align:right;color:#888;font-size:12px">MDD</th></tr></thead><tbody>';
      for (const yKey of yearKeys) {
        const snap = snapshots[yKey];
        const yearReturn = snap.startCap > 0 ? ((snap.endCap - snap.startCap) / snap.startCap * 100) : 0;
        const yearMdd = snap.mdd || 0;
        const returnCls = yearReturn >= 0 ? '#22c55e' : '#ef4444';
        yearHtml += '<tr style="border-bottom:1px solid #222;cursor:pointer" onclick="toggleYearMonths(\'' + yKey + '\')">';
        yearHtml += '<td style="padding:12px 8px;color:#fff;font-weight:700">' + yKey + ' <span id="year-arrow-' + yKey + '" style="color:#666;font-size:11px">▼</span></td>';
        yearHtml += '<td style="padding:12px 8px;text-align:right;font-weight:800;color:' + returnCls + ';font-size:15px">' + (yearReturn >= 0 ? '+' : '') + yearReturn.toFixed(1) + '%</td>';
        yearHtml += '<td style="padding:12px 8px;text-align:right;color:#ef4444;font-size:13px">' + yearMdd.toFixed(1) + '%</td>';
        yearHtml += '</tr>';
        const monthKeys = Object.keys(snapshots).filter(k => k.length === 7 && k.startsWith(yKey)).sort();
        if (monthKeys.length > 0) {
          yearHtml += '<tr id="months-' + yKey + '" style="display:none"><td colspan="3" style="padding:0;background:#0a0a14"><div style="padding:10px"><table style="width:100%;border-collapse:collapse;font-family:monospace;font-size:13px">';
          yearHtml += '<thead><tr style="border-bottom:1px solid #333"><th style="padding:8px;text-align:left;color:#666;font-size:11px">월</th><th style="padding:8px;text-align:right;color:#888;font-size:11px">수익률</th><th style="padding:8px;text-align:right;color:#666;font-size:11px">MDD</th></tr></thead><tbody>';
          for (const mKey of monthKeys) {
            const mSnap = snapshots[mKey];
            const mReturn = mSnap.startCap > 0 ? ((mSnap.endCap - mSnap.startCap) / mSnap.startCap * 100) : 0;
            const mMdd = mSnap.mdd || 0;
            const mCls = mReturn >= 0 ? '#22c55e' : '#ef4444';
            const monthOnly = mKey.slice(5);
            yearHtml += '<tr style="border-bottom:1px solid #1a1a1a"><td style="padding:8px;color:#aaa">' + monthOnly + '월</td><td style="padding:8px;text-align:right;color:' + mCls + ';font-weight:700">' + (mReturn >= 0 ? '+' : '') + mReturn.toFixed(1) + '%</td><td style="padding:8px;text-align:right;color:#ef4444">' + mMdd.toFixed(1) + '%</td></tr>';
          }
          yearHtml += '</tbody></table></div></td></tr>';
        }
      }
      yearHtml += '</tbody></table></div>';
      html += yearHtml;
    }

    // 사이클 분석
    html += '<div class="cycle-card">';
    html += '<div class="cs-title">🏆 사이클 분석 (0u → 매수 → ... → 0u 복귀)</div>';
    html += '<div class="cycle-main"><div class="cycle-big"><div class="lbl">🎯 사이클 승률</div><div class="big" style="color:' + (result.cycleWinRate>=80?'#0f0':result.cycleWinRate>=60?'#fbbf24':'#f88') + '">' + result.cycleWinRate.toFixed(1) + '%</div><div class="sub">' + result.cycleWins + '승 : ' + result.cycleLosses + '패</div></div><div class="cycle-big"><div class="lbl">📊 총 사이클</div><div class="big" style="color:#fbbf24">' + result.cycleTotal + '<span style="font-size:14px;color:#aaa">회</span></div><div class="sub">' + (result.incompleteCount > 0 ? '진행중 ' + result.incompleteCount + '회 포함' : '모두 완료') + '</div></div></div>';
    html += '<div class="cycle-grid"><div class="cycle-mini"><div class="lbl">평균 수익</div><div class="val" style="color:' + (result.avgCyclePnl>=0?'#0f0':'#f88') + '">' + (result.avgCyclePnl>=0?'+':'') + result.avgCyclePnl.toFixed(2) + '%</div></div><div class="cycle-mini"><div class="lbl">평균 기간</div><div class="val">' + result.avgCycleDuration.toFixed(1) + '일</div></div><div class="cycle-mini"><div class="lbl">중앙값 기간</div><div class="val">' + result.medianCycleDuration + '일</div></div></div>';

    if (result.bestCycle && result.worstCycle) {
      html += '<div class="best-worst"><div class="bw-card best"><div style="color:#0f0;font-weight:700">🌟 최고 사이클</div><div class="bw-pnl" style="color:' + (result.bestCycle.pnl>=0?'#0f0':'#f88') + ' !important">' + (result.bestCycle.pnl>=0?'+':'') + result.bestCycle.pnl.toFixed(2) + '%</div><div class="bw-date">' + result.bestCycle.startDate + '<br>→ ' + result.bestCycle.endDate + '<br>(' + result.bestCycle.duration + '일, max ' + result.bestCycle.maxUnits + 'u)</div></div><div class="bw-card worst"><div style="color:#f88;font-weight:700">💀 최악 사이클</div><div class="bw-pnl" style="color:' + (result.worstCycle.pnl>=0?'#0f0':'#f88') + ' !important">' + (result.worstCycle.pnl>=0?'+':'') + result.worstCycle.pnl.toFixed(2) + '%</div><div class="bw-date">' + result.worstCycle.startDate + '<br>→ ' + result.worstCycle.endDate + '<br>(' + result.worstCycle.duration + '일, max ' + result.worstCycle.maxUnits + 'u)</div></div></div>';
    }

    html += '<div class="cycle-distribution"><div style="font-size:12px;font-weight:700;color:#fbbf24;margin-bottom:6px">📊 사이클 수익률 분포</div>' + distHtml + '</div>';

    if (unitHtml) {
      html += '<div class="unit-stats"><div class="unit-stats-title">🎯 사이클 최대 유닛 분포 (얼마나 진입했나)</div>' + unitHtml;
      const allMax = completed.map(c => c.maxUnits).filter(u => u > 0);
      if (allMax.length > 0) {
        const avgMax = allMax.reduce((s,u) => s+u, 0) / allMax.length;
        const sortedMax = [...allMax].sort((a,b) => a-b);
        const medMax = sortedMax[Math.floor(sortedMax.length/2)];
        html += '<div style="margin-top:8px;font-size:11px;color:#aaa;text-align:center">평균 ' + avgMax.toFixed(1) + 'u · 중앙값 ' + medMax + 'u</div>';
        html += '<div style="margin-top:6px;font-size:10px;color:#888;line-height:1.5">💡 2-4u 多 = 건강한 변동 / 12-20u 多 = 폭락 시장 / 2u 만 多 = 단방향 (HUNTER 한계)</div>';
      }
      html += '</div>';
    }

    html += '';
    html += '</div>';
    html += '</div>';

    resultEl.innerHTML = html;
    progressEl.innerHTML = '✅ 완료!';
  } catch (e) {
    progressEl.innerHTML = '❌ ' + e.message;
    console.error(e);
  }
}

</script>

</body>
</html>
