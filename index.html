<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HUNTER v14 매매일지</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#08080a;--card:#111118;--card2:#1a1a1f;--border:#222233;--accent:#3b82f6;--green:#22c55e;--red:#ef4444;--text:#f0f0f0;--dim:#666;--radius:16px;--top:#a78bfa;--mid:#3b82f6;--bot:#22c55e;--gold:#fbbf24}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;padding:12px;max-width:600px;margin:0 auto}
.hdr{text-align:center;padding:16px 0 10px}
.hdr h1{font-family:'Bebas Neue',sans-serif;font-size:34px;letter-spacing:3px;color:#fff}
.hdr h1 span{color:var(--accent)}
.hdr .stats{font-family:'JetBrains Mono',monospace;font-size:12px;margin-top:6px;color:var(--green);letter-spacing:1px;font-weight:700}
.tickers-bar{display:flex;gap:8px;overflow-x:auto;padding:8px 10px;background:var(--card2);border:1px solid var(--border);border-radius:12px;margin-bottom:12px;-webkit-overflow-scrolling:touch}
.tickers-bar::-webkit-scrollbar{display:none}
.ticker-card{min-width:90px;padding:10px 12px;background:#2a2a3e;border-radius:10px;text-align:center;cursor:pointer;flex-shrink:0;user-select:none;position:relative}
.ticker-card.active{background:linear-gradient(135deg,#667eea,#764ba2)}
.tc-sym{font-weight:700;font-size:15px;color:#fff}
.tc-price{font-size:14px;color:#ffd;margin-top:3px;font-family:'JetBrains Mono',monospace;font-weight:700}
.tc-info{font-size:11px;color:#aaa;margin-top:2px}
.tc-del{position:absolute;top:3px;left:4px;width:16px;height:16px;background:rgba(239,68,68,0.85);color:#fff;border:none;border-radius:50%;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;opacity:0}
.ticker-card:hover .tc-del,.ticker-card.active .tc-del{opacity:1}
.ticker-add{min-width:46px;padding:8px;background:#2a2a3e;border:1px dashed #555;border-radius:10px;text-align:center;cursor:pointer;font-size:24px;color:#888;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.zone-bar{display:flex;gap:6px;margin-bottom:12px}
.zone-box{flex:1;padding:12px 6px;border-radius:10px;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;text-align:center;border:2px solid var(--border);background:var(--card);color:var(--dim);letter-spacing:1px}
.zone-box.on-top{border-color:var(--top);color:var(--top);box-shadow:0 0 20px rgba(167,139,250,0.4)}
.zone-box.on-mid{border-color:var(--mid);color:var(--mid);box-shadow:0 0 20px rgba(59,130,246,0.4)}
.zone-box.on-bot{border-color:var(--bot);color:var(--bot);box-shadow:0 0 20px rgba(34,197,94,0.4)}
.zone-box .pct{font-size:15px;margin-top:4px;font-weight:800}
.zone-box .rule{font-size:11px;margin-top:4px;opacity:0.8}
.tabs{display:flex;gap:3px;margin-bottom:12px;background:var(--card);border-radius:10px;padding:4px;border:1px solid var(--border)}
.tab{flex:1;padding:11px;border:none;border-radius:8px;background:none;color:var(--dim);font-size:14px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif}
.tab.on{background:var(--accent);color:#fff}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px}
.ct{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--dim);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:12px;font-weight:700}
.ir{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ir label{font-size:14px;color:var(--dim);width:90px;font-weight:600}
.ir input,.ir select{flex:1;background:#0a0a0f;border:1px solid var(--border);border-radius:8px;padding:11px 14px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:700;text-align:right;outline:none;-webkit-appearance:none}
.ir input:focus{border-color:var(--accent)}
.ir .u{font-size:14px;color:var(--dim);width:16px;font-weight:700}
.btn{width:100%;padding:14px;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;margin-top:6px;font-family:'DM Sans',sans-serif}
.btn:active{transform:scale(0.97)}
.btn-b{background:var(--accent);color:#fff}
.btn-s{background:var(--red);color:#fff}
.btn-d{background:var(--card2);color:var(--dim);border:1px solid var(--border)}
.btn-r{background:#1a0a0a;color:var(--red);border:1px solid var(--red)}
.btn-g{background:#0a1a0a;color:var(--green);border:1px solid var(--green);font-size:13px;padding:11px}
.btn-fetch{background:#1a1a2a;color:var(--accent);border:1px solid var(--accent);font-size:14px;padding:12px}
.btn-gold{background:linear-gradient(135deg,#fbbf24,#f97316);color:#000;font-weight:800;font-size:15px;padding:14px}
.diary-table{width:100%;border-collapse:collapse;font-size:13px;font-family:'JetBrains Mono',monospace}
.diary-table th{background:var(--card2);color:var(--dim);font-size:11px;font-weight:700;padding:10px 5px;text-align:center;letter-spacing:0.5px;border-bottom:1px solid var(--border)}
.diary-table td{padding:10px 5px;text-align:center;border-bottom:1px solid var(--border);color:var(--text);font-weight:600}
.diary-table tr:hover{background:#0a0a14}
.diary-table tr.today{background:rgba(59,130,246,0.08)}
.diary-table tr.today td{color:var(--accent);font-weight:800}
.diary-table tr.refday{opacity:0.5}
.diary-table tr.refday td{color:var(--dim)}
.cell-up{color:var(--green)}
.cell-dn{color:var(--red)}
.cell-2u{color:#4ade80;font-weight:800;background:rgba(34,197,94,0.18);border-radius:6px;padding:4px 8px;display:inline-block}
.cell-4u{color:#f87171;font-weight:800;background:rgba(239,68,68,0.18);border-radius:6px;padding:4px 8px;display:inline-block}
.cell-zone-top{color:var(--top)}
.cell-zone-mid{color:var(--mid)}
.cell-zone-bot{color:var(--bot)}
.ref-badge{font-size:9px;background:rgba(102,102,102,0.3);color:var(--dim);padding:2px 5px;border-radius:4px;font-weight:700;letter-spacing:0.3px;display:inline-block;margin-left:4px}
.ref-banner{background:#0a0a14;border-left:3px solid var(--gold);padding:10px 12px;border-radius:6px;margin-bottom:10px;font-size:13px;color:var(--text)}
.ref-banner b{color:var(--gold);font-family:'JetBrains Mono',monospace;font-size:15px}
.ref-banner small{color:var(--dim);font-size:11px;margin-left:6px}
.order-table{width:100%;border-collapse:collapse;font-size:14px;font-family:'JetBrains Mono',monospace;margin-top:6px}
.order-table th{background:#0a0a1a;color:var(--accent);font-size:12px;padding:12px 6px;text-align:center;border-bottom:1px solid var(--accent)}
.order-table td{padding:12px 6px;text-align:center;border-bottom:1px solid var(--border);color:var(--text);font-weight:700}
.order-table tr.buy-row{background:rgba(34,197,94,0.04)}
.order-table tr.sell-row{background:rgba(167,139,250,0.04)}
.order-table .act-buy{color:var(--green);font-weight:800}
.order-table .act-sell{color:var(--top);font-weight:800}
.order-table .price-cell{font-size:16px;font-weight:800}
.tier-table{width:100%;border-collapse:collapse;font-size:13px;font-family:'JetBrains Mono',monospace}
.tier-table th{background:var(--card2);color:var(--dim);font-size:11px;padding:10px 5px;text-align:center;letter-spacing:0.5px;border-bottom:1px solid var(--border)}
.tier-table td{padding:10px 5px;text-align:center;border-bottom:1px solid var(--border);font-weight:600}
.tier-table tr.empty{opacity:0.3}
.tier-table .pnl-up{color:var(--green);font-weight:700}
.tier-table .pnl-dn{color:var(--red);font-weight:700}
.start-box{background:linear-gradient(135deg,#0a0a1f,#0f0a1a);border:2px solid var(--accent);border-radius:12px;padding:16px;margin-bottom:12px}
.start-box .title{font-size:13px;color:var(--accent);font-weight:700;margin-bottom:10px;letter-spacing:1px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.8);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal{background:var(--card);border:1px solid var(--accent);border-radius:14px;padding:18px;max-width:400px;width:100%;max-height:85vh;overflow-y:auto}
.modal h3{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;color:var(--accent);margin-bottom:12px}
.modal .desc{color:var(--dim);font-size:14px;margin-bottom:14px;line-height:1.6}
.modal .btn-row{display:flex;gap:8px;margin-top:14px}
.modal .btn-row .btn{margin-top:0}
.warn{background:#1a0a0a;border:1px solid var(--red);border-radius:10px;padding:14px;color:var(--red);font-weight:700;text-align:center;font-size:14px}
.danger-zone{background:#1a0a0a;border:2px dashed var(--red);border-radius:10px;padding:14px;margin-top:10px}
.danger-zone .title{color:var(--red);font-size:12px;font-weight:700;letter-spacing:1px;margin-bottom:8px}
.sb-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:14px}
.sb-row .k{color:var(--dim)}
.sb-row .v{font-family:'JetBrains Mono',monospace;font-weight:700}
.note{background:#0a0a14;border-radius:8px;padding:12px;font-size:13px;color:var(--dim);line-height:1.7;margin-top:8px}
.btn-edit{background:rgba(34,197,94,0.15);color:var(--green);border:1px solid var(--green);border-radius:6px;padding:5px 10px;font-size:11px;font-weight:700;cursor:pointer}
.btn-edit:hover{background:rgba(34,197,94,0.25)}
.idx-mode-btn{padding:9px 8px;border:2px solid var(--border);border-radius:10px;text-align:center;font-size:13px;font-weight:700;color:var(--dim);background:var(--card);transition:all .15s;letter-spacing:0.3px}
label input[name="idx-buyunit"]:checked + .idx-mode-btn{border-color:#00d8ff;background:#00b4d8;color:#fff;box-shadow:0 0 14px rgba(0,180,216,0.5)}
</style>

<body>
<div class="hdr">
  <h1>🏹 <span>HUNTER</span></h1>
  <div class="tickers-bar" id="tickers-bar"></div>
  <div class="stats" id="us-status">매일 자동 기록 · 다음날 LOC 자동 계산</div>
  <a href="routine.html" style="display:inline-block;margin-top:10px;padding:8px 18px;background:linear-gradient(135deg,#a78bfa,#ec4899);color:#fff;text-decoration:none;border-radius:20px;font-size:13px;font-weight:700;font-family:'DM Sans',sans-serif">🔥 오늘의 루틴 →</a>
</div>
<div class="zone-bar">
  <div class="zone-box" id="zbox-top">천장<div class="pct">+2.5% / 7일</div><div class="rule">-12% 이내</div></div>
  <div class="zone-box" id="zbox-mid">중간<div class="pct">+0.5% / 7일</div><div class="rule">-12~-20%</div></div>
  <div class="zone-box" id="zbox-bot">바닥<div class="pct">+3% / 10일</div><div class="rule">-20% 이상</div></div>
</div>
<div class="tabs">
  <button class="tab on" id="tab-d" onclick="sw('d')">📋 주문</button>
  <button class="tab" id="tab-t" onclick="sw('t')">📦 보유</button>
  <button class="tab" id="tab-s" onclick="sw('s')">⚙️ 설정</button>
  <button class="tab" id="tab-h" onclick="sw('h')">📜 기록</button>
</div>
<div id="body"></div>
<a href="/bt.html" style="display:block;background:linear-gradient(135deg,#f97316,#ef4444);color:#fff;text-decoration:none;text-align:center;padding:14px;border-radius:12px;font-weight:700;font-size:15px;margin-top:14px;box-shadow:0 4px 16px rgba(249,115,22,0.3)">📊 백테스트 페이지로!</a>
<a href="/screener.html" style="display:block;background:linear-gradient(135deg,#00b4d8,#7c3aed);color:#fff;text-decoration:none;text-align:center;padding:14px;border-radius:12px;font-weight:700;font-size:15px;margin-top:10px;box-shadow:0 4px 16px rgba(124,58,237,0.3)">🔍 종목 스크리너로!</a>
<div style="text-align:center;font-family:'JetBrains Mono',monospace;font-size:10px;color:#333;margin-top:16px">HUNTER v14 매매일지 · 멀티종목 지원</div>
<div id="modal-container"></div>
<script>
const TU=20,UP=2,DN=4,TOP_TH=-12,BOT_TH=-20;
// NEW SYSTEM 유닛: 공격모드 상승3u/하락4u(기본) or 하락5u(공격적), 방어모드 점증 사다리 1·2·4·6·7u(상승 매수X)
let NS={atkUp:3,atkDn:4};
// V자 룰 ON/OFF (체크박스 토글)
let V_RULE_ENABLED = false;
// 매수 단위 토글 (3/4 디폴트 = 보수)
function setBuyUnit(mode){
  NS.atkDn = (mode === '34') ? 4 : 5;
  localStorage.setItem('huntermode_buyunit', mode);
  try { render(); } catch(e) { console.warn(e); }
}
// V자 룰 토글
function setVRule(on){
  V_RULE_ENABLED = !!on;
  localStorage.setItem('huntermode_vrule', on ? '1' : '0');
  try { render(); } catch(e) {}
}
// 페이지 로드 시 저장된 설정 복원 (NS / V자) - 토글은 매매일지 카드 안에서 렌더됨
(function(){
  const savedUnit = localStorage.getItem('huntermode_buyunit') || '34';
  NS.atkDn = (savedUnit === '34') ? 4 : 5;
  const savedVR = localStorage.getItem('huntermode_vrule') || '0';
  V_RULE_ENABLED = (savedVR === '1');
})();

// 이벤트 위임 - 동적 HTML 토글에도 무조건 작동 (모바일 호환)
document.addEventListener('click', function(e){
  const btn = e.target.closest('.idx-ubtn');
  if (btn && btn.dataset.val) {
    e.preventDefault();
    setBuyUnit(btn.dataset.val);
  }
}, false);
document.addEventListener('change', function(e){
  if (e.target.classList && e.target.classList.contains('idx-vrule-chk')) {
    setVRule(e.target.checked);
  }
}, false);
const DEF_TIERS=[1,2,4,6,7];  // 방어모드 점증 사다리: 한 단계씩 진행(매도로 빠져도 단계 유지)
// 현재 방어 포지션의 최고 진행단계 다음 단계 → 다음 방어 매수 유닛 (남은 한도 고려)
function defNextUnit(pos){
  const defs=(pos||[]).filter(pp=>pp.nsMode==='defense');
  const usedU=(pos||[]).reduce((s,pp)=>s+(pp.uu||0),0);
  // 방어 포지션이 비어있으면 사다리 처음(1u)부터, 아니면 보유 중 최고단계+1
  let step;
  if(defs.length===0){ step=0; }
  else { const maxTier=Math.max(...defs.map(pp=>(pp.tier!=null?pp.tier:0))); step=Math.min(maxTier+1,DEF_TIERS.length-1); }
  let u=DEF_TIERS[step];
  return Math.max(0,Math.min(u,20-usedU));
}
// 다음 방어 매수의 단계 인덱스 (포지션 기록용 tier)
function defNextTier(pos){
  const defs=(pos||[]).filter(pp=>pp.nsMode==='defense');
  if(defs.length===0) return 0;
  const maxTier=Math.max(...defs.map(pp=>(pp.tier!=null?pp.tier:0)));
  return Math.min(maxTier+1,DEF_TIERS.length-1);
}
const ZONES={top:{tp:0.025,fd:7,label:'천장'},mid:{tp:0.005,fd:7,label:'중간'},bot:{tp:0.030,fd:10,label:'바닥'}};
let tab='d';
let portfolios=JSON.parse(localStorage.getItem('v13-portfolios')||'null');
if(!portfolios){
  const v12=JSON.parse(localStorage.getItem('v12-portfolios')||'null');
  if(v12){
    portfolios={};
    for(const sym in v12){
      portfolios[sym]={seed:v12[sym].seed||100000,startDate:'',priceClose:v12[sym].priceClose||0,priceLive:v12[sym].priceLive||0,high20:v12[sym].high20||0,priceDate:v12[sym].priceDate||'',diary:[],pos:v12[sym].pos||[],hist:v12[sym].hist||[]};
    }
  }else{
    portfolios={SOXL:{seed:100000,startDate:'',priceClose:0,priceLive:0,high20:0,priceDate:'',diary:[],pos:[],hist:[]}};
  }
  localStorage.setItem('v13-portfolios',JSON.stringify(portfolios));
}
let activeSymbol=localStorage.getItem('v13-active')||'SOXL';
if(!portfolios[activeSymbol]){
  activeSymbol=Object.keys(portfolios)[0]||'SOXL';
  if(!portfolios[activeSymbol]){portfolios.SOXL={seed:100000,startDate:'',priceClose:0,priceLive:0,high20:0,priceDate:'',diary:[],pos:[],hist:[]};activeSymbol='SOXL';}
}
for(const sym in portfolios){
  const p=portfolios[sym];
  p.seed=Number(p.seed)||100000;p.startDate=p.startDate||'';p.priceClose=Number(p.priceClose)||0;p.priceLive=Number(p.priceLive)||0;p.high20=Number(p.high20)||0;p.priceDate=p.priceDate||'';
  p.diary=Array.isArray(p.diary)?p.diary:[];p.pos=Array.isArray(p.pos)?p.pos:[];p.hist=Array.isArray(p.hist)?p.hist:[];
  p.virtualWeight=Number(p.virtualWeight)||1.0;
  p.bossThreshold=Number(p.bossThreshold)||-20;
  p.bossBoost=p.bossBoost!==undefined?Number(p.bossBoost):1.0;
  if(p.hybrid&&(p.hybrid.ma50===undefined||p.hybrid.ma200===undefined))delete p.hybrid;
  if(!p.symbol)p.symbol=sym;
  if(p.label===undefined)p.label='';
}
const $=id=>document.getElementById(id);
const gv=id=>parseFloat($(id).value)||0;
const td=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const curPort=()=>portfolios[activeSymbol];
const getSym=()=>curPort().symbol||activeSymbol;
const getDisplay=(key)=>{const p=portfolios[key];if(!p)return key;return p.label?`${p.symbol} (${p.label})`:p.symbol;};
function getUSMarketStatus(){
  const now=new Date();
  const etStr=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',weekday:'short',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}).format(now);
  const parts=etStr.split(', ');
  const weekday=parts[0];const date=parts[1];const time=parts[2];
  const [h,m]=time.split(':').map(Number);
  const min=h*60+m;
  const isWeekday=!['Sat','Sun'].includes(weekday);
  let status,statusColor,emoji;
  if(!isWeekday){status='주말 휴장';statusColor='#666';emoji='💤';}
  else if(min<570){status='장 시작 전';statusColor='#fbbf24';emoji='⏳';}
  else if(min<960){status='본장 진행중';statusColor='#ef4444';emoji='🔴';}
  else{status='장 마감';statusColor='#22c55e';emoji='✅';}
  const wdMap={Mon:'월',Tue:'화',Wed:'수',Thu:'목',Fri:'금',Sat:'토',Sun:'일'};
  const wdKr=wdMap[weekday]||weekday;
  return '<div style="display:inline-flex;align-items:center;gap:6px;padding:5px 10px;background:#0a0a14;border:1px solid '+statusColor+';border-radius:6px;font-size:11px;font-family:\'JetBrains Mono\',monospace;font-weight:700;color:'+statusColor+';letter-spacing:0.5px">🇺🇸 '+date+' ('+wdKr+') · '+time+' ET · '+emoji+' '+status+'</div>';
}
const save=()=>{localStorage.setItem('v13-portfolios',JSON.stringify(portfolios));localStorage.setItem('v13-active',activeSymbol);};
const db=(a,b)=>{try{if(!a||!b)return 0;const d1=new Date(a),d2=new Date(b);if(isNaN(d1.getTime())||isNaN(d2.getTime()))return 0;let days=0,cur=new Date(d1);while(cur<d2){cur.setDate(cur.getDate()+1);if(cur.getDay()!==0&&cur.getDay()!==6)days++;}return days;}catch(e){return 0;}};
const addBd=(dateStr,n)=>{try{const d=new Date(dateStr);let added=0;while(added<n){d.setDate(d.getDate()+1);if(d.getDay()!==0&&d.getDay()!==6)added++;}return (d.getMonth()+1)+'/'+d.getDate();}catch(e){return '';}};
function getZoneFor(close,high20){if(!close||!high20)return 'top';const dd=(close-high20)/high20*100;if(dd>=TOP_TH)return 'top';if(dd<=BOT_TH)return 'bot';return 'mid';}
function getZone(){const p=curPort();return getZoneFor(p.priceClose,p.high20);}

// ── NEW SYSTEM: 주간 RSI 모드 계산 (공격/방어) ──
// bars(일봉) → 주(월요일 키)별 마지막 종가 → 주간 RSI(와일더14) → 직전 확정 주끼리 비교
function calcNewSystemMode(bars){
  if(!bars||bars.length<120)return{mode:'attack',wrsi:50,prevWrsi:50,ready:false};
  const weekClose={};const order=[];
  for(const b of bars){
    const d=new Date(b.date);const day=d.getDay();
    const mon=new Date(d);mon.setDate(d.getDate()-(day===0?6:day-1));
    const key=mon.toISOString().slice(0,10);
    if(weekClose[key]===undefined)order.push(key);
    weekClose[key]=b.close;
  }
  const wkeys=order.slice().sort();
  const wc=wkeys.map(k=>weekClose[k]);
  // 주간 RSI 전체 시계열 (와일더14)
  function rsiSeries(arr){
    const out=new Array(arr.length).fill(50);
    if(arr.length<16)return out;
    let ag=0,al=0;
    for(let i=1;i<=14;i++){const d=arr[i]-arr[i-1];if(d>0)ag+=d;else al-=d;}
    ag/=14;al/=14;
    out[14]=al===0?100:100-100/(1+ag/al);
    for(let i=15;i<arr.length;i++){const d=arr[i]-arr[i-1];if(d>0){ag=(ag*13+d)/14;al=(al*13)/14;}else{ag=(ag*13)/14;al=(al*13-d)/14;}out[i]=al===0?100:100-100/(1+ag/al);}
    return out;
  }
  const wrsi=rsiSeries(wc);
  // 직전 "확정된" 주 = 마지막 주가 진행중일 수 있으니 마지막 완성주 기준
  const lastIdx=wc.length-1;
  const lastRi=lastIdx-1;  // 직전 확정 주
  if(lastRi<15)return{mode:'attack',wrsi:50,prevWrsi:50,ready:false};
  // 관성 유지: 처음부터 순회하며 6개 조건에 걸릴 때만 전환, 아니면 이전 모드 유지
  let cur='attack';
  for(let ri=15;ri<=lastRi;ri++){
    const c2=wrsi[ri], p2=wrsi[ri-1], rising=c2>p2;
    if      (p2<50&&c2>=50)          cur='attack';
    else if (rising&&c2>=50&&c2<=60) cur='attack';
    else if (rising&&c2<35)          cur='attack';
    else if (p2>=50&&c2<50)          cur='defense';
    else if (!rising&&c2>=40&&c2<=50) cur='defense';
    else if (!rising&&c2>65)         cur='defense';
    // else: 이전 모드 유지 (관성)
  }
  let mode=cur;
  const c2=wrsi[lastRi], p2=wrsi[lastRi-1], rising=c2>p2;

  // V자 룰: 전년 SOXL -50%↓면 올해는 wRSI 방어 무시하고 공격 고정 (토글 ON일 때만)
  let vrule=false, prevYrRet=null;
  if (V_RULE_ENABLED) {
    const yrFirst={}, yrLast={};
    for(const b of bars){ const y=b.date.slice(0,4); if(yrFirst[y]===undefined)yrFirst[y]=b.close; yrLast[y]=b.close; }
    const curYr=bars[bars.length-1].date.slice(0,4);
    const py=(parseInt(curYr)-1).toString();
    if(yrFirst[py]!==undefined){ prevYrRet=(yrLast[py]/yrFirst[py]-1)*100; if(prevYrRet<=-50){ mode='attack'; vrule=true; } }
  }
  return{mode,wrsi:c2,prevWrsi:p2,rising,ready:true,vrule,prevYrRet};
}

// 비중조절 6단계 (V자 안전)
function calcMA(closes,period){
  if(closes.length<period)return 0;
  let sum=0;
  for(let i=closes.length-period;i<closes.length;i++)sum+=closes[i];
  return sum/period;
}
function recommendHybrid(closes){
  if(!closes||closes.length<200)return{weight:1.0,trendLabel:'데이터부족',ma50:0,ma200:0,trend:0,gap:0,bossMode:false,boost:0};
  const cl=closes[closes.length-1];
  const ma50=calcMA(closes,50);
  const ma200=calcMA(closes,200);
  const trend=(ma50-ma200)/ma200*100;
  const gap=(cl-ma200)/ma200*100;
  let weight,trendLabel;
  if(trend>5&&gap>0){weight=1.0;trendLabel='🟢 강세 강';}
  else if(trend>0){weight=0.9;trendLabel='🟢 강세 약';}
  else if(trend>-5){weight=0.6;trendLabel='🟡 중립';}
  else if(trend>-10){weight=0.4;trendLabel='🟠 약세';}
  else if(gap<-30){weight=0.5;trendLabel='🔵 바닥 역발상';}
  else{weight=0.3;trendLabel='🔴 폭락';}
  return{weight,trendLabel,ma50,ma200,trend,gap,bossMode:false,boost:0};
}

// 형님 룰 V4: 전월 -20% 이하면 이번달 HUNTER 100% + 부스터 +100%
function calcMonthlyReturns(bars){
  const monthly={};
  for(const b of bars){
    const m=b.date.substring(0,7);
    if(!monthly[m])monthly[m]={start:b.close,end:b.close};
    monthly[m].end=b.close;
  }
  const r={};
  for(const m in monthly)r[m]=(monthly[m].end/monthly[m].start-1)*100;
  return r;
}
function checkBossRule(bars,threshold){
  if(!bars||bars.length<25)return null;
  const monthly=calcMonthlyReturns(bars);
  const today=new Date();
  const curY=today.getFullYear();
  const curM=today.getMonth()+1;
  let prevY=curY,prevM=curM-1;
  if(prevM===0){prevY=curY-1;prevM=12;}
  const prevKey=prevY+'-'+String(prevM).padStart(2,'0');
  const prevRet=monthly[prevKey];
  if(prevRet===undefined)return{triggered:false,prevKey,prevRet:null,threshold};
  return{triggered:prevRet<threshold,prevKey,prevRet,threshold};
}
async function autoUpdateRsi(){
  const p=curPort();
  const btn=event.target;btn.disabled=true;btn.textContent='⏳ 가져오는 중...';
  try{
    const start=new Date();start.setDate(start.getDate()-300);
    const res=await fetch('/api/history?symbol='+getSym()+'&start='+start.toISOString().slice(0,10)+'&end='+td()+'&_='+Date.now(),{cache:'no-store'});
    const data=await res.json();
    if(data.error||!data.bars||data.bars.length<200){alert('200일+ 데이터 필요');return;}
    const closes=data.bars.map(b=>b.close);
    const hybrid=recommendHybrid(closes);
    p.hybrid=hybrid;
    p.bossRule=checkBossRule(data.bars,p.bossThreshold||-20);
    p.rsiUpdated=new Date().toISOString();
    if(confirm('⚙️ 비중조절 추천\n\n📊 '+hybrid.trendLabel+'\n   50MA: $'+hybrid.ma50.toFixed(2)+'\n   200MA: $'+hybrid.ma200.toFixed(2)+'\n   추세: '+(hybrid.trend>=0?'+':'')+hybrid.trend.toFixed(1)+'%\n   gap: '+(hybrid.gap>=0?'+':'')+hybrid.gap.toFixed(1)+'%\n\n🎯 비중: '+(hybrid.weight*100).toFixed(0)+'%\n\n바로 적용?')){
      p.virtualWeight=hybrid.weight;
    }
    save();render();
  }catch(e){alert('실패: '+e.message);}
  finally{if(btn){btn.disabled=false;btn.textContent='🔄 야후에서 자동 가져오기 + 적용';}}
}
function setVirtualWeight(w){curPort().virtualWeight=w;save();render();}
function setBossThreshold(th){
  const p=curPort();
  p.bossThreshold=th;
  // 임계값 변경 시 트리거 재계산
  if(p.diary&&p.diary.length>0){
    // monthlyReturns 재계산을 위해 일지 데이터 활용
    const monthly={};
    for(const d of p.diary){
      const m=d.date.substring(0,7);
      if(!monthly[m])monthly[m]={start:d.close,end:d.close};
      monthly[m].end=d.close;
    }
    const today=new Date();
    const curY=today.getFullYear();
    const curM=today.getMonth()+1;
    let prevY=curY,prevM=curM-1;
    if(prevM===0){prevY=curY-1;prevM=12;}
    const prevKey=prevY+'-'+String(prevM).padStart(2,'0');
    const md=monthly[prevKey];
    if(md){
      const prevRet=(md.end/md.start-1)*100;
      p.bossRule={triggered:prevRet<th,prevKey,prevRet,threshold:th};
    }
  }
  save();render();
}

function addSymbol(){
  const sym=prompt('종목 코드 (예: SOXL):');
  if(!sym)return;
  const code=sym.toUpperCase().trim();
  if(!code)return;
  const label=(prompt('라벨 (선택 - 같은 종목 여러 슬롯 구분용. 예: 공격 / 아윤 / 방어 / 비워두면 없음):')||'').trim();
  const key=label?`${code} (${label})`:code;
  if(portfolios[key]){alert(key+' 이미 있음');return;}
  portfolios[key]={seed:100000,startDate:'',priceClose:0,priceLive:0,high20:0,priceDate:'',diary:[],pos:[],hist:[],symbol:code,label:label};
  save();switchSymbol(key);
}
function removeSymbol(sym){if(Object.keys(portfolios).length<=1){alert('최소 1개 필요');return;}if(!confirm(getDisplay(sym)+' 삭제?'))return;delete portfolios[sym];save();if(sym===activeSymbol)activeSymbol=Object.keys(portfolios)[0];render();}
function renderTickers(){

async function buildDiary(){
  const p=curPort();
  if(!p.startDate){alert('시작일을 설정하세요');return;}
  try{
    const start=new Date(p.startDate);start.setDate(start.getDate()-300);
    const fmt=d=>d.toISOString().slice(0,10);
    const res=await fetch('/api/history?symbol='+getSym()+'&start='+fmt(start)+'&end='+td()+'&_='+Date.now(),{cache:'no-store'});
    if(!res.ok){alert('API 오류 '+res.status);return;}
    const text=await res.text();
    let data;try{data=JSON.parse(text);}catch(e){alert('API 응답 오류');return;}
    if(data.error){alert('실패: '+data.error);return;}
    if(!data.bars||data.bars.length<21){alert('데이터 부족');return;}
    const startTs=new Date(p.startDate).getTime();
    let refIdx=-1;
    let firstTradingIdx=-1;
    for(let i=0;i<data.bars.length;i++){
      const ts=new Date(data.bars[i].date).getTime();
      if(ts<startTs)refIdx=i;
      if(ts>=startTs&&firstTradingIdx<0)firstTradingIdx=i;
    }
    if(firstTradingIdx<0&&refIdx<0){alert('시작일 데이터 없음');return;}
    
    const diary=[];
    
    if(refIdx>=0){
      const bar=data.bars[refIdx];
      const prevBar=refIdx>0?data.bars[refIdx-1]:null;
      const start20=Math.max(0,refIdx-19);
      const last20=data.bars.slice(start20,refIdx+1);
      const high20=Math.max(...last20.map(b=>b.high));
      const vsPrev=prevBar?((bar.close-prevBar.close)/prevBar.close*100):0;
      const nextUnits=(prevBar&&bar.close<prevBar.close)?DN:UP;
      const zone=getZoneFor(bar.close,high20);
      diary.push({date:bar.date,close:+bar.close.toFixed(2),high20:+high20.toFixed(2),vsPrev:+vsPrev.toFixed(2),units:nextUnits,zone:zone,isRef:true});
    }
    
    if(firstTradingIdx>=0){
      for(let i=firstTradingIdx;i<data.bars.length;i++){
        const bar=data.bars[i];
        const prevBar=i>0?data.bars[i-1]:null;
        const start20=Math.max(0,i-19);
        const last20=data.bars.slice(start20,i+1);
        const high20=Math.max(...last20.map(b=>b.high));
        const vsPrev=prevBar?((bar.close-prevBar.close)/prevBar.close*100):0;
        const nextUnits=(prevBar&&bar.close<prevBar.close)?DN:UP;
        const zone=getZoneFor(bar.close,high20);
        diary.push({date:bar.date,close:+bar.close.toFixed(2),high20:+high20.toFixed(2),vsPrev:+vsPrev.toFixed(2),units:nextUnits,zone:zone,isRef:false});
      }
    }
    
    p.diary=diary;
    if(diary.length>0){const last=diary[diary.length-1];p.priceClose=last.close;p.high20=last.high20;p.priceDate=last.date;}
    
    // NEW SYSTEM 모드 계산 (주간 RSI 공격/방어)
    p.nsMode=calcNewSystemMode(data.bars);
    p.rsiUpdated=new Date().toISOString();
    
    save();render();
    
    const tradingDays=diary.filter(d=>!d.isRef);
    const refDay=diary.find(d=>d.isRef);
    let msg='✅ '+getDisplay(activeSymbol)+' 매매일지 생성!\n\n';
    if(refDay)msg+='📌 참조 데이터: '+refDay.date+' ($'+refDay.close+')\n';
    if(tradingDays.length>0){
      msg+='📅 거래일: '+tradingDays[0].date+' ~ '+tradingDays[tradingDays.length-1].date+'\n';
      msg+='📊 총 '+tradingDays.length+'거래일\n';
      msg+='💰 마지막 종가: $'+tradingDays[tradingDays.length-1].close;
    }else{
      msg+='⏳ 시작일 데이터 아직 없음\n';
      msg+='🛒 참조 데이터로 다음 거래일 LOC 주문표만 표시됩니다';
    }
    alert(msg);
  }catch(e){alert('실패: '+e.message);}
}

function updSeed(){const v=gv('seed-in');if(v>0)curPort().seed=v;save();render();}

function quickFillBuy(date,close,units,mode){
  const p=curPort();
  mode=mode||'attack';
  const diaryEntry=p.diary.find(d=>d.date===date);
  if(!diaryEntry)return alert('일지에 없는 날');
  if(diaryEntry.isRef){alert('참조 데이터는 체결할 수 없습니다 (시작일 전날)');return;}
  if(p.pos.find(pp=>pp.d===date)){if(!confirm(date+'에 이미 매수 기록 있음. 추가로 더 기록할까요?'))return;}
  const zone=diaryEntry.zone;
  const uw=p.seed/TU;
  const shares=Math.floor(units*uw/close);
  const modeLabel=mode==='attack'?'🟢 공격':'🔵 방어';
  showModal('<h3>📈 '+date+' 체결 기록 · '+modeLabel+'</h3><div class="desc">백테 기준: <b>$'+close+'</b> · '+units+'u<br>형님 실제 체결가가 다르면 수정하세요.<br><span style="color:var(--green)">매도점은 일지 종가 기준으로 고정됩니다 ($'+(close*(1+ZONES[zone].tp)).toFixed(2)+')</span></div><div class="ir"><label>매수 날짜</label><input type="date" id="qf-date" value="'+date+'"><span class="u">📅</span></div><div class="ir"><label>실제 체결가</label><input type="number" step="0.01" id="qf-price" value="'+close+'"><span class="u">$</span></div><div class="ir"><label>유닛</label><input type="number" id="qf-units" value="'+units+'" readonly style="background:#0a0a14;color:var(--accent)"><span class="u">u</span></div><div class="ir"><label>실제 주수</label><input type="number" id="qf-shares" value="'+shares+'"><span class="u">주</span></div><div class="note" style="margin-top:8px">💡 매도 LOC = <b style="color:var(--green)">$'+(close*(1+ZONES[zone].tp)).toFixed(2)+'</b> (일지 종가 기준 고정)<br>💡 형님이 다른 가격에 사도 매도점은 일지 기준 유지</div><div class="btn-row"><button class="btn btn-d" onclick="closeModal()">취소</button><button class="btn btn-b" onclick="confirmQuickFill(\''+date+'\','+close+',\''+zone+'\',\''+mode+'\')">체결 기록</button></div>');
}
function confirmQuickFill(diaryDate,diaryClose,zone,mode){
  const p=curPort();
  mode=mode||'attack';
  const actualPrice=parseFloat($('qf-price').value)||diaryClose;
  const actualShares=parseInt($('qf-shares').value);
  const actualDate=$('qf-date').value||diaryDate;
  const units=parseInt($('qf-units').value);
  if(!actualShares||actualShares<=0)return alert('주수 입력');
  if(!units)return alert('유닛 입력');
  const defTier=(mode==='defense')?defNextTier(p.pos):null;  // 방어 사다리 단계 기록
  p.pos.push({e:actualPrice,u:units,s:actualShares,d:actualDate,z:zone,diaryClose:diaryClose,diaryDate:diaryDate,nsMode:mode,tier:defTier});
  p.hist.push({a:'B',d:actualDate,e:actualPrice,u:units,s:actualShares,z:zone,diaryClose:diaryClose,diaryDate:diaryDate,nsMode:mode,tier:defTier});
  save();closeModal();
  const sellPoint=(diaryClose*(1+ZONES[zone].tp)).toFixed(2);
  alert('✅ T'+p.pos.length+' 체결 기록!\n\n매수: '+actualShares+'주 @ $'+actualPrice+'\n매도 LOC: $'+sellPoint+' (일지 기준 고정)');
  render();
}
function editFill(date){
  const p=curPort();
  const posIdx=p.pos.findIndex(pp=>pp.d===date);
  const histIdx=p.hist.findIndex(r=>r.a==='B'&&r.d===date);
  if(posIdx>=0){
    const pp=p.pos[posIdx];
    const sellPoint=((pp.diaryClose||pp.e)*(1+ZONES[pp.z].tp)).toFixed(2);
    showModal('<h3>✏️ '+date+' 체결 수정</h3><div class="desc">현재 기록: <b>'+pp.s+'주 @ $'+pp.e+'</b> ('+pp.u+'u, '+ZONES[pp.z].label+')<br><span style="color:var(--green)">매도점: $'+sellPoint+'</span></div><div class="ir"><label>매수 날짜</label><input type="date" id="ef-date" value="'+pp.d+'"><span class="u">📅</span></div><div class="ir"><label>실제 체결가</label><input type="number" step="0.01" id="ef-price" value="'+pp.e+'"><span class="u">$</span></div><div class="ir"><label>유닛</label><input type="number" id="ef-units" value="'+pp.u+'"><span class="u">u</span></div><div class="ir"><label>실제 주수</label><input type="number" id="ef-shares" value="'+pp.s+'"><span class="u">주</span></div><div class="note" style="margin-top:8px;color:var(--red)">⚠️ 삭제하면 보유에서도 사라집니다 (실수로 체결 누른 경우)</div><div class="btn-row"><button class="btn btn-d" onclick="closeModal()">취소</button><button class="btn btn-r" onclick="deleteFill(\''+date+'\','+posIdx+','+histIdx+')">🗑️ 삭제</button><button class="btn btn-b" onclick="saveEditFill('+posIdx+','+histIdx+')">저장</button></div>');
  }
  else if(histIdx>=0){
    const r=p.hist[histIdx];
    showModal('<h3>📜 '+date+' 매수 기록 (매도 완료)</h3><div class="desc">이미 매도된 매수 기록입니다.<br>매수: <b>'+r.s+'주 @ $'+r.e+'</b> ('+r.u+'u)<br><br>📜 기록 탭에서 매도 기록도 확인하세요.<br><br>⚠️ 매도된 기록은 수정 불가 (회계 보존)</div><div class="btn-row"><button class="btn btn-d" onclick="closeModal()">닫기</button></div>');
  }
}
function saveEditFill(posIdx,histIdx){
  const p=curPort();
  const newDate=$('ef-date').value;
  const newPrice=parseFloat($('ef-price').value);
  const newUnits=parseInt($('ef-units').value);
  const newShares=parseInt($('ef-shares').value);
  if(!newDate)return alert('날짜 입력');
  if(!newPrice||newPrice<=0)return alert('가격 입력');
  if(!newUnits||newUnits<=0)return alert('유닛 입력');
  if(!newShares||newShares<=0)return alert('주수 입력');
  if(posIdx>=0){
    p.pos[posIdx].d=newDate;
    p.pos[posIdx].e=newPrice;
    p.pos[posIdx].u=newUnits;
    p.pos[posIdx].s=newShares;
  }
  if(histIdx>=0){
    p.hist[histIdx].d=newDate;
    p.hist[histIdx].e=newPrice;
    p.hist[histIdx].u=newUnits;
    p.hist[histIdx].s=newShares;
  }
  save();closeModal();
  alert('✅ 수정 완료!\n'+newShares+'주 @ $'+newPrice);
  render();
}
function deleteFill(date,posIdx,histIdx){
  if(!confirm(date+' 체결 기록을 정말 삭제하시겠습니까?\n\n보유에서도 사라지고, 매수 기록도 삭제됩니다.'))return;
  const p=curPort();
  if(posIdx>=0)p.pos.splice(posIdx,1);
  if(histIdx>=0)p.hist.splice(histIdx,1);
  save();closeModal();
  alert('🗑️ 삭제 완료');
  render();
}
function toggleLivePrice(){window._showLivePrice=!window._showLivePrice;render();if(window._showLivePrice){setTimeout(()=>{const el=$('cp-live-quick');if(el)el.focus();},100);}}
function updPriceLiveQuick(){
  const v=gv('cp-live-quick');curPort().priceLive=v;save();
  const p=curPort();const livePrice=p.priceLive||p.priceClose||0;
  const sortedPos=[...p.pos].sort((a,b)=>a.d.localeCompare(b.d));
  document.querySelectorAll('.tier-table tbody tr').forEach((tr,idx)=>{
    const pp=sortedPos[idx];if(!pp||tr.classList.contains('empty'))return;
    const pnl=livePrice?((livePrice-pp.e)/pp.e*100).toFixed(2):0;
    const tds=tr.querySelectorAll('td');
    if(tds.length>=8){tds[7].textContent=(pnl>=0?'+':'')+pnl+'%';tds[7].className=pnl>=0?'pnl-up':'pnl-dn';}
  });
}
function openSellModal(){
  const p=curPort();
  if(p.pos.length===0)return alert('보유 티어 없음');
  let h='<h3>📉 매도할 티어 선택</h3>';
  const sortedWithIdx=p.pos.map((pp,origIdx)=>({pp,origIdx})).sort((a,b)=>a.pp.d.localeCompare(b.pp.d));
  sortedWithIdx.forEach((item,displayIdx)=>{
    const pp=item.pp;
    const origIdx=item.origIdx;
    const pz=ZONES[pp.z];
    const basePriceForSell=pp.diaryClose||pp.e;
    const sellP=(basePriceForSell*(1+pz.tp)).toFixed(2);
    h+='<button class="btn btn-d" onclick="promptSell('+origIdx+')" style="text-align:left;margin-top:6px"><b>T'+(displayIdx+1)+'</b> '+pp.s+'주 @ $'+pp.e+' ('+pp.u+'u, '+pz.label+') → 매도점 $'+sellP+'</button>';
  });
  h+='<div class="btn-row"><button class="btn btn-d" onclick="closeModal()">취소</button></div>';
  showModal(h);
}
function promptSell(idx){
  const p=curPort();const pp=p.pos[idx];const pz=ZONES[pp.z];
  const basePriceForSell=pp.diaryClose||pp.e;
  const defaultPrice=(basePriceForSell*(1+pz.tp)).toFixed(2);
  showModal('<h3>T'+(idx+1)+' 매도</h3><div class="desc">매수 $'+pp.e+' · '+pp.s+'주 · '+pz.label+' · '+pp.d+'<br>'+(pp.diaryClose?'일지 종가: $'+pp.diaryClose+' (매도점 기준)<br>':'')+'추천 매도가: <b style="color:var(--green)">$'+defaultPrice+'</b></div><div class="ir"><label>매도가</label><input type="number" step="0.01" id="sell-price" value="'+defaultPrice+'"><span class="u">$</span></div><div class="ir"><label>매도일</label><input type="date" id="sell-date" value="'+td()+'" min="'+pp.d+'"><span class="u">📅</span></div><div class="btn-row"><button class="btn btn-d" onclick="closeModal()">취소</button><button class="btn btn-s" onclick="doSell('+idx+')">매도!</button></div>');
}
function doSell(idx){
  const p=curPort();
  const sp=parseFloat($('sell-price').value);
  const sd=$('sell-date').value;
  if(!sp||sp<=0)return alert('매도가');
  if(!sd)return alert('매도일');
  if(sd>td())return alert('미래 X');
  const pp=p.pos[idx];
  if(sd<pp.d)return alert('매수일('+pp.d+') 이후');
  const pnl=(sp-pp.e)/pp.e*100;
  const realized=(sp-pp.e)*pp.s;
  p.hist.push({a:'S',d:sd,e:sp,u:pp.u,s:pp.s,z:pp.z,pnl:pnl,buyPrice:pp.e,realized:realized});
  p.pos.splice(idx,1);
  save();closeModal();
  if(p.pos.length===0){
    const allSells=p.hist.filter(r=>r.a==='S'&&r.realized!==undefined);
    const cumulativeRealized=allSells.reduce((sum,r)=>sum+(r.realized||0),0);
    const newSeed=p.seed+cumulativeRealized;
    setTimeout(()=>{
      showModal('<h3>🎉 사이클 완료!</h3><div class="desc">모든 티어 매도 완료! 보유 0u<br><br>💰 이번 매도 수익: <b style="color:var(--green)">+$'+realized.toFixed(0)+' (+'+pnl.toFixed(1)+'%)</b><br>📊 누적 매도 수익: <b style="color:var(--green)">+$'+cumulativeRealized.toFixed(0)+'</b><br><br><div style="background:#0a1a0a;padding:12px;border-radius:8px;border:1px solid var(--green);margin-top:8px"><div style="font-size:11px;color:var(--dim)">현재 시드</div><div style="font-size:18px;font-weight:800">$'+p.seed.toLocaleString()+'</div><div style="font-size:11px;color:var(--dim);margin-top:8px">새 시드 (복리 반영)</div><div style="font-size:20px;font-weight:800;color:var(--green)">$'+newSeed.toFixed(0)+'</div></div></div><div class="btn-row"><button class="btn btn-d" onclick="closeModal()">나중에</button><button class="btn btn-b" onclick="applyCycleSeed('+newSeed+')">✅ 시드 업데이트!</button></div>');
    },200);
  }else{
    alert('T'+(idx+1)+' 매도!\n'+pp.s+'주 @ $'+sp+'\n수익: '+(pnl>=0?'+':'')+pnl.toFixed(2)+'% ($'+realized.toFixed(0)+')\n\n💡 보유 '+p.pos.length+'개 남음\n💡 시드 증액은 모두 매도 후 (T1까지)');
  }
  render();
}
function applyCycleSeed(newSeed){
  const p=curPort();
  const oldSeed=p.seed;
  p.seed=Math.round(newSeed);
  p.hist.forEach(r=>{if(r.a==='S')r.realized=0;});
  save();closeModal();
  alert('💰 시드 업데이트!\n$'+oldSeed.toLocaleString()+' → $'+p.seed.toLocaleString()+'\n\n다음 사이클 시작!');
  render();
}
function promptSeedReset(){
  const p=curPort();
  showModal('<h3>💰 시드 재설정</h3><div class="desc">현재: <b>$'+p.seed.toLocaleString()+'</b></div><div class="ir"><label>새 시드</label><input type="number" id="new-seed" value="'+p.seed+'"><span class="u">$</span></div><div class="btn-row"><button class="btn btn-d" onclick="closeModal()">취소</button><button class="btn btn-b" onclick="applyManualSeed()">재설정</button></div>');
}
function applyManualSeed(){
  const p=curPort();
  const ns=parseFloat($('new-seed').value);
  if(!ns||ns<=0)return alert('금액');
  if(!confirm('$'+p.seed.toLocaleString()+' → $'+ns.toLocaleString()+'?'))return;
  p.seed=ns;save();closeModal();
  alert('재설정!\n$'+p.seed.toLocaleString());
  render();
}
function confirmFullReset(){
  const p=curPort();
  showModal('<h3 style="color:var(--red)">⚠️ '+getDisplay(activeSymbol)+' 초기화</h3><div class="desc">'+getDisplay(activeSymbol)+' 모든 데이터 삭제:<br>• 시드 → $100,000<br>• 일지 '+p.diary.length+'일<br>• 보유 '+p.pos.length+'개<br>• 기록 '+p.hist.length+'건<br><br><b>정말?</b></div><div class="btn-row"><button class="btn btn-d" onclick="closeModal()">취소</button><button class="btn btn-r" onclick="doFullReset()">💀 초기화</button></div>');
}
function doFullReset(){
  if(!confirm('마지막 확인'))return;
  const p=curPort();
  portfolios[activeSymbol]={seed:100000,startDate:'',priceClose:0,priceLive:0,high20:0,priceDate:'',diary:[],pos:[],hist:[],symbol:p.symbol,label:p.label};
  save();closeModal();alert('완료!');sw('d');
}
function showModal(html){$('modal-container').innerHTML='<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">'+html+'</div></div>';}
function closeModal(){$('modal-container').innerHTML='';}

// 앱 시작 시 자동 일지 갱신 + 형님 룰 체크
async function autoRefreshOnStart(){
  const p=curPort();
  if(!p.startDate)return;
  const today=td();
  if(p.priceDate===today)return;
  if(p.diary.length>0&&p.diary[p.diary.length-1].date===today)return;
  console.log('[자동갱신] 시작');
  try{
    const start=new Date(p.startDate);start.setDate(start.getDate()-300);
    const fmt=d=>d.toISOString().slice(0,10);
    const res=await fetch('/api/history?symbol='+getSym()+'&start='+fmt(start)+'&end='+today+'&_='+Date.now(),{cache:'no-store'});
    if(!res.ok)return;
    const data=await res.json();
    if(data.error||!data.bars||data.bars.length<21)return;
    
    const startTs=new Date(p.startDate).getTime();
    let refIdx=-1,firstTradingIdx=-1;
    for(let i=0;i<data.bars.length;i++){
      const ts=new Date(data.bars[i].date).getTime();
      if(ts<startTs)refIdx=i;
      if(ts>=startTs&&firstTradingIdx<0)firstTradingIdx=i;
    }
    const diary=[];
    const buildEntry=(i,isRef)=>{
      const bar=data.bars[i];
      const prevBar=i>0?data.bars[i-1]:null;
      const start20=Math.max(0,i-19);
      const last20=data.bars.slice(start20,i+1);
      const high20=Math.max(...last20.map(b=>b.high));
      const vsPrev=prevBar?((bar.close-prevBar.close)/prevBar.close*100):0;
      const nextUnits=(prevBar&&bar.close<prevBar.close)?DN:UP;
      const zone=getZoneFor(bar.close,high20);
      return{date:bar.date,close:+bar.close.toFixed(2),high20:+high20.toFixed(2),vsPrev:+vsPrev.toFixed(2),units:nextUnits,zone,isRef};
    };
    if(refIdx>=0)diary.push(buildEntry(refIdx,true));
    if(firstTradingIdx>=0){for(let i=firstTradingIdx;i<data.bars.length;i++)diary.push(buildEntry(i,false));}
    p.diary=diary;
    if(diary.length>0){const last=diary[diary.length-1];p.priceClose=last.close;p.high20=last.high20;p.priceDate=last.date;}
    
    // NEW SYSTEM 모드 계산 (주간 RSI)
    const prevMode=p.nsMode?p.nsMode.mode:null;
    p.nsMode=calcNewSystemMode(data.bars);
    p.rsiUpdated=new Date().toISOString();
    if(prevMode&&p.nsMode.ready&&prevMode!==p.nsMode.mode){
      setTimeout(()=>{
        alert('🔄 모드 전환!\n\n'+(prevMode==='attack'?'🟢 공격':'🔵 방어')+' → '+(p.nsMode.mode==='attack'?'🟢 공격':'🔵 방어')+'\n\n주간 RSI: '+p.nsMode.wrsi.toFixed(1)+' (직전 '+p.nsMode.prevWrsi.toFixed(1)+')\n\n주문 탭 확인!');
      },500);
    }
    save();render();
    console.log('[자동갱신] 완료');
  }catch(e){console.warn('[자동갱신] 실패:',e.message);}
}

render();
setTimeout(autoRefreshOnStart,1000);
setInterval(()=>{const usEl=$('us-status');if(usEl)usEl.innerHTML=getUSMarketStatus();},60000);
</script>
