const diary=[];

// 시작일 직전 거래일 = 참조 (isRef:true)
if(refIdx>=0){

}

// 🆕 HYBRID 추천: 추세 비중 + 강세장 부스트
function calcMA(closes, period){
if(closes.length<period)return 0;
let sum=0;
for(let i=closes.length-period;i<closes.length;i++)sum+=closes[i];
return sum/period;
}
// 🆕 PANIC 모드 감지 (강화1: -7% + 거래량 1.5x + 3일 후 진입)
// 백테 검증: 5년 +882%p 추가 알파 / 기대값 +3.0%
function detectPanic(closes, volumes){
if(!closes||closes.length<31)return{active:false};

const n=closes.length;
const today=closes[n-1];
const yesterday=closes[n-2];
const todayChange=(today-yesterday)/yesterday*100;

// 거래량 비교
let volRatio=0;
if(volumes&&volumes.length>=31){
const todayVol=volumes[n-1];
let avgVol30=0;
for(let i=n-31;i<n-1;i++)avgVol30+=volumes[i];
avgVol30/=30;
volRatio=todayVol/avgVol30;
}

// 20일 고점 대비
let high20=0;
for(let i=n-21;i<n;i++)if(closes[i]>high20)high20=closes[i];
const fromHigh=(today-high20)/high20*100;

// 🆕 강화1 시그널 (백테 베스트)
// 조건: 일 -7% AND 거래량 1.5배 이상
const signalStrong=todayChange<=-7 && volRatio>=1.5;
// 약한 시그널 (참고용)
const signalWeak=todayChange<=-5 && volRatio>=1.3;

let level=0, levelName=’-’, action=‘대기’;

if(signalStrong){
level=3;
levelName=‘🔴 강화 시그널 (-7% + 1.5x)’;
action=‘3 거래일 후 시초가 풀 매수’;
}else if(signalWeak){
level=1;
levelName=‘🟠 약한 시그널 (-5% + 1.3x)’;
action=‘관망 (조건 부족)’;
}else if(fromHigh<=-30){
level=0.5;
levelName=‘🟡 잠재 (고점 -30%+)’;
action=‘대기 (S1/S2 시그널 기다림)’;
}

return{
active:level>=3,  // 강화1 시그널만 active
weak:level>=1,
level,levelName,action,
todayChange,fromHigh,volRatio,
volTrigger:volRatio>=1.5,
high20,today
};
}

function recommendHybrid(closes, todayRsi, prevRsi){
if(!closes||closes.length<200)return{weight:1.0,boost:0,trendLabel:‘데이터부족’,rsiLabel:’-’,ma50:0,ma200:0,trend:0,gap:0};  
const cl=closes[closes.length-1];
const ma50=calcMA(closes,50);
const ma200=calcMA(closes,200);
const trend=(ma50-ma200)/ma200*100;
const gap=(cl-ma200)/ma200*100;

// 🆕 비중조절만 (부스트 X) - V자 폭락 견딤
// 5년 백테: +2,127% / MDD -39% / Calmar 2.19 ⭐
// 2020 코로나: -21% (HYBRID 강 -39% 대비 안전)
let weight, boost = 0, trendLabel;

if(trend>5&&gap>0){
weight=1.0;
trendLabel=‘🟢 강세 강 (trend+’+trend.toFixed(1)+’%, gap+’+gap.toFixed(1)+’%)’;
}
else if(trend>0){
weight=0.9;
trendLabel=‘🟢 강세 약 (trend+’+trend.toFixed(1)+’%)’;
}
else if(trend>-5){
weight=0.6;
trendLabel=‘🟡 중립 (trend’+trend.toFixed(1)+’%)’;
}
else if(trend>-10){
weight=0.4;
trendLabel=‘🟠 약세 (trend’+trend.toFixed(1)+’%)’;
}
else if(gap<-30){
weight=0.5;
trendLabel=‘🔵 바닥 역발상 (gap’+gap.toFixed(1)+’%)’;
}
else {
weight=0.3;
trendLabel=‘🔴 폭락 (trend’+trend.toFixed(1)+’%)’;
}

// RSI 라벨
let rsiLabel=’-’;
if(todayRsi>0&&prevRsi>0){
const direction=todayRsi<prevRsi?‘↓’:(todayRsi>prevRsi?‘↑’:‘→’);
rsiLabel=‘RSI ‘+direction+todayRsi.toFixed(0)+’ / 비중 ‘+(weight*100).toFixed(0)+’%’;
}

return{weight,boost,trendLabel,rsiLabel,ma50,ma200,trend,gap};
}

function recommendBoost(rsi, prevRsi){
if(!rsi||!prevRsi)return{boost:0,reason:‘RSI 데이터 필요’};

// 위험 구간 차단
if(rsi>=70)return{boost:0,reason:‘과매수 위험 (RSI 70+)’};
if(rsi<30)return{boost:0,reason:‘과매도 직전 (RSI <30, 폭락 임박)’};

const falling = rsi < prevRsi;
const rising = rsi > prevRsi;

// 하락 중 (고점 추락형) - 진짜 sweet spot!
if(falling){
if(rsi>=40&&rsi<55)return{boost:0.30,reason:‘⭐ 하락 중 40-55 (베스트! T5+ 0% 검증)’};
if(rsi>=55&&rsi<65)return{boost:0.20,reason:‘✅ 하락 중 55-65 (적정)’};
if(rsi>=65&&rsi<70)return{boost:0.10,reason:‘⚠️ 하락 중 65-70 (조심)’};
}

// 상승 중 (바닥 회복형) - 표본 적음 + T5 위험
if(rising){
if(rsi>=30&&rsi<40)return{boost:0,reason:‘⚠️ 상승 중 30-40 (초기 회복, 위험)’};
if(rsi>=40&&rsi<50)return{boost:0.10,reason:‘⚠️ 상승 중 40-50 (T5+ 50% 위험)’};
if(rsi>=50&&rsi<60)return{boost:0.20,reason:‘✅ 상승 중 50-60 (적정)’};
if(rsi>=60&&rsi<70)return{boost:0.15,reason:‘⚠️ 상승 중 60-70 (과열 주의)’};
}

return{boost:0.10,reason:‘횡보 (작은 부스트)’};
}

p.hist=p.hist.filter(r=>r.a===‘S’); // 매도 기록만 남김

// 시작일 자동 갱신 (새 사이클 = 오늘)
p.startDate=td();

// 일지 초기화 (야후 갱신 시 새로 생성)
p.diary=[];

save();closeModal();
alert(‘💰 시드 업데이트 + 새 사이클 시작!\n$’+oldSeed.toLocaleString()+’ → $’+p.seed.toLocaleString()+’\n\n📅 시작일: ‘+p.startDate+’\n📊 매도 수익 기록 보존됨\n\n야후 갱신 한 번 해줘!’);
render();
}
function promptSeedReset(){
const p=curPort();
showModal(’<h3>💰 시드 재설정</h3><div class="desc">현재: <b>$’+p.seed.toLocaleString()+’</b></div><div class="ir"><label>새 시드</label><input type="number" id="new-seed" value="'+p.seed+'"><span class="u">$</span></div><div class="btn-row"><button class="btn btn-d" onclick="closeModal()">취소</button><button class="btn btn-b" onclick="applyManualSeed()">재설정</button></div>’);
}
function applyManualSeed(){
const p=curPort();
const ns=parseFloat($(‘new-seed’).value);
if(!ns||ns<=0)return alert(‘금액’);
if(!confirm(’$’+p.seed.toLocaleString()+’ → $’+ns.toLocaleString()+’?’))return;
p.seed=ns;save();closeModal();
alert(‘재설정!\n$’+p.seed.toLocaleString());
render();
}
function confirmFullReset(){
const p=curPort();
showModal(’<h3 style="color:var(--red)">⚠️ ‘+activeSymbol+’ 초기화</h3><div class="desc">’+activeSymbol+’ 모든 데이터 삭제:<br>• 시드 → $100,000<br>• 일지 ‘+p.diary.length+‘일<br>• 보유 ‘+p.pos.length+‘개<br>• 기록 ‘+p.hist.length+‘건<br><br><b>정말?</b></div><div class="btn-row"><button class="btn btn-d" onclick="closeModal()">취소</button><button class="btn btn-r" onclick="doFullReset()">💀 초기화</button></div>’);
}
function doFullReset(){
if(!confirm(‘마지막 확인’))return;
portfolios[activeSymbol]={seed:100000,startDate:’’,priceClose:0,priceLive:0,high20:0,priceDate:’’,diary:[],pos:[],hist:[]};
save();closeModal();alert(‘완료!’);sw(‘d’);
}
function showModal(html){$(‘modal-container’).innerHTML=’<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">’+html+’</div></div>’;}
function closeModal(){$(‘modal-container’).innerHTML=’’;}
render();
setInterval(()=>{const usEl=$(‘us-status’);if(usEl)usEl.innerHTML=getUSMarketStatus();},60000);
startLivePriceAutoUpdate();
// 🆕 페이지 로드 시 RSI 자동 갱신 (1시간 이상 지났을 때만)
setTimeout(()=>{
const p=curPort();
const rsiAge=p.rsiUpdated?(Date.now()-new Date(p.rsiUpdated).getTime())/3600000:999;
if(rsiAge>=1){fetchAndApplyRsi(false);}
},2000);
</script>
