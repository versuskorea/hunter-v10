<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎯 떨사 매매</title>
<style>
:root {
  --bg: #0a0e1a;
  --card: #131825;
  --text: #e2e8f0;
  --dim: #94a3b8;
  --green: #22c55e;
  --red: #ef4444;
  --gold: #fbbf24;
  --cyan: #06b6d4;
  --border: #2a3142;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  padding: 12px;
  max-width: 480px;
  margin: 0 auto;
  font-size: 14px;
}
h1 { color: var(--cyan); text-align: center; margin-bottom: 16px; font-size: 22px; }
.back {
  display: block; text-align: center; padding: 12px;
  background: var(--card); border: 1px solid var(--border);
  border-radius: 10px; color: var(--dim); text-decoration: none;
  margin-bottom: 16px; font-weight: 600;
}
.card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; padding: 14px; margin-bottom: 12px;
}
.ct { font-size: 13px; color: var(--dim); margin-bottom: 10px; font-weight: 700; }
.ir { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.ir label { flex: 0 0 90px; font-size: 13px; color: var(--dim); }
.ir input, .ir select {
  flex: 1; padding: 10px; background: var(--bg); color: var(--text);
  border: 1px solid var(--border); border-radius: 6px; font-size: 14px;
}
.ir .u { color: var(--dim); font-size: 12px; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th, td { padding: 6px 4px; text-align: center; border-bottom: 1px solid var(--border); }
th { color: var(--dim); font-size: 11px; font-weight: 600; }
.boost-row { display: flex; flex-wrap: wrap; gap: 6px; }
.boost-btn {
  flex: 1; min-width: 60px; padding: 10px; background: var(--bg);
  color: var(--text); border: 1px solid var(--border);
  border-radius: 6px; font-size: 13px; cursor: pointer; font-weight: 700;
}
.boost-btn.on { background: var(--gold); color: #000; border-color: var(--gold); }
.note {
  background: rgba(6,182,212,0.08); border-left: 3px solid var(--cyan);
  padding: 10px; margin-top: 10px; font-size: 12px;
  color: var(--dim); border-radius: 4px;
}
.warn {
  background: rgba(251,191,36,0.08); border-left: 3px solid var(--gold);
  color: var(--gold);
}
.asset-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.asset-item {
  background: var(--bg); padding: 10px; border-radius: 8px; text-align: center;
}
.asset-item .lbl { color: var(--dim); font-size: 11px; margin-bottom: 4px; }
.asset-item .val { font-size: 15px; font-weight: 700; }
.order-card {
  background: linear-gradient(135deg, rgba(6,182,212,0.1), rgba(251,191,36,0.1));
  border: 2px solid var(--gold); border-radius: 12px;
  padding: 14px; margin-bottom: 12px;
}
.order-card .ct { color: var(--gold); }
.order-table th { color: var(--gold); }
.order-table td.price { color: var(--cyan); font-weight: 700; font-size: 14px; }
.order-table td.qty { color: var(--gold); font-weight: 700; font-size: 14px; }
.empty { color: var(--dim); font-style: italic; }
.held { color: var(--green); font-weight: 700; }
.btn-row { display: flex; gap: 8px; margin-top: 10px; }
.btn {
  flex: 1; padding: 10px; border-radius: 6px; border: none;
  font-weight: 700; cursor: pointer; font-size: 13px;
}
.btn-b { background: var(--cyan); color: #000; }
.btn-s { background: var(--red); color: #fff; }
.btn-d { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
.modal-bg {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.8); display: none;
  align-items: center; justify-content: center; z-index: 100; padding: 16px;
}
.modal-bg.on { display: flex; }
.modal {
  background: var(--card); border-radius: 12px;
  padding: 16px; max-width: 100%; width: 380px;
}
.modal h3 { margin-bottom: 10px; color: var(--cyan); }
.modal .desc { color: var(--dim); font-size: 13px; margin-bottom: 12px; }
</style>
</head>
<body>

<h1>🎯 떨사 매매</h1>
<a href="index.html" class="back">← HUNTER 매매앱으로</a>

<div class="card">
  <div class="ct">💰 자산 현황</div>
  <div class="asset-grid">
    <div class="asset-item"><div class="lbl">총자산</div><div class="val" id="totalAsset">$0</div></div>
    <div class="asset-item"><div class="lbl">주식평가금</div><div class="val" id="stockVal">$0</div></div>
    <div class="asset-item"><div class="lbl">예수금</div><div class="val" id="cash">$0</div></div>
  </div>
  <div class="note" id="ratioNote">현금 100.0%</div>
</div>

<div class="card">
  <div class="ct">⚙️ 설정</div>
  <div class="ir">
    <label>시드</label>
    <input type="number" id="seedIn" oninput="setSeed()">
    <span class="u">$</span>
  </div>
  <div class="ir">
    <label>전일 종가</label>
    <input type="number" id="closeIn" step="0.01" oninput="setClose()">
    <span class="u">$</span>
  </div>
  <div class="ir">
    <label>Pro</label>
    <select id="proIn" onchange="setPro()">
      <option value="1">Pro1</option>
      <option value="2">Pro2</option>
      <option value="3">Pro3</option>
    </select>
  </div>
  <div class="btn-row">
    <button class="btn btn-b" onclick="fetchYahoo()" id="fetchBtn">🔄 야후에서 자동 가져오기</button>
  </div>
  <div id="fetchStatus" style="font-size:11px;color:var(--dim);margin-top:6px;text-align:center"></div>
</div>

<div class="card">
  <div class="ct">🔥 부스트 강도</div>
  <div class="boost-row" id="boostRow"></div>
  <div id="boostInfo"></div>
</div>

<div class="order-card">
  <div class="ct">🛒 오늘의 주문 (다음 매수 티어)</div>
  <table class="order-table" id="orderTable"></table>
  <div class="btn-row">
    <button class="btn btn-b" onclick="recordBuy()">✅ 매수 체결</button>
  </div>
</div>

<div class="card">
  <div class="ct">📦 보유 현황</div>
  <table id="posTable"></table>
</div>

<div class="card">
  <div class="ct">🔄 사이클 관리</div>
  <div class="btn-row">
    <button class="btn btn-s" onclick="endCycle()">🔄 사이클 종료 (전체 매도)</button>
  </div>
  <div class="note">모든 보유 티어 일괄 매도 후 새 사이클 시작</div>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal" id="modalContent"></div>
</div>

<script>
const PROS = {
  1: {name:'Pro1', ratios:[5,10,15,20,25,25], buyPct:-0.0001, sellPct:0.0001, time:10},
  2: {name:'Pro2', ratios:[10,15,20,25,20,10], buyPct:-0.0001, sellPct:0.015, time:10},
  3: {name:'Pro3', ratios:[16.67,16.67,16.67,16.67,16.67,16.67], buyPct:-0.001, sellPct:0.02, time:12},
};

let state = {
  seed: 100000,
  close: 184.24,
  pro: 2,
  boost: 0,
  cash: 100000,
  pos: [],
  lossCount: 0,
};

function save() {
  localStorage.setItem('ddulsa-state', JSON.stringify(state));
}

function load() {
  const s = localStorage.getItem('ddulsa-state');
  if (s) {
    try { state = {...state, ...JSON.parse(s)}; } catch(e) {}
  }
}

function setSeed() {
  const v = parseFloat(document.getElementById('seedIn').value);
  if (v > 0) {
    if (state.pos.length === 0) state.cash = v;
    state.seed = v;
    save(); render();
  }
}

function setClose() {
  state.close = parseFloat((parseFloat(document.getElementById('closeIn').value) || 0).toFixed(2));
  save(); render();
}

function setPro() {
  state.pro = parseInt(document.getElementById('proIn').value);
  save(); render();
}

function setBoost(b) {
  state.boost = b;
  save(); render();
}

async function fetchYahoo() {
  const btn = document.getElementById('fetchBtn');
  const status = document.getElementById('fetchStatus');
  btn.disabled = true;
  btn.innerText = '⏳ 가져오는 중...';
  status.innerText = '';
  
  try {
    const today = new Date().toISOString().slice(0,10);
    const past = new Date();
    past.setDate(past.getDate() - 7);
    const start = past.toISOString().slice(0,10);
    
    const res = await fetch('/api/history?symbol=SOXL&start=' + start + '&end=' + today);
    if (!res.ok) throw new Error('API 오류 ' + res.status);
    const data = await res.json();
    if (data.error || !data.bars || data.bars.length === 0) throw new Error('데이터 없음');
    
    const lastBar = data.bars[data.bars.length - 1];
    state.close = parseFloat(lastBar.close.toFixed(2));
    save();
    render();
    status.innerText = '✅ ' + lastBar.date + ' 종가 $' + lastBar.close.toFixed(2);
  } catch(e) {
    status.innerText = '❌ ' + e.message;
  }
  
  btn.disabled = false;
  btn.innerText = '🔄 야후에서 자동 가져오기';
}

function getBoostMult() {
  return 1 + state.boost / 100;
}

function getCurrentWeights() {
  const pro = PROS[state.pro];
  const mult = getBoostMult();
  const used = state.pos.reduce((s,p) => s + p.weight, 0);
  
  const weights = [];
  let remaining = 100 - used;
  
  for (let i = 0; i < 6; i++) {
    if (i < state.pos.length) {
      weights.push(state.pos[i].weight);
    } else {
      const wanted = pro.ratios[i] * mult;
      const actual = Math.max(0, Math.min(wanted, remaining));
      remaining -= actual;
      weights.push(actual);
    }
  }
  return weights;
}

function recordBuy() {
  if (state.pos.length >= 6) { alert('이미 T6까지 매수 완료'); return; }
  
  const tier = state.pos.length;
  const weights = getCurrentWeights();
  const weight = weights[tier];
  
  if (weight <= 0) { alert('자금 한도 도달 (가매수)'); return; }
  
  const pro = PROS[state.pro];
  const buyPrice = state.close * (1 + pro.buyPct);
  const amount = state.seed * weight / 100;
  const shares = Math.floor(amount / buyPrice);
  
  if (shares <= 0) { alert('주수 0 (시드/가격 확인)'); return; }
  
  const today = new Date().toISOString().slice(0,10);
  state.pos.push({
    tier: tier + 1, buyDate: today, buyPrice: buyPrice,
    shares: shares, weight: weight,
  });
  
  state.cash -= shares * buyPrice;
  save(); render();
}

function sellTier(idx) {
  const pos = state.pos[idx];
  if (!pos) return;
  
  showModal(
    '<h3>T' + pos.tier + ' 매도</h3>' +
    '<div class="desc">매수 $' + pos.buyPrice.toFixed(2) + ' × ' + pos.shares + '주<br>매수일: ' + pos.buyDate + '</div>' +
    '<div class="ir"><label>매도가</label><input type="number" step="0.01" id="sellP" value="' + (pos.buyPrice * (1 + PROS[state.pro].sellPct)).toFixed(2) + '"><span class="u">$</span></div>' +
    '<div class="btn-row"><button class="btn btn-d" onclick="closeModal()">취소</button>' +
    '<button class="btn btn-s" onclick="doSell(' + idx + ')">매도!</button></div>'
  );
}

function doSell(idx) {
  const sp = parseFloat(document.getElementById('sellP').value);
  if (!sp || sp <= 0) return alert('매도가');
  
  const pos = state.pos[idx];
  state.cash += pos.shares * sp;
  state.pos.splice(idx, 1);
  
  closeModal(); save(); render();
}

function endCycle() {
  if (state.pos.length === 0) { alert('보유 티어 없음'); return; }
  
  showModal(
    '<h3>🔄 사이클 종료</h3>' +
    '<div class="desc">전체 ' + state.pos.length + '개 티어 일괄 매도</div>' +
    '<div class="ir"><label>매도가</label><input type="number" step="0.01" id="bulkP" value="' + state.close.toFixed(2) + '"><span class="u">$</span></div>' +
    '<div class="btn-row"><button class="btn btn-d" onclick="closeModal()">취소</button>' +
    '<button class="btn btn-s" onclick="doEndCycle()">🔄 일괄 매도</button></div>'
  );
}

function doEndCycle() {
  const sp = parseFloat(document.getElementById('bulkP').value);
  if (!sp || sp <= 0) return alert('매도가');
  
  let totalBuy = 0, totalSell = 0;
  state.pos.forEach(p => {
    totalBuy += p.shares * p.buyPrice;
    totalSell += p.shares * sp;
  });
  
  state.cash += totalSell;
  const pnl = totalSell - totalBuy;
  const isLoss = pnl < 0;
  
  state.pos = [];
  
  if (isLoss) state.lossCount = 5;
  else if (state.lossCount > 0) state.lossCount--;
  
  state.seed = state.cash;
  
  closeModal(); save();
  
  alert('사이클 종료\n손익: ' + (pnl >= 0 ? '+' : '') + '$' + pnl.toFixed(0) + '\n새 시드: $' + state.seed.toFixed(0) + (isLoss ? '\n\n⚠️ 손실! 다음 5사이클 부스트 검토' : ''));
  render();
}

function showModal(html) {
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modalBg').classList.add('on');
}

function closeModal() {
  document.getElementById('modalBg').classList.remove('on');
}

function bizDaysFromToday(start) {
  if (!start) return 0;
  const s = new Date(start);
  const t = new Date();
  let d = 0, cur = new Date(s);
  while (cur < t) {
    cur.setDate(cur.getDate() + 1);
    if (cur.getDay() !== 0 && cur.getDay() !== 6) d++;
  }
  return d;
}

function render() {
  document.getElementById('seedIn').value = state.seed;
  document.getElementById('closeIn').value = state.close.toFixed(2);
  document.getElementById('proIn').value = state.pro;
  
  const pro = PROS[state.pro];
  const stockVal = state.pos.reduce((s,p) => s + p.shares * state.close, 0);
  const total = state.cash + stockVal;
  const stockRatio = total > 0 ? stockVal / total * 100 : 0;
  
  document.getElementById('totalAsset').innerText = '$' + total.toFixed(0).toLocaleString();
  document.getElementById('stockVal').innerText = '$' + stockVal.toFixed(0).toLocaleString();
  document.getElementById('cash').innerText = '$' + state.cash.toFixed(0).toLocaleString();
  document.getElementById('ratioNote').innerText = '주식 ' + stockRatio.toFixed(1) + '% · 현금 ' + (100-stockRatio).toFixed(1) + '%';
  
  const boosts = [0, 20, 30, 50, 70, 100, 150, 200];
  document.getElementById('boostRow').innerHTML = boosts.map(b => 
    '<button class="boost-btn ' + (state.boost === b ? 'on' : '') + '" onclick="setBoost(' + b + ')">+' + b + '%</button>'
  ).join('');
  
  let bInfo = '';
  if (state.lossCount > 0) {
    bInfo = '<div class="note warn">⚠️ 손실 사이클 후 ' + state.lossCount + '회 남음 (부스트 검토)</div>';
  }
  if (state.boost > 0) {
    bInfo += '<div class="note warn">🔥 부스트 +' + state.boost + '% 적용 (×' + getBoostMult().toFixed(2) + '배)</div>';
  }
  document.getElementById('boostInfo').innerHTML = bInfo;
  
  const nextTier = state.pos.length;
  let orderHtml = '';
  if (nextTier >= 6) {
    orderHtml = '<tr><td colspan="6" class="empty" style="padding:14px">T6 매수 완료 - 매도 대기</td></tr>';
  } else if (state.close <= 0) {
    orderHtml = '<tr><td colspan="6" class="empty" style="padding:14px">전일 종가 입력</td></tr>';
  } else {
    const weights = getCurrentWeights();
    const w = weights[nextTier];
    const buyPrice = state.close * (1 + pro.buyPct);
    const amount = state.seed * w / 100;
    const shares = Math.floor(amount / buyPrice);
    const isGhost = w <= 0;
    
    orderHtml = 
      '<thead><tr><th>티어</th><th>구분</th><th>방법</th><th>주문가</th><th>비중</th><th>수량</th></tr></thead>' +
      '<tbody><tr><td><b>T' + (nextTier+1) + '</b></td>' +
      '<td style="color:var(--cyan)">매수</td><td>LOC</td>' +
      '<td class="price">' + (isGhost ? '-' : '$' + buyPrice.toFixed(2)) + '</td>' +
      '<td>' + w.toFixed(1) + '%</td>' +
      '<td class="qty">' + (isGhost ? '가매수' : shares + '주') + '</td>' +
      '</tr></tbody>';
  }
  document.getElementById('orderTable').innerHTML = orderHtml;
  
  let posHtml = 
    '<thead><tr><th>티어</th><th>비중</th><th>할당</th><th>매수일</th>' +
    '<th>매수가</th><th>수량</th><th>매도목표</th><th>보유일</th><th></th></tr></thead><tbody>';
  
  const weights = getCurrentWeights();
  for (let i = 0; i < 6; i++) {
    const pos = state.pos[i];
    const w = weights[i];
    const alloc = state.seed * w / 100;
    
    if (pos) {
      const target = pos.buyPrice * (1 + pro.sellPct);
      const heldDays = bizDaysFromToday(pos.buyDate);
      posHtml += 
        '<tr style="background:rgba(34,197,94,0.05)">' +
        '<td><b style="color:var(--cyan)">T' + pos.tier + '</b></td>' +
        '<td>' + pos.weight.toFixed(1) + '%</td>' +
        '<td>$' + (pos.shares*pos.buyPrice).toFixed(0) + '</td>' +
        '<td>' + pos.buyDate.slice(5) + '</td>' +
        '<td class="held">$' + pos.buyPrice.toFixed(2) + '</td>' +
        '<td class="held">' + pos.shares + '</td>' +
        '<td style="color:var(--green)">$' + target.toFixed(2) + '</td>' +
        '<td>' + heldDays + '일</td>' +
        '<td><button class="btn btn-s" style="padding:4px 8px;font-size:11px" onclick="sellTier(' + i + ')">매도</button></td>' +
        '</tr>';
    } else {
      const isGhost = w <= 0;
      posHtml += 
        '<tr style="' + (isGhost ? 'opacity:0.3' : '') + '">' +
        '<td><b style="color:var(--dim)">T' + (i+1) + '</b></td>' +
        '<td>' + w.toFixed(1) + '%</td>' +
        '<td>$' + alloc.toFixed(0) + '</td>' +
        '<td class="empty">-</td><td class="empty">-</td><td class="empty">-</td>' +
        '<td class="empty">-</td><td class="empty">-</td><td></td>' +
        '</tr>';
    }
  }
  
  posHtml += '</tbody>';
  document.getElementById('posTable').innerHTML = posHtml;
}

load();
render();

// 페이지 로드 시 자동 갱신 (1회만)
setTimeout(() => {
  const today = new Date().toISOString().slice(0,10);
  const lastFetch = localStorage.getItem('ddulsa-last-fetch');
  if (lastFetch !== today) {
    fetchYahoo();
    localStorage.setItem('ddulsa-last-fetch', today);
  }
}, 500);
</script>
</body>
</html>
