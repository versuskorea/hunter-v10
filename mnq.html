<style>
:root{--bg:#08080a;--card:#111118;--card2:#1a1a1f;--border:#222233;--accent:#3b82f6;
      --green:#22c55e;--red:#ef4444;--text:#f0f0f0;--dim:#666;--gold:#fbbf24;--purple:#a78bfa}
*{margin:0;padding:0;box-sizing:border-box}
.chartbox{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 12px 8px;margin:10px 0}
.ch-head{display:flex;align-items:baseline;gap:8px;margin-bottom:4px;font-family:'JetBrains Mono',monospace}
.ch-px{font-size:24px;font-weight:800}
.ch-chg{font-size:14px;font-weight:700}
.ch-t{margin-left:auto;font-size:11px;color:var(--dim)}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;
     padding:12px;max-width:600px;margin:0 auto}
.top{display:flex;align-items:center;gap:8px;padding:6px 0}
.back{font-size:12px;color:var(--accent);text-decoration:none;font-weight:700;

.top h1 span{color:var(--accent)}
.status{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;
        font-weight:700;padding:5px 9px;border-radius:20px;background:var(--card);color:var(--dim)}
.status.live{color:var(--green);border:1px solid var(--green)}
.status.err{color:var(--gold);border:1px solid var(--gold)}
.asof{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--dim);margin:4px 2px 12px}

.todo{border-radius:15px;padding:16px;margin-bottom:12px}
.todo .lb{font-size:10px;letter-spacing:1.5px;opacity:.75;font-weight:700}
.todo .big{font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:800;
           line-height:1.25;margin-top:5px}
.todo .sub{font-size:12px;font-weight:600;opacity:.9;margin-top:6px;line-height:1.5}
.t-buy{background:linear-gradient(135deg,#15803d,#22c55e);color:#fff}
.t-sell{background:linear-gradient(135deg,#6d28d9,#a78bfa);color:#fff}
.t-both{background:linear-gradient(135deg,#0369a1,#3b82f6);color:#fff}
.t-none{background:linear-gradient(135deg,#171720,#20202c);color:var(--text);
        border:1px solid #30304a}
.todo .trow{display:flex;align-items:center;gap:8px;margin-top:7px;

.todo .trow .tl{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700}
.todo .trow .tr{margin-left:auto;font-family:'JetBrains Mono',monospace;
                font-size:19px;font-weight:800;letter-spacing:-.3px;color:#fff}
.todo .trow.on{background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
.todo .trow .hit{font-size:12px;font-weight:800}
.todo .sub{color:inherit}
.t-none .todo-sub,.t-none .sub{opacity:.72}
.mtag{font-size:9px;font-weight:800;letter-spacing:.5px;padding:2px 6px;border-radius:5px}
.mtag.atk{color:#ffe27a;background:rgba(251,191,36,.18);
          text-shadow:0 0 5px rgba(251,191,36,.95),0 0 13px rgba(251,191,36,.6);
          box-shadow:0 0 9px rgba(251,191,36,.4)}
.mtag.def{color:#9fd0ff;background:rgba(96,165,250,.18);
          text-shadow:0 0 5px rgba(96,165,250,.9),0 0 13px rgba(96,165,250,.5);
          box-shadow:0 0 9px rgba(96,165,250,.33)}

.box{background:var(--card);border:1px solid var(--border);border-radius:14px;
     overflow:hidden;margin-bottom:12px}
.bhead{background:var(--card2);padding:9px 14px;font-family:'JetBrains Mono',monospace;
       font-size:10px;color:var(--dim);letter-spacing:1.2px;font-weight:700;display:flex}
.bhead .r{margin-left:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:10px;color:var(--dim);font-weight:700;text-align:left;
        padding:6px;border-bottom:1px solid var(--border)}
.tbl td{padding:9px 6px}
.tbl .sym{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--dim)}
.tbl .px{font-family:'JetBrains Mono',monospace;font-weight:700;text-align:right}
.tbl .qty{font-family:'JetBrains Mono',monospace;text-align:right}
.tag{font-size:10px;font-weight:700;padding:3px 7px;border-radius:5px}
.t-b{background:rgba(34,197,94,.22);color:#4ade80}
.t-s{background:rgba(167,139,250,.24);color:#c4b5fd}
.t-m{background:rgba(251,191,36,.24);color:#fcd34d}
.memo{font-size:11px;color:var(--dim);padding:0 6px 9px!important}
.note{font-size:10px;color:var(--dim);padding:8px 14px;border-top:1px solid var(--border);line-height:1.5}
.empty{padding:20px;text-align:center;color:var(--dim);font-size:12px}

.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.c{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:11px}
.c .l{font-size:9px;color:var(--dim);letter-spacing:1px;font-weight:700}
.c .v{font-family:'JetBrains Mono',monospace;font-size:17px;font-weight:800;margin-top:3px}
.c .s{font-size:10px;margin-top:2px;color:var(--dim)}
.up{color:var(--green)}.down{color:var(--red)}
.rz{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);border-bottom:1px solid var(--border)}
.rz div{background:var(--card);padding:10px 12px}
.rz .k{font-size:10px;color:var(--dim);font-weight:700}
.rz .n{font-family:'JetBrains Mono',monospace;font-size:17px;font-weight:800;margin-top:3px}
.rz .tot .n{font-size:19px}
.bt td{padding:7px 10px}.bt .tm{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700}
.bt tr.done td{opacity:.45}.bt tr.next td{background:rgba(56,189,248,.08)}
.bt .ub{color:#f87171}.bt .lb{color:#60a5fa}
.who{font-size:10px;font-weight:800;padding:2px 6px;border-radius:5px}
.who.b{color:#4ade80;background:rgba(34,197,94,.16)}
.who.w{color:#7dd3fc;background:rgba(56,189,248,.16)}

</style>

<script>
var BOT_URL = 'https://raw.githubusercontent.com/versuskorea/hunter-v10/main/mnq_state.json';
var API     = 'https://hunter-v10.vercel.app';
var TICK    = 0.25;

function flr(v){ return Math.floor(v/TICK)*TICK; }
function cel(v){ return Math.ceil(v/TICK)*TICK; }
function fmt(v,d){
  if(d===undefined) d=2;
  if(v===null||v===undefined||isNaN(v)) return '—';
  return (+v).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});
}
  // 봇의 biz_days와 동일 — 주말 제외 거래일 수
  function bizDays(d1, d2){
    var a = new Date(d1 + 'T00:00:00'), b = new Date(d2 + 'T00:00:00'), n = 0;
    if(isNaN(a) || isNaN(b)) return 0;
    while(a < b){ a.setDate(a.getDate() + 1);
      if(a.getDay() > 0 && a.getDay() < 6) n++; }
    return n;
  }
function ymd(offset){
  var t = new Date(Date.now() + (offset||0)*86400000);
  return t.toISOString().slice(0,10);
}

/* 활성 월물 — 3·6·9·12월 */
function activeContract(){
  var n = new Date(), y = n.getUTCFullYear(), m = n.getUTCMonth()+1, d = n.getUTCDate();
  var codes = {3:'H',6:'M',9:'U',12:'Z'};
  var months = [3,6,9,12];
  var cm = null;
  for(var i=0;i<months.length;i++){
    if(months[i] > m || (months[i] === m && d <= 18)){ cm = months[i]; break; }
  }
  var cy = y;
  if(cm === null){ cm = 3; cy = y+1; }
  return 'MNQ' + codes[cm] + String(cy).slice(-2);
}

/* 1분봉에서 매일 16:00 ET 이전 마지막 종가 */
function closes1600(sym){
  var url = API + '/api/history?symbol=' + encodeURIComponent(sym)
          + '&start=' + ymd(-6) + '&end=' + ymd(1)
          + '&interval=1m&_=' + Date.now();
  return fetch(url, {cache:'no-store'}).then(function(r){
    if(!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }).then(function(d){
    if(d.error || !d.bars || !d.bars.length) throw new Error(d.error || 'no 1m bars');
    window.RAW1M = d.bars;
    var byDay = {};
    for(var i=0;i<d.bars.length;i++){
      var b = d.bars[i];
      if(!b.etTime || b.close == null) continue;
      var parts = b.etTime.split(':');
      var mins = (+parts[0])*60 + (+parts[1]);
      var dkey = b.date, sk = mins;
      if(mins >= 18*60){                 // 18:00 ET 이후 = 다음 거래일 세션 (일요일 저녁 포함)
        var nd0 = new Date(b.date + 'T12:00:00Z');
        do { nd0.setUTCDate(nd0.getUTCDate()+1); } while(nd0.getUTCDay()===0 || nd0.getUTCDay()===6);
        dkey = nd0.toISOString().slice(0,10);
        sk = mins - 24*60;               // 같은 날 정규 시간 봉보다 앞 순서
      }else if(mins >= 16*60) continue;  // 16:00~18:00 제외 (15:59 봉이 마지막)
      if(!byDay[dkey] || sk > byDay[dkey][0]) byDay[dkey] = [sk, +b.close];
    }
    var keys = Object.keys(byDay).sort();
    if(keys.length < 3) throw new Error('1분봉 부족 (' + keys.length + '일)');
    return keys.map(function(k){ return {date:k, close:byDay[k][1], min:byDay[k][0]}; });
  });
}

/* MA·포모 판정용 장기 일봉 — 1분봉은 최근 5일뿐이라 일봉으로 보강 */
function dailyCloses(sym, want){
  var url = API + '/api/history?symbol=' + encodeURIComponent(sym)
          + '&start=' + ymd(-(want*2 + 40)) + '&end=' + ymd(1)
          + '&interval=1d&_=' + Date.now();
  return fetch(url, {cache:'no-store'}).then(function(r){
    if(!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }).then(function(d){
    if(d.error || !d.bars || !d.bars.length) throw new Error(d.error || 'no 1d bars');
    return d.bars.filter(function(b){ return b.close != null; })
                 .map(function(b){ return {date:b.date, close:+b.close}; });
  });
}

function loadBot(){
  return fetch(BOT_URL + '?_=' + Date.now(), {cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .catch(function(e){ console.log('봇 로드 실패', e.message); return null; });
}

function ladder(total, tiers){
  var l = [], i;
  for(i=0;i<tiers;i++) l.push(1);
  var seq = [];
  for(i=0;i<tiers;i++) seq.push(i);
  seq.sort(function(a,b){
    var da = Math.abs(a-(tiers-1)/2), db = Math.abs(b-(tiers-1)/2);
    return da - db || a - b;
  });
  var e = total - tiers, k = 0;
  while(e > 0){ l[seq[k % tiers]]++; e--; k++; }
  return l;
}

/* ── 1일 선차트 (아이폰 주식 스타일) ── */
var CH = null;
function nextBiz(ymdStr){
  var d = new Date(ymdStr + 'T12:00:00Z');
  do { d.setUTCDate(d.getUTCDate()+1); } while(d.getUTCDay()===0 || d.getUTCDay()===6);
  return d.toISOString().slice(0,10);
}
function sessionBars(){
  var raw = window.RAW1M || [], out = {}, last = null;
  for(var i=0;i<raw.length;i++){
    var b = raw[i]; if(!b.etTime || b.close == null) continue;
    var pr = b.etTime.split(':'), m = (+pr[0])*60 + (+pr[1]);
    if(m >= 17*60 && m < 18*60) continue;                    // 정비 시간
    var td = m >= 18*60 ? nextBiz(b.date) : b.date;
    var t  = m >= 18*60 ? m - 18*60 : m + 6*60;               // 세션 시작(18:00 ET)부터 분
    (out[td] = out[td] || []).push({t:t, px:+b.close, et:b.etTime});
    if(!last || td > last) last = td;
  }
  if(!last) return null;
  var arr = out[last].sort(function(a,b){ return a.t - b.t; });
  return {date:last, bars:arr};
}
function kstLabel(t){                                         // 세션분 → 한국시각 (EDT +13h)
  var etMin = (t + 18*60) % 1440, k = (etMin + 13*60) % 1440;
  var h = Math.floor(k/60), mm = k % 60;
  return (h<10?'0':'') + h + ':' + (mm<10?'0':'') + mm;
}
function drawChart(o){
  var box = document.getElementById('chartBox'), el = document.getElementById('chart');
  var S = sessionBars();
  if(!S || S.bars.length < 2){ box.style.display = 'none'; return; }
  box.style.display = '';
  var W = Math.max(280, Math.round(el.clientWidth || box.clientWidth - 24 || 340)), H = Math.round(W*0.55), L = 2, R = 2, T = 8, B = 20, END = 1380;
  var bars = S.bars, base = o.prev || bars[0].px;
  var lo = Math.min.apply(null, bars.map(function(b){return b.px;}).concat([base]));
  var hi = Math.max.apply(null, bars.map(function(b){return b.px;}).concat([base]));
  if(o.thr)    lo = Math.min(lo, o.thr);
  if(o.atkThr) hi = Math.max(hi, o.atkThr);
  (o.tps || []).forEach(function(t){ lo = Math.min(lo, t.px); hi = Math.max(hi, t.px); });
  var pad = (hi - lo) * 0.08 || 5; lo -= pad; hi += pad;
  var X = function(t){ return L + (W-L-R) * t / END; };
  var Y = function(v){ return T + (H-T-B) * (hi - v) / (hi - lo); };
  var lastB = bars[bars.length-1], up = lastB.px >= base;
  var col = up ? '#22c55e' : '#ef4444';
  var pts = bars.map(function(b){ return X(b.t).toFixed(1) + ',' + Y(b.px).toFixed(1); }).join(' ');
  var area = 'M' + X(bars[0].t).toFixed(1) + ',' + (H-B) + ' L' + pts.replace(/ /g,' L') + ' L' + X(lastB.t).toFixed(1) + ',' + (H-B) + ' Z';
  var tags = [];
  var hline = function(v, c, lab, dash){
    tags.push({y:Y(v), c:c, lab:lab});
    return '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'" stroke="'+c+'" stroke-width="1.2" stroke-dasharray="'+(dash||'5 4')+'" opacity=".9"/>';
  };
  var tagSvg = function(){
    tags.sort(function(a,b){ return a.y - b.y; });
    for(var q=1;q<tags.length;q++) if(tags[q].y - tags[q-1].y < 18) tags[q].y = tags[q-1].y + 18;   // 겹침 방지
    return tags.map(function(g){
      var w = g.lab.replace(/[가-힣]/g,'').length * 7.3 + (g.lab.match(/[가-힣]/g)||[]).length * 12 + 12, x = W - R - w, y = Math.min(Math.max(g.y, T+9), H-B-9);
      return '<rect x="'+x+'" y="'+(y-9)+'" width="'+w+'" height="18" rx="5" fill="#0b0b12" stroke="'+g.c+'" stroke-width="1"/>'
           + '<text x="'+(x+w/2)+'" y="'+(y+4)+'" fill="'+g.c+'" font-size="12" font-weight="700" text-anchor="middle" font-family="JetBrains Mono,monospace">'+g.lab+'</text>';
    }).join('');
  };
  var svg = '<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" style="display:block;max-width:100%">'
    + '<defs><linearGradient id="chg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+col+'" stop-opacity=".35"/><stop offset="1" stop-color="'+col+'" stop-opacity="0"/></linearGradient></defs>';
  [[0,'07시'],[360,'13시'],[930,'22:30'],[1320,'05시']].forEach(function(g){
    svg += '<line x1="'+X(g[0])+'" x2="'+X(g[0])+'" y1="'+T+'" y2="'+(H-B)+'" stroke="#222233" stroke-width="1"/>'
        +  '<text x="'+X(g[0])+'" y="'+(H-5)+'" fill="#888" font-size="11" text-anchor="'+(g[0]===0?'start':(g[0]===1320?'end':'middle'))+'">'+g[1]+'</text>';
  });
  svg += hline(base, '#9a9a9a', '전일 ' + fmt(base), '2 3');
  if(o.thr)    svg += hline(o.thr,    '#22c55e', '방어 ' + fmt(o.thr));
  if(o.atkThr) svg += hline(o.atkThr, '#fbbf24', '공격 ' + fmt(o.atkThr));
  var TPC = ['#38bdf8', '#facc15', '#f472b6'];                  // 티어별 익절선 색 (T1 하늘 · T2 노랑)
  (o.tps || []).forEach(function(t, k){ svg += hline(t.px, TPC[k % TPC.length], t.lab + ' ' + fmt(t.px), '1 0'); });
  svg += '<path d="'+area+'" fill="url(#chg)"/>'
      +  '<polyline points="'+pts+'" fill="none" stroke="'+col+'" stroke-width="1.8" stroke-linejoin="round"/>'
      +  '<circle cx="'+X(lastB.t).toFixed(1)+'" cy="'+Y(lastB.px).toFixed(1)+'" r="3.5" fill="'+col+'"/>'
      +  tagSvg()
      +  '<g id="chCross" style="display:none"><line id="chCx" y1="'+T+'" y2="'+(H-B)+'" stroke="#aaa" stroke-width="1"/><circle id="chCd" r="4" fill="#fff"/></g>'
      +  '</svg>';
  el.innerHTML = svg;
  CH = {bars:bars, base:base, X:X, Y:Y, W:W, last:lastB, date:S.date, o:o};
  chHead(lastB, false);
}
function chHead(b, touching){
  var d = b.px - CH.base, pc = d / CH.base * 100, c = d >= 0 ? 'var(--green)' : 'var(--red)';
  document.getElementById('chPx').textContent = fmt(b.px);
  var cg = document.getElementById('chChg');
  cg.textContent = (d>=0?'+':'') + d.toFixed(2) + ' (' + (d>=0?'+':'') + pc.toFixed(2) + '%)';
  cg.style.color = c;

/* ── 웨이브 밴드 (장 전 예상 → 22:30 이후 확정) ── */
function renderBand(BOT, bars){
  var el = document.getElementById('bandBody'), tag = document.getElementById('bandTag');
  fetch(INTRA_URL + '?_=' + Date.now(), {cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .catch(function(){ return null; })
    .then(function(W){
      if(!W || !W.hist){ el.innerHTML = '<div class="empty">웨이브 기록을 못 불러왔어요</div>'; return; }
      var now = new Date();
      var hOf = function(tz){ return +new Intl.DateTimeFormat('en-US',{timeZone:tz,hour:'numeric',hourCycle:'h23'}).format(now); };
      var off = (hOf('Asia/Seoul') - hOf('America/New_York') + 24) % 24;           // 13(서머) / 14(겨울)
      var etStr = new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit'}).format(now);
      var etMin = hOf('America/New_York')*60 + (+new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',minute:'numeric'}).format(now));
      var BQ = BOT && BOT.quote;
      var after = etMin >= 960;                                   // 16:00 ET 이후면 다음 거래일 밴드
      var keys = Object.keys(W.hist).sort();
      var prevDate = after ? (keys.filter(function(k){ return k <= etStr; }).pop())
                           : (keys.filter(function(k){ return k <  etStr; }).pop());
      if(!prevDate){ el.innerHTML = '<div class="empty">기록이 부족해요</div>'; return; }
      var session = after ? '다음 거래일' : etStr.slice(5);
      // 전일 종가: 봇 16:00 종가가 그날 것이면 그걸, 아니면 웨이브 기록의 15:30 가격 (웨이브 봇과 같은 규칙)
      var pcSrc, pc;
      if(BQ && BQ.date === prevDate && BQ.px){ pc = +BQ.px; pcSrc = '16:00'; }
      else { var hh = W.hist[prevDate]; pc = hh && hh.c ? +hh.c[hh.c.length-1] : null; pcSrc = '15:30'; }
      if(!pc){ el.innerHTML = '<div class="empty">전일 종가가 없어요</div>'; return; }
      var ks = keys.filter(function(k){ return k <= prevDate; }).slice(-14);
      if(ks.length < 5){ el.innerHTML = '<div class="empty">기록이 부족해요</div>'; return; }
      var sig = [];
      for(var j = 0; j < 12; j++){
        var a = 0, n = 0;
        ks.forEach(function(k){ var h = W.hist[k]; if(h && h.c && h.c[j] && h.o){ a += Math.abs(h.c[j]/h.o - 1); n++; } });
        sig.push(n ? a/n : 0);
      }
      // 시가: 확정(웨이브 기록) → 없으면 현재가로 예상
      var cur = (bars && bars.length) ? +bars[bars.length-1].px : null;
      var fixed = (session !== '다음 거래일' && W.day === etStr && W.op);
      var op = fixed ? +W.op : (cur || pc);
      tag.textContent = fixed ? '시가 ' + fmt(op) + ' 확정' : '시가 ' + fmt(op) + ' 가정 · 예상';
      var hi = Math.max(op, pc), lo = Math.min(op, pc);
      var done = (W.day === etStr && W.done) ? W.done : [];
      var live = !after && etMin >= 570 && etMin < 960;          // 정규장 중
      var pts = [], nx = null;
      for(var i = 0; i < 12; i++){
        var em = 600 + 30*i;
        var ub = hi * (1 + sig[i]), lb = lo * (1 - sig[i]);
        var et = String(Math.floor(em/60)).padStart(2,'0') + ':' + String(em%60).padStart(2,'0');
        var km = (em + off*60) % 1440;
        pts.push({em:em, ub:ub, lb:lb, done: done.indexOf(et) >= 0,
                  kst: String(Math.floor(km/60)).padStart(2,'0') + ':' + String(km%60).padStart(2,'0')});
        if(nx === null && (after || em > etMin)) nx = i;
      }
      // ── SVG 차트: x = 시각(ET 09:30~16:00), y = 가격 ──
      var W0 = 360, H0 = 230, L = 52, R = 8, T = 12, B = 26;
      var ys = []; pts.forEach(function(p){ ys.push(p.ub, p.lb); }); ys.push(pc, op); if(cur) ys.push(cur);
      var y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys), pad = (y1 - y0) * 0.08 || 10; y0 -= pad; y1 += pad;
      var X = function(m){ return L + (m - 570) / 390 * (W0 - L - R); };
      var Y = function(v){ return T + (y1 - v) / (y1 - y0) * (H0 - T - B); };
      var step = function(key){
        var d = '';
        pts.forEach(function(p, k){
          var x0 = X(p.em), x1 = X(k < 11 ? pts[k+1].em : 960), y = Y(p[key]);
          d += (k ? 'L' : 'M') + x0.toFixed(1) + ',' + y.toFixed(1) + 'L' + x1.toFixed(1) + ',' + y.toFixed(1);
        });
        return d;
      };
      var g = '';
      // 가로 눈금 4개
      for(var q = 0; q <= 4; q++){
        var v = y0 + (y1 - y0) * q / 4, yy = Y(v);
        g += '<line x1="' + L + '" x2="' + (W0-R) + '" y1="' + yy + '" y2="' + yy + '" stroke="var(--border)" stroke-width="1"/>'
          +  '<text x="' + (L-4) + '" y="' + (yy+3) + '" text-anchor="end" font-size="9" fill="var(--dim)">' + Math.round(v).toLocaleString() + '</text>';
      }
      // 시각 눈금 (한국 시각, 1시간마다)
      for(var em2 = 600; em2 <= 960; em2 += 60){
        var km2 = (em2 + off*60) % 1440, xx = X(em2);
        g += '<line x1="' + xx + '" x2="' + xx + '" y1="' + T + '" y2="' + (H0-B) + '" stroke="var(--border)" stroke-width="1" stroke-dasharray="2 3"/>'
          +  '<text x="' + xx + '" y="' + (H0-B+14) + '" text-anchor="middle" font-size="9" fill="var(--dim)">' + String(Math.floor(km2/60)).padStart(2,'0') + ':' + String(km2%60).padStart(2,'0') + '</text>';
      }
      // 밴드 사이 음영
      var area = step('ub') + 'L' + X(960).toFixed(1) + ',' + Y(pts[11].lb).toFixed(1);
      for(var k2 = 11; k2 >= 0; k2--){ var p2 = pts[k2]; area += 'L' + X(k2 < 11 ? pts[k2+1].em : 960).toFixed(1) + ',' + Y(p2.lb).toFixed(1) + 'L' + X(p2.em).toFixed(1) + ',' + Y(p2.lb).toFixed(1); }
      g += '<path d="' + area + 'Z" fill="rgba(148,163,184,.08)"/>';
      // 전일 종가·시가
      g += '<line x1="' + L + '" x2="' + (W0-R) + '" y1="' + Y(pc) + '" y2="' + Y(pc) + '" stroke="var(--dim)" stroke-width="1" stroke-dasharray="4 3"/>'
        +  '<text x="' + (W0-R-2) + '" y="' + (Y(pc)-3) + '" text-anchor="end" font-size="9" fill="var(--dim)">전일 ' + fmt(pc) + '</text>';
      if(Math.abs(op - pc) > 0.5)
        g += '<line x1="' + L + '" x2="' + (W0-R) + '" y1="' + Y(op) + '" y2="' + Y(op) + '" stroke="var(--dim)" stroke-width="1" stroke-dasharray="1 3"/>'
          +  '<text x="' + (W0-R-2) + '" y="' + (Y(op)-3) + '" text-anchor="end" font-size="9" fill="var(--dim)">시가 ' + fmt(op) + (fixed ? '' : '(가정)') + '</text>';
      // 상하 밴드 (계단)
      g += '<path d="' + step('ub') + '" fill="none" stroke="#f87171" stroke-width="2"/>'
        +  '<path d="' + step('lb') + '" fill="none" stroke="#60a5fa" stroke-width="2"/>';
      // 판단 시점 점 (지난 건 속 빈 점)
      pts.forEach(function(p){
        [['ub','#f87171'],['lb','#60a5fa']].forEach(function(z){
          g += '<circle cx="' + X(p.em) + '" cy="' + Y(p[z[0]]) + '" r="2.5" fill="' + (p.done ? 'var(--card)' : z[1]) + '" stroke="' + z[1] + '" stroke-width="1.2"/>';
        });
      });
      // 웨이브 진입가
      if(W.day === etStr && +W.pos)
        g += '<line x1="' + L + '" x2="' + (W0-R) + '" y1="' + Y(+W.entry) + '" y2="' + Y(+W.entry) + '" stroke="#facc15" stroke-width="1.2"/>'
          +  '<text x="' + (L+4) + '" y="' + (Y(+W.entry)-3) + '" font-size="9" fill="#facc15">진입 ' + fmt(+W.entry) + '</text>';
      // 현재가
      if(cur){
        if(live){
          var cx = X(etMin), cy = Y(cur);
          g += '<line x1="' + cx + '" x2="' + cx + '" y1="' + T + '" y2="' + (H0-B) + '" stroke="#4ade80" stroke-width="1" stroke-dasharray="3 2"/>'
            +  '<circle cx="' + cx + '" cy="' + cy + '" r="4.5" fill="#4ade80" stroke="var(--card)" stroke-width="1.5"/>'
            +  '<text x="' + (cx > W0-80 ? cx-7 : cx+7) + '" y="' + (cy-6) + '" text-anchor="' + (cx > W0-80 ? 'end' : 'start') + '" font-size="10" font-weight="800" fill="#4ade80">' + fmt(cur) + '</text>';
        } else if(!after){
          var cy2 = Y(cur);
          g += '<line x1="' + L + '" x2="' + (W0-R) + '" y1="' + cy2 + '" y2="' + cy2 + '" stroke="#4ade80" stroke-width="1.2" stroke-dasharray="5 3"/>'
            +  '<text x="' + (L+4) + '" y="' + (cy2-4) + '" font-size="10" font-weight="800" fill="#4ade80">현재가 ' + fmt(cur) + '</text>';
        }
      }
      var svg = '<svg viewBox="0 0 ' + W0 + ' ' + H0 + '" style="width:100%;height:auto;display:block;font-family:\'JetBrains Mono\',monospace">' + g + '</svg>';
      // 다음 판단 요약
      var info = '';
      if(nx !== null){
        var P = pts[nx];
        info = '<div style="display:flex;gap:10px;align-items:baseline;padding:8px 14px;border-top:1px solid var(--border);font-family:\'JetBrains Mono\',monospace;font-size:12px">'
          + '<span style="color:var(--dim);font-size:11px">다음 판단 ' + P.kst + '</span>'
          + '<span style="color:#f87171">위 ' + fmt(P.ub) + '</span><span style="color:#60a5fa">아래 ' + fmt(P.lb) + '</span>'
          + (cur && !after ? '<span style="margin-left:auto;color:var(--dim);font-size:11px">' + (cur >= P.ub ? '위 돌파 중' : cur <= P.lb ? '아래 돌파 중' : '↑' + (P.ub-cur).toFixed(0) + ' ↓' + (cur-P.lb).toFixed(0) + 'pt') + '</span>' : '')
          + '</div>';
      }
      var posLine = (W.day === etStr && +W.pos)
        ? '<div style="padding:8px 14px;font-size:12px;font-weight:700;border-bottom:1px solid var(--border)">보유 중 · ' + (+W.pos > 0 ? '📈 롱' : '📉 숏') + ' ' + W.qty + '계약 @ ' + fmt(+W.entry) + ' (' + W.entry_t + ' ET 진입)</div>' : '';
      el.innerHTML = posLine
        + '<div style="padding:8px 14px 2px;font-size:11px;color:var(--dim)">' + session + ' · 전일 종가 ' + fmt(pc) + ' (' + prevDate.slice(5) + ' ' + pcSrc + ')</div>'
        + '<div style="padding:4px 6px 2px">' + svg + '</div>' + info
        + '<div class="note">빨강 위 밴드 · 파랑 아래 밴드 · 초록 현재가(야후 ~10분 지연) · 진입은 VWAP 조건도 맞아야 함</div>';
    });
}

    var FOMO_DAYS = cfg.fomo_days !== undefined ? +cfg.fomo_days : 4;
    var FOMO_MULT = cfg.fomo_mult !== undefined ? +cfg.fomo_mult : 2;
    var isAtk = false, atkThr = null, fomoHot = false, fomoRun = 0;

    // 선물 세션 종료(17:00 ET = 한국 06:00) 이후면 당일 종가를 기준가 계산에 포함.
    // 그 전에는 오늘 쓸 기준가(직전 2일 기준)를 그대로 보여준다.
    var etNow   = new Date(Date.now() - 4*3600000);   // EDT
    var etToday = etNow.toISOString().slice(0,10);
    // 오늘(ET) 16:00 정산이 끝났을 때만 당일 종가를 확정값으로 쓴다.
    // ET 자정을 넘기면 hour<4 가 되는데 그날 정산은 아직이므로 포함하지 않는다.
    var sessionDone = (etNow.getUTCHours() >= 16)
                      && bars && bars.length && bars[bars.length-1].date === etToday;
    var appNewer = bars && bars.length >= 3 && BQ && BQ.date
                   && bars[bars.length-1].date > BQ.date;

    var botRolled = false;
    if(BQ && BQ.buy_thr != null && !appNewer && !sessionDone){
      // 봇 quote = BQ.date 종가로 이미 판정을 마친 값 → 다음 판정용으로 한 칸 민다
      px = BQ.px; p1 = BQ.px; p2 = BQ.p1;
      thr = flr(Math.min(p1,p2) * (1 - buyPct/100));
      src = (BQ.src || '봇') + ' · 다음 거래일 기준'; asof = BQ.date; botRolled = true;
      // 공격모드: 봇 종가(BQ.px)를 p1로 넣어 MA20·포모 재계산
      if(ATK_ON && mabars && mabars.length >= 21){
        var cl = mabars.filter(function(b){ return b && b.date < BQ.date; }).map(function(b){ return b.close; });
        cl.push(BQ.px);
        if(cl.length >= 21){
          var m = cl.length, sm = 0;
          for(var q = m-20; q < m; q++) sm += cl[q];
          sm /= 20;
          if(p1 > sm){
            isAtk = true;
            atkThr = Math.ceil(p1 * (1 + ATK_BUY/100) / 0.25) * 0.25;
            if(FOMO_DAYS > 0){
              var rn = 0;
              for(var f2 = 0; f2 < FOMO_DAYS; f2++){
                if(cl[m-1-f2] > cl[m-2-f2]) rn++; else break;
              }
              fomoRun = rn; fomoHot = rn >= FOMO_DAYS;
            }
          }
        }
      }
      stEl.textContent = '봇 연동'; stEl.className = 'status live';
    }else if(bars && bars.length >= 3){
      var n = bars.length;
      px = bars[n-1].close;
      if(sessionDone){                 // 세션 종료 → 당일 종가가 p1
        p1 = bars[n-1].close; p2 = bars[n-2].close;
        src = sym + '.CME 1분봉 · 다음 거래일 기준';
      }else{                           // 장중·마감 직후 → 오늘 쓸 기준가
        p1 = bars[n-2].close; p2 = bars[n-3].close;
        src = sym + '.CME 1분봉 · 실시간';
        // 봇이 확정한 종가(한투)가 있으면 기준가는 그 값으로
        if(BQ && BQ.date === bars[n-2].date && BQ.px != null){
          p1 = BQ.px; if(BQ.p1 != null) p2 = BQ.p1;
          src = sym + ' 실시간 · 기준가 봇 종가';
          for(var _q = mabars.length-1; _q >= 0; _q--){        // MA·포모에도 봇 종가 반영
            if(mabars[_q].date === BQ.date){ mabars[_q] = {date:BQ.date, close:BQ.px}; break; }
          }
        }
      }
      thr = flr(Math.min(p1,p2) * (1 - buyPct/100));
      asof = bars[n-1].date;
      // 공격모드: p1이 MA20 위면 T1은 상승 돌파로 매수
      if(ATK_ON && mabars && mabars.length >= 21){
        var mn = mabars.length;
        var base = sessionDone ? mn-1 : mn-2;
        var sma = 0, cnt = 0;
        for(var k = base-19; k <= base; k++){ if(mabars[k]) { sma += mabars[k].close; cnt++; } }
        if(cnt === 20){
          sma /= 20;
          if(p1 > sma){
            isAtk = true;
            atkThr = Math.ceil(p1 * (1 + ATK_BUY/100) / 0.25) * 0.25;
            // 포모: 전일까지 N일 연속 상승
            if(FOMO_DAYS > 0){
              var run = 0;
              for(var f = 0; f < FOMO_DAYS; f++){
                if(mabars[base-f] && mabars[base-f-1] && mabars[base-f].close > mabars[base-f-1].close) run++;
                else break;
              }
              fomoRun = run;
              fomoHot = run >= FOMO_DAYS;
            }
          }
        }
      }
      stEl.textContent = sessionDone ? '다음 기준' : '직접 계산';
      stEl.className = 'status ' + (sessionDone ? 'live' : 'err');
    }else{
      stEl.textContent = '오류'; stEl.className = 'status err';
      document.getElementById('asof').textContent = ctx.err || '데이터 없음';
      document.getElementById('todo').innerHTML =
        '<div class="lb">오류</div><div class="big">데이터 없음</div>' +
        '<div class="sub">' + (ctx.err || '') + '</div>';
      return;
    }

    // 다음 판정일 = 다음 영업일 (한국 기준 미국장 마감 다음날 새벽)
    var nd = new Date(asof + 'T00:00:00Z');
    if(sessionDone || botRolled){   // 판정이 끝난 날이면 다음 영업일이 판정일
      do { nd.setUTCDate(nd.getUTCDate()+1); } while (nd.getUTCDay()===0 || nd.getUTCDay()===6);
    }else{             // 아직이면 오늘(asof)이 판정일
      while (nd.getUTCDay()===0 || nd.getUTCDay()===6) nd.setUTCDate(nd.getUTCDate()+1);
    }
    var wk = ['일','월','화','수','목','금','토'];
    var ndStr = (nd.getUTCMonth()+1) + '/' + nd.getUTCDate() + '(' + wk[nd.getUTCDay()] + ')';
    var kd = new Date(nd.getTime() + 86400000);   // 한국은 하루 뒤 새벽
    var kdStr = (kd.getUTCMonth()+1) + '/' + kd.getUTCDate() + '(' + wk[kd.getUTCDay()] + ') 05:00';

    document.getElementById('asof').innerHTML =
      sym + ' · ' + src + '<br>'
      + '<span style="color:var(--gold)">다음 판정 ' + ndStr + ' 미국장 → 한국 ' + kdStr + '</span>';

    document.getElementById('cPx').textContent = fmt(px);
    var prevC = (botRolled || sessionDone) ? p2 : p1;   // 판정 끝난 날은 p1=당일 종가라 전일은 p2
    var chg = prevC ? (px/prevC - 1)*100 : 0;
    var chgEl = document.getElementById('cChg');
    chgEl.textContent = (chg>0?'+':'') + chg.toFixed(2) + '%';
    chgEl.className = 's ' + (chg>0?'up':chg<0?'down':'');
    var pos = (BOT && BOT.positions && BOT.positions.length) ? BOT.positions : [];
    var _t1atk = isAtk && pos.length === 0;   // 상단 요약은 현재 보유 기준
    document.getElementById('cThr').textContent = fmt(_t1atk ? atkThr : thr);
    document.getElementById('cLow').textContent = _t1atk
      ? ('전일 ' + fmt(p1,0) + ' × +' + ATK_BUY + '% [공격]')
      : ('최근2일 저가 ' + fmt(Math.min(p1,p2),0));

    var held = 0;
    for(var i=0;i<pos.length;i++) held += (pos[i].qty || 1);
    document.getElementById('cPos').textContent = pos.length + ' / ' + tiers;
    document.getElementById('cQty').textContent = held + '계약';

    var totalQ = (BQ && BQ.total_q) || tiers;
    var lad = ladder(totalQ, tiers);
    var today = ymd(0);
    var orders = [];

    // ① 매도부터 — 오늘 나갈 수량을 먼저 센다
    var sellRows = [], sellQty = 0;
    for(i=0;i<pos.length;i++){
      var p = pos[i];
      var dd = bizDays(p.date, today);
      var moc = dd >= hold;
      var sp  = moc ? null : cel(p.entry*(1+sellPctOf(p)/100));
      var q   = p.qty || 1;
      if(moc || px >= sp) sellQty += q;
      sellRows.push({ t: moc?'MOC':'매도', cls: moc?'t-m':'t-s', px: sp, qty: q,
        memo: 'T' + (i+1) + ' · 진입 ' + fmt(p.entry) + ' · D+' + dd + (moc?' · 오늘 청산':'') });
    }

    // ② 오늘 전량 청산되면 사이클이 끝나므로 같은 날 매수는 T1 자리로 본다
    var stepNow = pos.length;
    if(held > 0 && sellQty >= held) stepNow = 0;

    // 매수 주문은 "그 가격에 끝났을 때" 기준으로 티어를 정한다
    //  - 그 가격이 익절가 이상이면 보유분이 먼저 청산 → 사이클 리셋 → T1 자리
    //  - 아니면 보유분 그대로 → 다음 티어 자리
    function stepAt(X){
      var c = 0;
      for(var k=0;k<sellRows.length;k++){ var r = sellRows[k]; if(r.t === 'MOC' || X >= r.px) c += r.qty; }
      return (held > 0 && c >= held) ? 0 : pos.length;
    }
    function buyRow(kind, X){                         // kind: 'atk' | 'def'
      var st = stepAt(X);
      if(st >= tiers) return;
      if(kind === 'atk' && !(isAtk && st === 0)) return;           // 공격 진입은 T1 자리에서만
      if(kind === 'def' && isAtk && st === 0 && !ATK_BOTH) return;  // 공격모드 T1은 양방향일 때만 방어 진입
      var q = lad[st] || 1;
      if(kind === 'atk' && fomoHot) q = Math.floor(q * FOMO_MULT);
      var hit = kind === 'atk' ? px >= X : px <= X;
      orders.push({ t:'매수', cls:'t-b', px:X, qty:q,
        memo:'T' + (st+1) + ' · '
             + (kind === 'atk' ? ('전일 +' + ATK_BUY + '% [공격]' + (fomoHot ? ' 🔥×' + FOMO_MULT : ''))
                               : ('최근2일 저가 −' + buyPct + '% [방어]'))
             + (st === 0 && pos.length ? ' · 청산 후 재진입' : '')
             + ' · ' + (hit ? '✅ 충족' : '대기') });
    }
    if(isAtk) buyRow('atk', atkThr);
    buyRow('def', thr);
    for(i=0;i<sellRows.length;i++) orders.push(sellRows[i]);

    document.getElementById('ordCnt').textContent = orders.length + '건';
    if(orders.length){
      var rows = '';
      for(i=0;i<orders.length;i++){
        var o = orders[i];
        rows += '<tr><td class="sym">' + sym + '</td>'
              + '<td><span class="tag ' + o.cls + '">' + o.t + '</span></td>'
              + '<td style="font-size:11px;color:var(--dim)">' + (o.px==null?'시장가':'LOC') + '</td>'
              + '<td class="px">' + (o.px==null?'—':fmt(o.px)) + '</td>'
              + '<td class="qty"><b>' + o.qty + '</b></td></tr>'
              + '<tr><td class="memo" colspan="5">' + o.memo + '</td></tr>';
      }
      document.getElementById('ordBody').innerHTML =
        '<table class="tbl"><thead><tr><th>종목</th><th>구분</th><th>주문</th>'
        + '<th style="text-align:right">주문가</th><th style="text-align:right">수량</th></tr></thead>'
        + '<tbody>' + rows + '</tbody></table>';
    }else{
      document.getElementById('ordBody').innerHTML = '<div class="empty">주문 없음</div>';
    }

    // T1 자리가 비어 있고(또는 오늘 전량 청산되고) 공격모드면 T1은 상승 돌파 조건
    var t1Atk   = isAtk && stepNow === 0;
    if(t1Atk && ATK_BOTH && px < atkThr && px <= thr) t1Atk = false;
    var showThr = t1Atk ? atkThr : thr;
    var sign    = t1Atk ? '이상' : '이하';
    var canBuy  = stepNow < tiers;
    var buyHit  = canBuy && (t1Atk ? (px >= atkThr) : (px <= thr));

    function mtag(isAtkPos){
      return '<span class="mtag ' + (isAtkPos ? 'atk' : 'def') + '">'
             + (isAtkPos ? '공격' : '방어') + '</span>';
    }
    function trow(tagCls, tagTxt, tier, badge, val, hit){
      return '<div class="trow' + (hit ? ' on' : '') + '">'
        + '<span class="tl"><span class="tag ' + tagCls + '">' + tagTxt + '</span>'
        + tier + (badge || '') + '</span>'
        + '<span class="tr">' + val + (hit ? ' <span class="hit">✅</span>' : '') + '</span></div>';
    }

    var rows = '', mocQty = 0, sellHit = false;
    var atkSt = isAtk ? stepAt(atkThr) : 9;                 // 공격가에 끝나면 몇 번째 티어 자리인지
    var defSt = stepAt(thr);                                 // 방어가에 끝나면
    var showAtk = isAtk && atkSt === 0;
    var showDef = defSt < tiers && !(isAtk && defSt === 0 && !ATK_BOTH);
    buyHit = (showAtk && px >= atkThr) || (showDef && px <= thr);
    if(showAtk) rows += trow('t-b', '매수', 'T1', mtag(true), fmt(atkThr) + ' 이상', px >= atkThr);
    if(showDef) rows += trow('t-b', '매수', 'T' + (defSt + 1), defSt === 0 ? mtag(false) : '', fmt(thr) + ' 이하', px <= thr);
    for(i=0;i<pos.length;i++){
      var pp  = pos[i];
      var dd2 = bizDays(pp.date, today);
      if(dd2 >= hold){
        mocQty += (pp.qty || 1);
        rows += trow('t-m', 'MOC', 'T' + (i+1), mtag(pp.m === 'atk'), '시장가', true);
      }else{
        var sp = cel(pp.entry*(1+sellPctOf(pp)/100));
        var ht = px >= sp;
        if(ht) sellHit = true;
        rows += trow('t-s', '매도', 'T' + (i+1), mtag(pp.m === 'atk'),
                     fmt(sp) + ' 이상', ht);
      }
    }

    var cls = mocQty > 0 ? 't-sell'
            : (buyHit && sellHit) ? 't-both'
            : buyHit  ? 't-buy'
            : sellHit ? 't-sell' : 't-none';

    // 지금 이 가격으로 끝나면? (장중 실시간일 때)
    var live = !botRolled && !sessionDone;
    var gauge = '';
    if(live){
      var dPct = function(t){ return (t/px - 1)*100; };
      var lines = [], vs = [];
      // ① 청산
      for(var k=0;k<sellRows.length;k++){
        var r = sellRows[k];
        if(r.t === 'MOC') vs.push('<b style="color:#fff">' + r.memo.split(' · ')[0] + ' 만기청산</b>');
        else if(px >= r.px) vs.push('<b style="color:#7dd3fc">' + r.memo.split(' · ')[0] + ' 익절</b>');
      }
      // ② 매수 (청산 후 자리 기준)
      var nowSt = stepAt(px);
      if(nowSt < tiers){
        if(isAtk && nowSt === 0 && px >= atkThr) vs.push('<b style="color:#fde047">공격 매수 T1' + (fomoHot ? ' 🔥 포모' : '') + '</b>');
        else if(px <= thr && !(isAtk && nowSt === 0 && !ATK_BOTH)) vs.push('<b style="color:#86efac">방어 매수 T' + (nowSt+1) + '</b>');
      }
      var verdict = vs.length ? vs.join(' · ') : '<b style="color:#fff">주문 없음</b>';
      if(showAtk) lines.push('공격까지 ' + (px >= atkThr ? '✅' : '+' + dPct(atkThr).toFixed(2) + '% (' + (atkThr-px).toFixed(2) + 'pt)'));
      if(showDef) lines.push('방어까지 ' + (px <= thr ? '✅' : dPct(thr).toFixed(2) + '% (' + (thr-px).toFixed(2) + 'pt)'));
      var bar = '';
      if(showAtk && showDef && atkThr > thr){
        var pos01 = Math.max(0, Math.min(1, (px - thr)/(atkThr - thr)));
        bar = '<div style="position:relative;height:6px;border-radius:3px;margin:8px 0 2px;'
            + 'background:linear-gradient(90deg,var(--green),#333 20%,#333 80%,var(--gold))">'
            + '<div style="position:absolute;top:-4px;left:calc(' + (pos01*100).toFixed(1) + '% - 7px);width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid #111"></div></div>'
            + '<div style="display:flex;justify-content:space-between;font-size:10px;color:rgba(255,255,255,.8)"><span>방어 ' + fmt(thr) + '</span><span>공격 ' + fmt(atkThr) + '</span></div>';
      }
      gauge = '<div style="margin-top:10px;padding-top:10px;border-top:1px dashed rgba(255,255,255,.35)">'
            + '<div style="font-size:13px;color:#fff">지금 끝나면 → ' + verdict + '</div>'
            + (lines.length ? '<div style="font-size:11px;color:rgba(255,255,255,.85);margin-top:4px">' + lines.join(' · ') + '</div>' : '')
            + bar + '</div>';
    }

    var todo = document.getElementById('todo');
    todo.className = 'todo ' + cls;
    todo.innerHTML =
      '<div class="lb">' + (sessionDone ? ndStr + ' 미국장' : '오늘') + ' 할 일</div>'
      + (rows || '<div class="trow"><span class="tl">주문 없음</span></div>')
      + '<div class="sub">' + (live ? '현재가 ' : '종가 ') + fmt(px) + ' · 보유 ' + pos.length + '/' + tiers + '티어 · ' + held + '계약'
      + (t1Atk && fomoHot ? ' · 🔥 포모 ' + fomoRun + '일연속 ×' + FOMO_MULT : '') + '</div>'
      + gauge;
    try{
      var _base = live ? p1 : (botRolled || sessionDone ? p2 : p1);
      drawChart({prev:_base, thr: (live && showDef) ? thr : null, atkThr: (live && showAtk) ? atkThr : null,
        tps: pos.map(function(q, k){ return {lab:'T'+(k+1)+' 익절', px: cel(q.entry*(1+sellPctOf(q)/100))}; })});
    }catch(e){ document.getElementById('chartBox').style.display = 'none'; }

    document.getElementById('posSrc').innerHTML = BOT
      ? '<span style="color:var(--green)">🤖 봇</span>' : '—';
    if(pos.length){
      var prows = '';
      var FXv = (BOT && BOT.cfg && BOT.cfg.fx) ? +BOT.cfg.fx : 1360;
      var won = function(v){ var a = Math.abs(v); return (v<0?'−':'+') + (a>=1e8 ? (a/1e8).toFixed(2)+'억' : Math.round(a/1e4).toLocaleString()+'만'); };
      var totPt = 0, totKrw = 0, totUsd = 0;
      pos.forEach(function(q){
        var qq = +(q.qty || 1), pt = px - q.entry;
        totPt += pt*qq; totUsd += pt*2*qq; totKrw += pt*2*qq*FXv;
      });
      var eqv = (BOT && BOT.equity) ? +BOT.equity : null;
      var pc = function(v){ return v>0 ? 'var(--green)' : v<0 ? 'var(--red)' : 'var(--dim)'; };
      var pnlHead = '<div style="display:flex;align-items:baseline;gap:10px;padding:10px 14px 4px;font-family:\'JetBrains Mono\',monospace">'
        + '<span style="font-size:11px;color:var(--dim)">평가손익</span>'
        + '<span style="font-size:22px;font-weight:800;color:' + pc(totKrw) + '">' + won(totKrw) + '</span>'
        + '<span style="font-size:12px;color:' + pc(totKrw) + '">' + (totUsd>=0?'+$':'−$') + Math.abs(totUsd).toFixed(0)
        + (eqv ? ' · ' + (totKrw/eqv*100>=0?'+':'') + (totKrw/eqv*100).toFixed(2) + '%' : '') + '</span>'
        + '<span style="margin-left:auto;font-size:10px;color:var(--dim)">' + (live ? '현재가 ' + fmt(px) + ' · 야후 ~10분 지연' : '종가 ' + fmt(px)) + '</span></div>';
      for(i=0;i<pos.length;i++){
        var q = pos[i];
        var d2 = bizDays(q.date, today);
        var qn = +(q.qty || 1), ptq = px - q.entry, krw = ptq*2*qn*FXv;
        var tgtq = cel(q.entry*(1+sellPctOf(q)/100));
        prows += '<tr><td><b style="color:' + ['#38bdf8','#facc15','#f472b6'][i % 3] + '">T' + (i+1) + '</b><div style="font-size:10px;color:var(--dim)">' + q.date.slice(5) + '</div></td>'
               + '<td class="px">' + fmt(q.entry)
               + ' <span style="font-size:10px;color:' + (q.m === 'atk' ? 'var(--gold)' : 'var(--dim)') + '">'
               + (q.m === 'atk' ? '공격' : '방어') + '</span></td>'
               + '<td class="px">' + fmt(tgtq)
               + '<div style="font-size:10px;color:var(--dim)">' + (px>=tgtq ? '✅ 도달' : '+' + (tgtq-px).toFixed(2) + 'pt') + '</div></td>'
               + '<td class="px" style="color:' + pc(krw) + '">' + won(krw)
               + '<div style="font-size:10px">' + (ptq>=0?'+':'') + ptq.toFixed(2) + 'pt · ' + (ptq/q.entry*100>=0?'+':'') + (ptq/q.entry*100).toFixed(2) + '%</div></td>'
               + '<td class="qty">' + qn + '계약<div style="font-size:10px;color:var(--dim)">' + (d2>=hold ? '<b style="color:var(--gold)">MOC</b>' : 'D+'+d2) + '</div></td></tr>';
      }
      document.getElementById('posBody').innerHTML =
        pnlHead + '<table class="tbl"><thead><tr><th>T</th>'
        + '<th style="text-align:right">진입가</th><th style="text-align:right">익절가</th>'
        + '<th style="text-align:right">평가</th>'
        + '<th style="text-align:right">수량</th></tr></thead><tbody>' + prows + '</tbody></table>';
    }else{
      document.getElementById('posBody').innerHTML = '<div class="empty">보유 없음</div>';
    }

    renderPnl(BOT, (typeof totKrw === "number") ? totKrw : 0);
    renderBand(BOT, bars);

    if(BOT && BOT.cfg){
      document.getElementById('cfgBody').innerHTML =
        '<table class="tbl"><tbody>'
        + '<tr><td style="color:var(--dim);font-size:11px">복리</td><td class="px">' + fmt(cfg.per,0) + '만</td>'
        + '<td style="color:var(--dim);font-size:11px">기준선</td><td class="px">' + fmt(cfg.icap,0) + '만</td></tr>'
        + '<tr><td style="color:var(--dim);font-size:11px">매수/매도</td><td class="px">' + buyPct + '/' + sellPct + '%' + (ATK_ON ? ' <span style="color:var(--dim);font-size:10px">공격 ' + ATK_SELL + '%</span>' : '') + '</td>'
        + '<td style="color:var(--dim);font-size:11px">보유일</td><td class="px">' + hold + '일</td></tr>'
        + '<tr><td style="color:var(--dim);font-size:11px">총납입</td><td class="px">' + fmt(cfg.paid,0) + '만</td>'
        + '<td style="color:var(--dim);font-size:11px">티어</td><td class="px">' + tiers + '</td></tr>'
        + '</tbody></table>';
    }else{
      document.getElementById('cfgBody').innerHTML = '<div class="empty">봇 데이터 없음</div>';
    }
  }).catch(function(e){
    stEl.textContent = '오류'; stEl.className = 'status err';
    document.getElementById('asof').textContent = e.message;
    console.error(e);
  });
}

render();
setInterval(render, 60000);
</script>
</body>
</html>
