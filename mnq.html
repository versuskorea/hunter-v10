<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎯 MNQ 방어모드</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#08080a;--card:#111118;--card2:#1a1a1f;--border:#222233;--accent:#3b82f6;--green:#22c55e;--red:#ef4444;--text:#f0f0f0;--dim:#666;--top:#a78bfa;--gold:#fbbf24}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;padding:12px;max-width:600px;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;padding:6px 0 2px}
.back{font-size:13px;color:var(--accent);text-decoration:none;font-weight:700;padding:7px 12px;border:1px solid var(--border);border-radius:10px;white-space:nowrap}
.top h1{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;color:#fff}
.top h1 span{color:var(--accent)}
.status{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;padding:5px 10px;border-radius:20px;background:var(--card);color:var(--dim)}
.status.live{color:var(--green);border:1px solid var(--green)}
.status.err{color:var(--gold);border:1px solid var(--gold)}
.asof{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--dim);margin:4px 2px 14px}

.action{border-radius:14px;padding:18px 16px;margin-bottom:12px;text-align:center;font-weight:800}
.action .lb{font-size:11px;letter-spacing:1px;opacity:.8;margin-bottom:6px}
.action .msg{font-family:'JetBrains Mono',monospace;font-size:22px;line-height:1.3}
.action .sub{font-size:12px;font-weight:600;opacity:.85;margin-top:8px}
.a-buy{background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff}
.a-sell{background:linear-gradient(135deg,#7c3aed,#a78bfa);color:#fff}
.a-none{background:var(--card);color:var(--dim);border:1px solid var(--border)}

.px-card{display:flex;align-items:flex-end;gap:14px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.px-lab{font-size:11px;color:var(--dim);font-weight:600;margin-bottom:4px}
.px-big{font-family:'JetBrains Mono',monospace;font-size:30px;font-weight:800;line-height:1;color:#fff}
.px-chg{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:800;margin-top:4px}
.px-right{margin-left:auto;text-align:right}
.px-right .v{font-family:'JetBrains Mono',monospace;font-size:17px;font-weight:800}
.up{color:var(--green)}.down{color:var(--red)}

.lv{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:12px}
.lv-row{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border);position:relative}
.lv-row:last-child{border-bottom:none}
.lv-row .bar{position:absolute;left:0;top:0;bottom:0;width:4px}
.lv-row.sell .bar{background:var(--top)}
.lv-row.now .bar{background:var(--accent)}
.lv-row.buy .bar{background:var(--green)}
.lv-row.now{background:var(--card2)}
.lv-row .k{font-size:12px;font-weight:700;width:74px;color:var(--dim)}
.lv-row.sell .k{color:var(--top)}.lv-row.buy .k{color:var(--green)}.lv-row.now .k{color:#fff}
.lv-row .p{font-family:'JetBrains Mono',monospace;font-size:19px;font-weight:800}
.lv-row .g{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;color:var(--dim)}
.lv-row .note{font-size:10px;color:var(--dim);width:100%;padding-left:74px;margin-top:2px}

.ct{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--dim);letter-spacing:1.5px;text-transform:uppercase;margin:0 4px 8px;font-weight:700}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;font-family:'JetBrains Mono',monospace}
th,td{padding:11px 6px;text-align:right;font-size:13px;border-bottom:1px solid var(--border)}
th{background:var(--card2);color:var(--dim);font-weight:700;font-size:11px}
td:first-child,th:first-child{text-align:left;padding-left:14px;font-weight:800}
tr:last-child td{border-bottom:none}
tr.warn td{background:rgba(251,191,36,0.08)}
.empty{color:var(--dim);font-style:italic;text-align:center;padding:20px}

.sum{display:flex;gap:8px;margin-bottom:12px}
.sum-box{flex:1;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 8px;text-align:center}
.sum-box .k{font-size:10px;color:var(--dim);font-weight:600}
.sum-box .v{font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:800;margin-top:3px}

details{margin-top:14px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:2px 14px}
summary{font-size:13px;font-weight:700;color:var(--dim);cursor:pointer;padding:12px 0;list-style:none}
summary::-webkit-details-marker{display:none}
.field{margin:8px 0 14px}
.field label{display:block;font-size:11px;color:var(--dim);margin-bottom:5px;font-weight:600}
.field input{width:100%;background:#0a0a0f;border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;text-align:right;outline:none}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;padding:12px;background:#1a1a2a;color:var(--accent);border:1px solid var(--accent);border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;margin:4px 0 12px}
.btn-add{background:#0a1a0a;color:var(--green);border-color:var(--green)}
.btn-del{background:#1a0a0a;color:var(--red);border-color:var(--red);font-size:11px;padding:5px 9px;width:auto;margin:0}
.note{background:#0a0a14;border-radius:8px;padding:10px 12px;font-size:11px;color:var(--dim);line-height:1.6;margin-bottom:10px}
</style>
</head>
<body>
  <div class="top">
    <a href="/index.html" class="back">← 헌터</a>
    <h1>🎯 <span>MNQ</span></h1>
    <a href="/mnqbt.html" class="back" style="margin-left:auto;color:var(--gold);border-color:var(--gold)">📊 백테</a>
    <span class="status" id="status">연결중</span>
  </div>
  <div class="asof" id="asof">불러오는 중…</div>

  <div class="action a-none" id="action">
    <div class="lb">오늘 할 일</div>
    <div class="msg">—</div>
  </div>

  <div class="px-card">
    <div>
      <div class="px-lab">NQ 종가</div>
      <div class="px-big" id="px">—</div>
      <div class="px-chg" id="chg">—</div>
    </div>
    <div class="px-right">
      <div class="px-lab">3일 MA</div>
      <div class="v" id="ma3">—</div>
      <div class="px-lab" style="margin-top:8px">보유</div>
      <div class="v" id="tiers">—</div>
    </div>
  </div>

  <div class="ct">내일 주문 기준가</div>
  <div class="lv" id="levels"></div>

  <div class="sum">
    <div class="sum-box"><div class="k">투입 증거금</div><div class="v" id="s-marg">—</div></div>
    <div class="sum-box"><div class="k">평가손익</div><div class="v" id="s-pnl">—</div></div>
    <div class="sum-box"><div class="k">여유</div><div class="v" id="s-free">—</div></div>
  </div>

  <div class="ct">보유 티어</div>
  <table>
    <thead><tr><th>티어</th><th>진입일</th><th>진입가</th><th>경과</th><th>평가</th><th></th></tr></thead>
    <tbody id="pos"></tbody>
  </table>

  <details>
    <summary>⚙️ 설정 · 티어 입력</summary>
    <div class="field g2">
      <div><label>자본 (만원)</label><input id="cap" type="number" value="2200"></div>
      <div><label>계약수/티어</label><input id="qty" type="number" value="1"></div>
    </div>
    <div class="field g2">
      <div><label>진입가</label><input id="in-price" type="number" step="0.25" placeholder="29400"></div>
      <div><label>진입일</label><input id="in-date" type="date"></div>
    </div>
    <button class="btn btn-add" id="add">＋ 티어 추가</button>
    <div class="note">
      체결되면 여기에 진입가·진입일 기록. 브라우저에 저장됨.<br>
      매수 = min(MA3×0.994, 전일×1.055) · 매도 = MA3×1.007 · 8일 강제청산 · 5티어 상한
    </div>
    <div class="field g2">
      <div><label>실제 NQ 시세 (보정용)</label><input id="m-px" type="number" step="1" placeholder="29400"></div>
      <div><label>&nbsp;</label><button class="btn" id="calib" style="margin:0">📐 배율 보정</button></div>
    </div>
    <div class="note" id="calib-info">
      선물 심볼이 안 잡히면 QQQ 환산값을 쓴다. 실제 MNQ 시세를 넣고 보정하면 배율이 맞춰진다.
    </div>
    <button class="btn" id="reload">🔄 시세 새로고침</button>
  </details>

<script>
const SYM='NQ=F', MULT=2, MARGIN=200, FX=1390;   // MNQ: 승수$2, 증거금 200만/계약
const KEY='mnq-positions';

/* ── 스나이퍼 방어 공식 (헌터와 동일) ── */
function buyPrice(pc1,pc2){ const f=0.994; return Math.min(f*(pc1+pc2)/(3-f), pc1*1.055); }
function sellPrice(pc1,pc2){ return 1.007*(pc1+pc2)/(3-1.007); }

/* ── 데이터 (헌터 /api/history) ── */
const etDate=off=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(Date.now()+(off||0)*86400000));
function dropIntraday(bars){
  if(!bars||bars.length<2)return bars;
  const h=parseInt(new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',hour:'2-digit',hour12:false}).format(new Date()),10);
  const last=bars[bars.length-1];
  if(last.date===etDate(0)&&h<16)return bars.slice(0,-1);
  return bars;
}
async function fetchBars(symbol){
  const url=`/api/history?symbol=${encodeURIComponent(symbol)}&start=${etDate(-40)}&end=${etDate(1)}&_=${Date.now()}`;
  const r=await fetch(url,{cache:'no-store'});
  const d=await r.json();
  if(d.error||!d.bars||d.bars.length<5) throw new Error(d.error||'데이터 부족');
  return dropIntraday(d.bars);
}

/* 선물 시세 자동 조회: NQ=F → MNQ=F → QQQ 환산 순으로 시도 */
async function fetchNQ(){
  for(const sym of ['NQ=F','MNQ=F','^NDX']){
    try{
      const bars=await fetchBars(sym);
      const last=bars[bars.length-1].close;
      if(last>5000){   // NQ 지수 범위 확인
        return {bars, scale:1, src:sym};
      }
    }catch(e){ /* 다음 심볼 시도 */ }
  }
  // 폴백: QQQ × 자동배율
  const bars=await fetchBars('QQQ');
  let scale=+localStorage.getItem('mnq-scale')||41;
  return {bars, scale, src:'QQQ×'+scale.toFixed(1)};
}

/* ── 상태 ── */
let S={px:0,p1:0,p2:0,date:'',live:false};
function loadPos(){ try{return JSON.parse(localStorage.getItem(KEY))||[];}catch(e){return [];} }
function savePos(a){ localStorage.setItem(KEY,JSON.stringify(a)); }

function bizDays(from,to){
  let d=new Date(from),e=new Date(to),n=0;
  while(d<e){ d.setDate(d.getDate()+1); const w=d.getDay(); if(w!==0&&w!==6)n++; }
  return n;
}

async function load(){
  const st=document.getElementById('status'), asof=document.getElementById('asof');
  st.textContent='불러오는중'; st.className='status';
  try{
    const {bars,scale,src}=await fetchNQ();
    const n=bars.length;
    S={px:bars[n-1].close*scale, p1:bars[n-2].close*scale, p2:bars[n-3].close*scale,
       date:bars[n-1].date, live:true, src};
    st.textContent='실시간'; st.className='status live';
    asof.textContent=`${src} · ${S.date} 종가 ${S.px.toLocaleString(undefined,{maximumFractionDigits:0})}`;
  }catch(e){
    st.textContent='실패'; st.className='status err';
    asof.textContent='시세 실패 ('+e.message+') — 아래 수동값 사용';
    const mv=+document.getElementById('m-px').value;
    if(mv){ S={px:mv,p1:mv*1.004,p2:mv*1.008,date:etDate(0),live:false,src:'수동'}; }
  }
  render();
}

function render(){
  const {px,p1,p2}=S;
  const qty=+document.getElementById('qty').value||1;
  const cap=(+document.getElementById('cap').value||2200)*1e4;
  const pos=loadPos().sort((a,b)=>a.date.localeCompare(b.date));
  const ma3=(px+p1+p2)/3;
  const buy=buyPrice(px,p1), sell=sellPrice(px,p1);
  const today=etDate(0);

  document.getElementById('px').textContent=px?px.toLocaleString(undefined,{maximumFractionDigits:0}):'—';
  const ch=p1?(px/p1-1)*100:0;
  const chEl=document.getElementById('chg');
  chEl.textContent=(ch>0?'+':'')+ch.toFixed(2)+'%';
  chEl.className='px-chg '+(ch>0?'up':ch<0?'down':'');
  document.getElementById('ma3').textContent=ma3?ma3.toLocaleString(undefined,{maximumFractionDigits:0}):'—';
  document.getElementById('tiers').textContent=pos.length+' / 5';

  // 오늘 판정
  const toSell=pos.filter(p=>px>=sell || bizDays(p.date,today)>=8);
  const canBuy=pos.length<5 && px<=buy;
  const act=document.getElementById('action');
  if(toSell.length){
    act.className='action a-sell';
    act.innerHTML=`<div class="lb">오늘 할 일</div><div class="msg">매도 ${toSell.length}티어</div>
      <div class="sub">${toSell.map(p=>'T'+(pos.indexOf(p)+1)+'('+(bizDays(p.date,today)>=8?'8일':'MA')+')').join(' · ')} · 각 ${qty}계약</div>`;
  }else if(canBuy){
    act.className='action a-buy';
    act.innerHTML=`<div class="lb">오늘 할 일</div><div class="msg">T${pos.length+1} 매수</div>
      <div class="sub">${qty}계약 · 시장가</div>`;
  }else{
    act.className='action a-none';
    const gap=pos.length>=5?'5티어 풀':`매수까지 ${(px-buy).toFixed(0)}pt`;
    act.innerHTML=`<div class="lb">오늘 할 일</div><div class="msg">대기</div><div class="sub">${gap}</div>`;
  }

  // 기준가
  const lv=[
    {c:'sell',k:'매도',p:sell,n:'종가 ≥ 이면 익절 (MA3×1.007)',g:px?((sell/px-1)*100):0},
    {c:'now', k:'현재',p:px,  n:S.date+' 종가',g:0},
    {c:'buy', k:'매수',p:buy, n:'종가 ≤ 이면 매수 (MA3−0.6%)',g:px?((buy/px-1)*100):0},
  ];
  document.getElementById('levels').innerHTML=lv.map(x=>
    `<div class="lv-row ${x.c}"><span class="bar"></span><span class="k">${x.k}</span>
     <span class="p">${x.p?x.p.toLocaleString(undefined,{maximumFractionDigits:0}):'—'}</span>
     <span class="g">${x.g?((x.g>0?'+':'')+x.g.toFixed(2)+'%'):''}</span>
     <span class="note">${x.n}</span></div>`).join('');

  // 보유 티어
  let unreal=0;
  const rows=pos.map((p,i)=>{
    const d=bizDays(p.date,today);
    const pnl=(px-p.entry)*MULT*qty*FX;
    unreal+=pnl;
    const cls=pnl>=0?'up':'down';
    return `<tr class="${d>=8?'warn':''}">
      <td>T${i+1}</td><td>${p.date.slice(5)}</td>
      <td>${p.entry.toLocaleString(undefined,{maximumFractionDigits:0})}</td>
      <td>${d}일${d>=8?' ⚠️':''}</td>
      <td class="${cls}">${(pnl/1e4>=0?'+':'')+(pnl/1e4).toFixed(0)}만</td>
      <td><button class="btn btn-del" onclick="delPos(${i})">삭제</button></td></tr>`;
  });
  document.getElementById('pos').innerHTML=rows.length?rows.join(''):'<tr><td colspan="6" class="empty">보유 없음</td></tr>';

  const marg=pos.length*qty*MARGIN*1e4;
  document.getElementById('s-marg').textContent=(marg/1e4).toLocaleString()+'만';
  const pe=document.getElementById('s-pnl');
  pe.textContent=(unreal/1e4>=0?'+':'')+(unreal/1e4).toFixed(0)+'만';
  pe.className='v '+(unreal>=0?'up':'down');
  const free=cap+unreal-marg;
  const fe=document.getElementById('s-free');
  fe.textContent=(free/1e4).toFixed(0)+'만';
  fe.className='v '+(free<marg*0.3?'down':'');
}

window.delPos=i=>{ const a=loadPos().sort((x,y)=>x.date.localeCompare(y.date)); a.splice(i,1); savePos(a); render(); };
document.getElementById('add').addEventListener('click',()=>{
  const p=+document.getElementById('in-price').value;
  const d=document.getElementById('in-date').value;
  if(!p||!d){alert('진입가와 진입일을 입력하세요');return;}
  const a=loadPos(); a.push({entry:p,date:d}); savePos(a);
  document.getElementById('in-price').value='';
  render();
});
document.getElementById('reload').addEventListener('click',load);
document.getElementById('calib').addEventListener('click',async()=>{
  const real=+document.getElementById('m-px').value;
  if(!real){alert('실제 NQ 시세를 입력하세요');return;}
  try{
    const bars=await fetchBars('QQQ');
    const q=bars[bars.length-1].close;
    const scale=real/q;
    localStorage.setItem('mnq-scale',scale.toFixed(4));
    document.getElementById('calib-info').textContent=
      `보정 완료 · QQQ ${q.toFixed(2)} × ${scale.toFixed(2)} = ${real.toLocaleString()}`;
    load();
  }catch(e){ alert('보정 실패: '+e.message); }
});
document.querySelectorAll('#cap,#qty').forEach(e=>e.addEventListener('input',render));
document.getElementById('in-date').value=etDate(0);
load();
</script>
</body>
</html>
