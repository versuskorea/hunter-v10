<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎯 MNQ 주문</title>
<meta http-equiv="Cache-Control" content="no-store, must-revalidate">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#08080a;--card:#111118;--card2:#1a1a1f;--border:#222233;--accent:#3b82f6;--green:#22c55e;--red:#ef4444;--text:#f0f0f0;--dim:#666;--top:#a78bfa;--gold:#fbbf24}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;padding:12px;max-width:600px;margin:0 auto}
.top{display:flex;align-items:center;gap:8px;padding:6px 0 2px}
.back{font-size:12px;color:var(--accent);text-decoration:none;font-weight:700;padding:6px 10px;border:1px solid var(--border);border-radius:9px;white-space:nowrap}
.top h1{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:2px;color:#fff}
.top h1 span{color:var(--accent)}
.status{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;padding:5px 9px;border-radius:20px;background:var(--card);color:var(--dim)}
.status.live{color:var(--green);border:1px solid var(--green)}
.status.err{color:var(--gold);border:1px solid var(--gold)}
.asof{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--dim);margin:4px 2px 12px}

/* 오늘 할 일 */
.todo{border-radius:15px;padding:16px;margin-bottom:12px}
.todo .lb{font-size:10px;letter-spacing:1.5px;opacity:.75;font-weight:700}
.todo .big{font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:800;line-height:1.25;margin-top:5px}
.todo .sub{font-size:12px;font-weight:600;opacity:.9;margin-top:6px;line-height:1.5}
.t-buy{background:linear-gradient(135deg,#15803d,#22c55e);color:#fff}
.t-sell{background:linear-gradient(135deg,#6d28d9,#a78bfa);color:#fff}
.t-both{background:linear-gradient(135deg,#0369a1,#3b82f6);color:#fff}
.t-none{background:var(--card);color:var(--dim);border:1px solid var(--border)}

/* 주문표 */
.ordbox{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:12px}
.ordhead{background:var(--card2);padding:9px 14px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--dim);letter-spacing:1.2px;font-weight:700;display:flex;align-items:center}
.ordhead .r{margin-left:auto;font-size:10px}
.ord{display:flex;align-items:center;padding:13px 14px;border-bottom:1px solid var(--border);gap:10px}
.ord:last-child{border-bottom:none}
.ord .tag{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:800;padding:3px 8px;border-radius:6px;min-width:44px;text-align:center}
.tag-b{background:#0d2818;color:var(--green);border:1px solid var(--green)}
.tag-s{background:#1c1030;color:var(--top);border:1px solid var(--top)}
.tag-m{background:#2a1f08;color:var(--gold);border:1px solid var(--gold)}
.ord .px{font-family:'JetBrains Mono',monospace;font-size:19px;font-weight:800}
.ord .qty{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--dim);margin-left:auto;text-align:right}
.ord .qty b{color:var(--text);font-size:14px}
.ord .memo{font-size:10px;color:var(--dim);width:100%;padding-left:54px;margin-top:2px}
.ord-buy{background:linear-gradient(90deg,rgba(34,197,94,.14),transparent)}
.ord-hit{background:linear-gradient(90deg,rgba(167,139,250,.14),transparent)}
.ord-wait{opacity:.42}
.ord-buy .px{color:var(--green)}
.px-big{font-size:27px !important;letter-spacing:-.5px}
.qtybar{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--accent);border-radius:12px;padding:9px 12px;margin-bottom:9px}
.qtybar .ql{font-size:11px;color:var(--accent);font-weight:800;letter-spacing:.5px}
.qtybar input{width:62px;background:#0a0a0f;border:1px solid var(--border);border-radius:8px;padding:7px 4px;color:#fff;font-family:'JetBrains Mono',monospace;font-size:19px;font-weight:800;text-align:center;outline:none;-webkit-appearance:none}
.qtybar .qb{width:34px;height:34px;background:#161622;color:var(--accent);border:1px solid var(--border);border-radius:9px;font-size:19px;font-weight:800;cursor:pointer;line-height:1}
.qtybar .qb:active{background:var(--accent);color:#fff}
.qtybar .qinfo{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--dim);text-align:right;line-height:1.5}
.up{color:var(--green)}.down{color:var(--red)}

/* 현재가 */
.now{display:flex;align-items:flex-end;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:13px 15px;margin-bottom:12px}
.now .k{font-size:10px;color:var(--dim);font-weight:600;margin-bottom:3px}
.now .big{font-family:'JetBrains Mono',monospace;font-size:28px;font-weight:800;line-height:1;color:#fff}
.now .chg{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:800;margin-top:3px}
.now .rt{margin-left:auto;text-align:right}
.now .rt .v{font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:800}

.sum{display:flex;gap:7px;margin-bottom:12px}
.sbox{flex:1;background:var(--card);border:1px solid var(--border);border-radius:11px;padding:10px 6px;text-align:center}
.sbox .k{font-size:9px;color:var(--dim);font-weight:600}
.sbox .v{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:800;margin-top:3px}

.ct{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--dim);letter-spacing:1.3px;text-transform:uppercase;margin:14px 4px 7px;font-weight:700}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--border);border-radius:13px;overflow:hidden;font-family:'JetBrains Mono',monospace}
th,td{padding:10px 5px;text-align:right;font-size:12px;border-bottom:1px solid var(--border)}
th{background:var(--card2);color:var(--dim);font-weight:700;font-size:10px}
td:first-child,th:first-child{text-align:left;padding-left:12px;font-weight:800}
tr:last-child td{border-bottom:none}
tr.d0 td{background:rgba(251,191,36,.09)}
.empty{color:var(--dim);text-align:center;padding:20px;font-style:italic;font-size:12px}
.bdel{background:#1a0a0a;color:var(--red);border:1px solid var(--red);border-radius:6px;font-size:10px;padding:4px 8px;cursor:pointer}

details{margin-top:12px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:2px 13px}
summary{font-size:12px;font-weight:700;color:var(--dim);cursor:pointer;padding:11px 0;list-style:none}
summary::-webkit-details-marker{display:none}
.f{margin:7px 0 12px}
.f label{display:block;font-size:10px;color:var(--dim);margin-bottom:4px;font-weight:600}
.f input,.f select{width:100%;background:#0a0a0f;border:1px solid var(--border);border-radius:8px;padding:9px 11px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;text-align:center;outline:none;-webkit-appearance:none}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.btn{width:100%;padding:11px;background:#1a1a2a;color:var(--accent);border:1px solid var(--accent);border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;margin:3px 0 10px;font-family:'DM Sans',sans-serif}
.btn-add{background:#0a1a0a;color:var(--green);border-color:var(--green)}
.note{background:#0a0a14;border-radius:8px;padding:9px 11px;font-size:10px;color:var(--dim);line-height:1.6;margin-bottom:9px}
</style>

  <div class="top">

    <span class="status" id="status">연결중</span>
  </div>
  <div class="asof" id="asof">불러오는 중…</div>

    <div class="lb">오늘 할 일</div><div class="big">—</div>
  </div>

  <div id="expWarn" style="font-size:12px;color:var(--gold);margin:0 4px 8px;font-weight:700"></div>\n  <div class="ct">📋 오늘 주문표</div>
  <div class="qtybar">
    <span class="ql">계약/티어</span>

  <details>

    <div class="f g3">
      <div><label>티어</label><input id="ntier" type="number" value="3"></div>

      매수 = min(전일종가, 그제종가) × (1−매수%) · 내림<br>
      매도 = 각 티어 진입가 × (1+매도%) · 올림 · 보유일 초과 시 MOC<br>
      MOC 있는 날엔 다른 매도 주문 없음 (명세 공통규칙)

        <option value="1">16:00 ET (한국 5시)</option>
        <option value="0">17:00 ET (선물 마감)</option>

    </div>

      <div><label>수동 NQ 시세</label><input id="mpx" type="number" step="1" placeholder="자동 실패 시"></div>
      <div><label>&nbsp;</label><button class="btn" id="calib" style="margin:0">📐 배율 보정</button></div>
    </div>
  </details>

<script>
const MULT=2, FX=1390, TICK=0.25, KEY='mnq-pos-v2';
let USE_1600 = localStorage.getItem('mnq-1600')!=='0';

/* ── 주문가 계산 ── */
const flr = v => Math.floor(v/TICK)*TICK;
const cel = v => Math.ceil (v/TICK)*TICK;
const buyPrice  = (p1,p2,pct) => flr(Math.min(p1,p2)*(1-pct/100));
const sellPrice = (entry,pct) => cel(entry*(1+pct/100));

/* ── 월물 ── */
function thirdFriday(y,m){
  let c=0;
  for(let d=1;d<=31;d++){
    const dt=new Date(Date.UTC(y,m-1,d));
    if(dt.getUTCMonth()+1!==m) break;
    if(dt.getUTCDay()===5){ c++; if(c===3) return dt; }
  }
  return null;
}
function contractInfo(rollDays=7){
  const M={3:'H',6:'M',9:'U',12:'Z'};
  const now=new Date();
  for(let y=now.getUTCFullYear(); y<=now.getUTCFullYear()+1; y++){
    for(const q of [3,6,9,12]){
      const exp=thirdFriday(y,q);
      if(exp && exp>=now){
        const d2e=Math.ceil((exp-now)/864e5);
        if(d2e>rollDays)
          return {code:`MNQ${M[q]}${String(y).slice(2)}`, exp, d2e, roll:false};
        // 만기 임박 → 다음 월물
        const nq=q===12?3:q+3, ny=q===12?y+1:y;
        const ne=thirdFriday(ny,nq);
        return {code:`MNQ${M[nq]}${String(ny).slice(2)}`, exp:ne,
                d2e:Math.ceil((ne-now)/864e5), roll:true, oldD2e:d2e,
                oldCode:`MNQ${M[q]}${String(y).slice(2)}`};
      }
    }
  }
  return {code:'MNQZ26', exp:null, d2e:99, roll:false};
}

/* ── 데이터 ── */
const etDate = off => new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York',
  year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(Date.now()+(off||0)*864e5));
function dropIntraday(bars){
  if(!bars||bars.length<2) return bars;
  const h=parseInt(new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',hour:'2-digit',hour12:false}).format(new Date()),10);
  const last=bars[bars.length-1];
  if(last.date===etDate(0)&&h<16) return bars.slice(0,-1);
  return bars;
}
async function fetchBars(sym){
  const r=await fetch(`/api/history?symbol=${encodeURIComponent(sym)}&start=${etDate(-40)}&end=${etDate(1)}&_=${Date.now()}`,{cache:'no-store'});
  const d=await r.json();
  if(d.error||!d.bars||d.bars.length<4) throw new Error(d.error||'데이터 부족');
  return dropIntraday(d.bars);
}
async function fetch1600(sym='NQ=F'){
  /* 5분봉에서 매일 16:00 ET(한국 5시) 값만 추출 */
  const r=await fetch(`/api/history?symbol=${encodeURIComponent(sym)}&start=${etDate(-12)}&end=${etDate(1)}&interval=5m&_=${Date.now()}`,{cache:'no-store'});
  const d=await r.json();
  if(d.error||!d.bars) throw new Error(d.error||'분봉 없음');
  const byDay={};
  for(const b of d.bars){
    if(!b.etTime||b.close==null) continue;
    const [h,m]=b.etTime.split(':').map(Number);
    const mins=h*60+m;
    if(mins>16*60) continue;                       // 16:00 이후 제외
    if(!byDay[b.date]||mins>byDay[b.date].mins) byDay[b.date]={mins,close:b.close};
  }
  return Object.keys(byDay).sort().map(k=>({date:k,close:byDay[k].close}));
}

async function fetchNQ(){
  if(USE_1600){
    try{
      const b=await fetch1600('NQ=F');
      if(b.length>=3 && b[b.length-1].close>5000)
        return {bars:b,scale:1,src:'NQ=F 16:00ET'};
    }catch(e){ console.log('16:00 조회 실패',e.message); }
  }
  for(const sym of ['NQ=F','^NDX']){
    try{ const b=await fetchBars(sym); if(b[b.length-1].close>5000) return {bars:b,scale:1,src:sym}; }catch(e){}
  }
  const b=await fetchBars('QQQ');
  const sc=+localStorage.getItem('mnq-scale')||41.4;
  return {bars:b,scale:sc,src:`QQQ×${sc.toFixed(1)}`};
}

let S={px:0,p1:0,p2:0,date:'',src:''};
const loadPos=()=>{try{return JSON.parse(localStorage.getItem(KEY))||[];}catch(e){return[];}};
const savePos=a=>localStorage.setItem(KEY,JSON.stringify(a));
function bizDays(a,b){let d=new Date(a),e=new Date(b),n=0;while(d<e){d.setDate(d.getDate()+1);const w=d.getDay();if(w!==0&&w!==6)n++;}return n;}
const fmtW=v=>(v>=0?'+':'')+Math.round(v/1e4).toLocaleString()+'만';

async function load(){
  const st=document.getElementById('status'),as=document.getElementById('asof');
  st.textContent='불러오는중'; st.className='status';
  try{
    const {bars,scale,src}=await fetchNQ();
    const c=bars.map(b=>b.close*scale), n=c.length;
    S={px:c[n-1],p1:c[n-2],p2:c[n-3],date:bars[n-1].date,src};
    st.textContent='실시간'; st.className='status live';
    const ci=contractInfo();
    as.innerHTML=`${src} · ${S.date} 종가 ${S.px.toLocaleString(undefined,{maximumFractionDigits:0})}<br>`+
      `<b style="color:${ci.d2e<=7?'var(--gold)':'var(--accent)'}">${ci.code}</b> · 만기 D-${ci.d2e}`+
      (ci.roll?` <span style="color:var(--gold)">← ${ci.oldCode} 만기 D-${ci.oldD2e}, 롤오버</span>`:'');
  }catch(e){
    const mv=+document.getElementById('mpx').value;
    if(mv){ S={px:mv,p1:mv*1.002,p2:mv*1.004,date:etDate(0),src:'수동'}; }
    st.textContent='수동값'; st.className='status err';
    as.textContent='시세 실패 — '+e.message;
  }
  render();
}

function render(){
  const P={qty:+document.getElementById('qty').value||1,
           nt:+document.getElementById('ntier').value||3,
           hold:+document.getElementById('hold').value||3,
           buyp:+document.getElementById('buyp').value||0.5,
           sellp:+document.getElementById('sellp').value||0.5,
           marg:(+document.getElementById('marg').value||400)*1e4};
  const {px,p1,p2}=S;
  const pos=loadPos().sort((a,b)=>a.date.localeCompare(b.date));
  const today=etDate(0);
  const buy=buyPrice(p1,p2,P.buyp);   // 전일·그제
  const low2=Math.min(p1,p2);

  // 현재가 카드
  document.getElementById('px').textContent = px?px.toLocaleString(undefined,{maximumFractionDigits:0}):'—';
  const ch=p1?(px/p1-1)*100:0;
  const ce=document.getElementById('chg');
  ce.textContent=(ch>0?'+':'')+ch.toFixed(2)+'%';
  ce.className='chg '+(ch>0?'up':ch<0?'down':'');
  document.getElementById('low2').textContent = low2?low2.toLocaleString(undefined,{maximumFractionDigits:0}):'—';
  document.getElementById('tiers').textContent = pos.length+' / '+P.nt;

  // ── 오늘 주문표 ──
  const orders=[];
  const mocList = pos.filter(x=>bizDays(x.date,today)>=P.hold);
  const hasMOC  = mocList.length>0;

  if(hasMOC){
    mocList.forEach(x=>orders.push({t:'MOC',cls:'tag-m',px:'시장가',hit:true,
      qty:x.qty, memo:`T${pos.indexOf(x)+1} · ${x.date.slice(5)} 진입 · ${bizDays(x.date,today)}일 경과`}));
  }else{
    pos.forEach((x,i)=>{
      const sp=sellPrice(x.entry,P.sellp), hit=px>=sp;
      orders.push({t:'매도',cls:'tag-s',px:sp,hit,
        qty:x.qty, memo:`T${i+1} · 진입 ${x.entry.toLocaleString(undefined,{maximumFractionDigits:0})} → ${hit?'✅ 충족 (시장가 청산)':'대기'}`});
    });
  }
  const ci2=contractInfo();
  const nearExp = ci2.roll || ci2.d2e<=7;
  if(pos.length<P.nt && !nearExp){
    orders.push({t:'매수',cls:'tag-b',px:buy,hit:px<=buy,qty:P.qty,
      memo:`T${pos.length+1} · 저가 ${low2.toLocaleString(undefined,{maximumFractionDigits:0})} −${P.buyp}% · ${px<=buy?'✅ 충족 (시장가 매수)':'대기'}`});
  }

  document.getElementById('orders').innerHTML = orders.length ? orders.map(o=>
    `<div class="ord ${o.hit?(o.t==='매수'?'ord-buy':'ord-hit'):'ord-wait'}">
      <span class="tag ${o.cls}">${o.t}</span>
      <span class="px ${o.t==='매수'?'px-big':''}">${typeof o.px==='number'?o.px.toLocaleString(undefined,{minimumFractionDigits:2}):o.px}</span>
      <span class="qty"><b>${o.qty}</b>계약</span>
      <span class="memo">${o.memo}</span></div>`).join('')
    : '<div class="empty">주문 없음</div>';
  document.getElementById('ordCnt').textContent = orders.length?`${orders.length}건`:'';

  // ── 오늘 할 일 배너 ──
  const td=document.getElementById('todo');
  if(nearExp){
    const warn=document.getElementById('expWarn');
    if(warn) warn.innerHTML=`⚠️ <b>만기 임박</b> — 신규 매수 중단${pos.length?` · 보유 ${pos.length}티어 정리 필요`:''}`;
  }
  const nB=orders.filter(o=>o.t==='매수').length;
  const nS=orders.filter(o=>o.t!=='매수').length;
  if(hasMOC){
    td.className='todo t-sell';
    td.innerHTML=`<div class="lb">오늘 할 일</div><div class="big">MOC 청산 ${mocList.length}건</div>
      <div class="sub">보유 ${P.hold}일 경과 · 시장가 청산${nB?` · T${pos.length+1} 매수 ${buy.toLocaleString(undefined,{minimumFractionDigits:2})}`:''}</div>`;
  }else if(nS&&nB){
    td.className='todo t-both';
    td.innerHTML=`<div class="lb">오늘 할 일</div><div class="big">매도 ${nS} · 매수 1</div>
      <div class="sub">조건 충족분 시장가 주문</div>`;
  }else if(nS){
    td.className='todo t-sell';
    td.innerHTML=`<div class="lb">오늘 할 일</div><div class="big">매도 ${nS}건</div>
      <div class="sub">기준 도달 티어 시장가 청산</div>`;
  }else if(nB){
    td.className='todo t-buy';
    td.innerHTML=`<div class="lb">오늘 할 일</div><div class="big">T${pos.length+1} 매수</div>
      <div class="sub">종가 ${buy.toLocaleString(undefined,{minimumFractionDigits:2})} 이하면 시장가 매수 · ${P.qty}계약</div>`;
  }else{
    td.className='todo t-none';
    td.innerHTML=`<div class="lb">오늘 할 일</div><div class="big">대기</div>
      <div class="sub">${pos.length>=P.nt?'티어 가득':'매수 조건 미달'}</div>`;
  }

  // ── 보유 티어 ──
  let un=0, qsum=0;
  const rows=pos.map((x,i)=>{
    const d=bizDays(x.date,today), left=P.hold-d;
    const pnl=(px-x.entry)*MULT*x.qty*FX;
    un+=pnl; qsum+=x.qty;
    const sp=sellPrice(x.entry,P.sellp);
    return `<tr class="${left<=0?'d0':''}">
      <td>T${i+1}</td><td>${x.date.slice(5)}</td>
      <td>${x.entry.toLocaleString(undefined,{maximumFractionDigits:0})}</td>
      <td class="up">${sp.toLocaleString(undefined,{maximumFractionDigits:0})}</td>
      <td>${left<=0?'MOC':'D-'+left}</td>
      <td class="${pnl>=0?'up':'down'}">${fmtW(pnl)}</td>
      <td><button class="bdel" onclick="del(${i})">삭제</button></td></tr>`;
  });
  document.getElementById('pos').innerHTML = rows.length?rows.join(''):'<tr><td colspan="7" class="empty">보유 없음</td></tr>';

  document.getElementById('s-qty').textContent = qsum+'계약';
  const pe=document.getElementById('s-pnl');
  pe.textContent=fmtW(un); pe.className='v '+(un>=0?'up':'down');
  document.getElementById('s-marg').textContent=(qsum*P.marg/1e4).toLocaleString()+'만';
  document.getElementById('qinfo').innerHTML =
    `최대 ${P.qty*P.nt}계약 · 증거금 ${(P.qty*P.nt*P.marg/1e4).toLocaleString()}만<br>`+
    `<span style="color:var(--gold)">권장자본 ${Math.round(P.qty*P.nt*P.marg*1.35*1.3/1e4).toLocaleString()}만</span>`;
}

window.chgQty=d=>{
  const el=document.getElementById('qty');
  el.value=Math.max(1,(+el.value||1)+d); render();
};
window.del=i=>{const a=loadPos().sort((x,y)=>x.date.localeCompare(y.date));a.splice(i,1);savePos(a);render();};
document.getElementById('add').addEventListener('click',()=>{
  const p=+document.getElementById('in-px').value, d=document.getElementById('in-dt').value;
  const q=+document.getElementById('qty').value||1;
  if(!p||!d){alert('진입가와 진입일을 입력하세요');return;}
  const a=loadPos(); a.push({entry:p,date:d,qty:q}); savePos(a);
  document.getElementById('in-px').value=''; render();
});
document.getElementById('reload').addEventListener('click',load);
document.getElementById('calib').addEventListener('click',async()=>{
  const real=+document.getElementById('mpx').value;
  if(!real){alert('실제 NQ 시세를 입력하세요');return;}
  try{ const b=await fetchBars('QQQ'); const q=b[b.length-1].close;
    localStorage.setItem('mnq-scale',(real/q).toFixed(4)); alert(`배율 ${(real/q).toFixed(2)} 저장`); load();
  }catch(e){ alert('보정 실패: '+e.message); }
});
document.querySelectorAll('#qty,#ntier,#hold,#buyp,#sellp,#marg').forEach(e=>e.addEventListener('input',render));
document.getElementById('closeMode').value = USE_1600?'1':'0';
document.getElementById('closeMode').addEventListener('change',e=>{
  USE_1600 = e.target.value==='1';
  localStorage.setItem('mnq-1600', USE_1600?'1':'0');
  load();
});
document.getElementById('in-dt').value=etDate(0);
load();
</script>
</body>
</html>
