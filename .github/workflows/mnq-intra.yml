name: MNQ Intraday

on:
  schedule:
    # 오전 실행 — 10:00 ET 첫 체크 전에 시작, 실행 한도(약 5시간 45분) 안에서 처리
    - cron: '35 13 * * 1-5'   # 22:35 KST (EDT 09:35 / EST 08:35)
    - cron: '50 13 * * 1-5'   # 백업
    - cron: '35 14 * * 1-5'   # 겨울(EST 09:35)
    - cron: '50 14 * * 1-5'   # 겨울 백업
    # 오후 이어받기 — 오전 실행이 끝나면 대기 중이던 실행이 나머지 체크 + 15:59:40 청산
    - cron: '40 16 * * 1-5'
    - cron: '10 17 * * 1-5'
    - cron: '40 17 * * 1-5'
    - cron: '10 18 * * 1-5'
    - cron: '40 18 * * 1-5'
    - cron: '10 19 * * 1-5'
    - cron: '40 19 * * 1-5'
  workflow_dispatch:
    inputs:
      test:
        description: '연결 점검만 (주문·상태 저장 없음)'
        type: boolean
        default: true

# 한 번에 하나만 실행 — 겹쳐 깨워도 앞 실행이 끝난 뒤 이어받음
concurrency:
  group: mnq-intra
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Git 설정
        run: |
          git config user.name "mnq-intra"
          git config user.email "bot@users.noreply.github.com"

      - name: Run intraday
        env:
          INTRA_MODE:  ${{ vars.INTRA_MODE || 'PAPER' }}
          INTRA_TEST:  ${{ inputs.test && '1' || '0' }}
          INTRA_LEV:   ${{ vars.INTRA_LEV || '3.3' }}
          INTRA_MAX:   ${{ vars.INTRA_MAX || '2' }}
          INTRA_VWAP:  ${{ vars.INTRA_VWAP || '1' }}
          INTRA_SKIP_DAYS: ${{ vars.INTRA_SKIP_DAYS || '2026-11-27,2026-12-24' }}
          MODE:        ${{ vars.MODE || 'PAPER' }}
          TIERS:       ${{ vars.TIERS || '3' }}
          MARGIN_USD:  ${{ vars.MARGIN_USD || '3138' }}
          FX:          ${{ vars.FX || '1350' }}
          TOTAL_PAID:  ${{ vars.TOTAL_PAID || '4500' }}
          INITIAL_CAP: ${{ vars.INITIAL_CAP || '4500' }}
          PER_CONTRACT: ${{ vars.PER_CONTRACT || '1000' }}
          BUFFER:      ${{ vars.BUFFER || '30' }}
          HUNTER_API:  ${{ vars.HUNTER_API || 'https://hunter-v10.vercel.app' }}
          SYMBOL:      ${{ vars.SYMBOL || 'MNQ' }}
          ROLL_STOP_DAYS: ${{ vars.ROLL_STOP_DAYS || '14' }}
          STATE_FILE:  mnq_state.json
          TG_TOKEN:    ${{ secrets.TG_TOKEN }}
          TG_CHAT:     ${{ secrets.TG_CHAT }}
          KIS_APP_KEY:      ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET:   ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT_NO:   ${{ secrets.KIS_ACCOUNT_NO }}
          KIS_ACCOUNT_CODE: ${{ secrets.KIS_ACCOUNT_CODE }}
        run: python mnq_intra.py
