name: Data News

on:
  workflow_dispatch:
    inputs:
      start:
        description: '시작일'
        default: '2016-01-01'

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 뉴스·1분봉 받기
        env:
          ALPACA_KEY:    ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          START: ${{ inputs.start }}
        run: python tools/alpaca_news.py
      - name: news 브랜치에 저장 (main은 안 건드림)
        run: |
          ls -la data
          mv data /tmp/data
          git config user.name "data-bot"
          git config user.email "bot@users.noreply.github.com"
          git checkout --orphan news
          git rm -rf --cached . > /dev/null
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/data/* .
          git add *.json.gz
          git commit -m "뉴스 이벤트 데이터"
          git push -f origin news
